<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Storyboarder</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="app">

  <header id="topbar">
    <div class="brand">Storyboarder</div>

    <input id="projName" class="proj-name" placeholder="Untitled project" spellcheck="false">

    <div class="tb-group">
      <button id="btnNew"  class="tb">New</button>
      <button id="btnOpen" class="tb">Open…</button>
      <button id="btnSaveAs" class="tb">Save as…</button>
      <button id="btnCopy" class="tb" title="Download a standalone copy of this board">Copy</button>
      <span id="saveState" class="save-state">no file</span>
    </div>

    <div class="tb-sep"></div>

    <div class="tb-group">
      <button id="btnScript"  class="tb toggle">Script</button>
      <button id="btnComment" class="tb toggle">Comment mode</button>
      <button id="btnPersonas" class="tb toggle">Personas</button>
      <button id="btnPrompts" class="tb toggle">Prompts</button>
    </div>

    <div class="tb-sep"></div>

    <div class="tb-group">
      <button id="btnVersions" class="tb"><span id="verLabel">v1</span> ▾</button>
      <button id="btnPdf" class="tb">PDF</button>
      <button id="btnSettings" class="tb">Settings</button>
      <button id="btnTheme" class="tb" title="Light / dark">◐</button>
    </div>
  </header>

  <main id="main">

    <aside id="scenePanel">
      <div class="panel-head">
        <span>Scenes</span>
        <button id="btnAddScene" class="mini">+ Scene</button>
      </div>
      <div id="sceneList" class="scene-list"></div>
    </aside>

    <section id="boardPanel">
      <div id="board" class="board"></div>
    </section>

    <aside id="scriptPanel" class="hidden">
      <div class="panel-head">
        <span>Master script</span>
        <span class="spacer"></span>
        <button id="btnUndo" class="mini" title="Undo script edit (Ctrl+Z)">↶</button>
        <button id="btnRedo" class="mini" title="Redo script edit (Ctrl+Shift+Z)">↷</button>
        <button id="btnCapture" class="mini primary" disabled title="Select some text in the script first">Capture shot</button>
      </div>
      <div class="script-hint">
        Select text below, then <b>Capture shot</b>. Highlighted text is already driving a shot.
      </div>
      <div id="masterScript" class="master-script" contenteditable="true" spellcheck="true"></div>
      <div id="captureForm" class="capture-form hidden"></div>
    </aside>

    <aside id="personaPanel" class="hidden">
      <div class="panel-head"><span>Personas</span></div>
      <div id="personaBody" class="pp-body"></div>
    </aside>

    <aside id="promptPanel" class="hidden">
      <div class="panel-head"><span>Prompts</span></div>
      <div id="promptBody" class="pp-body"></div>
    </aside>

  </main>

  <div id="modalRoot"></div>
  <div id="toastRoot"></div>
</div>

<script src="js/theme.js"></script>
<script src="js/util.js"></script>
<script src="js/doc.js"></script>
<script src="js/geminimodels.js"></script>
<script src="js/brand.js"></script>
<script src="js/personas.js"></script>
<script src="js/model.js"></script>
<script src="js/store.js"></script>
<script src="js/history.js"></script>
<script src="js/editor.js"></script>
<script src="js/board.js"></script>
<script src="js/scriptmode.js"></script>
<script src="js/comments.js"></script>
<script src="js/prompts.js"></script>
<script src="js/promptpanel.js"></script>
<script src="js/personapanel.js"></script>
<script src="js/settings.js"></script>
<script src="js/versions.js"></script>
<script src="js/pdf.js"></script>
<script src="js/app.js"></script>
</body>
</html>
