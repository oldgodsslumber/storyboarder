<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Storyboarder</title>
<link rel="stylesheet" href="css/app.css?v=be9debb">
</head>
<body>

<div id="app">

  <header id="topbar">
    <div class="brand">Storyboarder</div>

    <input id="projName" class="proj-name" placeholder="Untitled project" spellcheck="false">

    <div class="tb-group">
      <button id="btnNew"  class="tb">New</button>
      <button id="btnOpen" class="tb">Open…</button>
      <button id="btnSaveAs" class="tb">Save as…</button>
      <button id="btnCopy" class="tb" title="Download a standalone copy of this board">Copy</button>
      <span id="saveState" class="save-state">no file</span>
    </div>

    <div class="tb-sep"></div>

    <div class="tb-group">
      <button id="btnScript"  class="tb toggle">Script</button>
      <button id="btnComment" class="tb toggle">Review</button>
      <button id="btnPersonas" class="tb toggle" title="The cast, the locations, the objects">References</button>
      <button id="btnPrompts" class="tb toggle">Create</button>
    </div>

    <div class="tb-sep"></div>

    <div class="tb-group">
      <button id="btnVersions" class="tb"><span id="verLabel">v1</span> ▾</button>
      <button id="btnExport" class="tb toggle">Export</button>
      <button id="btnPdf" class="tb">PDF</button>
      <button id="btnSettings" class="tb">Settings</button>
      <button id="btnTheme" class="tb" title="Light / dark">◐</button>
    </div>
  </header>

  <main id="main">

    <aside id="scenePanel">
      <div class="panel-head">
        <span>Scenes</span>
        <button id="btnAddScene" class="mini">+ Scene</button>
      </div>
      <div id="sceneList" class="scene-list"></div>
    </aside>

    <section id="boardPanel">
      <div id="board" class="board"></div>
      <div id="selBar" class="sel-bar-wrap hidden"></div>
    </section>

    <aside id="scriptPanel" class="hidden">
      <div class="panel-head">
        <span>Master script</span>
        <span class="spacer"></span>
        <button id="btnUndo" class="mini" title="Undo script edit (Ctrl+Z)">↶</button>
        <button id="btnRedo" class="mini" title="Redo script edit (Ctrl+Shift+Z)">↷</button>
        <button id="btnScriptNote" class="mini hidden" disabled title="Select some text in the script first">+ Comment</button>
        <button id="btnCapture" class="mini primary" disabled title="Select some text in the script first">Capture</button>
      </div>
      <div class="script-hint">
        Select text below, then <b>Capture</b>. A <b>wash</b> means a shot covers it;
        a <b class="hint-scene">teal rule above the line</b> means a scene claims that section.
        <span id="scriptCoverage" class="hint-cov"></span>
      </div>
      <div id="masterScript" class="master-script" contenteditable="true" spellcheck="true"></div>
      <div id="captureForm" class="capture-form hidden"></div>
      <div id="noteForm" class="capture-form hidden"></div>
      <div id="noteList" class="note-list hidden"></div>
    </aside>

  </main>

  <div id="modalRoot"></div>
  <div id="toastRoot"></div>
</div>

<script src="js/theme.js?v=be9debb"></script>
<script src="js/util.js?v=be9debb"></script>
<script src="js/focus.js?v=be9debb"></script>
<script src="js/doc.js?v=be9debb"></script>
<script src="js/blobs.js?v=be9debb"></script>
<script src="js/geminimodels.js?v=be9debb"></script>
<script src="js/providers.js?v=be9debb"></script>
<script src="js/brand.js?v=be9debb"></script>
<script src="js/renders.js?v=be9debb"></script>
<script src="js/imaginemodels.js?v=be9debb"></script>
<script src="js/imagine.js?v=be9debb"></script>
<script src="js/refs.js?v=be9debb"></script>
<script src="js/personas.js?v=be9debb"></script>
<script src="js/fields.js?v=be9debb"></script>
<script src="js/model.js?v=be9debb"></script>
<script src="js/h3.js?v=be9debb"></script>
<script src="js/store.js?v=be9debb"></script>
<script src="js/history.js?v=be9debb"></script>
<script src="js/editor.js?v=be9debb"></script>
<script src="js/refbox.js?v=be9debb"></script>
<script src="js/viewer.js?v=be9debb"></script>
<script src="js/board.js?v=be9debb"></script>
<script src="js/scriptmode.js?v=be9debb"></script>
<script src="js/comments.js?v=be9debb"></script>
<script src="js/prompts.js?v=be9debb"></script>
<script src="js/coverage.js?v=be9debb"></script>
<script src="js/promptpanel.js?v=be9debb"></script>
<script src="js/personapanel.js?v=be9debb"></script>
<script src="js/mentions.js?v=be9debb"></script>
<script src="js/settings.js?v=be9debb"></script>
<script src="js/versions.js?v=be9debb"></script>

</body>
</html>
