  function head(im, vm, rows) {
    headEl.innerHTML = '';
    const r1 = SB.el('div', 'pt-hrow');
    const r2 = SB.el('div', 'pt-hrow pt-hrow2');
    headEl.appendChild(r1);
    headEl.appendChild(r2);

    r1.appendChild(SB.el('h2', null, 'Prompts'));

    const tabs = SB.el('div', 'lib-tabs');
    const all = allRows();
    const counts = {
      all: all.length,
      /* prompts left to write, not rows with something left */
      missing: all.reduce(function (n, r) { return n + missingCount(r, im, vm); }, 0),
      stale: all.filter(function (r) { return isStale(r, im, vm); }).length,
      scene: all.filter(function (r) { return r.scene.id === SB.app.selectedSceneId; }).length
    };
    /* Every count is shown, zero included: "Missing" with the number left off
       reads as "not counted", and none-left-to-do is the one moment this screen
       most wants to say a number. */
    [['all', 'All'], ['missing', 'Missing'], ['stale', 'Stale'],
    ['scene', 'This scene']].forEach(function (t) {
      const b = SB.el('button', 'tb toggle' + (filter === t[0] ? ' on' : ''),
        t[1] + ' ' + counts[t[0]]);
      b.onclick = function () { filter = t[0]; render(); };
      tabs.appendChild(b);
    });
    r1.appendChild(tabs);
    r1.appendChild(SB.el('span', 'spacer'));

    const x = SB.el('button', 'tb lib-x', '✕');
    x.title = 'Close (Esc)';
    x.onclick = close;
    r1.appendChild(x);

    r2.appendChild(modelSelect('image'));
    r2.appendChild(modelSelect('video'));

    /* The provider switch is a working decision — quota gone, offline, a draft
       not worth spending calls on — so it stays one click away, not in a modal. */
    const provWrap = SB.el('div', 'prov-pick pt-prov');
    SB.Providers.list().forEach(function (prov) {
      const b = SB.el('button', 'tb toggle' + (prov.id === SB.Providers.activeId() ? ' on' : ''),
        prov.id === 'gemini' ? 'Gemini' : 'Local');
      b.title = prov.label;
      b.onclick = function () { SB.Providers.setActive(prov.id); SB.app.changed(true); render(); };
      provWrap.appendChild(b);
    });
    r2.appendChild(provWrap);

    r2.appendChild(usageBit());

    /* Whether the cards carry their prompt boxes as well. Off by default so the
       board stays a board; this is the screen where you would change it. */
    const onCards = SB.el('div', 'pt-oncards');
    onCards.appendChild(SB.el('span', 'l', 'on cards'));
    [['showImagePrompt', 'first frame'], ['showVideoPrompt', 'video']].forEach(function (k) {
      const l = SB.el('label', 'pp-toggle');
      const c = document.createElement('input');
      c.type = 'checkbox';
      c.checked = !!P().settings[k[0]];
      c.dataset.setting = k[0];
      c.addEventListener('change', function () {
        P().settings[k[0]] = c.checked;
        SB.app.changed(true);
      });
      l.appendChild(c);
      l.appendChild(document.createTextNode(' ' + k[1]));
      onCards.appendChild(l);
    });
    r2.appendChild(onCards);

    r2.appendChild(SB.el('span', 'spacer'));

    const acts = SB.el('div', 'pt-acts');
    statusEl = SB.el('span', 'pt-status');
    acts.appendChild(statusEl);
    r2.appendChild(acts);
  }

  /* the quota readout, kept because a run of thirty rows is where it matters */
  function usageBit() {
    const p = P();
    const wrap = SB.el('span', 'pt-usage-wrap');
    if (SB.Providers.activeId() !== 'gemini') {
      usageEl = null; limitEl = null;
      const o = SB.Store.getOoba();
      wrap.appendChild(SB.el('span', 'pp-usage', o.model || 'local model'));
      return wrap;
    }
    const pick = SB.GeminiModels.picker(p.settings.geminiModel, function (id) {
      p.settings.geminiModel = id || SB.GeminiModels.DEFAULT;
      SB.Store.touch();
      refreshUsage();
    });
    pick.el.classList.add('pt-gm');
    wrap.appendChild(pick.el);
    usageEl = SB.el('span', 'pp-usage');
    wrap.appendChild(usageEl);
    limitEl = document.createElement('input');
    limitEl.type = 'number';
    limitEl.min = '0';
    limitEl.className = 'pp-limit';
    limitEl.title = 'Your free-tier requests per day for this model. Blank = just count.';
    limitEl.placeholder = 'limit';
    limitEl.addEventListener('change', function () {
      SB.GeminiModels.setLimit(p.settings.geminiModel, parseInt(limitEl.value, 10) || 0);
      refreshUsage();
    });
    wrap.appendChild(limitEl);
    return wrap;
  }

  function refreshUsage() {
    if (!usageEl || !P()) return;
    if (SB.Providers.activeId() !== 'gemini') return;   // local runs have no allowance
    const id = P().settings.geminiModel;
    usageEl.textContent = SB.GeminiModels.usageText(id);
    usageEl.classList.toggle('spent', SB.GeminiModels.remaining(id) === 0);
    if (limitEl && document.activeElement !== limitEl) {
      const lim = SB.GeminiModels.limit(id);
      limitEl.value = lim ? lim : '';
    }
  }

  /* ---------------------------------------------------------------- table */

  function render() {
    if (!root || !P()) return;
    const p = P();
    const im = SB.Model.imageModel(p), vm = SB.Model.videoModel(p);
    const rows = visible(im, vm);
    head(im, vm, rows);
    refreshUsage();

    bodyEl.innerHTML = '';

    const grid = SB.el('div', 'pt-grid');
    const hdr = SB.el('div', 'pt-head-row');
    ['Shot', 'Description', 'First frame' + (im ? ' · ' + im.name : ''),
      'Video' + (vm ? ' · ' + vm.name : ''), 'Feed'].forEach(function (t) {
        hdr.appendChild(SB.el('div', 'pt-h', t));
      });
    grid.appendChild(hdr);

    if (!rows.length) {
      grid.appendChild(SB.el('div', 'pt-empty',
        filter === 'missing' ? 'Every shot in this board has both its prompts.'
          : filter === 'stale' ? 'No prompt has fallen behind its cast.'
            : filter === 'scene'
              ? (SB.app.selectedSceneId
                ? 'That scene has no shots yet.'
                : 'No scene is selected — pick one on the board or in the scene list.')
              : 'No shots yet.'));
    }

    let lastScene = null;
    rows.forEach(function (r) {
      if (r.scene.id !== lastScene) {
        lastScene = r.scene.id;
        const band = SB.el('div', 'pt-scene');
        band.appendChild(SB.el('span', 'n', 'Scene ' + (r.si + 1)));
        band.appendChild(SB.el('span', 't', r.scene.heading || '(untitled)'));
        grid.appendChild(band);
      }
      grid.appendChild(rowEl(r, im, vm));
    });
    bodyEl.appendChild(grid);

    const ready = SB.Providers.active().ready();
    if (!ready) setStatus(SB.Providers.active().notReady(), true);
  }

  function rowEl(r, im, vm) {
    const sh = r.shot;
    const row = SB.el('div', 'pt-row' + (sh.noShot ? ' noshot' : ''));
    row.dataset.shot = sh.id;

    /* ---- what it is ---- */
    const c1 = SB.el('div', 'pt-cell pt-shot');
    const line = SB.el('div', 'pt-code-line');
    line.appendChild(SB.el('span', 'code', r.code));
    if (sh.render && sh.render.serial) {
      const ser = SB.el('span', 'code-serial', SB.Renders.pad(sh.render.serial));
      ser.title = 'Full-size render: ' + SB.Renders.fileName(sh.render.serial, sh.render.ext);
      line.appendChild(ser);
    }
    c1.appendChild(line);

    const thumb = SB.el('div', 'pt-thumb');
    if (sh.image) {
      const im2 = document.createElement('img');
      im2.src = SB.Blobs.src(P(), sh.image);
      thumb.appendChild(im2);
    } else {
      thumb.classList.add('none');
      thumb.textContent = 'not rendered';
    }
    thumb.title = 'Show this card on the board';
    thumb.onclick = function () {
      close();
      SB.Board.select(sh.id);
      const el = document.querySelector('.card[data-shot="' + sh.id + '"]');
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    };
    c1.appendChild(thumb);
    c1.appendChild(SB.el('div', 'pt-type' + (sh.noShot ? ' noshot' : ''),
      sh.noShot ? 'no shot' + (sh.type ? ' · ' + sh.type : '') : (sh.type || '—')));
    row.appendChild(c1);

    /* ---- what it says ---- */
    const c2 = SB.el('div', 'pt-cell');
    const desc = SB.el('div', 'pt-desc');
    desc.dataset.shot = sh.id;
    SB.RefBox.attach(desc, {
      get: function () { return sh.description || ''; },
      set: function (t) {
        sh.description = t;
        SB.Store.touch();
        SB.Board.refreshCastRows();
        refreshFeedCell(sh.id);
      },
      placeholder: 'What we see. @ anything the model should be shown.',
      ctx: { shot: sh, code: r.code }
    });
    c2.appendChild(desc);
    row.appendChild(c2);

    /* ---- the two prompts ---- */
    row.appendChild(promptCell(sh, im, 'imagePrompt'));
    row.appendChild(promptCell(sh, vm, 'videoPrompt'));

    /* ---- what goes in with it ---- */
    const c5 = SB.el('div', 'pt-cell pt-feed');
    c5.dataset.feedCell = sh.id;
    c5.appendChild(feedList(sh, r.code));
    row.appendChild(c5);

    return row;
  }

  /* The box comes first in every column, so the three of them start on the same
   * line. With the badges and the generate button above it, the two prompt
   * boxes sat a row lower than the description beside them and the whole table
   * read as if it were out of register. Everything that acts on a prompt now
   * sits under it, which is also the order you use it in: read, then act. */
  function code(sh) {
    const f = SB.Model.findShot(P(), sh.id);
    return f ? f.code : 'this shot';
  }

  function promptCell(sh, m, field) {
    const cell = SB.el('div', 'pt-cell pt-prompt');
    if (!m) {
      cell.appendChild(SB.el('div', 'pt-none', 'no model chosen'));
      return cell;
    }
    const pr = sh.prompts[m.id] || null;

    const ta = document.createElement('textarea');
    ta.className = 'pt-text';
    ta.value = (pr && pr[field]) || '';
    ta.placeholder = sh.noShot ? '(\u201cno shot\u201d \u2014 never generated)' : 'not generated yet';
    ta.addEventListener('input', function () {
      sh.prompts[m.id] = sh.prompts[m.id] || { imagePrompt: '', videoPrompt: '', modelName: m.name };
      sh.prompts[m.id][field] = ta.value;
      sh.prompts[m.id].modelName = m.name;
      /* Editing by hand is the user restating the prompt as it should read now,
         so it stops being behind the cast. */
      sh.prompts[m.id].at = Date.now();
      SB.Store.touch();
      SB.Board.refreshPromptStale();
    });
    cell.appendChild(ta);

    const foot = SB.el('div', 'pt-foot');

    if (pr && pr[field] && SB.Personas.staleFor(P(), sh, pr.at)) {
      const b = SB.el('span', 'badge warn stale', 'cast changed');
      b.title = 'Something on this card was edited after this prompt was written.';
      foot.appendChild(b);
    }

    const copy = SB.el('button', 'mini', 'copy');
    copy.disabled = !ta.value;
    copy.onclick = function () {
      navigator.clipboard.writeText(ta.value || '').then(function () {
        SB.toast('Prompt copied');
      }).catch(function () { SB.toast('Could not copy', true); });
    };
    foot.appendChild(copy);

    foot.appendChild(SB.el('span', 'spacer'));

    const gen = SB.el('button', 'mini primary', '\u2726 generate');
    gen.disabled = !!sh.noShot || !(sh.description || '').trim();
    if (gen.disabled) {
      gen.title = sh.noShot ? 'A \u201cno shot\u201d card never generates'
        : 'Write a description first \u2014 there is nothing for the writer to work from';
    } else if (ta.value) {
      gen.title = 'Write this one again, replacing what is there';
    }
    gen.onclick = function () {
      gen.disabled = true;
      gen.textContent = '\u2026';
      setStatus('writing the ' + (field === 'imagePrompt' ? 'first frame' : 'video') +
        ' prompt for ' + code(sh) + '\u2026');
      const roles = field === 'imagePrompt' ? { image: true } : { video: true };
      SB.Prompts.generateFor(sh, roles).then(function () {
        setStatus('');
        refreshUsage();
        render();
      }).catch(function (e) {
        gen.disabled = false;
        gen.textContent = '\u2726 generate';
        refreshUsage();
        writeError(e, function () { gen.onclick(); });
      });
    };
    foot.appendChild(gen);

    cell.appendChild(foot);
    return cell;
  }

  /* The references this row hands over, in order — the same feed the card
   * shows, laid out down the column because there is room for it here. */
  /* The references this row hands over, in order.
   *
   * Named by FILE, not by subject. "Nat" tells you nothing you can act on: the
   * point of this column is that you go and find those pictures and drop them
   * into a model in this order, so it says 0007.png. The subject's name rides
   * along after it, because the filename alone says nothing about who it is.
   */
  function feedList(sh, code) {
    const wrap = SB.el('div', 'pt-feed-list');
    const list = SB.Refs.feed(P(), sh);
    if (!list.length) {
      wrap.appendChild(SB.el('div', 'pt-none', 'no references'));
      return wrap;
    }
    /* one line per FILE, so the numbers down the column are the numbers in the
       prompt's mapping and in the folder */
    SB.Refs.images(P(), sh).forEach(function (e) {
      const it = SB.el('div', 'pt-fe' + (e.kind === 'shot' ? ' is-shot' : ''));
      it.appendChild(SB.el('span', 'feed-n', String(e.n)));

      const t = SB.el('span', 'feed-thumb');
      const im3 = document.createElement('img');
      im3.src = SB.Blobs.src(P(), e.img);
      t.appendChild(im3);
      it.appendChild(t);

      const file = e.render
        ? SB.Renders.fileName(e.render.serial, e.render.ext)
        : null;
      const nameEl = SB.el('span', 'feed-file' + (file ? '' : ' none'),
        file || 'board copy only');
      it.appendChild(nameEl);
      it.appendChild(SB.el('span', 'feed-who', e.label + (e.role ? ' · ' + e.role : '')));

      it.title = (file
        ? file + ' — the full-size original, in the renders folder'
        : 'No original kept for this one: the board\'s 854×480 copy is what would be ' +
          'written. Connect a renders folder in Settings to keep originals.') +
        '\n' + e.label + (e.role ? ' (' + e.role + ')' : '');
      wrap.appendChild(it);
    });

    /* things that are referenced but have no picture behind them still have to
       be said — they are numbered nowhere and feed nothing */
    list.forEach(function (e) {
      if (e.images.length) return;
      const it = SB.el('div', 'pt-fe' + (e.kind === 'dead' ? ' dead' : ' empty'));
      it.appendChild(SB.el('span', 'feed-n', '–'));
      it.appendChild(SB.el('span', 'feed-thumb none', '?'));
      it.appendChild(SB.el('span', 'feed-file none', e.kind === 'dead' ? 'gone' : 'no picture'));
      it.appendChild(SB.el('span', 'feed-who', e.label));
      it.title = e.label + (e.why ? ' — ' + e.why : '');
      wrap.appendChild(it);
    });

    const imgs = SB.Refs.images(P(), sh);
    if (imgs.length) {
      const full = imgs.filter(function (e) { return !!e.render; }).length;
      const b = SB.el('button', 'mini', 'copy image set');
      b.title = imgs.length + ' images, numbered in feed order' +
        (full ? ' — ' + full + ' full-size' : ' — all at board size');
      b.onclick = function () { SB.Board.saveFeed(sh, imgs, code); };
      wrap.appendChild(b);
    }
    return wrap;
  }

  function refreshFeedCell(id) {
    if (!root) return;
    const cell = bodyEl.querySelector('.pt-feed[data-feed-cell="' + id + '"]');
    if (!cell) return;
    const f = SB.Model.findShot(P(), id);
    if (!f) return;
    cell.innerHTML = '';
    cell.appendChild(feedList(f.shot, f.code));
  }

  /* ------------------------------------------------------- one shot at a time */

  /* Prompts are written one shot at a time, because that is how they are read
   * and edited. There was a button here that wrote a whole board's worth in one
   * go; it was faster at producing text nobody had looked at, and every prompt
   * it wrote was one you then had to open anyway.
   *
   * What it did carry, and this does now, is the answer to a writer model the
   * key cannot reach: a 404 is not a dead end, it is a question the key can be
   * asked directly. */
  function writeError(e, retry) {
    if (SB.apiBlocked(e, retry)) {
      setStatus('blocked — see the dialog', true);
      return;
    }
    const msg = e.message || String(e);
    setStatus(msg, true);
    const notAvailable = msg.indexOf('404') >= 0 && SB.Providers.activeId() === 'gemini';
    if (!notAvailable) {
      SB.toast(msg, true);
      return;
    }
    setStatus(msg + ' — checking what your key can reach…', true);
    SB.GeminiModels.fetchAvailable().then(function (models) {
      render();
      setStatus('“' + P().settings.geminiModel + '” is not available to this key. ' +
        'The writer list now shows the ' + models.length +
        ' models it can reach — pick one.', true);
    }).catch(function () {
      setStatus(msg, true);
    });
  }

  SB.PromptPanel = {
    init: init, open: open, close: close, toggle: toggle, isOpen: isOpen, refresh: refresh,
    follow: follow, refreshUsage: refreshUsage
  };

})(window.SB);

</script>
<script>
/* ===== js/personapanel.js ===== */
/* personapanel.js — the reference library.
 *
 * A full-page takeover holding the two things that are true of the whole board
 * rather than of one card: every recurring subject (the cast, the locations,
 * the objects) and the scenes in the order they play. Both are answers to
 * "what is this film made of", which is a question you ask with your head up,
 * away from the cards — so it gets the whole window rather than a 320px column
 * squeezed in beside the board.
 *
 * The scenes here are deliberately shot-free: this is the shape of the film,
 * not its contents. Shots have a board.
 */
(function (SB) {
  'use strict';

  const SPLIT_KEY = 'sb.library.split';
  const SIZE_KEY = 'sb.library.size';

  /* How big a reference reads at. Portrait subjects are stored at 270x480 at
     most (SB.downscaleImage caps at 854x480), so L stops short of upscaling.
     The column widens with the hero: a tall picture plus the fields beside it
     needs the room. */
  const SIZES = {
    s: { hero: 170, col: 300 },
    m: { hero: 260, col: 380 },
    l: { hero: 380, col: 460 }
  };
  let size = 'm';
  try { if (SIZES[localStorage.getItem(SIZE_KEY)]) size = localStorage.getItem(SIZE_KEY); }
  catch (e) { /* private mode */ }

  let root = null;          // the overlay, while it is open
  let refsEl, scenesEl, statusEl, searchEl, tabsEl, sizeEl;
  let filter = 'all';       // which kind the library is showing
  let query = '';
  let targetId = null;      // the subject a paste would land on
  /* A rename offer outlives the input that raised it: closing the panel, or
   * anything that re-renders it, detaches that input and fires its blur. The
   * offer is state, and the bar is drawn from it. */
  let pendingRename = null;

  function P() { return SB.app.project; }

  /* Pure CSS, so changing size costs no re-render — the portrait cards' own
     widths are calc()s off the same variable and follow along. */
  function applySize() {
    if (!refsEl) return;
    const v = SIZES[size] || SIZES.m;
    refsEl.style.setProperty('--ref-hero', v.hero + 'px');
    refsEl.style.setProperty('--ref-col', v.col + 'px');
    if (sizeEl) {
      sizeEl.querySelectorAll('button').forEach(function (b) {
        b.classList.toggle('on', b.dataset.size === size);
      });
    }
  }

  function init() { /* nothing to bind — the takeover is built when it opens */ }

  function setStatus(txt, isErr) {
    if (!statusEl) return;
    statusEl.textContent = txt || '';
    statusEl.classList.toggle('err', !!isErr);
  }

  /* ---------------------------------------------------------------- shell */

  function open() {
    if (root) { render(); return; }

    root = SB.el('div', 'lib-back');
    const lib = SB.el('div', 'lib');

    lib.appendChild(head());

    const split = SB.el('div', 'lib-split');
    refsEl = SB.el('section', 'lib-refs');
    scenesEl = SB.el('section', 'lib-scenes');
    const divider = SB.el('div', 'lib-divider');
    divider.title = 'Drag to give more room to either half';
    split.appendChild(refsEl);
    split.appendChild(divider);
    split.appendChild(scenesEl);
    lib.appendChild(split);
    dragDivider(divider, refsEl);

    root.appendChild(lib);
    root.addEventListener('mousedown', function (ev) { if (ev.target === root) close(); });
    document.addEventListener('keydown', onKey);
    document.getElementById('modalRoot').appendChild(root);
    document.getElementById('btnPersonas').classList.add('on');

    const saved = parseFloat(localStorage.getItem(SPLIT_KEY) || '');
    if (saved > 20 && saved < 90) refsEl.style.flexBasis = saved + '%';

    render();
    if (searchEl) searchEl.focus();
  }

  /* Esc closes, but not out from under a popover or a confirm inside it. */
  function onKey(e) {
    if (e.key !== 'Escape' || !root) return;
    if (document.querySelector('.modal-back')) return;   // a dialog owns Esc first
    if (document.querySelector('.lib-pop')) return;
    close();
  }

  function close() {
    if (!root) return;
    root.remove();
    root = null;
    refsEl = scenesEl = statusEl = searchEl = null;
    document.removeEventListener('keydown', onKey);
    document.getElementById('btnPersonas').classList.remove('on');
  }

  function toggle() { root ? close() : open(); }
  function isOpen() { return !!root; }
  function refresh() { if (root) render(); }
  function refreshScenes() { if (root) renderScenes(); }
  /* Just the library half — so something minted while typing in the scene
     organizer appears without rebuilding the box being typed into. */
  function refreshRefs() { if (root) renderRefs(); }

  /* The divider writes a percentage rather than pixels, so the split survives
   * the window being resized between sessions. */
  function dragDivider(divider, upper) {
    divider.addEventListener('mousedown', function (ev) {
      ev.preventDefault();
      const box = divider.parentNode.getBoundingClientRect();
      const move = function (m) {
        const pct = SB.clamp((m.clientY - box.top) / box.height * 100, 22, 88);
        upper.style.flexBasis = pct + '%';
      };
      const up = function () {
        document.removeEventListener('mousemove', move);
        document.removeEventListener('mouseup', up);
        try { localStorage.setItem(SPLIT_KEY, parseFloat(upper.style.flexBasis)); } catch (e) { /* private mode */ }
      };
      document.addEventListener('mousemove', move);
      document.addEventListener('mouseup', up);
    });
  }

  function head() {
    const h = SB.el('header', 'lib-head');
    h.appendChild(SB.el('h2', null, 'Reference library'));

    tabsEl = SB.el('div', 'lib-tabs');
    const tab = function (id, label) {
      const b = SB.el('button', 'tb toggle', label);
      b.dataset.kind = id;
      b.onclick = function () { filter = id; renderRefs(); };
      return b;
    };
    tabsEl.appendChild(tab('all', 'All'));
    SB.Personas.KINDS.forEach(function (k) { tabsEl.appendChild(tab(k.id, k.plural)); });
    h.appendChild(tabsEl);

    searchEl = document.createElement('input');
    searchEl.type = 'text';
    searchEl.className = 'lib-search';
    searchEl.placeholder = 'Search names and descriptions';
    searchEl.value = query;
    searchEl.addEventListener('input', function () {
      query = searchEl.value.trim().toLowerCase();
      renderRefs();
    });
    h.appendChild(searchEl);

    /* A library of people is a library of tall pictures, and how big they need
       to read is a matter of the screen and the eyes in front of it. */
    sizeEl = SB.el('div', 'lib-size');
    sizeEl.appendChild(SB.el('span', 'lbl', 'size'));
    [['s', 'S'], ['m', 'M'], ['l', 'L']].forEach(function (pair) {
      const b = SB.el('button', 'tb toggle', pair[1]);
      b.dataset.size = pair[0];
      b.title = 'Show references ' +
        (pair[0] === 's' ? 'small' : pair[0] === 'm' ? 'at the usual size' : 'large');
      b.onclick = function () {
        size = pair[0];
        try { localStorage.setItem(SIZE_KEY, size); } catch (e) { /* private mode */ }
        applySize();
      };
      sizeEl.appendChild(b);
    });
    h.appendChild(sizeEl);

    h.appendChild(SB.el('span', 'spacer'));

    SB.Personas.KINDS.forEach(function (k) {
      const b = SB.el('button', 'tb', '+ ' + k.label);
      b.onclick = function () {
        const per = SB.Personas.add(P(), { kind: k.id });
        SB.app.changed(true);
        filter = 'all'; query = ''; searchEl.value = '';
        renderRefs();
        focusName(per.id);
        targetId = per.id;
      };
      h.appendChild(b);
    });

    /* Demoted on purpose: generating a cast is what you do once, and it had no
       business owning the top of this panel for the rest of the project. */
    const bGen = SB.el('button', 'tb', '✦ Generate from script ▾');
    bGen.onclick = function (ev) { ev.stopPropagation(); generatePop(bGen); };
    h.appendChild(bGen);

    const x = SB.el('button', 'tb lib-x', '✕');
    x.title = 'Close (Esc)';
    x.onclick = close;
    h.appendChild(x);
    return h;
  }

  function focusName(id) {
    const el = root && root.querySelector('.persona[data-id="' + id + '"] .persona-name');
    if (el) { el.focus(); el.select(); }
  }

  /* ------------------------------------------------------ generate popover */

  function generatePop(anchor) {
    const old = document.querySelector('.lib-pop');
    if (old) old.remove();
    const pop = SB.el('div', 'lib-pop');
    pop.addEventListener('mousedown', function (ev) { ev.stopPropagation(); });

    const kindRow = SB.el('div', 'pp-row');
    kindRow.appendChild(SB.el('label', null, 'What'));
    const kind = document.createElement('select');
    SB.Personas.KINDS.forEach(function (k) {
      const o = document.createElement('option');
      o.value = k.id; o.textContent = k.plural;
      kind.appendChild(o);
    });
    kindRow.appendChild(kind);
    pop.appendChild(kindRow);

    const row = SB.el('div', 'pp-row');
    row.appendChild(SB.el('label', null, 'How many'));
    const count = document.createElement('select');
    [1, 2, 3, 4, 5].forEach(function (n) {
      const o = document.createElement('option');
      o.value = n; o.textContent = n;
      if (n === 2) o.selected = true;
      count.appendChild(o);
    });
    row.appendChild(count);
    pop.appendChild(row);

    const note = document.createElement('input');
    note.type = 'text';
    note.placeholder = 'optional direction — “one on-site technician”';
    const nRow = SB.el('div', 'pp-row');
    nRow.appendChild(SB.el('label', null, 'Direction'));
    nRow.appendChild(note);
    pop.appendChild(nRow);

    const acts = SB.el('div', 'pp-actions');
    const go = SB.el('button', 'tb on', 'Generate');
    go.onclick = function () {
      go.disabled = true;
      setStatus('reading the script…');
      SB.Personas.generate(P(), parseInt(count.value, 10) || 1, note.value.trim(), kind.value)
        .then(function (made) {
          pop.remove();
          SB.app.changed(true);
          filter = 'all';
          render();
          setStatus('added ' + made.length + ' — edit anything that is not right.');
        })
        .catch(function (e) {
          go.disabled = false;
          if (SB.apiBlocked(e, function () { go.onclick(); })) {
            setStatus('blocked — see the dialog', true);
            return;
          }
          setStatus(e.message || String(e), true);
        });
    };
    acts.appendChild(go);
    pop.appendChild(acts);
    pop.appendChild(SB.el('div', 'pp-note',
      'Read from the master script and the shot descriptions. Nothing is replaced — ' +
      'whatever comes back is added to what is already here.'));

    document.body.appendChild(pop);
    const r = anchor.getBoundingClientRect();
    pop.style.left = Math.min(r.left, window.innerWidth - pop.offsetWidth - 8) + 'px';
    pop.style.top = Math.min(r.bottom + 4, window.innerHeight - pop.offsetHeight - 8) + 'px';
    setTimeout(function () {
      document.addEventListener('mousedown', function away(ev) {
        if (pop.contains(ev.target)) return;
        pop.remove();
        document.removeEventListener('mousedown', away);
      });
    }, 0);
  }

  /* --------------------------------------------------------------- render */

  function render() {
    if (!root || !P()) return;
    renderRefs();
    renderScenes();
  }

  /* A board-wide sweep for descriptions that still carry a wardrobe. It lives
   * here because this panel is where the wardrobe gets changed, which is what
   * puts the descriptions out of date in the first place. */
  function sweepBlock(p) {
    const stale = SB.Coverage.shotsCarryingWardrobe(p);
    if (!stale.length) return null;

    const box = SB.el('div', 'pp-block warn-block');
    box.appendChild(SB.el('div', 't', 'descriptions out of date'));
    box.appendChild(SB.el('div', 'pp-note',
      stale.length + (stale.length === 1 ? ' card describes' : ' cards describe') +
      ' what somebody looks like in the description itself. The cast is the real ' +
      'record, so that text is a frozen copy — it does not change when you edit a ' +
      'persona, and it is simply wrong once a different person is put on the card.'));

    const st = SB.el('div', 'pp-status');
    const say = function (txt, isErr) {
      st.textContent = txt || '';
      st.classList.toggle('err', !!isErr);
    };

    const acts = SB.el('div', 'pp-actions');
    const b = SB.el('button', 'tb on', 'Clean ' + stale.length +
      (stale.length === 1 ? ' description' : ' descriptions'));
    b.title = 'Take the appearance and wardrobe out of those descriptions, keeping the action. ' +
      'Anything that is an exact copy of a persona is lifted off for free; the rest is rewritten.';
    b.onclick = function () {
      b.disabled = true;
      say('cleaning 0/' + stale.length + '…');
      SB.Coverage.cleanWardrobe(p, stale, {
        onProgress: function (done, total) { say('cleaning ' + done + '/' + total + '…'); }
      }).then(function (r) {
        SB.app.changed(true);
        renderRefs();
        /* renderRefs() has rebuilt this by now — the sweep block is gone once
           everything is clean, so anything left to say goes to the toast. */
        SB.toast(r.cleaned + ' description' + (r.cleaned === 1 ? '' : 's') + ' cleaned' +
          (r.stripped ? ' (' + r.stripped + ' without a request)' : '') +
          (r.failed ? ' · ' + r.failed + ' could not be done' : ''), !!r.failed);
      }).catch(function (e) {
        b.disabled = false;
        if (SB.apiBlocked(e, function () { b.onclick(); })) { say('blocked — see the dialog', true); return; }
        say(e.message || String(e), true);
      });
    };
    acts.appendChild(b);
    box.appendChild(acts);
    box.appendChild(st);
    return box;
  }

  function matches(per) {
    if (!query) return true;
    return ((per.name || '') + ' ' + (per.description || '')).toLowerCase().indexOf(query) >= 0;
  }

  function renderRefs() {
    if (!refsEl || !P()) return;
    const p = P();
    refsEl.innerHTML = '';

    /* The filter moves for reasons other than a tab being clicked — adding a
       subject, a generate run finishing — so the highlight is set from the
       filter every time, not by the click that happened to change it. */
    if (tabsEl) {
      tabsEl.querySelectorAll('button').forEach(function (b) {
        b.classList.toggle('on', b.dataset.kind === filter);
      });
    }

    applySize();

    statusEl = SB.el('div', 'pp-status lib-status');
    refsEl.appendChild(statusEl);

    const bar = renameBar();
    if (bar) refsEl.appendChild(bar);

    const sweep = sweepBlock(p);
    if (sweep) refsEl.appendChild(sweep);

    let shown = 0;
    SB.Personas.KINDS.forEach(function (kind) {
      if (filter !== 'all' && filter !== kind.id) return;
      const mine = SB.Personas.ofKind(p, kind.id).filter(matches);
      const sec = SB.el('div', 'lib-section');
      const h = SB.el('div', 'lib-section-head');
      h.appendChild(SB.el('span', 't', kind.plural));
      h.appendChild(SB.el('span', 'n', mine.length ? String(mine.length) : ''));
      sec.appendChild(h);

      if (!mine.length) {
        sec.appendChild(SB.el('div', 'pp-note lib-empty',
          query ? 'Nothing here matches “' + query + '”.'
                : 'No ' + kind.plural.toLowerCase() + ' yet.'));
      } else {
        const grid = SB.el('div', 'lib-grid');
        mine.forEach(function (per) { grid.appendChild(card(per)); });
        sec.appendChild(grid);
        shown += mine.length;
      }
      refsEl.appendChild(sec);
    });

    if (!shown && !query) {
      refsEl.appendChild(SB.el('div', 'pp-note',
        'A subject here is anything that has to look the same twice — a person, a room, ' +
        'a product. Descriptions carry the wardrobe; the description plus the reference ' +
        'images is what keeps it identical from shot to shot.'));
    }
  }

  /* ------------------------------------------------------------ one subject */

  function card(per) {
    const p = P();
    const kind = SB.Personas.kindOf(per);
    const wrap = SB.el('div', 'persona kind-' + kind.id + (targetId === per.id ? ' target' : ''));
    wrap.dataset.id = per.id;
    /* Whatever you last touched is what a pasted image belongs to. */
    const claim = function () {
      if (targetId === per.id) return;
      targetId = per.id;
      refsEl.querySelectorAll('.persona.target').forEach(function (x) { x.classList.remove('target'); });
      wrap.classList.add('target');
    };
    wrap.addEventListener('mousedown', claim);
    wrap.addEventListener('focusin', claim);

    /* ---- head: name, kind, usage, delete ---- */
    const head = SB.el('div', 'persona-head');
    const name = document.createElement('input');
    name.type = 'text';
    name.className = 'persona-name';
    name.value = per.name || '';
    name.placeholder = 'Name';
    /* what the name was when this edit started, so a rename can be spotted */
    let nameWas = per.name || '';
    name.addEventListener('focus', function () { nameWas = per.name || ''; });
    name.addEventListener('input', function () {
      per.name = name.value;
      SB.Personas.touch(per);
      SB.Store.touch();
      /* Rows only — re-rendering this panel would rebuild the very input being
         typed into and drop focus after each keystroke. */
      SB.Board.refreshCastRows();
    });
    /* The name is written into descriptions by hand and by @, so a rename
       leaves copies of the old one lying around. Offered, never automatic. */
    name.addEventListener('blur', function () {
      const was = nameWas, now = per.name || '';
      nameWas = now;
      if (!was || !now || was === now) return;
      /* Renaming in two passes — fixing a typo, thinking again — used to lose
         the repair: the second blur overwrote the pending record with a name
         that was never in any description, which then cancelled itself. The
         oldest unrepaired name is the one actually sitting in the text, so an
         offer already standing for this subject is left alone. */
      if (!pendingRename || pendingRename.id !== per.id) {
        pendingRename = { id: per.id, was: was };
      }
      /* This blur may be the panel tearing the input out from under the user
         — a tab, the kind select, the ✕. Redraw only if it was not. */
      if (root && refsEl && refsEl.querySelector('.persona[data-id="' + per.id + '"]')) renderRefs();
    });
    head.appendChild(name);

    const sel = document.createElement('select');
    sel.className = 'persona-kind';
    sel.title = 'What this is. It changes how the prompt writer is told about it.';
    SB.Personas.KINDS.forEach(function (k) {
      const o = document.createElement('option');
      o.value = k.id; o.textContent = k.label;
      if (k.id === kind.id) o.selected = true;
      sel.appendChild(o);
    });
    sel.onchange = function () {
      per.kind = sel.value;
      SB.Personas.touch(per);
      SB.app.changed(true);
      renderRefs();
    };
    head.appendChild(sel);

    const used = countShots(per.id);
    const usedEl = SB.el('button', 'persona-used', used + (used === 1 ? ' shot' : ' shots'));
    if (used) {
      usedEl.title = 'Go to the first card this is on';
      usedEl.onclick = function () { jumpToFirst(per.id); };
    } else {
      usedEl.classList.add('none');
      usedEl.title = 'Not on any card yet';
      usedEl.disabled = true;
    }
    head.appendChild(usedEl);

    const del = SB.el('button', 'mini danger', '✕');
    del.title = 'Remove this and take it off every shot';
    del.onclick = function () {
      /* This cannot be undone — structural changes are deliberately outside the
         undo stack — and it takes more with it than the cards it is on. */
      const frames = SB.Personas.imagesOf(per).length;
      const marked = markedIn(per.id);
      const takes = [];
      if (used) takes.push('comes off ' + used + ' card' + (used === 1 ? '' : 's'));
      if (frames) takes.push('deletes ' + frames + ' reference image' + (frames === 1 ? '' : 's'));
      if (marked) takes.push(marked + ' description' + (marked === 1 ? '' : 's') +
        ' will keep the name as plain text');
      if (!confirm('Remove “' + (per.name || kind.one) + '”?' +
        (takes.length ? '\n\nIt ' + takes.join(', ') + '.' : '') +
        '\n\nThis cannot be undone.')) return;
      SB.Personas.remove(p, per.id);
      SB.app.changed(true);
      render();
    };
    head.appendChild(del);
    wrap.appendChild(head);

    /* ---- reference frames, and the fields beside or below them ---- */
    const body = SB.el('div', 'persona-body');
    const fields = SB.el('div', 'persona-fields');
    body.appendChild(frames(per, kind, wrap));
    body.appendChild(fields);
    wrap.appendChild(body);

    /* ---- description ---- */
    fields.appendChild(SB.el('div', 'box-label', kind.descLabel));
    const d = document.createElement('textarea');
    d.className = 'persona-text';
    d.rows = 3;
    d.value = per.description || '';
    d.placeholder = kind.descHint;
    d.addEventListener('input', function () {
      per.description = d.value;
      SB.Personas.touch(per);
      SB.Store.touch();
      /* the cards carrying this may now be showing a prompt written against
         the old wardrobe */
      SB.Board.refreshCastRows();
      SB.Board.refreshPromptStale();
    });
    fields.appendChild(d);

    /* ---- reference-image prompt ---- */
    fields.appendChild(SB.el('div', 'box-label', 'reference image prompt'));
    const ip = document.createElement('textarea');
    ip.className = 'persona-text';
    ip.rows = 2;
    ip.value = per.imagePrompt || '';
    ip.placeholder = 'The prompt that makes this reference frame.';
    ip.addEventListener('input', function () {
      per.imagePrompt = ip.value;
      SB.Personas.touch(per);
      SB.Store.touch();
    });
    fields.appendChild(ip);

    const foot = SB.el('div', 'pp-actions');
    const copy = SB.el('button', 'mini', 'copy prompt');
    copy.onclick = function () {
      navigator.clipboard.writeText(per.imagePrompt || '').then(function () {
        SB.toast('Reference prompt copied');
      }).catch(function () { SB.toast('Could not copy', true); });
    };
    foot.appendChild(copy);

    const write = SB.el('button', 'mini', 'write it for me');
    write.title = 'Ask the writer model for a reference-frame prompt from the description';
    write.onclick = function () {
      if (!(per.description || '').trim()) { SB.toast('Write a description first', true); return; }
      write.disabled = true;
      const m = SB.Model.imageModel(P());
      const brand = SB.Brand.brandOf(P());
      const sys = brand.enabled
        ? 'HOUSE STYLE\n\n' + brand.text + '\n\n' + SB.Brand.REFERENCE_RIDER
        : SB.Brand.REFERENCE_RIDER;
      SB.Prompts.raw(
        'Write one still-image prompt for ' + (m ? m.name : 'an image model') +
        ' that produces ' + kind.refBrief + '.\n\n' +
        kind.label.toUpperCase() + ':\n' + per.description,
        { type: 'OBJECT', properties: { imagePrompt: { type: 'STRING' } }, required: ['imagePrompt'] },
        sys
      ).then(function (out) {
        per.imagePrompt = out.imagePrompt || '';
        ip.value = per.imagePrompt;
        write.disabled = false;
        SB.app.changed(true);
      }).catch(function (e) {
        write.disabled = false;
        if (SB.apiBlocked(e, function () { write.onclick(); })) return;
        SB.toast(e.message || String(e), true);
      });
    };
    foot.appendChild(write);
    fields.appendChild(foot);

    return wrap;
  }

  /* One angle rarely pins a face or a room down, so a subject holds as many
   * frames as it needs. The first is the hero: it is what the board shows and
   * what a single-reference model gets handed. */
  /* The shape of a stored picture, or 0 when the record predates w/h being
   * kept. Everything added through this panel has them — SB.downscaleImage
   * hands them over — so a 0 means an old file or a hand-built fixture. */
  function ratioOf(rec) {
    if (!rec || !(rec.w > 0) || !(rec.h > 0)) return 0;
    return rec.w / rec.h;
  }

  /* Below this a subject is tall enough that the fields belong beside it
   * rather than under it. Square-ish stays stacked. */
  const PORTRAIT_AT = 0.95;

  function applyShape(wrap, box, big, ratio) {
    const portrait = !!ratio && ratio < PORTRAIT_AT;
    if (big) big.style.setProperty('--ar', ratio ? String(ratio) : '');
    wrap.classList.toggle('portrait', portrait);
    /* The frames column is exactly as wide as the frame, so the fields get
       every pixel the picture is not using. It tracks the size dial. */
    box.style.width = portrait
      ? 'calc(var(--ref-hero, 260px) * ' + ratio.toFixed(4) + ')'
      : '';
  }

  function frames(per, kind, wrap) {
    const box = SB.el('div', 'persona-frames');
    const list = SB.Personas.imagesOf(per);

    const big = SB.el('div', 'persona-frame');
    applyShape(wrap, box, big, ratioOf(list[0]));
    if (list.length) {
      const img = document.createElement('img');
      img.src = SB.Blobs.src(P(), list[0]);
      /* An old record carrying no dimensions learns its own shape the first
         time it is drawn, and the file keeps the answer. */
      if (!ratioOf(list[0])) {
        img.onload = function () {
          const w = img.naturalWidth, h = img.naturalHeight;
          if (!w || !h) return;
          list[0].w = w; list[0].h = h;
          SB.Store.touch();
          applyShape(wrap, box, big, w / h);
        };
      }
      big.appendChild(img);
      const rm = SB.el('button', 'frame-x', '✕');
      rm.title = 'Remove this reference image';
      rm.onclick = function (ev) {
        ev.stopPropagation();
        SB.Personas.removeImage(per, 0);
        SB.app.changed(true);
        renderRefs();
      };
      big.appendChild(rm);
    } else {
      big.appendChild(SB.el('div', 'drop-hint', 'drop the reference frame here, or click to load'));
    }
    big.title = list.length ? 'Drop or click to add another reference image' : '';
    dropTarget(big, per);
    box.appendChild(big);

    const strip = SB.el('div', 'persona-strip');
    list.forEach(function (img, i) {
      const cell = SB.el('div', 'strip-cell' + (i === 0 ? ' hero' : ''));
      const t = SB.el('div', 'strip-thumb');
      const r = ratioOf(img);
      if (r) t.style.setProperty('--ar', String(r));
      const im = document.createElement('img');
      im.src = SB.Blobs.src(P(), img);
      if (!r) {
        im.onload = function () {
          if (!im.naturalWidth || !im.naturalHeight) return;
          img.w = im.naturalWidth; img.h = im.naturalHeight;
          SB.Store.touch();
          t.style.setProperty('--ar', String(img.w / img.h));
        };
      }
      t.appendChild(im);
      t.title = i === 0 ? 'The hero frame' : 'Make this the hero frame';
      if (i > 0) {
        t.onclick = function () {
          SB.Personas.makeHero(per, i);
          SB.app.changed(true);
          renderRefs();
        };
      }
      const x = SB.el('button', 'frame-x small', '✕');
      x.title = 'Remove this reference image';
      x.onclick = function (ev) {
        ev.stopPropagation();
        SB.Personas.removeImage(per, i);
        SB.app.changed(true);
        renderRefs();
      };
      t.appendChild(x);
      cell.appendChild(t);

      /* The label is what the prompt block cites — "image 2 = Ops lead (3/4)" —
         so it is worth a box of its own rather than being guessed at. */
      const lb = document.createElement('input');
      lb.type = 'text';
      lb.className = 'strip-label';
      lb.value = img.label || '';
      lb.placeholder = i === 0 ? 'hero' : 'label';
      lb.title = (img.label || '') || 'What this angle is: front, 3/4, wardrobe detail, wide…';
      lb.addEventListener('input', function () {
        SB.Personas.labelImage(per, i, lb.value);
        lb.title = lb.value || 'What this angle is: front, 3/4, wardrobe detail, wide…';
        SB.Store.touch();
        /* the label is cited in the manifest and in the saved filename */
        SB.Board.refreshCastRows();
      });
      cell.appendChild(lb);
      strip.appendChild(cell);
    });

    const add = SB.el('div', 'strip-cell');
    const plus = SB.el('div', 'strip-thumb add', '+');
    plus.title = 'Add another reference image';
    plus.onclick = function () {
      SB.pickImageFile().then(function (f) { if (f) addImage(per, f); });
    };
    dropTarget(plus, per);
    add.appendChild(plus);
    strip.appendChild(add);
    box.appendChild(strip);

    const n = list.length;
    let note;
    if (!n) note = 'No reference image — prompts will describe this in full instead.';
    else note = (n === 1 ? 'One frame' : n + ' frames') + ', fed in this order wherever ' +
      (per.name || 'this') + ' appears.';
    if (n > SB.Personas.IMAGE_ADVICE) {
      note += ' Past ' + SB.Personas.IMAGE_ADVICE + ', most image models start averaging ' +
        'references together instead of reading them.';
    }
    box.appendChild(SB.el('div', 'pp-note' + (n > SB.Personas.IMAGE_ADVICE ? ' warn' : ''), note));
    return box;
  }

  function dropTarget(el, per) {
    el.onclick = el.onclick || function () {
      SB.pickImageFile().then(function (f) { if (f) addImage(per, f); });
    };
    el.addEventListener('dragover', function (ev) {
      ev.preventDefault();
      el.classList.add('drag-over');
    });
    el.addEventListener('dragleave', function () { el.classList.remove('drag-over'); });
    el.addEventListener('drop', function (ev) {
      ev.preventDefault();
      ev.stopPropagation();
      el.classList.remove('drag-over');
      SB.imageFromTransfer(ev.dataTransfer).then(function (src) {
        if (src) addImage(per, src);
        else SB.toast('No image in that drop', true);
      });
    });
  }

  function addImage(per, src) {
    /* The proxy is the visible half and never waits on the folder: reaching a
       remembered directory handle can cost a permission check, and on file://
       the handle store itself stalls. So the frame appears, and the full-size
       original catches up. */
    return SB.downscaleImage(src).then(function (img) {
      const rec = SB.Personas.addImage(per, SB.Blobs.image(P(), img.data, img.w, img.h), '');
      SB.app.changed(true);
      renderRefs();
      SB.Renders.keep(P(), src, null).then(function (r) {
        if (!r || !rec) return;
        rec.render = r;
        SB.Store.touch();
        renderRefs();
      });
    }).catch(function (e) { SB.toast('Image failed: ' + e.message, true); });
  }

  /* ---- renaming leaves copies of the old name in descriptions ---- */

  /* Built from `pendingRename` on every render rather than inserted by the blur
   * that raised it: that blur is often the panel tearing the input out from
   * under the user (a tab, the kind select, the ✕), and a bar inserted then
   * went into a tree that had already been thrown away. Held as state, the
   * offer survives a re-render and a close, and the hits are counted fresh
   * each time so it never offers to repair something already repaired. */
  function renameBar() {
    if (!pendingRename) return null;
    const per = SB.Personas.find(P(), pendingRename.id);
    const was = pendingRename.was;
    const now = per ? (per.name || '') : '';
    if (!per || !was || !now || was === now) { pendingRename = null; return null; }

    /* Only where the old name sits in the text as PROSE. A mark resolves by
       id, so it already says the new name and needs no repair — and matching
       inside one would rewrite the token's own fallback. */
    const hits = [];
    SB.Model.eachShot(P(), function (sh) {
      if (SB.Refs.proseHits(P(), sh.description, was).length) hits.push(sh);
    });
    if (!hits.length) { pendingRename = null; return null; }

    const bar = SB.el('div', 'lib-rename');
    bar.appendChild(SB.el('span', null,
      '“' + was + '” is still written into ' + hits.length +
      (hits.length === 1 ? ' description' : ' descriptions') + '.'));
    const b = SB.el('button', 'mini primary', 'Update ' + (hits.length === 1 ? 'it' : 'them') +
      ' to “' + now + '”');
    b.onclick = function () {
      hits.forEach(function (sh) {
        /* back to front, so each rewrite leaves the earlier offsets alone */
        const spots = SB.Refs.proseHits(P(), sh.description, was);
        let text = sh.description || '';
        for (let i = spots.length - 1; i >= 0; i--) {
          text = text.slice(0, spots[i].from) + now + text.slice(spots[i].to);
        }
        sh.description = text;
      });
      pendingRename = null;
      SB.app.changed(true);
      renderRefs();
      SB.toast(hits.length + (hits.length === 1 ? ' description' : ' descriptions') + ' updated');
    };
    const no = SB.el('button', 'mini link', 'leave them');
    no.onclick = function () { pendingRename = null; renderRefs(); };
    bar.appendChild(b);
    bar.appendChild(no);
    return bar;
  }

  /* ---- a pasted image belongs to the subject you last touched ---- */

  function pasteImage(blob) {
    if (!blob) return;
    const per = targetId ? SB.Personas.find(P(), targetId) : null;
    if (!per) {
      SB.toast('Click the subject you want it on first, then paste', true);
      return;
    }
    addImage(per, blob);
    SB.toast('Added to ' + (per.name || 'that subject'));
  }

  /* --------------------------------------------------------------- scenes */

  /* The shape of the film. Headings and descriptions, in order, with no shots
   * under them — the board is where shots live, and putting them here would
   * make this a second board instead of a way to see the whole thing at once. */
  function renderScenes() {
    if (!scenesEl || !P()) return;
    const p = P();
    /* This is called from under the user's hands — a generate finishing, an
       undo — so where the caret was is remembered across the rebuild. */
    const act = document.activeElement;
    const keep = (act && scenesEl.contains(act) && act.dataset && act.dataset.scene)
      ? { scene: act.dataset.scene, cls: act.className, at: act.selectionStart, to: act.selectionEnd }
      : null;
    scenesEl.innerHTML = '';

    const h = SB.el('div', 'lib-section-head');
    h.appendChild(SB.el('span', 't', 'Scenes'));
    h.appendChild(SB.el('span', 'n', String(p.scenes.length)));
    h.appendChild(SB.el('span', 'spacer'));
    const add = SB.el('button', 'tb', '+ Scene');
    add.onclick = function () {
      const sc = SB.Model.addScene(p);
      SB.app.selectedSceneId = sc.id;
      SB.app.changed(true);
      renderScenes();
      const el = scenesEl.querySelector('.sc-row[data-id="' + sc.id + '"] .sh-heading');
      if (el) { el.focus(); el.select(); }
    };
    h.appendChild(add);
    scenesEl.appendChild(h);

    const list = SB.el('div', 'sc-list');
    p.scenes.forEach(function (sc, i) { list.appendChild(sceneRow(sc, i)); });
    scenesEl.appendChild(list);
    scenesEl.appendChild(SB.el('div', 'pp-note',
      'Drag a scene by its handle to reorder the film. Shots stay with their scene.'));

    if (keep) {
      const back = scenesEl.querySelector(
        '[data-scene="' + keep.scene + '"].' + keep.cls.split(' ').join('.'));
      if (back) {
        back.focus();
        try { back.setSelectionRange(keep.at, keep.to); } catch (e) { /* not a text box */ }
      }
    }
  }

  function sceneRow(sc, idx) {
    const p = P();
    const row = SB.el('div', 'sc-row' + (SB.app.selectedSceneId === sc.id ? ' sel' : ''));
    row.dataset.id = sc.id;

    const grip = SB.el('div', 'sc-grip', '⠿');
    grip.title = 'Drag to reorder';
    grip.draggable = true;
    grip.addEventListener('dragstart', function (ev) {
      ev.dataTransfer.setData('text/sb-scene', sc.id);
      ev.dataTransfer.effectAllowed = 'move';
      row.classList.add('dragging');
    });
    grip.addEventListener('dragend', function () { row.classList.remove('dragging'); });
    row.appendChild(grip);

    row.addEventListener('dragover', function (ev) {
      if (ev.dataTransfer.types.indexOf('text/sb-scene') < 0) return;
      ev.preventDefault();
      row.classList.add('drag-over');
    });
    row.addEventListener('dragleave', function () { row.classList.remove('drag-over'); });
    row.addEventListener('drop', function (ev) {
      row.classList.remove('drag-over');
      const id = ev.dataTransfer.getData('text/sb-scene');
      if (!id || id === sc.id) return;
      ev.preventDefault();
      /* moveScene inserts BEFORE the index it is given, so dropping on the
         lower half of a row has to mean the slot after it — without this you
         could never drag a scene to the end, and a one-step drag downward
         quietly did nothing at all. */
      const r = row.getBoundingClientRect();
      const after = ev.clientY > r.top + r.height / 2;
      SB.Model.moveScene(p, id, after ? idx + 1 : idx);
      SB.app.changed(true);
      renderScenes();
      SB.Board.renderSceneList();
    });

    const num = SB.el('div', 'sc-num', String(idx + 1));
    row.appendChild(num);

    const fields = SB.el('div', 'sc-fields');
    const hd = document.createElement('input');
    hd.type = 'text';
    hd.className = 'sh-heading';
    hd.value = sc.heading || '';
    hd.placeholder = 'Untitled scene — what happens here';
    hd.dataset.scene = sc.id;
    hd.addEventListener('input', function () {
      sc.heading = hd.value;
      SB.app.changed(false);
      SB.Board.renderSceneList();
      SB.Board.syncSceneFields(sc.id);
    });
    fields.appendChild(hd);

    const d = SB.el('div', 'sh-desc');
    d.dataset.scene = sc.id;
    SB.RefBox.attach(d, {
      get: function () { return sc.description || ''; },
      set: function (t) {
        sc.description = t;
        SB.app.changed(false);
        SB.Board.syncSceneFields(sc.id);
      },
      placeholder: 'Scene description — what happens here, in prose.',
      ctx: { scene: sc }
    });
    fields.appendChild(d);
    fields.appendChild(SB.Board.sceneAi(sc, d));
    row.appendChild(fields);

    /* The only nod to shots: how many, and whether the scene claims a section
       of the script. Both are answers about the scene, not about its contents. */
    const meta = SB.el('div', 'sc-meta');
    const claim = sc.link && !sc.broken ? 'section'
      : (sc.broken ? 'section broken' : (sc.local ? 'own section' : 'untied'));
    const go = SB.el('button', 'mini', sc.shots.length +
      (sc.shots.length === 1 ? ' shot' : ' shots'));
    go.title = 'Show this scene on the board';
    go.onclick = function () {
      close();
      SB.app.selectedSceneId = sc.id;
      SB.Board.renderSceneList();
      const blk = document.querySelector('.scene-block[data-scene="' + sc.id + '"]');
      if (blk) blk.scrollIntoView({ behavior: 'smooth', block: 'start' });
    };
    meta.appendChild(go);
    const claimEl = SB.el('div', 'sc-claim' + (sc.broken ? ' broken' : ''), claim);
    claimEl.title = sc.broken
      ? 'This scene claimed a stretch of the master script, and the text it pointed at has moved.'
      : (sc.link || sc.local
        ? 'This scene claims a stretch of the master script.'
        : 'This scene claims no part of the master script — which is normal. ' +
          'Claiming one is a deliberate act: select the text in the Script panel and Capture.');
    meta.appendChild(claimEl);

    const del = SB.el('button', 'mini danger', '✕');
    del.title = 'Delete this scene';
    del.onclick = function () {
      if (p.scenes.length < 2) { SB.toast('A board keeps at least one scene', true); return; }
      /* The claim on the script is worth as much as the cards are, and it is
         the thing you cannot see from here — so it is asked about too. */
      const what = [];
      if (sc.shots.length) what.push(sc.shots.length + ' shot' + (sc.shots.length === 1 ? '' : 's'));
      if (SB.Model.sceneTied(sc)) what.push('its claim on the script');
      if (what.length && !confirm('Delete “' + (sc.heading || 'this scene') + '” and ' +
        what.join(' and ') + '?')) return;
      SB.Model.deleteScene(p, sc.id);
      SB.Board.forgetScene(sc.id);
      SB.app.changed(true);
      renderScenes();
      SB.Board.renderSceneList();
    };
    meta.appendChild(del);
    row.appendChild(meta);

    return row;
  }

  /* ---------------------------------------------------------------- utils */

  /* How many descriptions carry a mark for this subject — they do not break
   * when it goes, but they stop feeding a picture. */
  function markedIn(id) {
    let n = 0;
    SB.Model.eachShot(P(), function (sh) {
      if (SB.Refs.parse(P(), sh.description).some(function (m) { return m.id === id; })) n++;
    });
    return n;
  }

  function countShots(id) {
    let n = 0;
    SB.Model.eachShot(P(), function (sh) {
      if ((sh.personaIds || []).indexOf(id) >= 0) n++;
    });
    return n;
  }

  function jumpToFirst(id) {
    let found = null;
    SB.Model.eachShot(P(), function (sh) {
      if (!found && (sh.personaIds || []).indexOf(id) >= 0) found = sh;
    });
    if (!found) return;
    close();
    SB.Board.select(found.id);
    const el = document.querySelector('.card[data-shot="' + found.id + '"]');
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  SB.PersonaPanel = {
    init: init, open: open, close: close, toggle: toggle, isOpen: isOpen,
    refresh: refresh, refreshScenes: refreshScenes, refreshRefs: refreshRefs,
    pasteImage: pasteImage
  };

})(window.SB);

</script>
<script>
/* ===== js/mentions.js ===== */
/* mentions.js — the @ popover.
 *
 * @ means one thing: THE MODEL WILL BE SHOWN A PICTURE OF THIS.
 *
 *   @a subject  ->  its reference frames go into the feed
 *   @a shot     ->  that shot's rendered frame goes into the feed
 *   the order of the marks in the sentence is the order of the images
 *
 * Picking from this list writes a mark (refs.js), which the box draws as a
 * link and the card turns into a numbered feed strip. Knowing when to hand a
 * model a reference image is the expertise this replaces; written as one rule
 * with a visible consequence, it is something a person can follow on their
 * first day.
 *
 * The list also carries what a pick will actually feed — "2 frames", "no
 * reference image", "not rendered yet" — because a mark that feeds nothing is
 * the failure this is meant to prevent, and the moment to say so is now.
 *
 * Both kinds of box are driven: a plain textarea, and the contenteditable
 * reference box (refbox.js) that renders marks as links. Not the master script
 * or the tied scene boxes — those are Doc-backed, where every shot anchor is an
 * offset into one shared string, and inserting text behind SB.Doc.replace would
 * desync the file.
 */
(function (SB) {
  'use strict';

  let pop = null, host = null, ctx = null;
  let items = [], active = 0, at = -1, term = '';

  function P() { return SB.app.project; }

  /* A textarea answers with .value and .selectionStart; the reference box has
   * to be read out of the DOM. Everything below goes through these three, so
   * the popover does not care which it is driving. */
  function rich(el) { return el.isContentEditable; }
  function val(el) { return rich(el) ? SB.RefBox.read(el) : el.value; }
  function pos(el) { return rich(el) ? SB.RefBox.caret(el) : el.selectionStart; }
  function put(el, text, at) {
    if (rich(el)) {
      SB.RefBox.write(el, P(), text);
      SB.RefBox.setCaret(el, at);
      el.classList.toggle('empty', !text);
      return;
    }
    el.value = text;
    el.setSelectionRange(at, at);
  }

  /* An @ only opens the popover at the start of a word — mid-word it is an
   * email address or a handle somebody is quoting, and stealing those
   * keystrokes would be worse than not offering the list at all. */
  /* "}" is a boundary because that is where the caret lands after a pick —
   * naming two subjects back to back is ordinary, and used to be dead. */
  function boundary(ch) { return !ch || /[\s(\[\-—"'“‘}]/.test(ch); }

  function attach(el, opts) {
    if (!el) return;
    el.addEventListener('keydown', function (ev) { onKey(ev, el, opts || {}); }, true);
    el.addEventListener('input', function () { if (pop && host === el) update(); });
    /* Deferred so a click on a row lands first — but only ever closing this
       box's own popover. Unconditional, it reached across and killed a list
       that had already been opened in whichever box was focused next. */
    el.addEventListener('blur', function () {
      setTimeout(function () { if (host === el) hide(); }, 120);
    });
  }

  function onKey(ev, el, opts) {
    if (pop && host === el) {
      if (ev.key === 'ArrowDown') { ev.preventDefault(); move(1); return; }
      if (ev.key === 'ArrowUp') { ev.preventDefault(); move(-1); return; }
      if (ev.key === 'Enter' || ev.key === 'Tab') {
        if (items.length) { ev.preventDefault(); ev.stopPropagation(); choose(items[active]); }
        return;
      }
      if (ev.key === 'Escape') { ev.preventDefault(); ev.stopPropagation(); hide(); return; }
      /* A second @ is somebody starting again — naming a second person in the
         same sentence, or giving up on the first attempt. Fall through and
         re-anchor to it. Without this the list died on the new @ and would not
         come back until the character was deleted and retyped. */
      if (ev.key !== '@') return;
    }
    if (ev.key !== '@') return;
    const before = String(val(el)).slice(0, pos(el)).slice(-1);
    if (!boundary(before)) return;
    /* The @ itself is typed as normal; the popover opens on the next tick with
       the caret already past it, so the offsets below are simple. */
    host = el;
    ctx = opts;
    setTimeout(function () {
      const at = pos(el) - 1;
      if (String(val(el)).charAt(at) !== '@') { host = null; return; }
      term = '';
      show(at);
    }, 0);
  }

  /* What has been typed since the @, or null once it stops looking like a name
   * being written (a newline, a second @, or a run long enough that this was
   * plainly not a mention). */
  function typed() {
    if (!host || at < 0) return null;
    const caret = pos(host);
    if (caret == null || caret <= at) return null;
    const s = String(val(host)).slice(at + 1, caret);
    if (/[\n@]/.test(s) || s.length > 40) return null;
    return s;
  }

  /* What picking this would actually feed — said here, because a mark that
   * feeds nothing is the whole failure this is meant to prevent. */
  function note(per) {
    const n = SB.Personas.imagesOf(per).length;
    if (!n) return { text: 'no reference image', warn: true };
    return { text: n === 1 ? '1 frame' : n + ' frames', warn: false };
  }

  function candidates() {
    const p = P();
    const t = term.trim().toLowerCase();
    const out = [];
    SB.Personas.KINDS.forEach(function (kind) {
      SB.Personas.ofKind(p, kind.id).forEach(function (per) {
        const name = (per.name || '').toLowerCase();
        const e = { per: per, kind: kind, id: per.id, label: per.name || 'unnamed', note: note(per) };
        if (!t) { e.rank = 1; out.push(e); return; }
        const i = name.indexOf(t);
        if (i === 0) { e.rank = 0; out.push(e); }
        else if (i > 0) { e.rank = 1; out.push(e); }
        else if ((per.description || '').toLowerCase().indexOf(t) >= 0) {
          /* matched on what it IS, not what it is called — say so, or it reads
             as the list offering something at random */
          e.rank = 2; e.sub = 'matches its description'; out.push(e);
        }
      });
    });

    /* A shot is a reference image like any other: its rendered frame. This is
       how you riff — "reverse of @1C" says the relation, the feed and the
       prose in one line. The card being written is not offered to itself. */
    SB.Model.eachShot(p, function (sh, sc, si, sj) {
      if (ctx && ctx.shot && sh.id === ctx.shot.id) return;
      const code = SB.Model.code(si, sj);
      const full = SB.Refs.plain(p, sh.description).replace(/\s+/g, ' ').trim();
      const desc = full.length > 48 ? full.slice(0, 48) + '\u2026' : full;
      const hay = (code + ' ' + (sh.type || '') + ' ' + full).toLowerCase();
      if (t && hay.indexOf(t) < 0) return;
      out.push({
        shot: sh, id: sh.id, label: code,
        kind: { id: 'shot', label: 'Shot', one: 'shot' },
        rank: t && code.toLowerCase().indexOf(t) === 0 ? 0 : 3,
        sub: (sh.type ? sh.type + ' — ' : '') + (desc || 'no description'),
        note: sh.image ? { text: 'frame', warn: false }
                       : { text: 'not rendered yet', warn: true }
      });
    });

    out.sort(function (a, b) { return a.rank - b.rank; });
    /* Room for the mint rows: with eight matches plus three of those, the
       "+ new person" row — the whole point of typing a name that does not
       exist yet — sat permanently below the fold. */
    const list = out.slice(0, t ? 5 : 8);
    /* Writing is when you find out somebody is missing, so minting one is on
       the list rather than behind a trip to the library. */
    if (t) {
      SB.Personas.KINDS.forEach(function (kind) {
        list.push({ make: kind, kind: kind });
      });
    }
    return list;
  }

  /* The @ position is set after the teardown, not before it: hide() forgets
     where the last one was, and that includes the one being opened. */
  /* Any scroll between the caret and the viewport moves the box — the board,
   * the takeover's own panes, the textarea itself. Captured, because scroll
   * does not bubble, and the popover is stranded at a stale position
   * otherwise: it stays put while the box it belongs to slides away. */
  function onScroll() {
    if (!pop || !host) return;
    const r = host.getBoundingClientRect();
    if (r.bottom < 0 || r.top > window.innerHeight) { hide(); return; }
    place();
  }

  function show(pos) {
    hide(true);
    at = pos;
    pop = SB.el('div', 'men-pop');
    pop.addEventListener('mousedown', function (ev) { ev.preventDefault(); });   // keep the caret
    document.body.appendChild(pop);
    document.addEventListener('scroll', onScroll, true);
    window.addEventListener('resize', onScroll);
    active = 0;
    update();
  }

  function update() {
    if (!pop) return;
    const t = typed();
    if (t === null) { hide(); return; }
    term = t;
    items = candidates();
    if (!items.length) { hide(); return; }
    if (active >= items.length) active = items.length - 1;

    pop.innerHTML = '';
    items.forEach(function (it, i) {
      const row = SB.el('div', 'men-row' + (i === active ? ' on' : ''));
      if (it.make) {
        row.classList.add('make');
        row.appendChild(SB.el('span', 'men-kind', '+'));
        row.appendChild(SB.el('span', 'men-name', 'new ' + it.kind.one + ' “' + term.trim() + '”'));
      } else {
        row.appendChild(SB.el('span', 'men-kind kind-' + it.kind.id, it.kind.label));
        row.appendChild(SB.el('span', 'men-name', it.label));
        if (it.sub) row.appendChild(SB.el('span', 'men-sub', it.sub));
        row.appendChild(SB.el('span', 'men-img' + (it.note.warn ? ' warn' : ''), it.note.text));
      }
      row.addEventListener('mouseenter', function () {
        active = i;
        pop.querySelectorAll('.men-row').forEach(function (r, j) { r.classList.toggle('on', i === j); });
      });
      row.addEventListener('click', function () { choose(it); });
      pop.appendChild(row);
    });
    place();
  }

  function move(d) {
    if (!items.length) return;
    active = (active + d + items.length) % items.length;
    pop.querySelectorAll('.men-row').forEach(function (r, i) { r.classList.toggle('on', i === active); });
    const on = pop.querySelector('.men-row.on');
    if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest' });
  }

  /* Anchored to the caret, which a textarea will not tell you about — so the
   * text up to the caret is measured in a mirror styled like the box. */
  function place() {
    const r = host.getBoundingClientRect();
    const c = caretPoint();
    let left = r.left + c.x;
    let top = r.top + c.y + c.h;
    left = Math.min(left, window.innerWidth - pop.offsetWidth - 8);
    if (top + pop.offsetHeight > window.innerHeight - 8) top = r.top + c.y - pop.offsetHeight - 2;
    pop.style.left = Math.max(8, left) + 'px';
    pop.style.top = Math.max(8, top) + 'px';
  }

  function caretPoint() {
    /* A contenteditable will tell you where the caret is; a textarea will not,
       which is what the mirror below is for. */
    if (rich(host)) {
      const sel = window.getSelection();
      if (sel && sel.rangeCount) {
        const r = sel.getRangeAt(0).cloneRange();
        r.collapse(true);
        let rect = r.getClientRects()[0];
        if (!rect) {
          const probe = document.createElement('span');
          probe.textContent = '​';
          r.insertNode(probe);
          rect = probe.getBoundingClientRect();
          probe.remove();
        }
        if (rect) {
          const hb = host.getBoundingClientRect();
          return { x: rect.left - hb.left, y: rect.top - hb.top, h: rect.height || 16 };
        }
      }
      return { x: 0, y: 0, h: 16 };
    }
    const cs = window.getComputedStyle(host);
    const mirror = SB.el('div', 'men-mirror');
    ['fontFamily', 'fontSize', 'fontWeight', 'lineHeight', 'letterSpacing',
      'paddingTop', 'paddingRight', 'paddingBottom', 'paddingLeft',
      'borderTopWidth', 'borderLeftWidth', 'whiteSpace', 'wordWrap'].forEach(function (k) {
        mirror.style[k] = cs[k];
      });
    mirror.style.width = host.clientWidth + 'px';
    mirror.style.whiteSpace = 'pre-wrap';
    mirror.style.wordWrap = 'break-word';
    mirror.textContent = host.value.slice(0, at + 1);
    const dot = SB.el('span', null, '​');
    mirror.appendChild(dot);
    document.body.appendChild(mirror);
    const mb = mirror.getBoundingClientRect(), db = dot.getBoundingClientRect();
    const out = {
      x: db.left - mb.left,
      y: db.top - mb.top - host.scrollTop,
      h: parseFloat(cs.lineHeight) || 16
    };
    mirror.remove();
    return out;
  }

  function choose(it) {
    if (!host) return;
    const p = P();
    /* a shot: its frame is the reference, and there is nothing to cast */
    if (it.shot) {
      const el = host;
      const caret = pos(el);
      if (caret == null) { hide(); return; }
      const next = SB.Refs.insert(val(el), at, caret, it.shot.id, it.label);
      hide();
      put(el, next.text, next.caret);
      el.focus();
      el.dispatchEvent(new Event('input', { bubbles: true }));
      SB.Store.touch();
      if (!it.shot.image) SB.toast(it.label + ' has no frame yet — render it and this feeds it', true);
      return;
    }
    let per = it.per;
    if (it.make) {
      const nm = term.trim();
      if (!nm) return;
      per = SB.Personas.add(p, { kind: it.kind.id, name: nm });
      SB.toast('Added ' + it.kind.one + ' “' + nm + '” — give it a description in the library');
    }

    /* hide() forgets which box this was, so hold on to it first. */
    const el = host, where = ctx;
    const name = per.name || 'unnamed';
    const caret = pos(el);
    if (caret == null) { hide(); return; }
    /* A mark, not a name: it carries the id, so renaming the subject or
       renumbering the shot never has to touch a single description. */
    const next = SB.Refs.insert(val(el), at, caret, per.id, name);
    hide();
    put(el, next.text, next.caret);
    el.focus();

    /* Fire the box's own input handler so whatever it writes to — a shot
       description, a custom field, a scene — stores the text the same way it
       would have if this had been typed. */
    el.dispatchEvent(new Event('input', { bubbles: true }));

    /* And the part that actually reaches the model. */
    if (where && where.shot) {
      const ids = where.shot.personaIds = where.shot.personaIds || [];
      if (ids.indexOf(per.id) < 0) {
        ids.push(per.id);
        SB.Board.refreshCastRows();
        SB.toast(name + ' cast on ' + (where.code || 'this card'));
      }
    }
    /* Never app.changed(true) from here: a structural change rebuilds every
       card, and the box this was typed into is one of them. The cast rows are
       refreshed by hand above precisely so the caret can stay where it is. */
    SB.PersonaPanel.refreshRefs();
    SB.Store.touch();
  }

  function hide(keepHost) {
    if (pop) {
      pop.remove();
      pop = null;
      document.removeEventListener('scroll', onScroll, true);
      window.removeEventListener('resize', onScroll);
    }
    items = [];
    at = -1;
    if (!keepHost) { host = null; ctx = null; }
  }

  SB.Mentions = { attach: attach, hide: hide };

})(window.SB);

</script>
<script>
/* ===== js/settings.js ===== */
/* settings.js — tabbed: General · Card fields · Brand · Models & templates · API. */
(function (SB) {
  'use strict';

  function P() { return SB.app.project; }

  function field(labelText, control) {
    const l = SB.el('label', 'field');
    l.appendChild(SB.el('span', null, labelText));
    l.appendChild(control);
    return l;
  }


  /* Where the full-size renders live. The handle is per-browser and is kept the
   * way the project file's handle is — never in the .storyboard, because it is a
   * fact about this machine. */
  function rendersBlock() {
    const box = SB.el('div', 'pp-block');
    box.appendChild(SB.el('div', 't', 'renders folder'));
    const state = SB.el('div', 'pp-note');
    const acts = SB.el('div', 'pp-actions');

    const draw = function (remembered) {
      const p = P();
      if (!SB.Renders.hasFS) {
        state.textContent = 'This browser cannot hold a folder. Chrome or Edge can.';
        state.classList.add('warn');
        acts.innerHTML = '';
        return;
      }
      acts.innerHTML = '';
      if (SB.Renders.isConnected()) {
        state.classList.remove('warn');
        state.textContent = 'Full-size renders are kept in “' + SB.Renders.rootName() + '” / ' +
          SB.Renders.folderName(p) + '. The board still holds its own small copies, so it opens ' +
          'anywhere with or without this folder.';
        const ch = SB.el('button', 'tb', 'Change…');
        ch.onclick = function () {
          SB.Renders.connect().then(function () { draw(false); }).catch(function () { });
        };
        const off = SB.el('button', 'tb', 'Disconnect');
        off.title = 'Stop keeping originals. Nothing already written is touched.';
        off.onclick = function () { SB.Renders.disconnect().then(function () { draw(false); }); };
        acts.appendChild(ch);
        acts.appendChild(off);
      } else if (remembered) {
        /* Chrome hands a persisted handle back needing permission again after a
           restart. The folder IS remembered — saying "not set" here sent people
           off to pick the same folder a second time. */
        state.classList.add('warn');
        state.textContent = 'A folder is remembered, but this browser wants permission again ' +
          'before it can be written to. Dropping a picture or copying an image set will ask; ' +
          'or reconnect it here.';
        const b = SB.el('button', 'tb on', 'Reconnect');
        b.onclick = function () {
          SB.Renders.ready(true).then(function (h) {
            if (h) { SB.toast('Renders folder reconnected'); draw(true); return; }
            SB.Renders.connect().then(function () { draw(false); }).catch(function () { });
          });
        };
        acts.appendChild(b);
        const ch = SB.el('button', 'tb', 'Choose another…');
        ch.onclick = function () { SB.Renders.connect().then(function () { draw(false); }).catch(function () { }); };
        acts.appendChild(ch);
      } else {
        state.classList.remove('warn');
        state.textContent = 'Not set. Every picture you drop is shrunk to 854×480 for the board ' +
          'and the original is discarded — which is too small to feed back into an image model. ' +
          'Choose a folder and the originals are kept, one subfolder per project.';
        const b = SB.el('button', 'tb on', 'Choose a folder…');
        b.onclick = function () {
          SB.Renders.connect().then(function () {
            draw(false);
            SB.toast('Renders will be kept in ' + SB.Renders.rootName());
          }).catch(function (e) {
            if (e && e.name === 'AbortError') return;
            SB.toast(e.message || String(e), true);
          });
        };
        acts.appendChild(b);
      }
    };

    box.appendChild(state);
    box.appendChild(acts);
    draw(false);
    /* the handle is remembered across sessions, so look before saying anything:
       "connected", "remembered but needs a click", and "never chosen" are three
       different states and only the first two have a folder behind them */
    SB.Renders.ready().then(function (h) {
      if (h) { draw(false); return; }
      SB.Renders.isRemembered().then(draw);
    });
    return box;
  }

  function open(startTab) {
    const p = P();
    const body = SB.el('div');

    const tabs = SB.el('div', 'tabs');
    const panels = {};
    const order = [['general', 'General'], ['fields', 'Card fields'], ['brand', 'Brand style'],
    ['models', 'Models & templates'], ['api', 'API']];
    order.forEach(function (t) {
      const b = SB.el('button', 'tab', t[1]);
      b.dataset.tab = t[0];
      b.onclick = function () { select(t[0]); };
      tabs.appendChild(b);
      panels[t[0]] = SB.el('div', 'tab-panel');
    });
    function select(id) {
      tabs.querySelectorAll('.tab').forEach(function (b) { b.classList.toggle('on', b.dataset.tab === id); });
      order.forEach(function (t) { panels[t[0]].classList.toggle('on', t[0] === id); });
    }
    body.appendChild(tabs);
    const host = SB.el('div');
    host.style.paddingTop = '12px';
    order.forEach(function (t) { host.appendChild(panels[t[0]]); });
    body.appendChild(host);

    /* ---------------- General ---------------- */
    const types = document.createElement('textarea');
    types.rows = 8;
    types.value = p.settings.shotTypes.join('\n');
    panels.general.appendChild(field('Shot types (one per line)', types));

    const themeSel = document.createElement('select');
    [['dark', 'Dark'], ['light', 'Light']].forEach(function (o) {
      const op = document.createElement('option');
      op.value = o[0]; op.textContent = o[1];
      if (SB.Theme.current() === o[0]) op.selected = true;
      themeSel.appendChild(op);
    });
    themeSel.onchange = function () { SB.Theme.set(themeSel.value); };
    panels.general.appendChild(field('Appearance', themeSel));

    /* ---- the renders folder ----
     *
