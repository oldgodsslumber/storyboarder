    model: function () {
      return (P() && P().settings.geminiModel) || SB.GeminiModels.DEFAULT;
    },
    /* Gemma is served through the same endpoint but has no JSON mode. */
    schemaFor: function (mdl) { return !SB.GeminiModels.isGemma(mdl); },

    ready: function () { return !!SB.Store.getApiKey(); },
    notReady: function () {
      return 'No Google API key. Add one in Settings → API.';
    },

    url: function (mdl) {
      return GEMINI_ENDPOINT + encodeURIComponent(mdl) +
        ':generateContent?key=' + encodeURIComponent(SB.Store.getApiKey());
    },
    headers: function () { return { 'Content-Type': 'application/json' }; },

    /* opts = { schema, system, hint } — hint is the wording that replaces a
     * response schema when the model has no JSON mode. */
    body: function (mdl, text, opts) {
      const plain = !this.schemaFor(mdl);
      const withSchema = !plain && !!opts.schema;
      const gen = { temperature: 0.8 };
      if (withSchema) {
        gen.responseMimeType = 'application/json';
        gen.responseSchema = opts.schema;
      }
      let user = withSchema ? text : text + opts.hint;
      const body = { generationConfig: gen };
      if (opts.system) {
        /* Gemma takes no systemInstruction either — fold it into the one turn. */
        if (plain) user = opts.system + '\n\n----\n\n' + user;
        else body.systemInstruction = { parts: [{ text: opts.system }] };
      }
      body.contents = [{ role: 'user', parts: [{ text: user }] }];
      return body;
    },

    text: function (data) {
      const cand = data.candidates && data.candidates[0];
      const part = cand && cand.content && cand.content.parts && cand.content.parts[0];
      const raw = part && part.text;
      if (!raw) {
        throw new Error('Gemini returned no text' +
          (cand && cand.finishReason ? ' (' + cand.finishReason + ')' : ''));
      }
      return raw;
    },

    /* Turn a non-2xx into the message that says what to do about it. */
    error: function (status, msg, mdl) {
      let err;
      if (status === 429) {
        SB.GeminiModels.markExhausted(mdl);
        err = new Error('Gemini 429 — daily/rate limit reached for ' + mdl +
          '. Pick another model in the Prompts panel. (' + msg + ')');
      } else if (status === 404) {
        err = new Error('Gemini 404 — "' + mdl + '" is not available to this key. ' +
          'Settings → API → refresh the model list. (' + msg + ')');
      } else {
        err = new Error('Gemini ' + status + ': ' + msg);
      }
      return err;
    }
  };

  /* ---------------- ooba / OpenAI-compatible ---------------- */

  /* Trailing slashes and a pasted-in /v1 are both things people will type. */
  function baseUrl(raw) {
    let u = String(raw == null ? SB.Store.getOoba().url : raw).trim();
    if (!u) u = DEFAULT_OOBA_URL;
    u = u.replace(/\s+$/, '').replace(/\/+$/, '');
    /* Whatever someone pasted, /v1 is the OpenAI version segment and the base
     * is what comes before it — so the whole tail goes, not just the three
     * endings that were listed here. Pasting the models URL while trying to
     * make the model-list button work produced /v1/models/v1/models and a 404
     * that read as the server being wrong. A prefix in front of /v1 is real
     * though (host/openai/v1), so only the tail is taken. */
    u = u.replace(/\/v1(\/[^?#]*)?$/i, '');
    /* "127.0.0.1:11434" is not a URL. fetch() reads it as a path relative to
     * wherever this page is being served from, sends the request to THAT server
     * and hands back its 404 — which reads exactly like the local model server
     * answering on the wrong endpoint. Assume http rather than guessing. */
    if (!/^https?:\/\//i.test(u)) u = 'http://' + u.replace(/^\/+/, '');
    return u;
  }

  /* Browsers treat these as trustworthy even over plain http, so an https page
   * is allowed to reach them. Nothing else on a private network qualifies. */
  function isLoopback(host) {
    return /^(localhost|127\.\d+\.\d+\.\d+|\[::1\]|::1)$/i.test(host || '');
  }

  /* An https page may not fetch a plain http address. The browser refuses
   * before anything reaches the network, so the rejection is identical to the
   * one a dead server produces — and every hint about ports, flags and CORS
   * then sends people to fix a machine that was never asked a question.
   *
   * This is the shape it takes in practice: the app opened from its hosted
   * copy, and the model server on another box on the LAN. There is no setting
   * on either side that allows it. */
  function mixedContent(base) {
    if (typeof location === 'undefined' || location.protocol !== 'https:') return null;
    if (!/^http:\/\//i.test(base)) return null;
    let host = '';
    try { host = new URL(base).hostname; } catch (e) { return null; }
    if (isLoopback(host)) return null;
    return 'This page is served over https (' + location.host + '), and a browser will not let ' +
      'an https page reach a plain http address like ' + base + '. The request is refused ' +
      'before it leaves the browser, which looks exactly like the server being down — but ' +
      'nothing you change on the server can fix it. Either run the model server on this same ' +
      'machine and point at 127.0.0.1, or take a local copy of this app (toolbar → Copy), open ' +
      'that file on the machine you want to use, and set the address there.';
  }

  const ooba = {
    id: 'ooba',
    label: 'Ooba / OpenAI-compatible',
    supportsSchema: false,
    needsKey: false,

    model: function () { return SB.Store.getOoba().model || ''; },
    schemaFor: function () { return false; },

    /* A local server needs no key, so "ready" only means we know where it is. */
    ready: function () { return !!baseUrl(); },
    notReady: function () {
      return 'No server address for the local model. Set one in Settings → API.';
    },

    url: function () { return baseUrl() + '/v1/chat/completions'; },
    headers: function () {
      const h = { 'Content-Type': 'application/json' };
      const k = SB.Store.getOoba().key;
      if (k) h['Authorization'] = 'Bearer ' + k;
      return h;
    },

    body: function (mdl, text, opts) {
      const messages = [];
      if (opts.system) messages.push({ role: 'system', content: opts.system });
      messages.push({ role: 'user', content: text + opts.hint });
      const b = { messages: messages, temperature: 0.8, stream: false };
      /* Ooba serves whatever model is loaded and ignores this; LM Studio and
       * llama-server want it. Sending it only when set keeps both happy. */
      if (mdl) b.model = mdl;
      return b;
    },

    text: function (data) {
      const ch = data.choices && data.choices[0];
      const m = ch && ch.message;
      const raw = (m && m.content) || (ch && ch.text);
      if (!raw) {
        /* Thinking models — Qwen3, DeepSeek-R1 — put their chain of thought in
         * a separate `reasoning` field and the actual answer in `content`. An
         * empty content beside a full reasoning block means the reply ran out
         * of room mid-thought and never reached the answer. That is a context
         * or token ceiling, not a broken server, and saying "returned no text"
         * sends people back to the address for a second time. */
        if (m && m.reasoning) {
          throw new Error('The model used its whole reply thinking and never got to an ' +
            'answer' + (ch.finish_reason ? ' (' + ch.finish_reason + ')' : '') +
            '. Give it more room — on Ollama that is num_ctx — or use a model with ' +
            'thinking turned off.');
        }
        throw new Error('The local model returned no text' +
          (ch && ch.finish_reason ? ' (' + ch.finish_reason + ')' : ''));
      }
      return raw;
    },

    /* `path` is the endpoint the request actually went to. It defaults to the
     * completions one because that is where all but one of these come from, but
     * "refresh the model list" calls /v1/models — and telling somebody their
     * server is not answering on an endpoint the app never asked for sends them
     * to check a port that was right all along. */
    error: function (status, msg, mdl, path) {
      const ep = path || '/v1/chat/completions';
      /* Ollama answers 404 on a perfectly good endpoint when the MODEL is the
       * thing it cannot find. Reading that as "wrong port" sends people off to
       * restart a server that was never the problem, so the body decides which
       * kind of 404 this is before the address is ever blamed. A listing call
       * names no model, so it can never be this. */
      if (ep === '/v1/chat/completions' && status === 404 &&
        /\bmodels?\b/i.test(msg) &&
        /not found|does not exist|no such|unknown/i.test(msg)) {
        return new Error('The server answered, but it has no model called "' +
          (mdl || SB.Store.getOoba().model || '(none chosen)') +
          '". Pick one in Settings → API → Model — ' +
          '“Refresh list” asks the server what it actually has. Ollama names carry ' +
          'the tag, so it is qwen3:8b rather than qwen3. (' + msg + ')');
      }
      if (status === 404) {
        return new Error('404 from ' + baseUrl() + ' — that address answered, but not on ' +
          ep + '. Check the port, and that the server is started with its ' +
          'OpenAI-compatible API enabled (text-generation-webui: --api; Ollama serves this ' +
          'on 11434 with no flag). (' + msg + ')');
      }
      /* Ooba serves whatever is loaded and ignores the field; Ollama and friends
       * refuse without it, so "whatever is loaded" is not a universal default. */
      if (status === 400 && /model/i.test(msg) && /required|missing/i.test(msg)) {
        return new Error('This server has to be told which model to use — ' +
          '“whatever is loaded” only works on servers that keep one loaded. ' +
          'Choose a model in Settings → API. (' + msg + ')');
      }
      if (status === 401 || status === 403) {
        return new Error(status + ' from the local server — it wants an API key. ' +
          'Put the one you launched it with into Settings → API. (' + msg + ')');
      }
      if (status === 500 && /model|loaded/i.test(msg)) {
        return new Error('500 — no model is loaded in the server. Load one, then try again. (' +
          msg + ')');
      }
      return new Error('Local model ' + status + ': ' + msg);
    },

    /* GET /v1/models — the same call on every OpenAI-compatible server. */
    listModels: function (url) {
      const base = baseUrl(url);
      /* Fail here rather than letting the browser refuse it and reporting that
       * as an unreachable server. */
      const mc = mixedContent(base);
      if (mc) {
        const e = new Error(mc);
        e.localApi = true;
        return Promise.reject(e);
      }
      const headers = {};
      const k = SB.Store.getOoba().key;
      if (k) headers['Authorization'] = 'Bearer ' + k;
      return fetch(base + '/v1/models', { headers: headers })
        .catch(function (e) { throw localError(e, base); })
        .then(function (r) {
          return r.text().then(function (t) {
            if (!r.ok) throw ooba.error(r.status, t, null, '/v1/models');
            let data;
            try { data = JSON.parse(t); }
            catch (e) {
              throw new Error(base + ' answered, but not with JSON — is that really an ' +
                'OpenAI-compatible API port?');
            }
            const list = (data.data || data.models || []).map(function (m) {
              const id = typeof m === 'string' ? m : (m.id || m.name || '');
              return { id: id, label: id };
            }).filter(function (m) { return m.id; });
            if (!list.length) throw new Error('That server lists no models.');
            return list;
          });
        });
    }
  };

  /* A dead localhost is not a corporate proxy, and saying so sends people to
   * the wrong fix. util.js classifies any bare fetch rejection as "blocked";
   * for a local server the answer is always about the server itself. */
  function localError(e, base) {
    if (typeof navigator !== 'undefined' && navigator.onLine === false) {
      /* still worth reporting honestly — a localhost call does not need the net */
    }
    /* The browser refusing the scheme is not the server being unreachable, and
     * only one of those has a fix. */
    const mc = mixedContent(base || baseUrl());
    if (mc) {
      const blocked = new Error(mc);
      blocked.localApi = true;
      return blocked;
    }
    const err = new Error('Could not reach ' + (base || baseUrl()) + '. Check that the server ' +
      'is running with its OpenAI-compatible API enabled (text-generation-webui: --api), that ' +
      'the port matches, and that it allows requests from this page ' +
      '(text-generation-webui: --api-enable-CORS; Ollama: set OLLAMA_ORIGINS to allow this ' +
      'origin, or serve this app from the same host).');
    err.localApi = true;      // so SB.apiBlocked leaves it alone
    return err;
  }

  /* ---------------- registry ---------------- */

  const ALL = { gemini: gemini, ooba: ooba };
  const ORDER = ['gemini', 'ooba'];

  function normalize(id) { return ALL[id] ? id : 'gemini'; }

  function activeId() {
    const p = P();
    return normalize(p && p.settings && p.settings.aiProvider);
  }

  function active() { return ALL[activeId()]; }

  function get(id) { return ALL[normalize(id)]; }

  function setActive(id) {
    const p = P();
    if (!p) return;
    p.settings.aiProvider = normalize(id);
  }

  function list() { return ORDER.map(function (id) { return ALL[id]; }); }

  /* What the usage counter is keyed on: two providers can both be running
   * "mistral-7b" and they are not the same allowance. */
  function usageKey(id, mdl) {
    const pid = normalize(id);
    return pid === 'gemini' ? mdl : pid + ':' + (mdl || 'local');
  }

  SB.Providers = {
    DEFAULT_OOBA_URL: DEFAULT_OOBA_URL,
    all: ALL, list: list, get: get, active: active, activeId: activeId,
    setActive: setActive, normalize: normalize, usageKey: usageKey,
    baseUrl: baseUrl, localError: localError, mixedContent: mixedContent
  };

})(window.SB);

</script>
<script>
/* ===== js/brand.js ===== */
/* brand.js — the house style every written prompt has to obey.
 *
 * This is a separate layer from the per-model templates: templates say HOW a
 * given model likes to be addressed, the brand says what the picture must look
 * and feel like. It rides along on every call as a system instruction.
 *
 * The app also supplies what a style guide can't know by itself — the scene's
 * beats, so "consistent subject / wardrobe / environment across consecutive
 * frames" is something the writer can actually act on.
 */
(function (SB) {
  'use strict';

  const DEFAULT_BRAND = [
    'CONSTRAINTS',
    '- Cinematic + technical: maintain professional photographic detail — focal length, aperture, distance/angle, depth of field, and lighting notes for the frame.',
    '- Vary angles subtly (slight high/low tilt, over-shoulder, profile, foreground obstructions) while staying coherent with the rest of the scene.',
    '- Include tactile props or environmental elements that support the story (fabric, glass, rain, reflections, paper, steam).',
    '- Finishing: "Capture RAW", "muted professional grade", "smooth tonal rolloff", "subtle cinematic grain", "controlled contrast".',
    '',
    'STYLE & TONE',
    '- Authentic, documentary-style realism.',
    '- Natural expressions: relaxed faces, genuine smiles, subtle emotion — never exaggerated.',
    '- Real human gestures: mid-conversation, mid-task, mid-thought.',
    '- Diversity across age, gender presentation, life stage and cultural background.',
    '- Inclusive and global representation appropriate for the region.',
    '- Slight imperfections that feel lived-in (gentle motion, natural falloff, real textures).',
    '- Professional yet approachable tone.',
    '- Colour palette matches real-world lighting — warm neutrals, soft highlights, no artificial gloss.',
    '',
    'CAMERA & TECHNICAL FEEL',
    '- Natural light only: window light, office daylight, practical lamps, soft outdoor light.',
    '- Shallow depth of field with a clear focal point that guides the viewer.',
    '- Clean exposure — avoid harsh highlights, avoid blown-out whites.',
    '- Soft contrast and realistic colour (no HDR, no overly sharp digital edges).',
    '- Subtle grain or film-inspired softness is fine where it supports realism.',
    '- Composition avoids clichés (staged handshakes, pointing at screens, contrived poses).',
    '',
    'ENVIRONMENT & COMPOSITION',
    '- People centred in believable, everyday moments.',
    '- Thriving, confident, efficient individuals — not product-first imagery.',
    '- Open office spaces, home offices, industry environments, outdoor movement.',
    '- Work settings that feel modern, diverse and relatable.',
    '- Industry scenes that show clear context through subtle cues, not overemphasis.',
    '- Well-organised compositions with a single clear focal point.',
    '- Avoid cluttered backgrounds; aim for clean, lived-in realism.',
    '- Depth created through blurred backgrounds, reflections or foreground elements.',
    '',
    'OVERALL MOOD',
    '- Confident, approachable, human.',
    '- Calm, clear and aspirational without being glossy.',
    '- Feels like a real moment you walked into — not staged or overproduced.',
    '- Warm, modern, people-centric storytelling.',
    '- The image communicates authenticity, trust, competence, clarity and human connection.'
  ].join('\n');

  /* Motion inherits the same rules; these are the ones that only make sense once
   * the frame starts moving. */
  /* A first frame is an INSTANT, and a shot description is usually a little
   * story. Nothing used to say so: the template called the job a "first-frame
   * prompt" — a label, not a rule — and then handed over a paragraph in which
   * two or three things happen one after another. A writer with no instruction
   * about time drew all of them at once, so somebody described as walking in
   * later was standing in the opening frame.
   *
   * This is a rider rather than template text on purpose. Templates are stored
   * per project inside the file, so editing the default only reaches boards
   * made afterwards; a rider reaches every board that already exists. */
  const FIRST_FRAME_RIDER = [
    'THE FIRST FRAME IS ONE INSTANT',
    '- You are describing a single photograph: the state of things at the moment this shot ' +
    'opens, before anything the description says happens next has happened.',
    '- A shot description is a short sequence. Words like "then", "after", "as", "walks in", ' +
    '"enters", "arrives", "turns to", "reaches for", "picks up", "reveals", "cuts to" mark what ' +
    'happens AFTER the first frame. None of it is in this image.',
    '- If somebody or something is described as arriving, entering or appearing, the frame is ' +
    'what the camera sees BEFORE they arrive. Do not put them in it, and do not gesture at them ' +
    'with an open door, a shadow or a look off-screen unless the description opens that way.',
    '- If the description opens mid-action, draw the first recognisable instant of that action, ' +
    'not its result.',
    '- Everything you leave out is not lost: the image-to-video prompt covers the movement.'
  ].join('\n');

  /* When a frame of another shot is supplied, the still is an EDIT of it. The
   * template still says "describe subject, setting, composition, lens, lighting
   * and mood", because a board carries its own copy of that wording and most of
   * them were written before any of this existed — so the override travels in
   * the system instruction, where it reaches every board. */
  const DERIVED_RIDER = [
    'THIS FRAME IS DERIVED FROM A SUPPLIED FRAME',
    '- A rendered frame of an earlier shot is supplied with this job. The prompt you write is ' +
    'an EDIT of that frame.',
    '- Name it and start from it. State only what changes: the camera, the framing, the moment.',
    '- Do not re-describe the place, the light, the lens, the grade or the wardrobe, and do not ' +
    're-establish the setting. They are inherited from the frame exactly as they are. Any ' +
    'instruction to describe setting, lighting, lens or mood applies only to what actually ' +
    'changes.',
    '- Rebuilding the scene in words is what makes an edit come back as a different shot.'
  ].join('\n');

  /* A reference frame is a record, not a shot — but the house style says to
   * finish everything with a grade, a grain and a lens, and the model believes
   * the house style over a clause buried in the request. Said as its own rider
   * AFTER the brand, and phrased as an exemption from it, it holds: 5 of 5
   * generated subjects came back "Capture RAW, muted professional grade"
   * before this existed. */
  const REFERENCE_RIDER = [
    'THIS IS A REFERENCE FRAME, AND IT IS EXEMPT FROM THE HOUSE STYLE ABOVE',
    '- The house style describes finished SHOTS. This is a reference: a neutral record of what ' +
    'something looks like, so a model can reproduce it exactly.',
    '- The Finishing, grade, grain, contrast, lens, aperture and depth-of-field rules above do ' +
    'NOT apply here and must not appear in what you write. No "capture RAW", no "muted ' +
    'professional grade", no "cinematic grain", no focal length, no f-number, no shallow focus.',
    '- Everything sharp, evenly lit, true colour, plain background. The subject and its wardrobe ' +
    'or surface is the whole content of the frame.',
    '- Composition, palette and the sense of the world still follow the house style.'
  ].join('\n');

  const VIDEO_RIDER = [
    'MOTION',
    '- Wardrobe and location must not change during the shot.',
    '- Camera moves are restrained and motivated — no flourishes the scene has not earned.',
    '- Movement is documentary-real: the pace of an actual moment, not choreography.',
    '- Hold the natural-light look and the clean exposure through the whole move.'
  ].join('\n');

  /* There was a no-gendered-language rule here, enforced with a word list and
   * a corrective rewrite. It is gone on purpose. Stripping the gender out of a
   * subject's description does not make the picture neutral — it makes the
   * image model guess, and it guesses male. A reference frame has to be
   * allowed to say what the person it is a reference FOR actually looks like.
   */

  /* A board only stores the house style once someone has edited it. Boards on
   * the stock text follow the app, so a correction here reaches them. */
  function brandOf(p) {
    const b = (p.settings && p.settings.brand) || {};
    const custom = !!(b.custom && typeof b.text === 'string' && b.text.trim());
    return {
      enabled: b.enabled !== false,
      custom: custom,
      text: custom ? b.text : DEFAULT_BRAND
    };
  }

  /* Where this frame sits in its scene, so the writer isn't composing in a
   * vacuum. Who is in it — and what they look like and wear — is the personas
   * layer's job, not this one's. */
  function sequenceBlock(p, shot) {
    const f = SB.Model.findShot(p, shot.id);
    if (!f) return '';
    const scene = f.scene;
    const beats = scene.shots.filter(function (s) { return !s.noShot; });
    const pos = beats.indexOf(shot) + 1;
    const lines = [];

    lines.push('SCENE CONTEXT');
    lines.push('Scene ' + (f.sceneIdx + 1) + ': ' + (scene.heading || '(untitled)'));
    if (scene.description) lines.push('Scene note: ' + SB.Refs.plain(p, scene.description));
    lines.push('This is shot ' + f.code + (pos > 0 ? ' (beat ' + pos + ' of ' + beats.length + ')' : '') + '.');

    if (beats.length > 1) {
      lines.push('The other beats in this scene, in order:');
      beats.forEach(function (s, i) {
        const sf = SB.Model.findShot(p, s.id);
        const d = SB.Refs.plain(p, s.description).replace(/\s+/g, ' ').trim();
        lines.push('  ' + (i + 1) + '. [' + (sf ? sf.code : '?') + '] ' + (s.type || 'shot') + ' — ' +
          (d ? (d.length > 160 ? d.slice(0, 157) + '…' : d) : '(no description yet)') +
          (s.id === shot.id ? '   <-- the frame you are writing' : ''));
      });
      lines.push('Keep the location, the lighting mood and the grade coherent across these beats.');
    }
    return lines.join('\n');
  }

  /* The system instruction for one prompt-writing job.
   *
   * The house style is a choice about how a board looks and can be switched
   * off. The riders are not: they are what the two prompts ARE — a still of one
   * instant, and the movement out of it — and a board with no house style needs
   * them just as much. They used to sit behind the same early return, so
   * turning the brand off quietly took the craft rules with it. */
  function systemFor(p, shot, role) {
    const b = brandOf(p);
    const parts = [];
    /* Is a frame of another shot being handed over? Then this still is an edit
     * of it, which changes both what to say and what to leave unsaid. */
    const derived = (role === 'image' || role === 'both') &&
      SB.Refs.feed(p, shot).some(function (e) {
        return e.kind === 'shot' && e.images.length;
      });
    /* On an image job derived from another shot's frame, the house style is
     * NOT sent. It is a list of things to put into the words — the grade, the
     * grain, the lens, the practicals — and the source frame already carries
     * every one of them. Sent anyway, the writer dutifully restates them, and
     * an edit instruction full of "50mm, f/2.8, muted grade" comes back as a
     * re-render of the scene rather than a change to the picture. The frame is
     * the style reference now. (A combined image+video job still gets it: the
     * video half is not derived from anything.) */
    const styleInherited = derived && role === 'image';
    if (b.enabled && !styleInherited) {
      parts.push('HOUSE STYLE — every prompt you write must obey this.', '', b.text);
    } else if (b.enabled) {
      parts.push('THE HOUSE STYLE IS NOT REPEATED HERE.', '',
        'The supplied source frame was made under it and already carries the look — the grade, ' +
        'the grain, the lighting and the lens. Putting any of it back into words is what turns ' +
        'an edit into a re-render. Change what the description asks for; inherit the rest.');
    }
    if (role === 'image' || role === 'both') {
      if (parts.length) parts.push('');
      parts.push(FIRST_FRAME_RIDER);
      if (derived) parts.push('', DERIVED_RIDER);
    }
    if (role === 'video' || role === 'both') {
      if (parts.length) parts.push('');
      parts.push(VIDEO_RIDER);
    }
    const seq = sequenceBlock(p, shot);
    if (seq) {
      if (parts.length) parts.push('');
      parts.push(seq);
    }
    if (!parts.length) return '';
    /* The closing instruction is what puts the house style into the words. On a
     * derived frame that is exactly wrong for the half being inherited: told to
     * fold in the grade and the lighting, the writer restated the lens, the
     * practicals and the grain — rebuilding in words what the source frame
     * already carries. So there, the fold-in is scoped to what changes. */
    parts.push('', derived
      ? 'Fold these requirements into the prompt itself as concrete description, but ONLY where ' +
        'they describe what this frame CHANGES. Everything inherited from the supplied source ' +
        'frame — the place, the lighting, the lens, the grade, the wardrobe — is already in that ' +
        'image and must not be restated. Do not quote the rules back, and do not add headings ' +
        'or commentary.'
      : 'Fold these requirements into the prompt itself as concrete description — ' +
        'do not quote the rules back, and do not add headings or commentary.');
    return parts.join('\n');
  }

  SB.Brand = {
    DEFAULT: DEFAULT_BRAND,
    VIDEO_RIDER: VIDEO_RIDER,
    FIRST_FRAME_RIDER: FIRST_FRAME_RIDER,
    DERIVED_RIDER: DERIVED_RIDER,
    REFERENCE_RIDER: REFERENCE_RIDER,
    brandOf: brandOf,
    systemFor: systemFor,
    sequenceBlock: sequenceBlock
  };

})(window.SB);

</script>
<script>
/* ===== js/renders.js ===== */
/* renders.js — where the full-size pictures live.
 *
 * Everything on a board is a ≤480p proxy: small enough that a whole project is
 * one portable file, and far too small to feed back into an image model. Until
 * now the original was simply dropped on the floor — a 4K render became an
 * 854×480 JPEG at quality 0.82 and the bytes were gone. So the loop the app is
 * for (render it, then use it as the reference for the next shot) could not
 * actually be closed with the app's own copies.
 *
 * So: one folder, chosen once, with a subfolder per project, holding the
 * originals.
 *
 *   <root>/<project name>/0007.png          the current render
 *   <root>/<project name>/_versions/…       what it replaced
 *   <root>/<project name>/_feed/1C/…        a reference set, written on demand
 *
 * ---- why serials ----
 *
 * A file named for its shot code has to be renamed every time the board
 * renumbers, which is a permutation across the whole folder, which is a
 * two-phase rename that can half-fail against a file some other program has
 * open. A serial never moves. It is claimed the first time a picture lands, it
 * is never reused, and it rides with the picture — so swapping two cards moves
 * the record and touches no file at all.
 *
 * The number means nothing on its own, and that is fine: the board shows it
 * beside the shot code, and the board is always there.
 *
 * The folder is never required. Every proxy is in the .storyboard, so a board
 * with no folder connected — or opened on another machine, or in a browser
 * without the File System Access API — behaves exactly as it always did.
 */
(function (SB) {
  'use strict';

  const KEY_ROOT = 'rendersRoot';
  const VERSIONS = '_versions';
  const FEED = '_feed';

  const hasFS = typeof window.showDirectoryPicker === 'function';

  let root = null;            // the chosen root, once it is known
  let looking = null;         // the in-flight lookup, so two callers share one
  let looked = false;         // ...and whether it has ever finished
  let denied = false;         // permission refused this session; stop asking

  function P() { return SB.app.project; }

  /* ---------- the root ---------- */

  /* Two images dropped together both land here in the same tick. Marking the
   * lookup done before it finished handed the second one a null root, and its
   * original was thrown away with nothing said — so the in-flight promise is
   * shared instead. */
  function remember() {
    if (looked) return Promise.resolve(root);
    if (looking) return looking;
    looking = SB.Store.idbGet(KEY_ROOT).then(function (h) {
      root = h || null;
      looked = true;
      looking = null;
      return root;
    }).catch(function () {
      looked = true;
      looking = null;
      return null;
    });
    return looking;
  }

  /* Is a folder remembered at all, whatever its permission says? Settings needs
   * this to tell "never chosen" from "chosen, but Chrome wants a click". */
  function isRemembered() {
    return remember().then(function (h) { return !!h; });
  }

  /* Chrome will not hand back a persisted handle's permission without a user
   * gesture, so `interactive` says whether we are inside one. */
  /* Chrome hands a persisted handle back in the "prompt" state after a
   * restart, so a folder that is remembered perfectly well is unusable until
   * somebody asks — and nothing did. Every call that can only happen inside a
   * user gesture (dropping a picture, clicking copy image set) asks; a refused
   * request latches, so it is asked once and then left alone. */
  function ready(interactive) {
    if (!hasFS) return Promise.resolve(null);
    return remember().then(function (h) {
      if (!h) return null;
      if (denied) return null;
      return SB.Store.ensurePermission(h, !!interactive).then(function (ok) {
        if (ok) { denied = false; return h; }
        if (interactive) denied = true;    // asked, and told no
        return null;
      }).catch(function () { return null; });
    });
  }

  /* A fresh choice clears the refusal — it is a new answer to the question. */
  function connect() {
    if (!hasFS) {
      return Promise.reject(new Error('This browser has no directory access. Use Chrome or Edge.'));
    }
    return window.showDirectoryPicker({ id: 'sb-renders', mode: 'readwrite' })
      .then(function (h) {
        root = h;
        looked = true;
        looking = null;
        denied = false;
        return SB.Store.idbPut(KEY_ROOT, h).then(function () { return h; });
      });
  }

  function disconnect() {
    root = null;
    looked = true;
    looking = null;
    denied = false;
    return SB.Store.idbPut(KEY_ROOT, null);
  }

  function rootName() { return root ? root.name : ''; }
  function isConnected() { return !!root; }

  /* ---------- the project's own folder ---------- */

  /* A folder name a filesystem will actually accept. Windows is the strict one:
   * no \ / : * ? " < > |, no trailing dot or space, and a handful of reserved
   * device names that cannot be used even with an extension. */
  const RESERVED = /^(con|prn|aux|nul|com[1-9]|lpt[1-9])$/i;
  function folderName(p) {
    let n = String((p && p.name) || 'Untitled project')
      /* control characters are illegal too, and invisible in a project name */
      .replace(/[\u0000-\u001f\u007f]+/g, '')
      .replace(/[\\/:*?"<>|]+/g, '_')
      .trim()
      /* cut BEFORE stripping the tail: clamping afterwards could put a dot or
       * a space back on the end, which Windows will not accept, and the whole
       * folder then silently failed to open */
      .slice(0, 100)
      .replace(/[\s.]+$/, '')
      .trim();
    if (!n) n = 'Untitled project';
    /* reserved with an extension is reserved too: CON.txt is refused as well */
    if (RESERVED.test(n.replace(/\..*$/, ''))) n = n + '_';
    return n;
  }

  function folder(p, create, interactive) {
    return ready(interactive).then(function (h) {
      if (!h) return null;
      return h.getDirectoryHandle(folderName(p), { create: create !== false })
        .catch(function () { return null; });
    });
  }

  function sub(dir, name) {
    if (!dir) return Promise.resolve(null);
    return dir.getDirectoryHandle(name, { create: true }).catch(function () { return null; });
  }

  /* ---------- serials ---------- */

  /* The high-water mark only ever goes up. A number belonging to a deleted shot
   * is never handed out again, so a file that has already left the app — dragged
   * into an editor, sent to somebody — never comes to mean something else. */
  function claim(p) {
    p.renderSeq = (p.renderSeq | 0) + 1;
    return p.renderSeq;
  }

  function pad(n) { return String(n | 0).padStart(4, '0'); }

  function extOf(blobOrName) {
    const t = (blobOrName && blobOrName.type) || '';
    /* the subtype can carry a hyphen or a dot — image/x-icon, image/vnd.… */
    const m = /^image\/([a-z0-9+.-]+)/i.exec(t);
    let e = m ? m[1].toLowerCase() : '';
    if (!e && blobOrName && blobOrName.name) {
      const d = /\.([a-z0-9]+)$/i.exec(blobOrName.name);
      if (d) e = d[1].toLowerCase();
    }
    if (e === 'jpeg') e = 'jpg';
    if (e === 'svg+xml') e = 'svg';
    if (e === 'x-icon' || e === 'vnd.microsoft.icon') e = 'ico';
    return /^[a-z0-9]{2,5}$/.test(e) ? e : 'png';
  }

  function fileName(serial, ext) { return pad(serial) + '.' + (ext || 'png'); }

  /* ---------- writing ---------- */

  function toBlob(src) {
    if (!src) return Promise.resolve(null);
    if (typeof src !== 'string') return Promise.resolve(src);
    if (!/^data:/.test(src)) return Promise.resolve(null);
    return fetch(src).then(function (r) { return r.blob(); }).catch(function () { return null; });
  }

  function writeFile(dir, name, blob) {
    return dir.getFileHandle(name, { create: true }).then(function (fh) {
      return fh.createWritable().then(function (w) {
        return w.write(blob).then(function () { return w.close(); });
      });
    });
  }

  /* Move whatever is under this name into _versions before it is replaced. A
   * render you have already used somewhere is not the app's to destroy. */
  function archive(dir, name) {
    return dir.getFileHandle(name).then(function (fh) {
      return fh.getFile().then(function (f) {
        return sub(dir, VERSIONS).then(function (vd) {
          if (!vd) return null;
          /* to the millisecond: stamped to the second, two takes inside one
             second produced the same name and the second overwrote the first —
             destroying exactly the version this exists to keep */
          const stamp = new Date(f.lastModified || Date.now()).toISOString()
            .replace(/[:T]/g, '-').replace(/[.Z]/g, '');
          const dot = name.lastIndexOf('.');
          const base = (dot > 0 ? name.slice(0, dot) : name) + '__' + stamp;
          const ext = dot > 0 ? name.slice(dot) : '';
          /* and if even that collides, keep going rather than overwrite */
          const free = function (n) {
            const kept = base + (n ? '_' + n : '') + ext;
            return vd.getFileHandle(kept).then(function () {
              return n > 20 ? kept : free(n + 1);
            }, function () { return kept; });
          };
          return free(0).then(function (kept) {
            return writeFile(vd, kept, f).then(function () {
              return dir.removeEntry(name).catch(function () { });
            });
          });
        });
      });
    }).catch(function () { /* nothing there to keep */ });
  }

  /* Put the original bytes away and hand back the record the board stores.
   * Resolves to null whenever there is no folder — the caller keeps its proxy
   * either way, so nothing downstream has to care. */
  function keep(p, src, existing) {
    if (!hasFS) return Promise.resolve(null);
    return folder(p, true, true).then(function (dir) {
      if (!dir) return null;
      return toBlob(src).then(function (blob) {
        if (!blob || !blob.size) return null;
        const ext = extOf(blob);
        const serial = (existing && existing.serial) || claim(p);
        const name = fileName(serial, ext);
        /* an earlier take under this serial, and any take under another
           extension, both step aside */
        const fresh = !(existing && existing.serial);
        const older = (existing && existing.ext && existing.ext !== ext)
          ? archive(dir, fileName(serial, existing.ext)) : Promise.resolve();
        return older.then(function () { return archive(dir, name); })
          .then(function () { return writeFile(dir, name, blob); })
          .then(function () {
            return { serial: serial, ext: ext, bytes: blob.size, at: Date.now() };
          })
          .catch(function () {
            /* nothing was written, so give the number back if it is still the
               last one out — it is only ever a high-water mark, but a counter
               that climbs on failures makes the folder read as if pictures are
               missing */
            if (fresh && p.renderSeq === serial) p.renderSeq = serial - 1;
            return null;
          });
      });
    }).catch(function () { return null; });
  }

  /* ---------- reading ---------- */

  function file(p, rec) {
    if (!rec || !rec.serial) return Promise.resolve(null);
    return folder(p, false).then(function (dir) {
      if (!dir) return null;
      return dir.getFileHandle(fileName(rec.serial, rec.ext))
        .then(function (fh) { return fh.getFile(); })
        .catch(function () { return null; });
    });
  }

  function has(p, rec) {
    return file(p, rec).then(function (f) { return !!f; });
  }

  /* ---------- the feed ----------
   *
   * The reference set for one shot, written out at the moment it is asked for
   * and resolved through ids — so what you drag is correct whatever any file
   * happens to be called. Position first, because the order is the promise the
   * prompt's mapping makes; then the serial, which is the identity; then a
   * label, which is for the eye.
   *
   *   _feed/1C/1_0002_1B.png  2_0007_Colleague-front.png
   *
   * Full-size where the folder has it, the board's proxy where it does not, so
   * the set is always complete and never silently short.
   */
  function slug(t) {
    let s = String(t || '');
    /* letters and digits in any script — dropping everything non-ASCII turned a
     * subject named in Cyrillic or Japanese into "ref" */
    try { s = s.replace(/[^\p{L}\p{N}_-]+/gu, '-'); }
    catch (e) { s = s.replace(/[^\w-]+/g, '-'); }
    return s.replace(/^-+|-+$/g, '').slice(0, 40);
  }

  /* Empty it first: a set left over from a previous run, with an entry since
   * removed, is worse than no set at all — you would feed a picture the prompt
   * no longer accounts for. */
  function clear(dir) {
    const names = [];
    if (!dir.values) return Promise.resolve();
    return (async function () {
      for await (const h of dir.values()) names.push(h.name);
    })().then(function () {
      return Promise.all(names.map(function (n) {
        return dir.removeEntry(n, { recursive: true }).catch(function () { });
      }));
    }).catch(function () { });
  }

  function writeFeed(p, shot, code, entries) {
    if (!hasFS) return Promise.resolve(null);
    return folder(p).then(function (dir) {
      if (!dir) return null;
      return sub(dir, FEED).then(function (fd) {
        if (!fd) return null;
        return sub(fd, slug(code) || 'shot').then(function (od) {
          if (!od) return null;
          return clear(od).then(function () {
            let wrote = 0, full = 0;
            const missing = [];
            const step = function (i) {
              if (i >= entries.length) {
                return {
                  dir: od, wrote: wrote, full: full, total: entries.length,
                  missing: missing,
                  path: folderName(p) + '/' + FEED + '/' + slug(code)
                };
              }
              const e = entries[i];
              const name = e.n + '_' + (e.render ? pad(e.render.serial) + '_' : '') +
                (slug(e.label) || 'ref') + (e.role ? '_' + slug(e.role) : '');
              /* the original if there is one, the proxy if there is not */
              return file(p, e.render).then(function (f) {
                if (f) {
                  return writeFile(od, name + '.' + (e.render.ext || 'png'), f)
                    .then(function () { full++; wrote++; });
                }
                const src = SB.Blobs.src(p, e.img);
                if (!src) { missing.push(e.n); return null; }
                return toBlob(src).then(function (b) {
                  if (!b) { missing.push(e.n); return null; }
                  return writeFile(od, name + '.jpg', b).then(function () { wrote++; });
                });
              }).catch(function () { missing.push(e.n); })
                /* Counting every entry whether or not anything reached the disk
                   reported a complete set while leaving a hole in the numbering
                   — so image 2 on disk was what the prompt calls image 3, and
                   nothing said so. */
                .then(function () { return step(i + 1); });
            };
            return step(0);
          });
        });
      });
    }).catch(function () { return null; });
  }

  SB.Renders = {
    hasFS: hasFS,
    connect: connect, disconnect: disconnect, ready: ready,
    isConnected: isConnected, isRemembered: isRemembered,
    rootName: rootName, folderName: folderName,
    folder: folder, sub: sub, writeFile: writeFile,
    claim: claim, pad: pad, fileName: fileName, extOf: extOf,
    keep: keep, file: file, has: has, writeFeed: writeFeed, slug: slug,
    VERSIONS: VERSIONS, FEED: FEED
  };

})(window.SB);

<script>
/* ===== js/refs.js ===== */
/* refs.js — what the model is shown.
 *
 * An @ in a description is not a spelling convenience. It means: THE MODEL WILL
 * BE SHOWN A PICTURE OF THIS. That is the whole idea, and everything here
 * follows from it —
 *
 *   @a subject  ->  its reference frames go into the feed
 *   @a shot     ->  that shot's rendered frame goes into the feed
 *   the order of the marks in the sentence is the order of the images
 *   no mark     ->  not shown, only described
 *
 * Knowing when to hand a model a reference image is the expertise this replaces.
 * Written down as one rule with a visible consequence — the numbered feed strip
 * on the card — it stops being expertise and becomes a process somebody can
 * follow on their first day.
 *
 * ---- the stored form ----
 *
 * A mark is `@{id|Name}` in the description text. It carries the id AND a
 * readable fallback, which buys three things:
 *
 *   - renaming a subject, or renumbering a shot, rewrites nothing: the chip is
 *     drawn from the id every time it is rendered;
 *   - a description read raw — in another editor, in a diff — still says who it
 *     meant;
 *   - deleting a subject degrades its mentions to that last known name as plain
 *     prose, rather than leaving a dangling reference.
 *
 * Nothing outside this file should read a description for a machine. plain()
 * is the boundary: it resolves marks to the names they now have and hands back
 * ordinary prose.
 */
(function (SB) {
  'use strict';

  /* @{id|fallback} — ids are our own (per_/sh_), so the only thing that needs
   * sanitising on the way in is the closing brace and the pipe. */
  const MARK = /@\{([A-Za-z0-9_]+)\|([^}]*)\}/g;

  function clean(name) {
    return String(name == null ? '' : name).replace(/[|}]/g, '').trim();
  }

  function mark(id, name) { return '@{' + id + '|' + clean(name) + '}'; }

  /* ---- resolving ---- */

  /* What a mark points at, or null if it is gone. Subjects and shots live in
   * different places, so the id prefix decides where to look. */
  function target(p, id) {
    if (!p || !id) return null;
    if (/^sh_/.test(id)) {
      const f = SB.Model.findShot(p, id);
      if (!f) return null;
      return { kind: 'shot', id: id, shot: f.shot, label: f.code, f: f };
    }
    const per = SB.Personas.find(p, id);
    if (!per) return null;
    /* The label goes into prompts and into the printed board, so it is cleaned
     * on the way out: a subject named "Bad}Name" — or, deliberately, "@{x|y}" —
     * must not be able to put mark syntax into a request. */
    return { kind: 'subject', id: id, subject: per, label: clean(per.name) || 'unnamed' };
  }

  /* Every mark in a piece of text, in the order it appears. `label` is what a
   * reader should see; `dead` marks one whose target no longer exists. */
  function parse(p, text) {
    const out = [];
    const s = String(text == null ? '' : text);
    MARK.lastIndex = 0;
    let m;
    while ((m = MARK.exec(s))) {
      const t = target(p, m[1]);
      out.push({
        id: m[1],
        from: m.index,
        to: m.index + m[0].length,
        raw: m[0],
        fallback: m[2],
        label: t ? t.label : m[2],
        dead: !t,
        kind: t ? t.kind : null,
        target: t
      });
    }
    return out;
  }

  /* The boundary. Prose as a person or a model should read it: every mark
   * becomes the name or shot code it currently points at. */
  function plain(p, text) {
    const s = String(text == null ? '' : text);
    if (s.indexOf('@{') < 0) return s;
    return s.replace(MARK, function (_, id, fallback) {
      const t = target(p, id);
      return t ? t.label : fallback;
    });
  }

  /* Take one subject's marks out, leaving the name they were showing as plain
   * prose. What a mark whose target is gone actually needs. */
  function unmark(p, text, id) {
    let s = String(text == null ? '' : text);
    const marks = parse(p, s).filter(function (m) { return m.id === id; });
    for (let i = marks.length - 1; i >= 0; i--) {
      s = s.slice(0, marks[i].from) + marks[i].label + s.slice(marks[i].to);
    }
    return s;
  }

  /* ---- the feed ----
   *
   * The ordered list of images to hand the model. Marks first, in the order
   * they were written, because that order is the one thing the person writing
   * the sentence actually controls. Anything cast on the card but never
   * mentioned follows, flagged: it is still sent — silently dropping it would
   * change what every board made before this sends — but it is called out,
   * because an unmentioned subject is one whose position in the feed nobody
   * chose.
   */
  /* Everything on this card that can hold a mark, in the order it is read:
   * the description, then the project's own boxes. A mark in a field used to
   * be invisible here, which made its position in the feed a lie. */
  function marked(p, shot) {
    let out = parse(p, shot.description);
    if (SB.Fields && SB.Fields.enabled) {
      SB.Fields.enabled(p).forEach(function (f) {
        out = out.concat(parse(p, SB.Fields.value(shot, f.id)));
      });
    }
    return out;
  }

  function feed(p, shot) {
    const out = [];
    const seen = {};

    marked(p, shot).forEach(function (m) {
      if (seen[m.id]) return;
      seen[m.id] = 1;
      /* A mark whose target is gone feeds nothing, but it is still sitting in
       * the text — so it belongs in the strip, saying so. Left out, the card
       * claimed it had no references while the model was still being handed
       * the words. */
      if (m.dead) {
        out.push({
          kind: 'dead', id: m.id, label: m.label, mentioned: true, images: [],
          why: '“' + m.fallback + '” is gone — this is plain text now'
        });
        return;
      }
      /* A swap can leave a card pointing at itself, and telling a model to
       * derive a frame from that same frame is nonsense. */
      if (m.id === shot.id) return;
      if (m.kind === 'shot') {
        const img = m.target.shot.image;
        out.push({
          kind: 'shot', id: m.id, label: m.target.label, mentioned: true,
          images: img ? [img] : [],
          /* the full-size original, if the renders folder has it */
          renders: img ? [m.target.shot.render || null] : [],
          why: img ? 'the rendered frame of ' + m.target.label
                   : m.target.label + ' has no frame yet — there is nothing to feed'
        });
        return;
      }
      const imgs = SB.Personas.imagesOf(m.target.subject);
      out.push({
        kind: 'subject', id: m.id, label: m.target.label, mentioned: true,
        subject: m.target.subject, images: imgs,
        renders: imgs.map(function (x) { return x.render || null; }),
        why: imgs.length ? null : 'no reference image yet — it will be described in full instead'
      });
    });

    /* cast, but nobody said to show it */
    SB.Personas.forShot(p, shot).forEach(function (per) {
      if (seen[per.id]) return;
      seen[per.id] = 1;
      const imgs = SB.Personas.imagesOf(per);
      out.push({
        kind: 'subject', id: per.id, label: per.name || 'unnamed', mentioned: false,
        subject: per, images: imgs,
        renders: imgs.map(function (x) { return x.render || null; }),
        why: 'cast on this card but not mentioned in the description'
      });
    });

    /* image numbers, assigned once across the whole feed — this is the order
       the files go in, and it is what the prompt's mapping promises */
    let n = 0;
    out.forEach(function (e) {
      e.numbers = e.images.map(function () { return ++n; });
    });
    return out;
  }

  /* Just the pictures, in order — what "copy the image set" hands over. */
  function images(p, shot) {
    const list = [];
    feed(p, shot).forEach(function (e) {
      e.images.forEach(function (img, i) {
        list.push({
          img: img, id: e.id, kind: e.kind, label: e.label,
          /* null when the board's proxy is all there is */
          render: (e.renders || [])[i] || null,
          role: (img.label || ''), n: e.numbers[i]
        });
      });
    });
    return list;
  }

  /* ---- writing marks ---- */

  /* Put a mark in at a position, returning the new text and where the caret
   * should land. Used by the popover and by anything seeding a description. */
  function insert(text, at, until, id, name) {
    const s = String(text == null ? '' : text);
    const tok = mark(id, name);
    /* `until` is where the caret was. A caret that could not be read comes
     * back null, which used to slice from the start and paste the whole
     * description in again. */
    const from = Math.max(0, Math.min(at | 0, s.length));
    const to = (until == null || until < from) ? from : Math.min(until, s.length);
    return { text: s.slice(0, from) + tok + s.slice(to), caret: from + tok.length };
  }

  /* Marks for names the writer typed but never linked.
   *
   * A model rewrite hands back plain prose, and an old board never had marks at
   * all, so the names are sitting there unlinked — which under the one rule
   * above means no picture is sent for them. This finds them: the longest
   * matching name wins, so "Ops lead" is not matched as "Ops", and a name
   * already inside a mark is skipped. */
  function unlinked(p, text) {
    const s = String(text == null ? '' : text);
    if (!s.trim()) return [];
    const marks = parse(p, s);
    /* Everything from an unterminated `@{` to the end is a token being typed,
     * not prose — linking inside it nests one mark in another. */
    let half = -1;
    const open = s.lastIndexOf('@{');
    if (open >= 0 && s.indexOf('}', open) < 0) half = open;
    const inside = function (i) {
      if (half >= 0 && i >= half) return true;
      return marks.some(function (m) { return i >= m.from && i < m.to; });
    };
    const names = SB.Personas.all(p)
      .filter(function (x) { return (x.name || '').trim().length > 1; })
      .sort(function (a, b) { return b.name.length - a.name.length; });

    const out = [];
    const taken = [];
    names.forEach(function (per) {
      /* case-insensitively: the shot generator writes prose, and "the
       * industrial scanner" in a sentence never matched the subject
       * "Industrial Scanner" — so the one thing that would have caught it
       * silently found nothing. */
      const re = new RegExp('(?<![\\w@{])' +
        per.name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?![\\w}])', 'gi');
      let m;
      while ((m = re.exec(s))) {
        const a = m.index, b = a + m[0].length;
        if (inside(a)) continue;
        if (taken.some(function (t) { return a < t.to && b > t.from; })) continue;
        taken.push({ from: a, to: b });
        out.push({ id: per.id, name: per.name, from: a, to: b });
      }
    });
    return out.sort(function (x, y) { return x.from - y.from; });
  }

  /* Where this exact text appears as prose rather than inside a mark. The
   * rename offer needs this: a mark resolves by id and needs no repair, so
   * only the loose copies are worth offering to rewrite. */
  function proseHits(p, text, name) {
    const s = String(text == null ? '' : text);
    const n = String(name || '');
    if (!s || !n) return [];
    const marks = parse(p, s);
    const re = new RegExp('(?<![\\w@{|])' + n.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') +
      '(?![\\w}|])', 'g');
    const out = [];
    let m;
    while ((m = re.exec(s))) {
      const at = m.index;
      if (marks.some(function (k) { return at >= k.from && at < k.to; })) continue;
      out.push({ from: at, to: at + m[0].length });
    }
    return out;
  }

  /* Link every unlinked name in one pass, back to front so the offsets hold. */
  function linkAll(p, text) {
    const hits = unlinked(p, text);
    let s = String(text == null ? '' : text);
    for (let i = hits.length - 1; i >= 0; i--) {
      s = s.slice(0, hits[i].from) + mark(hits[i].id, hits[i].name) + s.slice(hits[i].to);
    }
    return s;
  }

  /* Put back the marks a model rewrite flattened.
   *
   * The writer is handed prose and answers with prose, so every mark in the
   * text it replaced is gone. Re-marking every name it happens to mention is
   * wrong twice over: it links names the writer deliberately left plain —
   * overwriting the "no mark, not shown" half of the rule — and it knows
   * nothing about shot codes, so an earlier frame silently drops out of the
   * feed. So only what WAS marked is marked again, matched on the label it
   * carries now, first occurrence only, in the order the marks were written.
   */
  function relink(p, next, prev) {
    let s = String(next == null ? '' : next);
    const was = parse(p, prev);
    if (!was.length) return s;
    const done = {};
    was.forEach(function (m) {
      if (done[m.id] || m.dead) return;
      const hits = proseHits(p, s, m.label);
      if (!hits.length) return;
      done[m.id] = 1;
      const h = hits[0];
      s = s.slice(0, h.from) + mark(m.id, m.label) + s.slice(h.to);
    });
    return s;
  }

  /* Which marks did not survive — what the rewrite dropped on the floor. */
  function lostIn(p, next, prev) {
    const after = {};
    parse(p, next).forEach(function (m) { after[m.id] = 1; });
    return parse(p, prev).filter(function (m) { return !m.dead && !after[m.id]; });
  }

  SB.Refs = {
    mark: mark, parse: parse, plain: plain, target: target, unmark: unmark, unmark: unmark,
    feed: feed, images: images, insert: insert,
    unlinked: unlinked, linkAll: linkAll, proseHits: proseHits,
    relink: relink, lostIn: lostIn
  };

})(window.SB);

<script>
/* ===== js/personas.js ===== */
/* personas.js — the recurring subjects of a board: the people, the places and
 * the things that have to come back looking the same shot after shot.
 *
 * One record covers all three. A subject holds a kind, a description, the
 * prompt that makes its reference frame, and the reference images themselves
 * (≤480p proxies, like every other image here) — several of them, because one
 * angle rarely pins a person or a room down. Shots name the subjects that
 * appear in them; the prompt writer then gets both the description AND the
 * phrasing that particular model expects for reference images — Qwen wants
 * "the person in image 1", others want something else.
 *
 * The storage key is still `personas` and shots still carry `personaIds`: the
 * name is historical, the contents are not. Renaming it would churn migration,
 * every frozen version snapshot and the blob walkers for no user-visible gain.
 */
(function (SB) {
  'use strict';

  /* How a model wants to be told about reference images. {{N}} = the image's
   * position, {{NAME}} = the persona's name. */
  const REF_TEMPLATES = {
    numbered: 'Reference images are supplied in order. Refer to each recurring subject as ' +
      '"the person in image {{N}}" and keep their face, hair and wardrobe exactly as in that image.',
    named: 'Reference images are supplied for each named subject. Refer to them by name ' +
      '({{NAME}}) and keep their face, hair and wardrobe exactly as in the reference.',
    none: ''
  };

  const DEFAULT_REF_TEMPLATE = REF_TEMPLATES.numbered;

  /* What every reference frame wants, whatever it is a frame of.
   *
   * Nothing here used to mention focus, so a portrait brief plus a house style
   * that asks for aperture and grade produced "shallow depth of field, f/2.0,
   * subtle cinematic grain" — which softens the fabric and shifts the colour,
   * the two things the frame exists to record. The grade belongs on the shots,
   * not on the reference. */
  const NEUTRAL_REF = 'A reference frame is a neutral record, not a graded shot: ' +
    'everything in sharp focus, deep depth of field, no background blur, accurate colour, ' +
    'no grain and no grade';

  /* The three kinds of recurring subject. They differ only in what you are
   * being asked to write down and how the block addresses them — the record,
   * the reference images and the casting are identical, because to an image
   * model a room that must not change is the same problem as a face that must
   * not change. */
  const KINDS = [
    {
      id: 'person', label: 'Person', plural: 'Cast', one: 'person',
      heading: 'CAST — these people recur across the board. They must look the same every time.',
      descLabel: 'description + wardrobe',
      descHint: 'Age range, build, hair, and the exact outfit — fabric and colour.',
      noImage: 'No reference image — describe this person fully and identically every time.',
      refBrief: 'a clean, front-facing reference frame of this person: plain background, ' +
        'even natural light, neutral expression, full length from head to feet with the whole ' +
        'outfit in frame. ' + NEUTRAL_REF
    },
    {
      id: 'place', label: 'Location', plural: 'Locations', one: 'location',
      heading: 'LOCATIONS — these places recur across the board. They must look the same every time.',
      descLabel: 'the place, and what is fixed about it',
      descHint: 'Architecture, surfaces, furniture, light sources, time of day — what never changes.',
      noImage: 'No reference image — describe this place fully and identically every time.',
      refBrief: 'a clean establishing reference frame of this place: wide, eye level, ' +
        'no people in shot, the light as it normally is there. ' + NEUTRAL_REF
    },
    {
      id: 'thing', label: 'Object', plural: 'Objects', one: 'object',
      heading: 'OBJECTS — these props, products and screens recur across the board. ' +
        'They must look the same every time.',
      descLabel: 'the object, product or screen',
      descHint: 'Form, size, material, finish, colour, and any logo or screen state that must be exact.',
      noImage: 'No reference image — describe this object fully and identically every time.',
      refBrief: 'a clean product-style reference frame of this object: plain background, ' +
        'even light, three-quarter view, the whole object in frame. ' + NEUTRAL_REF
    }
  ];

  function kindOf(per) {
    const k = per && per.kind;
    return KINDS.filter(function (x) { return x.id === k; })[0] || KINDS[0];
  }

  /* More than this on one subject and most image models start averaging the
   * references together instead of reading them. A warning, not a limit. */
  const IMAGE_ADVICE = 4;

  function newPersona(opts) {
    opts = opts || {};
    return {
      id: SB.uid('per'),
      kind: kindOf({ kind: opts.kind }).id,
      name: opts.name || 'New ' + kindOf({ kind: opts.kind }).one,
      description: opts.description || '',
      imagePrompt: opts.imagePrompt || '',
      /* [{ref,w,h,label}] — the reference frames. A lone `image` is still
       * accepted: it is what every caller wrote before there could be more
       * than one, and it costs a line to keep them working. */
      images: (opts.images || []).slice().concat(opts.image ? [opts.image] : []),
      updatedAt: Date.now()
    };
  }

  /* ---- reference images ----
   *
   * Boards written before this held a single `image`. Reading through here
   * rather than off the record means an unmigrated one — a hand-built test
   * fixture, a snapshot restored out of an old file — still answers. */
  function imagesOf(per) {
    if (!per) return [];
    if (per.images && per.images.length) return per.images;
    return per.image ? [per.image] : [];
  }
  function hero(per) { return imagesOf(per)[0] || null; }
  function hasImage(per) { return !!hero(per); }

  function addImage(per, img, label, render) {
    if (!per || !img) return null;
    per.images = imagesOf(per).slice();
    delete per.image;
    /* `render` points at the full-size original in the renders folder, when
     * there is one. The board still holds the proxy either way. */
    const rec = { ref: img.ref, w: img.w, h: img.h, label: label || '', render: render || null };
    per.images.push(rec);
    touch(per);
    return rec;
  }

  function removeImage(per, idx) {
    if (!per) return;
    const list = imagesOf(per).slice();
    if (idx < 0 || idx >= list.length) return;
    list.splice(idx, 1);
    per.images = list;
    delete per.image;
    touch(per);
  }

  /* The first image is the one the board shows and the one a single-reference
   * model gets, so promoting is how you say "this is the shot of them". */
  function makeHero(per, idx) {
    if (!per) return;
    const list = imagesOf(per).slice();
    if (idx <= 0 || idx >= list.length) return;
    list.unshift(list.splice(idx, 1)[0]);
    per.images = list;
    delete per.image;
    touch(per);
  }

  function labelImage(per, idx, label) {
    const list = imagesOf(per);
    if (!list[idx]) return;
    list[idx].label = label || '';
    per.images = list;
    delete per.image;
    touch(per);
  }

  /* A prompt already written into a card is a snapshot of the persona as it read
   * at the time. Editing the persona does not — cannot — reach back into it, so
   * the edit is stamped and the card can say it has fallen behind. */
  function touch(per) {
    if (per) per.updatedAt = Date.now();
  }

  /* The newest edit among everything this shot FEEDS, or 0 if none of it has
   * ever been stamped (a board written before this was recorded — unknowable,
   * so it is never reported as stale).
   *
   * The feed, not the cast, because those two stopped being the same thing:
   * a subject can be marked without being cast, and a shot riffing off another
   * feeds that shot's rendered frame. Both were invisible here — so the two
   * changes most likely to invalidate a derived prompt (a retake of the source
   * frame, an edit to a marked-but-uncast subject) were the two this did not
   * notice. */
  function editedAt(p, shot) {
    let at = 0;
    const seen = {};
    forShot(p, shot).forEach(function (per) {
      seen[per.id] = 1;
      at = Math.max(at, per.updatedAt || 0);
    });
    (SB.Refs ? SB.Refs.feed(p, shot) : []).forEach(function (e) {
      if (e.kind === 'subject' && e.subject && !seen[e.subject.id]) {
        at = Math.max(at, e.subject.updatedAt || 0);
      }
      /* a source frame that has been re-rendered since */
      if (e.kind === 'shot' && e.renders) {
        e.renders.forEach(function (r) { if (r) at = Math.max(at, r.at || 0); });
      }
    });
    return at;
  }

  /* Has this shot's stored prompt fallen behind its cast? `at` is the stamp the
   * prompt was written with (prompts.js store()). */
  function staleFor(p, shot, at) {
    if (!at) return false;
    const ed = editedAt(p, shot);
    return !!ed && ed > at;
  }

  function all(p) { return (p.personas = p.personas || []); }

  function find(p, id) {
    return all(p).filter(function (x) { return x.id === id; })[0] || null;
  }

  function add(p, opts) {
    const per = newPersona(opts);
    all(p).push(per);
    return per;
  }

  function remove(p, id) {
    p.personas = all(p).filter(function (x) { return x.id !== id; });
    SB.Model.eachShot(p, function (sh) {
      sh.personaIds = (sh.personaIds || []).filter(function (x) { return x !== id; });
      sh.castEnters = (sh.castEnters || []).filter(function (x) { return x !== id; });
    });
  }

  /* The subjects in a shot, in the order their reference images should be fed.
   * Deduped: a file written by hand or by another tool can name the same
   * subject twice, which listed them twice in the block and made a nonsense of
   * the image numbering ("images 1–3" for a subject holding images 1 and 3). */
  function forShot(p, shot) {
    const seen = {};
    return (shot.personaIds || []).map(function (id) { return find(p, id); })
      .filter(function (per) {
        if (!per || seen[per.id]) return false;
        seen[per.id] = 1;
        return true;
      });
  }

  function toggleOnShot(p, shot, id) {
    shot.personaIds = shot.personaIds || [];
    const i = shot.personaIds.indexOf(id);
    if (i >= 0) {
      shot.personaIds.splice(i, 1);
      setEnters(shot, id, false);      // taken off the card, so not arriving on it either
    } else shot.personaIds.push(id);
  }

  /* ---- present when the shot opens, or arriving during it ----
   *
   * The first frame is one instant. Everything else about this was the writer
   * being told, in prose, to work out from the description who was already
   * there — and it got it wrong, because the CAST block reads like a guest
   * list. This is the same answer as data, so nothing has to be inferred. */
  function enters(shot, id) {
    return ((shot && shot.castEnters) || []).indexOf(id) >= 0;
  }

  function setEnters(shot, id, on) {
    if (!shot) return;
    const list = shot.castEnters = (shot.castEnters || []).slice();
    const i = list.indexOf(id);
    if (on && i < 0) list.push(id);
    if (!on && i >= 0) list.splice(i, 1);
  }

  function toggleEnters(shot, id) { setEnters(shot, id, !enters(shot, id)); }

  /* The cast as the first frame sees it. */
  function presentAtOpen(p, shot) {
    return forShot(p, shot).filter(function (per) { return !enters(shot, per.id); });
  }
  function arriving(p, shot) {
    return forShot(p, shot).filter(function (per) { return enters(shot, per.id); });
  }

  /* Everything of one kind, in board order. */
  function ofKind(p, kind) {
    return all(p).filter(function (x) { return kindOf(x).id === kind; });
  }

  /* ---- the CAST block appended to the system instruction for one job ----
   *
   * Reference images are numbered once across the whole block, in cast order,
   * because the number is a promise about the order the images are handed to
   * the model — and that order does not restart per kind.
   */
  function block(p, shot, model, role) {
    /* image N -> which subject, assigned before anything is written so the
     * per-kind sections can cite numbers the mapping will agree with */
    const numbered = SB.Refs.images(p, shot);
    /* Every subject in the FEED, in feed order — not just the cast. A subject
     * can be marked without being cast (a mark written by hand, a name linked
     * from the card), and describing only the cast left images numbered in the
     * mapping with no entry above them, under a paragraph claiming the entries
     * above were the complete and authoritative record. */
    const cast = SB.Refs.feed(p, shot)
      .filter(function (e) { return e.kind === 'subject'; })
      .map(function (e) { return e.subject; });
    /* A card can feed images with nobody cast on it — a shot mark from a riff,
     * or a mark written by hand, neither of which casts anyone. Bailing on an
     * empty cast then sent the files with no mapping at all, so the prompt said
     * nothing about images the person was about to hand over. */
    if (!cast.length && !numbered.length) return '';
    const rangeFor = function (per) {
      const mine = numbered.filter(function (e) { return e.id === per.id; })
        .map(function (e) { return e.n; });
      if (!mine.length) return '';
      if (mine.length === 1) return 'image ' + mine[0] + ' — ';
      return 'images ' + mine[0] + '–' + mine[mine.length - 1] + ' — ';
    };

    const lines = [];
    let multi = false;
    KINDS.forEach(function (kind) {
      const mine = cast.filter(function (x) { return kindOf(x).id === kind.id; });
      if (!mine.length) return;
      lines.push(kind.heading);
      mine.forEach(function (per, i) {
        const bits = [];
        bits.push(rangeFor(per) + (per.name || 'unnamed'));
        const d = (per.description || '').replace(/\s+/g, ' ').trim();
        bits.push(d || '(no description yet)');
        /* Marked rather than dropped: the image numbering has to mean the same
           thing in both prompts, because it is the order the person feeding the
           model puts their files in. */
        const late = enters(shot, per.id) ? '  [ARRIVES DURING THE SHOT — NOT IN THE FIRST FRAME]' : '';
        lines.push('  ' + (i + 1) + '. ' + bits.join(': ') + late);
        if (!hasImage(per)) lines.push('     ' + kind.noImage);
        if (imagesOf(per).length > 1) multi = true;
      });
    });

    const subjectImages = numbered.filter(function (e) { return e.kind === 'subject'; });
    if (numbered.length) {
      /* The per-model wording is about recurring SUBJECTS ("the person in image
       * N"). Sending it when the only image is another shot's whole frame told
       * the model to treat a frame as a face. */
      const tpl = subjectImages.length
        ? ((model && typeof model.referenceTemplate === 'string')
          ? model.referenceTemplate : DEFAULT_REF_TEMPLATE)
        : '';
      const names = cast.filter(hasImage).map(function (x) { return x.name; }).join(', ');
      lines.push(tpl.replace(/\{\{N\}\}/g, function () { return 'N'; })
        .replace(/\{\{NAME\}\}/g, names));
      /* The mapping is the feed's, not this block's: a shot's own rendered
         frame is a reference like any other, and the numbers have to agree
         with the strip on the card and with the files the person is about to
         drop in. */
      SB.Refs.images(p, shot).forEach(function (e) {
        lines.push('  image ' + e.n + ' = ' + e.label + (e.role ? ' (' + e.role + ')' : ''));
      });
      /* Several frames of one subject read as several subjects unless this is
       * said outright — the failure is a second person walking into the shot. */
      if (multi) {
        lines.push('Where more than one image is listed against the same name, they are the SAME ' +
          'subject seen from different angles — not different subjects. Do not add anybody or ' +
          'anything to the shot on account of the extra frames.');
      }
    }
    /* The shot description may itself name a wardrobe — older boards baked the
     * subject into every description, and that copy went stale the moment the
     * persona was edited. This block is the live record, so it is declared to
     * win outright rather than deferring to whatever the description says. */
    lines.push('The descriptions above are the CURRENT and AUTHORITATIVE record of how these ' +
      'people, places and things look. Where the shot description says anything different about ' +
      'their appearance, hair, wardrobe or surroundings, it is out of date — follow this block ' +
      'and ignore it. The shot description still governs what they are DOING and where.');

    /* ...and this block was being read as a guest list. It names everyone cast
     * in the shot and hands over a numbered reference image for each, which to
     * a writer looks like a manifest of who is in the picture — so somebody the
     * description had walking in later was drawn standing in the first frame.
     * What it actually answers is "how do they look", never "who is here". */
    const late = arriving(p, shot);
    if (role === 'image' || role === 'both') {
      const who = role === 'both' ? 'In the FIRST-FRAME PROMPT, only' : 'Only';
      lines.push('This block says how these subjects LOOK. It is not a list of who or what is ' +
        'visible in the frame you are writing — the shot description decides that, and a ' +
        'reference image being supplied does not mean the subject is in this frame. ' +
        who + ' draw the ones present at the instant the shot opens. ' +
        'Anything arriving, entering or appearing later is not in the frame yet' +
        (role === 'both' ? ' — it belongs to the video prompt.' : '.'));
      if (late.length) {
        lines.push('MARKED AS ARRIVING, AND THEREFORE ABSENT FROM THE FIRST FRAME: ' +
          late.map(function (x) { return x.name || 'unnamed'; }).join(', ') + '. ' +
          'Do not draw them, and do not hint at them with an opening door, a shadow or a ' +
          'look off-screen. The frame is what the camera sees before they arrive.');
      }
    }
    if (numbered.length && (role === 'video' || role === 'both')) {
      lines.push('The image-to-video call is given ONE picture — the first frame — so the video ' +
        'prompt must not refer to image numbers. Name people and things by name there.');
    }
    if (late.length && (role === 'video' || role === 'both')) {
      lines.push('ARRIVING DURING THE SHOT: ' +
        late.map(function (x) { return x.name || 'unnamed'; }).join(', ') +
        ' — they enter after the first frame, so their arrival is movement this prompt covers.');
    }
    /* Last, because it overrides what everything above it says.
     *
     * A frame of another shot is not a reference to a face — it is the picture
     * this one is derived FROM, and the prompt has to come out as an edit of
     * it. Told merely how to "treat" the image, the writer ignored image 1
     * entirely and rebuilt the room from scratch, which is the one thing the
     * source frame exists to prevent. So this is a constraint on the OUTPUT,
     * and it says which instructions above it cancels. */
    const shots = SB.Refs.feed(p, shot).filter(function (e) {
      return e.kind === 'shot' && e.images.length;
    });
    if (shots.length && (role === 'image' || role === 'both')) {
      const which = shots.map(function (e) {
        return 'image ' + (e.numbers[0] || '?') + ' is the whole rendered frame of shot ' + e.label;
      }).join('; ');
      lines.push('THE SOURCE FRAME — READ THIS LAST, IT OVERRIDES THE ABOVE');
      lines.push(which + '. It is not a subject and not a face: it is the frame this one is ' +
        'derived from.');
      lines.push('The prompt you write is an EDIT of that frame, not a fresh description of a ' +
        'scene. Open it by naming the image — "Starting from image ' +
        (shots[0].numbers[0] || 1) + ', …" — then state ONLY what changes: the camera, the ' +
        'framing, the moment. Do NOT re-describe the place, the light, the lens, the grade or ' +
        'the wardrobe, and do not re-establish the setting: all of it is inherited from that ' +
        'frame unchanged, and describing it again is what makes the edit come back as a ' +
        'different shot. Any instruction above to describe the setting, the lighting or the ' +
        'lens does not apply to what is inherited.');
    }

    return lines.join('\n');
  }

  /* ---- the description says somebody walks in, but nobody is marked ----
   *
   * The mark is the only thing that makes this deterministic, so it has to be
   * findable. This is the same shape as the wardrobe sweep: the board spots the
   * contradiction and offers the fix, rather than leaving it to be discovered
   * in a rendered frame with an extra person standing in it. */
  const ARRIVAL_RE = new RegExp('\\b(' + [
    'walks? in', 'walks? into', 'steps? in', 'steps? into', 'comes? in', 'enters?', 'entering',
    'arrives?', 'arriving', 'appears?', 'joins?', 'approaches?', 'crosses into',
    /* verb-anchored only: a bare "into frame" matched "a hand comes into
     * frame", which is the commonest insert phrasing there is */
    'moves? into (?:the )?(?:frame|shot)'
  ].join('|') + ')\\b', 'i');

  /* True when the text reads as somebody turning up partway through. */
  function readsAsArrival(desc) {
    return ARRIVAL_RE.test(String(desc || ''));
  }

  /* ---- generate subjects from the brand + the master script ---- */

  /* What the writer is being asked for, per kind. The name is always a board
   * handle rather than whatever the script calls the thing, because the handle
   * is what gets typed after an @ for the rest of the project. */
  const GEN_BRIEF = {
    person: {
      ask: 'recurring on-camera',
      unit: ['person', 'people'],
