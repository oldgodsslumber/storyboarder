<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Storyboarder</title>
<style>
/* Storyboarder — app styles */

:root,
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#15171c;
  --bg2:#1c1f26;
  --bg3:#242833;
  --line:#333844;
  --line2:#454c5c;
  --fg:#e6e9ef;
  --fg-dim:#98a0b0;
  --accent:#5b8dff;
  --accent2:#ffb347;
  --on-accent:#0d1017;
  --danger:#ff5f56;
  --ok:#4ec98a;
  --frame-bg:#0c0e12;
  --input-bg:#12141a;
  --shadow:rgba(0,0,0,.5);
  --hl1:rgba(91,141,255,.20);
  --hl2:rgba(91,141,255,.36);
  --hl3:rgba(255,179,71,.42);
  --card-radius:8px;
}

:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f2f4f7;
  --bg2:#ffffff;
  --bg3:#e9ecf1;
  --line:#d3d8e0;
  --line2:#b3bac6;
  --fg:#1a1d23;
  --fg-dim:#5f6774;
  --accent:#2563eb;
  --accent2:#b45309;
  --on-accent:#ffffff;
  --danger:#dc2626;
  --ok:#15803d;
  --frame-bg:#dadee5;
  --input-bg:#ffffff;
  --shadow:rgba(20,25,35,.18);
  --hl1:rgba(37,99,235,.15);
  --hl2:rgba(37,99,235,.30);
  --hl3:rgba(180,83,9,.30);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font:13px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif;
  overflow:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none !important}
.spacer{flex:1}

#app{display:flex;flex-direction:column;height:100%}

/* ---------- top bar ---------- */
#topbar{
  display:flex;align-items:center;gap:8px;padding:6px 10px;
  background:var(--bg2);border-bottom:1px solid var(--line);flex:0 0 auto;
  flex-wrap:wrap;
}
.brand{font-weight:700;letter-spacing:.4px;color:var(--accent);margin-right:4px}
.proj-name{
  background:transparent;border:1px solid transparent;border-radius:4px;
  padding:3px 6px;width:190px;
}
.proj-name:hover{border-color:var(--line)}
.proj-name:focus{outline:none;border-color:var(--accent);background:var(--bg)}
.tb-group{display:flex;align-items:center;gap:4px}
.tb-sep{width:1px;height:20px;background:var(--line)}
.tb{
  background:var(--bg3);border:1px solid var(--line);border-radius:4px;
  padding:4px 9px;cursor:pointer;white-space:nowrap;
}
.tb:hover{border-color:var(--line2)}
.tb.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.tb-select{background:var(--bg3);border:1px solid var(--line);border-radius:4px;padding:4px 6px;max-width:180px}
.tb-check{display:flex;align-items:center;gap:3px;color:var(--fg-dim);cursor:pointer;user-select:none}
.tb-check input{margin:0}
.mini{
  background:var(--bg3);border:1px solid var(--line);border-radius:4px;
  padding:2px 7px;cursor:pointer;font-size:12px;
}
.mini:hover{border-color:var(--line2)}
.mini.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.mini.primary:disabled{opacity:.35;cursor:default}
.mini.danger:hover{border-color:var(--danger);color:var(--danger)}
.save-state{color:var(--fg-dim);font-size:11px;min-width:74px}
.save-state.dirty{color:var(--accent2)}
.save-state.saved{color:var(--ok)}

/* ---------- layout ---------- */
#main{flex:1;display:flex;min-height:0}
#scenePanel{
  flex:0 0 200px;background:var(--bg2);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;
}
#boardPanel{flex:1;min-width:0;overflow:auto}
#scriptPanel{
  flex:0 0 380px;background:var(--bg2);border-left:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;
}
.panel-head{
  display:flex;align-items:center;gap:6px;padding:6px 8px;
  border-bottom:1px solid var(--line);font-weight:600;color:var(--fg-dim);
  text-transform:uppercase;font-size:11px;letter-spacing:.6px;flex:0 0 auto;
}

/* ---------- scene list ---------- */
.scene-list{overflow:auto;padding:6px;flex:1}
.scene-item{
  border:1px solid var(--line);border-radius:6px;background:var(--bg3);
  padding:6px 8px;margin-bottom:6px;cursor:grab;
}
.scene-item.sel{border-color:var(--accent)}
.scene-item.drag-over{border-top:2px solid var(--accent2)}
.scene-item.drop-shot{
  border-color:var(--accent);background:var(--bg);
  box-shadow:inset 0 0 0 1px var(--accent);
}
.scene-item.drop-shot::after{
  content:"drop to move here";display:block;margin-top:3px;
  font-size:10px;color:var(--accent);text-transform:uppercase;letter-spacing:.5px;
}
.scene-item .num{color:var(--accent);font-weight:700;margin-right:5px}
.scene-item .ttl{font-weight:600}
.scene-item .cnt{color:var(--fg-dim);font-size:11px;margin-top:2px}

/* ---------- board ---------- */
.board{padding:12px 14px 60px}
.scene-block{margin-bottom:22px}
.scene-head{
  display:flex;align-items:flex-start;gap:8px;padding:6px 8px;
  background:var(--bg2);border:1px solid var(--line);border-radius:6px;margin-bottom:10px;
}
.scene-head.sel{border-color:var(--accent)}
.scene-head .snum{
  color:var(--accent);font-weight:700;font-size:15px;padding-top:2px;min-width:58px;
}
.scene-head .fields{flex:1;display:flex;flex-direction:column;gap:4px}
.scene-head input.sh-heading{
  background:transparent;border:1px solid transparent;border-radius:4px;padding:2px 5px;
  font-size:15px;font-weight:600;
}
.scene-head textarea.sh-desc{
  background:transparent;border:1px solid transparent;border-radius:4px;padding:2px 5px;
  resize:vertical;min-height:24px;color:var(--fg-dim);font-size:12px;
}
.scene-head input:hover,.scene-head textarea:hover{border-color:var(--line)}
.scene-head input:focus,.scene-head textarea:focus{outline:none;border-color:var(--accent);background:var(--bg)}
.scene-actions{display:flex;gap:4px}

.shots{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;min-height:60px;border-radius:6px}
.shots.drag-over{outline:2px dashed var(--accent);outline-offset:4px;background:rgba(91,141,255,.06)}
.scene-block.drag-over > .scene-head{border-color:var(--accent);background:var(--bg3)}

/* ---------- shot card ---------- */
.card{
  width:280px;background:var(--bg2);border:1px solid var(--line);
  border-left:5px solid var(--line2);border-radius:var(--card-radius);
  display:flex;flex-direction:column;overflow:hidden;
}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.card.noshot{opacity:.72}
.card.drag-over{outline:2px dashed var(--accent2);outline-offset:2px}
.card.dragging{opacity:.4}
.card-head{
  display:flex;align-items:center;gap:6px;padding:4px 6px;background:var(--bg3);
  border-bottom:1px solid var(--line);cursor:grab;
}
.card-head{flex-wrap:wrap}
.card-head .code{font-weight:700;color:var(--accent);min-width:34px}
.card-head select.type{
  background:var(--bg2);border:1px solid var(--line);border-radius:4px;
  padding:1px 4px;font-size:11px;flex:1 1 60px;min-width:0;max-width:104px;
}
.card-head .ch-actions{margin-left:auto;display:flex;gap:3px;align-items:center}
.card-head .swatch{width:16px;height:16px;border:1px solid var(--line2);border-radius:3px;padding:0;background:none;cursor:pointer}
.badge{
  font-size:10px;padding:1px 5px;border-radius:9px;border:1px solid var(--line2);
  color:var(--fg-dim);text-transform:uppercase;letter-spacing:.4px;
}
.badge.noshot{border-color:var(--accent2);color:var(--accent2)}
.badge.warn{border-color:var(--danger);color:var(--danger);cursor:help}

.frame{
  position:relative;background:var(--frame-bg);aspect-ratio:16/9;display:flex;
  align-items:center;justify-content:center;cursor:pointer;overflow:hidden;
}
.frame img.shot-img{width:100%;height:100%;object-fit:contain;display:block}
.frame img.anno{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}
.frame .drop-hint{color:var(--fg-dim);font-size:11px;text-align:center;padding:8px}
.frame.drag-over{outline:2px dashed var(--accent);outline-offset:-4px}
.frame-tools{position:absolute;right:4px;top:4px;display:flex;gap:3px;opacity:0;transition:opacity .12s}
.frame:hover .frame-tools{opacity:1}

.box-label{
  display:flex;align-items:center;gap:5px;padding:3px 6px 0;
  font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--fg-dim);
}
.link-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:0 0 auto}
.link-dot.free{background:var(--fg-dim)}
.link-dot.broken{background:var(--danger)}
.box-label .lbl-actions{margin-left:auto;display:flex;gap:4px}
.box-label button{background:none;border:none;color:var(--fg-dim);cursor:pointer;padding:0;font-size:10px;text-decoration:underline}
.box-label button:hover{color:var(--fg)}

.script-box,.desc-box{
  margin:2px 6px 6px;padding:5px 6px;border:1px solid var(--line);border-radius:5px;
  background:var(--input-bg);white-space:pre-wrap;word-wrap:break-word;overflow:auto;
}
.script-box{min-height:44px;max-height:150px;font-size:12px}
.script-box.broken{border-color:var(--danger);background:rgba(255,95,86,.07)}
.script-box:empty::before{content:"(empty)";color:var(--fg-dim)}
.desc-box{min-height:70px;max-height:260px;resize:vertical;width:calc(100% - 12px);font-size:12.5px}
.script-box:focus,.desc-box:focus{outline:none;border-color:var(--accent)}

.prompt-box{margin:0 6px 6px}
.prompt-box .ptitle{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--accent2);padding:0 2px 2px;display:flex;gap:6px;align-items:center}
.prompt-box textarea{
  width:100%;min-height:58px;max-height:200px;background:var(--input-bg);color:var(--fg);
  border:1px solid var(--line);border-radius:5px;padding:5px 6px;font-size:11.5px;resize:vertical;
}
.prompt-box textarea:focus{outline:none;border-color:var(--accent2)}

.comments{margin:0 6px 6px;border-top:1px dashed var(--line);padding-top:5px}
.comment{display:flex;gap:6px;align-items:flex-start;font-size:12px;padding:2px 0;border-bottom:1px dotted var(--line)}
.comment .txt{flex:1;white-space:pre-wrap}
.comment .when{color:var(--fg-dim);font-size:10px}
.comment .del{background:none;border:none;color:var(--fg-dim);cursor:pointer}
.comment .del:hover{color:var(--danger)}
.comment-add{display:flex;gap:4px;margin-top:4px}
.comment-add input{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:3px 5px}
.comment-add input:focus{outline:none;border-color:var(--accent)}

.card-foot{display:flex;gap:4px;padding:0 6px 6px}
.add-shot{
  width:280px;min-height:120px;border:1px dashed var(--line2);border-radius:var(--card-radius);
  background:transparent;color:var(--fg-dim);cursor:pointer;font-size:13px;
}
.add-shot:hover{border-color:var(--accent);color:var(--fg)}

/* ---------- master script ---------- */
.script-hint{padding:6px 8px;color:var(--fg-dim);font-size:11px;border-bottom:1px solid var(--line)}
.master-script{
  flex:1;overflow:auto;padding:10px 12px;white-space:pre-wrap;word-wrap:break-word;
  font-size:13.5px;line-height:1.6;background:var(--bg);
}
.master-script:focus{outline:none}
.master-script:empty::before{
  content:"Paste or type the script here, then select a line and press Capture shot.";
  color:var(--fg-dim);
}
.master-script .h1{background:var(--hl1);border-radius:2px}
.master-script .h2{background:var(--hl2);border-radius:2px}
.master-script .h3{background:var(--hl3);border-radius:2px}
.master-script .hactive{box-shadow:inset 0 -2px 0 var(--accent2)}
.capture-form{
  border-top:1px solid var(--line);padding:8px;background:var(--bg3);
  display:flex;flex-direction:column;gap:6px;
}
.capture-form .row{display:flex;gap:6px;align-items:center}
.capture-form label{color:var(--fg-dim);font-size:11px;min-width:52px}
.capture-form select{flex:1;background:var(--bg2);border:1px solid var(--line);border-radius:4px;padding:3px 5px}
.capture-form .preview{
  max-height:60px;overflow:auto;background:var(--bg);border:1px solid var(--line);
  border-radius:4px;padding:4px 6px;font-size:11.5px;color:var(--fg-dim);
}

/* ---------- modal ---------- */
.modal-back{
  position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;
  align-items:center;justify-content:center;z-index:50;
}
.modal{
  background:var(--bg2);border:1px solid var(--line2);border-radius:8px;
  min-width:420px;max-width:min(900px,92vw);max-height:88vh;display:flex;flex-direction:column;
}
.modal h2{margin:0;padding:10px 14px;border-bottom:1px solid var(--line);font-size:15px}
.modal .body{padding:12px 14px;overflow:auto}
.modal .foot{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:6px;justify-content:flex-end}
.modal label.field{display:block;margin-bottom:10px}
.modal label.field > span{display:block;color:var(--fg-dim);font-size:11px;margin-bottom:3px;text-transform:uppercase;letter-spacing:.5px}
.modal input[type=text],.modal input[type=password],.modal textarea,.modal select{
  width:100%;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:5px 7px;
}
.modal textarea{resize:vertical;min-height:60px;font-size:12px}
.modal input:focus,.modal textarea:focus,.modal select:focus{outline:none;border-color:var(--accent)}
.model-row{border:1px solid var(--line);border-radius:6px;padding:8px;margin-bottom:8px;background:var(--bg3)}
.model-row .top{display:flex;gap:6px;margin-bottom:6px}
.model-row .top input{flex:1}
.model-row .top select{width:96px}
.ver-row{display:flex;gap:8px;align-items:center;padding:6px;border-bottom:1px solid var(--line)}
.ver-row .vname{flex:1}
.ver-row .vmeta{color:var(--fg-dim);font-size:11px}
.ver-row.current{color:var(--accent)}

/* drawing modal */
.draw-wrap{position:relative;background:#000;line-height:0}
.draw-wrap img{display:block;max-width:78vw;max-height:66vh}
.draw-wrap canvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair;touch-action:none}
.draw-tools{display:flex;gap:8px;align-items:center;padding:8px 0 0}
.draw-tools .sw{width:20px;height:20px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.draw-tools .sw.on{border-color:#fff}

/* ---------- data readout ---------- */
.size-state{
  background:none;border:1px solid transparent;border-radius:4px;padding:2px 6px;
  color:var(--fg-dim);font-size:11px;cursor:pointer;font-variant-numeric:tabular-nums;
}
.size-state:hover{border-color:var(--line);color:var(--fg)}
.size-state.over{color:var(--danger);font-weight:600}

.usage .stat-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.stat-tile{
  flex:1 1 160px;border:1px solid var(--line);border-radius:8px;
  background:var(--bg3);padding:10px 12px;
}
.stat-label{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--fg-dim)}
.stat-value{font-size:22px;font-weight:700;line-height:1.2;margin:2px 0;font-variant-numeric:tabular-nums}
.stat-note{font-size:11px;color:var(--fg-dim)}

.usage-h{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--fg-dim);margin:18px 0 8px}
.usage-bar{
  display:flex;gap:2px;height:22px;border-radius:4px;overflow:hidden;background:var(--bg);
}
.usage-seg{display:block;min-width:3px}
.usage-table{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px}
.usage-table th{
  text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.5px;
  color:var(--fg-dim);font-weight:600;padding:4px 6px;border-bottom:1px solid var(--line);
}
.usage-table td{padding:4px 6px;border-bottom:1px solid var(--line)}
.usage-table td.num,.usage-table th:nth-child(3),.usage-table th:nth-child(4){
  text-align:right;font-variant-numeric:tabular-nums;
}
.usage-table td:first-child{width:18px}
.usage-dot{display:inline-block;width:10px;height:10px;border-radius:3px}
.usage-heavy{font-size:12px}
.usage-heavy-row{
  display:flex;justify-content:space-between;gap:10px;padding:3px 6px;
  border-bottom:1px dotted var(--line);
}
.usage-heavy-row .num{font-variant-numeric:tabular-nums;color:var(--fg-dim)}
.usage-verdict{
  border-left:3px solid var(--ok);padding:8px 10px;background:var(--bg3);
  border-radius:0 6px 6px 0;font-size:12.5px;
}
.usage-verdict.bad{border-left-color:var(--danger)}
.usage-verdict.warn{border-left-color:var(--accent2)}
.usage-check.warn .usage-mark{color:var(--accent2)}
.usage-checks{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.usage-check{display:flex;gap:8px;align-items:flex-start;font-size:12px}
.usage-mark{color:var(--ok);font-weight:700;flex:0 0 14px}
.usage-check.bad .usage-mark{color:var(--danger)}
.usage-check-label{font-weight:600}
.usage-check-detail{color:var(--fg-dim);font-size:11.5px}

/* ---------- toast ---------- */
#toastRoot{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:6px;align-items:center}
.toast{
  background:var(--bg3);border:1px solid var(--line2);border-radius:6px;padding:6px 12px;
  box-shadow:0 4px 18px var(--shadow);animation:tin .15s ease-out;
}
.toast.err{border-color:var(--danger);color:var(--danger)}
@keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- prompt panel ---------- */
#promptPanel{
  flex:0 0 300px;background:var(--bg2);border-left:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;overflow:auto;
}
.pp-body{padding:10px;display:flex;flex-direction:column;gap:12px}
.pp-block{border:1px solid var(--line);border-radius:6px;background:var(--bg3);padding:8px}
.pp-block > .t{
  font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--fg-dim);margin-bottom:6px;
}
.pp-row{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.pp-row:last-child{margin-bottom:0}
.pp-row label{flex:0 0 74px;color:var(--fg-dim);font-size:11px}
.pp-row select,.pp-row input[type=text]{
  flex:1;min-width:0;background:var(--input-bg);border:1px solid var(--line);
  border-radius:4px;padding:3px 5px;
}
.pp-row select:focus{outline:none;border-color:var(--accent)}
.pp-toggle{display:flex;align-items:center;gap:6px;padding:3px 0;cursor:pointer;user-select:none}
.pp-toggle input{margin:0}
.pp-note{color:var(--fg-dim);font-size:11px;line-height:1.5}
.pp-note b{color:var(--fg)}
.pp-actions{display:flex;gap:6px;flex-wrap:wrap}
.pp-status{font-size:11px;color:var(--fg-dim);min-height:15px}
.pp-status.err{color:var(--danger)}
.pp-usage{flex:1;font-size:11px;color:var(--fg-dim)}
.pp-usage.spent{color:var(--danger);font-weight:600}
.pp-limit{
  width:58px;background:var(--input-bg);border:1px solid var(--line);
  border-radius:4px;padding:2px 4px;font-size:11px;
}
.pp-limit:focus{outline:none;border-color:var(--accent)}
.gm-picker{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.gm-picker select,.gm-picker input{
  width:100%;background:var(--input-bg);border:1px solid var(--line);
  border-radius:4px;padding:3px 5px;
}
.gm-picker select:focus,.gm-picker input:focus{outline:none;border-color:var(--accent)}
.modal .gm-picker{width:100%}

/* ---------- personas ---------- */
#personaPanel{
  flex:0 0 320px;background:var(--bg2);border-left:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;overflow:auto;
}
.persona{border:1px solid var(--line);border-radius:6px;background:var(--bg3);padding:8px;margin-bottom:10px}
.persona-head{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.persona-name{
  flex:1;min-width:0;background:var(--input-bg);border:1px solid var(--line);
  border-radius:4px;padding:3px 5px;font-weight:600;
}
.persona-name:focus{outline:none;border-color:var(--accent)}
.persona-used{color:var(--fg-dim);font-size:11px;white-space:nowrap}
.persona-frame{
  position:relative;background:var(--frame-bg);aspect-ratio:3/4;max-height:220px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  border-radius:5px;overflow:hidden;margin-bottom:4px;
}
.persona-frame img{width:100%;height:100%;object-fit:contain}
.persona-frame.drag-over{outline:2px dashed var(--accent);outline-offset:-4px}
.persona-clear{position:absolute;right:4px;top:4px}
.persona-text{
  width:100%;background:var(--input-bg);color:var(--fg);border:1px solid var(--line);
  border-radius:5px;padding:5px 6px;font-size:11.5px;resize:vertical;margin-bottom:6px;
}
.persona-text:focus{outline:none;border-color:var(--accent)}

.cast-row{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:4px 6px 0}
.cast-chip{
  font-size:10px;padding:1px 6px;border-radius:9px;
  border:1px solid var(--line2);color:var(--fg-dim);white-space:nowrap;
}
.cast-chip.has-img{border-color:var(--accent);color:var(--accent)}
.cast-empty{font-size:10px;color:var(--fg-dim);text-transform:uppercase;letter-spacing:.5px}
.cast-edit{margin-left:auto}
.cast-pop{
  position:fixed;z-index:60;background:var(--bg2);border:1px solid var(--line2);
  border-radius:6px;padding:6px;display:flex;flex-direction:column;gap:4px;
  box-shadow:0 6px 20px var(--shadow);max-height:60vh;overflow:auto;min-width:160px;
}
.cast-opt{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;font-size:12px}

/* ---------- colour palette popover ---------- */
.swatch{
  width:16px;height:16px;border:1px solid var(--line2);border-radius:3px;
  padding:0;cursor:pointer;flex:0 0 auto;
}
.pal-pop{
  position:fixed;z-index:60;background:var(--bg2);border:1px solid var(--line2);
  border-radius:6px;padding:6px;display:grid;grid-template-columns:repeat(5,20px);
  gap:6px;box-shadow:0 6px 20px var(--shadow);
}
.pal-pop button{
  width:20px;height:20px;border-radius:4px;border:2px solid transparent;cursor:pointer;padding:0;
}
.pal-pop button.on{border-color:var(--fg)}

/* ---------- settings tabs ---------- */
.tabs{display:flex;gap:4px;padding:8px 14px 0;border-bottom:1px solid var(--line);flex:0 0 auto}
.tab{
  background:none;border:1px solid transparent;border-bottom:none;border-radius:5px 5px 0 0;
  padding:5px 12px;cursor:pointer;color:var(--fg-dim);margin-bottom:-1px;
}
.tab:hover{color:var(--fg)}
.tab.on{background:var(--bg3);border-color:var(--line);color:var(--fg);font-weight:600}
.tab-panel{display:none}
.tab-panel.on{display:block}

/* Native selects otherwise keep a platform-themed background that ignores the
   theme, so draw our own chevron and let the rules above own the colour. */
select,.tb-select,.pp-row select,.modal select,.capture-form select,.card-head select.type,
.gm-picker select{
  -webkit-appearance:none;appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0h10L5 6z' fill='%238b93a3'/></svg>");
  background-repeat:no-repeat;background-position:right 6px center;
  padding-right:20px;
}

/* comment mode tint */
body.comment-mode #boardPanel{background:linear-gradient(180deg,rgba(255,179,71,.06),transparent 120px)}
body.comment-mode .frame{cursor:crosshair}

<script>
/* ===== js/theme.js ===== */
/* theme.js — light / dark. Runs before anything else so there is no flash.
 * The choice is a browser preference, not project data — it never touches the file.
 */
window.SB = window.SB || {};
(function (SB) {
  'use strict';

  const KEY = 'sb.theme';

  function stored() {
    try { return localStorage.getItem(KEY); } catch (e) { return null; }
  }

  function systemPref() {
    return (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches)
      ? 'light' : 'dark';
  }

  function current() { return document.documentElement.getAttribute('data-theme') || 'dark'; }

  function apply(t) {
    document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
    const b = document.getElementById('btnTheme');
    if (b) {
      b.textContent = t === 'light' ? '☾' : '☀';
      b.title = t === 'light' ? 'Switch to dark' : 'Switch to light';
    }
  }

  function set(t) {
    try { localStorage.setItem(KEY, t); } catch (e) { }
    apply(t);
  }

  function toggle() { set(current() === 'light' ? 'dark' : 'light'); }

  apply(stored() || systemPref());
  document.addEventListener('DOMContentLoaded', function () { apply(current()); });

  SB.Theme = { apply: apply, set: set, toggle: toggle, current: current };

})(window.SB);

</script>
<script>
/* ===== js/util.js ===== */
/* util.js — small shared helpers */
window.SB = window.SB || {};
(function (SB) {
  'use strict';

  let _seq = 0;
  SB.uid = function (p) {
    _seq++;
    return (p || 'id') + '_' + Date.now().toString(36) + '_' + _seq.toString(36) +
      Math.random().toString(36).slice(2, 6);
  };

  SB.debounce = function (fn, ms) {
    let t = null;
    const wrapped = function () {
      const args = arguments, self = this;
      clearTimeout(t);
      t = setTimeout(function () { t = null; fn.apply(self, args); }, ms);
    };
    wrapped.flush = function () { if (t) { clearTimeout(t); t = null; fn(); } };
    return wrapped;
  };

  SB.esc = function (s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  };

  SB.clone = function (o) { return JSON.parse(JSON.stringify(o)); };

  SB.clamp = function (v, a, b) { return v < a ? a : (v > b ? b : v); };

  /* A, B, ... Z, AA, AB ... */
  SB.letters = function (i) {
    let s = '';
    i = i | 0;
    do { s = String.fromCharCode(65 + (i % 26)) + s; i = Math.floor(i / 26) - 1; }
    while (i >= 0);
    return s;
  };

  SB.fmtDate = function (ts) {
    const d = new Date(ts);
    return d.toLocaleString(undefined, {
      year: 'numeric', month: 'short', day: 'numeric',
      hour: '2-digit', minute: '2-digit'
    });
  };

  SB.toast = function (msg, isErr) {
    const root = document.getElementById('toastRoot');
    if (!root) return;
    const el = document.createElement('div');
    el.className = 'toast' + (isErr ? ' err' : '');
    el.textContent = msg;
    root.appendChild(el);
    setTimeout(function () { el.remove(); }, isErr ? 6000 : 2600);
  };

  /* ---- images: downscale to <=480p proxy, base64 JPEG ---- */
  const MAX_W = 854, MAX_H = 480;

  SB.downscaleImage = function (blobOrDataUrl) {
    return new Promise(function (resolve, reject) {
      const img = new Image();
      img.onload = function () {
        let w = img.naturalWidth, h = img.naturalHeight;
        if (!w || !h) { reject(new Error('bad image')); return; }
        const scale = Math.min(1, MAX_W / w, MAX_H / h);
        w = Math.max(1, Math.round(w * scale));
        h = Math.max(1, Math.round(h * scale));
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        resolve({ data: c.toDataURL('image/jpeg', 0.82), w: w, h: h });
      };
      img.onerror = function () { reject(new Error('could not decode image')); };
      if (typeof blobOrDataUrl === 'string') img.src = blobOrDataUrl;
      else img.src = URL.createObjectURL(blobOrDataUrl);
    });
  };

  /* Pull an image out of a drop / paste event. Returns Promise<Blob|string|null> */
  SB.imageFromTransfer = function (dt) {
    if (!dt) return Promise.resolve(null);
    const files = dt.files;
    if (files && files.length) {
      for (let i = 0; i < files.length; i++) {
        if (/^image\//.test(files[i].type)) return Promise.resolve(files[i]);
      }
    }
    if (dt.items) {
      for (let i = 0; i < dt.items.length; i++) {
        const it = dt.items[i];
        if (it.kind === 'file' && /^image\//.test(it.type)) {
          const f = it.getAsFile();
          if (f) return Promise.resolve(f);
        }
      }
    }
    const uri = dt.getData && (dt.getData('text/uri-list') || dt.getData('text/plain'));
    if (uri && /^(https?:|data:image)/i.test(uri.trim())) {
      const u = uri.trim().split(/\s+/)[0];
      if (/^data:image/i.test(u)) return Promise.resolve(u);
      return fetch(u, { mode: 'cors' }).then(function (r) { return r.blob(); })
        .catch(function () { return null; });
    }
    const html = dt.getData && dt.getData('text/html');
    if (html) {
      const m = html.match(/<img[^>]+src=["']([^"']+)["']/i);
      if (m) {
        const u = m[1];
        if (/^data:image/i.test(u)) return Promise.resolve(u);
        return fetch(u, { mode: 'cors' }).then(function (r) { return r.blob(); })
          .catch(function () { return null; });
      }
    }
    return Promise.resolve(null);
  };

  SB.pickImageFile = function () {
    return new Promise(function (resolve) {
      const inp = document.createElement('input');
      inp.type = 'file';
      inp.accept = 'image/*';
      inp.onchange = function () { resolve(inp.files && inp.files[0] ? inp.files[0] : null); };
      inp.click();
    });
  };

  /* ---- modal ---- */
  SB.modal = function (opts) {
    const back = SB.el('div', 'modal-back');
    const m = SB.el('div', 'modal');
    if (opts.width) m.style.minWidth = opts.width;
    const h = SB.el('h2', null, opts.title || '');
    const body = SB.el('div', 'body');
    if (opts.body) body.appendChild(opts.body);
    const foot = SB.el('div', 'foot');
    m.appendChild(h); m.appendChild(body); m.appendChild(foot);
    back.appendChild(m);

    function close() {
      back.remove();
      document.removeEventListener('keydown', onKey);
      if (opts.onClose) opts.onClose();
    }
    function onKey(e) { if (e.key === 'Escape') close(); }
    document.addEventListener('keydown', onKey);
    back.addEventListener('mousedown', function (e) { if (e.target === back) close(); });

    (opts.buttons || [{ label: 'Close' }]).forEach(function (b) {
      const btn = SB.el('button', 'tb' + (b.primary ? ' on' : ''), b.label);
      btn.onclick = function () { if (b.onClick) b.onClick(close, body); else close(); };
      foot.appendChild(btn);
    });

    document.getElementById('modalRoot').appendChild(back);
    return { close: close, body: body, root: back };
  };

  /* tiny DOM helper */
  SB.el = function (tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  };

})(window.SB);

</script>
<script>
/* ===== js/doc.js ===== */
/* doc.js — the shared-document engine.
 *
 * A Doc is { text: string, marks: { b:[[s,e]..], i:[...], u:[...] } }.
 * Every edit anywhere in the app is funnelled through a single primitive:
 *
 *     replace(doc, start, end, insertedText)
 *
 * Positions (shot link anchors, marks) are *transformed* through that
 * primitive rather than re-found by string matching, so they survive edits
 * elsewhere in the document. Gravity decides what happens when an edit lands
 * exactly on an anchor.
 */
(function (SB) {
  'use strict';

  const TYPES = ['b', 'i', 'u'];
  const BIT = { b: 1, i: 2, u: 4 };

  function make(text) {
    return { text: text || '', marks: { b: [], i: [], u: [] } };
  }

  function normalize(list) {
    if (!list || !list.length) return [];
    const l = list.filter(function (r) { return r[1] > r[0]; })
      .sort(function (a, b) { return a[0] - b[0] || a[1] - b[1]; });
    const out = [];
    for (let k = 0; k < l.length; k++) {
      const last = out[out.length - 1];
      if (last && l[k][0] <= last[1]) last[1] = Math.max(last[1], l[k][1]);
      else out.push([l[k][0], l[k][1]]);
    }
    return out;
  }

  /* Transform position p through replace(start,end,len).
   * leftGravity=true  -> anchor stays to the LEFT of inserted text
   * leftGravity=false -> anchor moves to the RIGHT of inserted text
   */
  function mapPos(p, start, end, len, leftGravity) {
    // 1. deletion of [start,end)
    let q;
    if (p <= start) q = p;
    else if (p >= end) q = p - (end - start);
    else q = start;
    // 2. insertion of len at start
    if (q < start) return q;
    if (q > start) return q + len;
    return leftGravity ? start : start + len;
  }

  function mapList(list, start, end, len) {
    const out = [];
    for (let k = 0; k < list.length; k++) {
      // marks: don't grab text typed before them, do extend when typed at their end
      const a = mapPos(list[k][0], start, end, len, false);
      const b = mapPos(list[k][1], start, end, len, false);
      if (b > a) out.push([a, b]);
    }
    return normalize(out);
  }

  /* Apply a replacement to a doc's text + marks. Returns the raw op. */
  function replace(doc, start, end, text) {
    start = SB.clamp(start | 0, 0, doc.text.length);
    end = SB.clamp(end | 0, start, doc.text.length);
    text = text == null ? '' : String(text);
    doc.text = doc.text.slice(0, start) + text + doc.text.slice(end);
    for (let k = 0; k < TYPES.length; k++) {
      const t = TYPES[k];
      doc.marks[t] = mapList(doc.marks[t] || [], start, end, text.length);
    }
    return { start: start, end: end, len: text.length };
  }

  /* Does [s,e) carry the mark entirely? */
  function hasMark(doc, type, s, e) {
    if (e <= s) return false;
    const list = doc.marks[type] || [];
    let cur = s;
    for (let k = 0; k < list.length && cur < e; k++) {
      if (list[k][1] <= cur) continue;
      if (list[k][0] > cur) return false;
      cur = list[k][1];
    }
    return cur >= e;
  }

  function addMark(doc, type, s, e) {
    if (e <= s) return;
    doc.marks[type] = normalize((doc.marks[type] || []).concat([[s, e]]));
  }

  function removeMark(doc, type, s, e) {
    if (e <= s) return;
    const out = [];
    const list = doc.marks[type] || [];
    for (let k = 0; k < list.length; k++) {
      const a = list[k][0], b = list[k][1];
      if (b <= s || a >= e) { out.push([a, b]); continue; }
      if (a < s) out.push([a, s]);
      if (b > e) out.push([e, b]);
    }
    doc.marks[type] = normalize(out);
  }

  function toggleMark(doc, type, s, e) {
    if (e <= s || !BIT[type]) return;
    if (hasMark(doc, type, s, e)) removeMark(doc, type, s, e);
    else addMark(doc, type, s, e);
  }

  /* Per-character style bitfield for [from,to) */
  function flags(doc, from, to) {
    const n = Math.max(0, to - from);
    const f = new Uint8Array(n);
    for (let k = 0; k < TYPES.length; k++) {
      const t = TYPES[k], bit = BIT[t], list = doc.marks[t] || [];
      for (let j = 0; j < list.length; j++) {
        const a = Math.max(from, list[j][0]), b = Math.min(to, list[j][1]);
        for (let i = a; i < b; i++) f[i - from] |= bit;
      }
    }
    return f;
  }

  /* Marks inside [from,to) rebased to 0 (used when breaking a link). */
  function sliceMarks(doc, from, to) {
    const out = { b: [], i: [], u: [] };
    for (let k = 0; k < TYPES.length; k++) {
      const t = TYPES[k], list = doc.marks[t] || [];
      for (let j = 0; j < list.length; j++) {
        const a = Math.max(from, list[j][0]), b = Math.min(to, list[j][1]);
        if (b > a) out[t].push([a - from, b - from]);
      }
      out[t] = normalize(out[t]);
    }
    return out;
  }

  /* Render [from,to) as HTML. extraFn(absoluteIndex) -> extra class string (or ''). */
  function renderHTML(doc, from, to, extraFn) {
    from = SB.clamp(from | 0, 0, doc.text.length);
    to = SB.clamp(to | 0, from, doc.text.length);
    const slice = doc.text.slice(from, to);
    if (!slice) return '';
    const f = flags(doc, from, to);
    let html = '';
    let runStart = 0, runFlag = f[0], runExtra = extraFn ? extraFn(from) : '';
    function emit(a, b, fl, ex) {
      let s = SB.esc(slice.slice(a, b));
      if (fl & BIT.b) s = '<b>' + s + '</b>';
      if (fl & BIT.i) s = '<i>' + s + '</i>';
      if (fl & BIT.u) s = '<u>' + s + '</u>';
      if (ex) s = '<span class="' + ex + '">' + s + '</span>';
      html += s;
    }
    for (let i = 1; i < slice.length; i++) {
      const ex = extraFn ? extraFn(from + i) : '';
      if (f[i] !== runFlag || ex !== runExtra) {
        emit(runStart, i, runFlag, runExtra);
        runStart = i; runFlag = f[i]; runExtra = ex;
      }
    }
    emit(runStart, slice.length, runFlag, runExtra);
    if (slice.charAt(slice.length - 1) === '\n') html += '<br class="pad">';
    return html;
  }

  SB.Doc = {
    TYPES: TYPES, BIT: BIT,
    make: make, normalize: normalize, mapPos: mapPos, mapList: mapList,
    replace: replace, hasMark: hasMark, toggleMark: toggleMark,
    addMark: addMark, removeMark: removeMark,
    flags: flags, sliceMarks: sliceMarks, renderHTML: renderHTML
  };

})(window.SB);

</script>
<script>
/* ===== js/geminimodels.js ===== */
/* geminimodels.js — which Gemini model writes the prompts.
 *
 * Curated list of the text models documented at ai.google.dev (checked Aug 2026),
 * filtered to ones that take text in and return text/JSON out — no image, TTS,
 * live-audio, embedding or video models, none of which can write a prompt.
 *
 * Google retires ids on its own schedule, so the picker can also ask the key
 * itself: "refresh from my key" calls ListModels and replaces the list with
 * whatever that key can actually reach today. That result is cached locally.
 */
(function (SB) {
  'use strict';

  const DEFAULT = 'gemini-3.6-flash';
  const CACHE_KEY = 'sb.geminiModelList';

  const LIST = [
    { id: 'gemini-3.6-flash', label: 'Gemini 3.6 Flash — latest, balanced (default)' },
    { id: 'gemini-3.5-flash', label: 'Gemini 3.5 Flash — most intelligent' },
    { id: 'gemini-3.5-flash-lite', label: 'Gemini 3.5 Flash-Lite — fastest / cheapest 3.5' },
    { id: 'gemini-3.1-flash-lite', label: 'Gemini 3.1 Flash-Lite — frontier-class, low cost' },
    { id: 'gemini-3.1-pro-preview', label: 'Gemini 3.1 Pro — deepest reasoning (preview)' },
    { id: 'gemini-3-flash-preview', label: 'Gemini 3 Flash (preview)' },
    { id: 'gemini-2.5-flash', label: 'Gemini 2.5 Flash — older price/performance' },
    { id: 'gemini-2.5-flash-lite', label: 'Gemini 2.5 Flash-Lite — older, budget' },
    { id: 'gemini-2.5-pro', label: 'Gemini 2.5 Pro — older, deep reasoning' },
    { id: 'gemma-4-31b-it', label: 'Gemma 4 31B — open model, large free quota' }
  ];

  /* Gemma is served through the same endpoint but is not a Gemini model: it
   * has no JSON mode, so prompts.js asks it for JSON in words instead of
   * sending a responseSchema. */
  function isGemma(id) { return /^gemma/i.test(String(id || '')); }

  /* ids Google has shut down — anything pointing at these gets moved to DEFAULT */
  const RETIRED = [
    'gemini-2.0-flash', 'gemini-2.0-flash-lite',
    'gemini-3-pro-preview', 'gemini-3.1-flash-lite-preview',
    'gemini-1.5-flash', 'gemini-1.5-pro', 'gemini-flash-latest', 'gemini-pro'
  ];

  /* ---- daily request counting (same idea as the AI GM app) ----
   * Google stopped publishing per-model free-tier RPD in the docs, so the
   * count here is real (every request this browser sent today) while the
   * limit is whatever AI Studio shows you. Resets at local midnight.
   */
  const USAGE_KEY = 'sb.geminiUsage';
  const LIMITS_KEY = 'sb.geminiLimits';
  const DEFAULT_LIMITS = {
    'gemini-2.5-flash': 20, 'gemini-2.5-flash-lite': 20,
    'gemma-4-31b-it': 1500
  };

  function today() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' +
      String(d.getDate()).padStart(2, '0');
  }

  function usage() {
    try {
      const u = JSON.parse(localStorage.getItem(USAGE_KEY));
      if (u && u.date === today()) return u;
    } catch (e) { }
    return { date: today(), counts: {} };
  }

  function saveUsage(u) {
    try { localStorage.setItem(USAGE_KEY, JSON.stringify(u)); } catch (e) { }
  }

  function bump(id) {
    const u = usage();
    u.counts[id] = (u.counts[id] || 0) + 1;
    saveUsage(u);
    return u.counts[id];
  }

  function count(id) { return usage().counts[id] || 0; }

  /* a 429 means today's allowance is gone whatever the number says */
  function markExhausted(id) {
    const u = usage();
    const lim = limit(id);
    u.counts[id] = lim ? Math.max(lim, u.counts[id] || 0) : (u.counts[id] || 0) + 1;
    saveUsage(u);
  }

  function limits() {
    try { return JSON.parse(localStorage.getItem(LIMITS_KEY)) || {}; } catch (e) { return {}; }
  }

  function limit(id) {
    const l = limits();
    if (typeof l[id] === 'number') return l[id];
    return DEFAULT_LIMITS[id] || 0;   // 0 = unknown, just show the count
  }

  function setLimit(id, n) {
    const l = limits();
    if (n > 0) l[id] = n; else delete l[id];
    try { localStorage.setItem(LIMITS_KEY, JSON.stringify(l)); } catch (e) { }
  }

  function remaining(id) {
    const lim = limit(id);
    return lim ? Math.max(0, lim - count(id)) : null;
  }

  function usageText(id) {
    const c = count(id), lim = limit(id);
    if (!lim) return c + ' request' + (c === 1 ? '' : 's') + ' today';
    return c + ' / ' + lim + ' today · ' + Math.max(0, lim - c) + ' left';
  }

  function cached() {
    try {
      const v = JSON.parse(localStorage.getItem(CACHE_KEY));
      return (v && Array.isArray(v.models) && v.models.length) ? v : null;
    } catch (e) { return null; }
  }

  /* Curated list, or the live one from the key if it has been fetched. */
  function options() {
    const c = cached();
    if (!c) return LIST.slice();
    return c.models.map(function (m) {
      return { id: m.id, label: m.label || m.id };
    });
  }

  function isRetired(id) { return RETIRED.indexOf(id) >= 0; }

  function normalize(id) {
    if (!id || isRetired(id)) return DEFAULT;
    return id;
  }

  /* Ask the user's own key what it can reach. */
  function fetchAvailable() {
    const key = SB.Store.getApiKey();
    if (!key) return Promise.reject(new Error('Add your API key first, then refresh the list.'));
    return fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200&key=' +
      encodeURIComponent(key))
      .then(function (r) {
        return r.text().then(function (t) {
          if (!r.ok) {
            let msg = t;
            try { msg = JSON.parse(t).error.message; } catch (e) { }
            throw new Error('Gemini ' + r.status + ': ' + msg);
          }
          return JSON.parse(t);
        });
      })
      .then(function (data) {
        const models = (data.models || []).filter(function (m) {
          const methods = m.supportedGenerationMethods || m.supportedActions || [];
          if (methods.indexOf('generateContent') < 0) return false;
          const id = String(m.name || '').replace(/^models\//, '');
          // drop anything that can't write text back
          return !/embedding|aqa|tts|image|live|veo|imagen|robotics/i.test(id);
        }).map(function (m) {
          const id = String(m.name).replace(/^models\//, '');
          return { id: id, label: (m.displayName || id) + ' — ' + id };
        });
        if (!models.length) throw new Error('That key returned no text models.');
        try {
          localStorage.setItem(CACHE_KEY, JSON.stringify({ at: Date.now(), models: models }));
        } catch (e) { }
        return models;
      });
  }

  function clearCache() {
    try { localStorage.removeItem(CACHE_KEY); } catch (e) { }
  }

  /* A <select> of known models plus a "Custom…" escape hatch.
   * Returns {el, value()} — el is a wrapper holding the select and, when
   * "Custom…" is chosen, a text input. */
  function picker(current, onChange) {
    const wrap = SB.el('div', 'gm-picker');
    const sel = document.createElement('select');
    const custom = document.createElement('input');
    custom.type = 'text';
    custom.placeholder = 'model id, e.g. gemini-3.6-flash';
    custom.className = 'gm-custom';

    function build() {
      const list = options();
      sel.innerHTML = '';
      let matched = false;
      list.forEach(function (m) {
        const o = document.createElement('option');
        o.value = m.id; o.textContent = m.label;
        if (m.id === current) { o.selected = true; matched = true; }
        sel.appendChild(o);
      });
      if (current && !matched) {
        const o = document.createElement('option');
        o.value = current; o.textContent = current + ' — (not in list)';
        o.selected = true;
        sel.insertBefore(o, sel.firstChild);
      }
      const oc = document.createElement('option');
      oc.value = '__custom'; oc.textContent = 'Custom…';
      sel.appendChild(oc);
    }
    build();

    custom.classList.add('hidden');
    sel.addEventListener('change', function () {
      if (sel.value === '__custom') {
        custom.classList.remove('hidden');
        custom.value = current || '';
        custom.focus();
        return;
      }
      custom.classList.add('hidden');
      current = sel.value;
      if (onChange) onChange(current);
    });
    custom.addEventListener('input', function () {
      current = custom.value.trim();
      if (onChange) onChange(current);
    });

    wrap.appendChild(sel);
    wrap.appendChild(custom);
    return {
      el: wrap,
      value: function () { return current; },
      rebuild: function (cur) { if (cur) current = cur; build(); }
    };
  }

  SB.GeminiModels = {
    DEFAULT: DEFAULT, LIST: LIST, RETIRED: RETIRED,
    options: options, isRetired: isRetired, normalize: normalize, isGemma: isGemma,
    fetchAvailable: fetchAvailable, clearCache: clearCache, picker: picker,
    bump: bump, count: count, markExhausted: markExhausted,
    limit: limit, setLimit: setLimit, remaining: remaining, usageText: usageText
  };

})(window.SB);

</script>
<script>
/* ===== js/brand.js ===== */
/* brand.js — the house style every written prompt has to obey.
 *
 * This is a separate layer from the per-model templates: templates say HOW a
 * given model likes to be addressed, the brand says what the picture must look
 * and feel like. It rides along on every call as a system instruction.
 *
 * The app also supplies what a style guide can't know by itself — the scene's
 * beats, so "consistent subject / wardrobe / environment across consecutive
 * frames" is something the writer can actually act on.
 */
(function (SB) {
  'use strict';

  const DEFAULT_BRAND = [
    'CONSTRAINTS',
    '- No gender references: do not mention or imply gender. Avoid gendered nouns, adjectives, titles and pronouns. Use only neutral language — "the subject", "the person", "they" — or omit pronouns entirely.',
    '- Cinematic + technical: maintain professional photographic detail — focal length, aperture, distance/angle, depth of field, and lighting notes for the frame.',
    '- Vary angles subtly (slight high/low tilt, over-shoulder, profile, foreground obstructions) while staying coherent with the rest of the scene.',
    '- Include tactile props or environmental elements that support the story (fabric, glass, rain, reflections, paper, steam).',
    '- Finishing: "Capture RAW", "muted professional grade", "smooth tonal rolloff", "subtle cinematic grain", "controlled contrast".',
    '',
    'STYLE & TONE',
    '- Authentic, documentary-style realism.',
    '- Natural expressions: relaxed faces, genuine smiles, subtle emotion — never exaggerated.',
    '- Real human gestures: mid-conversation, mid-task, mid-thought.',
    '- Diversity across age, gender presentation, life stage and cultural background.',
    '- Inclusive and global representation appropriate for the region.',
    '- Slight imperfections that feel lived-in (gentle motion, natural falloff, real textures).',
    '- Professional yet approachable tone.',
    '- Colour palette matches real-world lighting — warm neutrals, soft highlights, no artificial gloss.',
    '',
    'CAMERA & TECHNICAL FEEL',
    '- Natural light only: window light, office daylight, practical lamps, soft outdoor light.',
    '- Shallow depth of field with a clear focal point that guides the viewer.',
    '- Clean exposure — avoid harsh highlights, avoid blown-out whites.',
    '- Soft contrast and realistic colour (no HDR, no overly sharp digital edges).',
    '- Subtle grain or film-inspired softness is fine where it supports realism.',
    '- Composition avoids clichés (staged handshakes, pointing at screens, contrived poses).',
    '',
    'ENVIRONMENT & COMPOSITION',
    '- People centred in believable, everyday moments.',
    '- Thriving, confident, efficient individuals — not product-first imagery.',
    '- Open office spaces, home offices, industry environments, outdoor movement.',
    '- Work settings that feel modern, diverse and relatable.',
    '- Industry scenes that show clear context through subtle cues, not overemphasis.',
    '- Well-organised compositions with a single clear focal point.',
    '- Avoid cluttered backgrounds; aim for clean, lived-in realism.',
    '- Depth created through blurred backgrounds, reflections or foreground elements.',
    '',
    'OVERALL MOOD',
    '- Confident, approachable, human.',
    '- Calm, clear and aspirational without being glossy.',
    '- Feels like a real moment you walked into — not staged or overproduced.',
    '- Warm, modern, people-centric storytelling.',
    '- The image communicates authenticity, trust, competence, clarity and human connection.'
  ].join('\n');

  /* Motion inherits the same rules; these are the ones that only make sense once
   * the frame starts moving. */
  const VIDEO_RIDER = [
    'MOTION',
    '- Wardrobe and location must not change during the shot.',
    '- Camera moves are restrained and motivated — no flourishes the scene has not earned.',
    '- Movement is documentary-real: the pace of an actual moment, not choreography.',
    '- Hold the natural-light look and the clean exposure through the whole move.'
  ].join('\n');

  /* Gendered language the "no gender references" rule forbids. Word-bounded, so
   * "human", "manager" and "therapist" are safe. */
  const GENDERED = new RegExp('\\b(' + [
    'he', 'him', 'his', 'himself', 'she', 'her', 'hers', 'herself',
    'man', 'men', "man's", 'woman', 'women', "woman's",
    'male', 'males', 'female', 'females',
    'boy', 'boys', 'girl', 'girls', 'guy', 'guys', 'gal', 'gals',
    'lady', 'ladies', 'gentleman', 'gentlemen',
    'businessman', 'businesswoman', 'businessmen', 'businesswomen',
    'salesman', 'saleswoman', 'spokesman', 'spokeswoman', 'chairman', 'chairwoman',
    'mr', 'mrs', 'ms', 'miss', 'sir', 'madam', "ma'am",
    'husband', 'wife', 'mother', 'father', 'mom', 'mum', 'dad',
    'son', 'daughter', 'brother', 'sister', 'aunt', 'uncle',
    'actress', 'waitress', 'hostess', 'stewardess'
  ].join('|') + ')\\b', 'gi');

  /* Which gendered words a written prompt actually used (deduped, lowercase). */
  function genderedTerms(text) {
    const hits = String(text || '').match(GENDERED);
    if (!hits) return [];
    const seen = {}, out = [];
    hits.forEach(function (h) {
      const k = h.toLowerCase();
      if (!seen[k]) { seen[k] = 1; out.push(k); }
    });
    return out;
  }

  /* A board only stores the house style once someone has edited it. Boards on
   * the stock text follow the app, so a correction here reaches them. */
  function brandOf(p) {
    const b = (p.settings && p.settings.brand) || {};
    const custom = !!(b.custom && typeof b.text === 'string' && b.text.trim());
    return {
      enabled: b.enabled !== false,
      custom: custom,
      text: custom ? b.text : DEFAULT_BRAND
    };
  }

  /* Where this frame sits in its scene, so the writer isn't composing in a
   * vacuum. Who is in it — and what they look like and wear — is the personas
   * layer's job, not this one's. */
  function sequenceBlock(p, shot) {
    const f = SB.Model.findShot(p, shot.id);
    if (!f) return '';
    const scene = f.scene;
    const beats = scene.shots.filter(function (s) { return !s.noShot; });
    const pos = beats.indexOf(shot) + 1;
    const lines = [];

    lines.push('SCENE CONTEXT');
    lines.push('Scene ' + (f.sceneIdx + 1) + ': ' + (scene.heading || '(untitled)'));
    if (scene.description) lines.push('Scene note: ' + scene.description);
    lines.push('This is shot ' + f.code + (pos > 0 ? ' (beat ' + pos + ' of ' + beats.length + ')' : '') + '.');

    if (beats.length > 1) {
      lines.push('The other beats in this scene, in order:');
      beats.forEach(function (s, i) {
        const sf = SB.Model.findShot(p, s.id);
        const d = (s.description || '').replace(/\s+/g, ' ').trim();
        lines.push('  ' + (i + 1) + '. [' + (sf ? sf.code : '?') + '] ' + (s.type || 'shot') + ' — ' +
          (d ? (d.length > 160 ? d.slice(0, 157) + '…' : d) : '(no description yet)') +
          (s.id === shot.id ? '   <-- the frame you are writing' : ''));
      });
      lines.push('Keep the location, the lighting mood and the grade coherent across these beats.');
    }
    return lines.join('\n');
  }

  /* The system instruction for one prompt-writing job. */
  function systemFor(p, shot, role) {
    const b = brandOf(p);
    if (!b.enabled) return '';
    const parts = ['HOUSE STYLE — every prompt you write must obey this.', '', b.text];
    if (role === 'video' || role === 'both') parts.push('', VIDEO_RIDER);
    const seq = sequenceBlock(p, shot);
    if (seq) parts.push('', seq);
    parts.push('', 'Fold these requirements into the prompt itself as concrete description — ' +
      'do not quote the rules back, do not add headings or commentary, and never use gendered language.');
    return parts.join('\n');
  }

  SB.Brand = {
    DEFAULT: DEFAULT_BRAND,
    VIDEO_RIDER: VIDEO_RIDER,
    brandOf: brandOf,
    systemFor: systemFor,
    sequenceBlock: sequenceBlock,
    genderedTerms: genderedTerms
  };

})(window.SB);

</script>
<script>
/* ===== js/personas.js ===== */
/* personas.js — recurring people, so the same face and the same clothes come
 * back shot after shot.
 *
 * A persona holds a description, the prompt that made its reference frame, and
 * the reference image itself (≤480p proxy, like every other image here). Shots
 * name the personas that appear in them; the prompt writer then gets both the
 * description AND the phrasing that particular model expects for reference
 * images — Qwen wants "the person in image 1", others want something else.
 */
(function (SB) {
  'use strict';

  /* How a model wants to be told about reference images. {{N}} = the image's
   * position, {{NAME}} = the persona's name. */
  const REF_TEMPLATES = {
    numbered: 'Reference images are supplied in order. Refer to each recurring subject as ' +
      '"the person in image {{N}}" and keep their face, hair and wardrobe exactly as in that image.',
    named: 'Reference images are supplied for each named subject. Refer to them by name ' +
      '({{NAME}}) and keep their face, hair and wardrobe exactly as in the reference.',
    none: ''
  };

  const DEFAULT_REF_TEMPLATE = REF_TEMPLATES.numbered;

  function newPersona(opts) {
    opts = opts || {};
    return {
      id: SB.uid('per'),
      name: opts.name || 'New persona',
      description: opts.description || '',
      imagePrompt: opts.imagePrompt || '',
      image: opts.image || null      // {data,w,h} — the reference frame
    };
  }

  function all(p) { return (p.personas = p.personas || []); }

  function find(p, id) {
    return all(p).filter(function (x) { return x.id === id; })[0] || null;
  }

  function add(p, opts) {
    const per = newPersona(opts);
    all(p).push(per);
    return per;
  }

  function remove(p, id) {
    p.personas = all(p).filter(function (x) { return x.id !== id; });
    SB.Model.eachShot(p, function (sh) {
      sh.personaIds = (sh.personaIds || []).filter(function (x) { return x !== id; });
    });
  }

  /* The personas in a shot, in the order their reference images should be fed. */
  function forShot(p, shot) {
    return (shot.personaIds || []).map(function (id) { return find(p, id); })
      .filter(Boolean);
  }

  function toggleOnShot(p, shot, id) {
    shot.personaIds = shot.personaIds || [];
    const i = shot.personaIds.indexOf(id);
    if (i >= 0) shot.personaIds.splice(i, 1);
    else shot.personaIds.push(id);
  }

  /* The CAST block appended to the system instruction for one job. */
  function block(p, shot, model) {
    const cast = forShot(p, shot);
    if (!cast.length) return '';
    const lines = ['CAST — these people recur across the board. They must look the same every time.'];
    const withImages = cast.filter(function (x) { return !!x.image; });

    cast.forEach(function (per, i) {
      const bits = [];
      bits.push((per.image ? 'image ' + (withImages.indexOf(per) + 1) + ' — ' : '') + (per.name || 'unnamed'));
      const d = (per.description || '').replace(/\s+/g, ' ').trim();
      bits.push(d || '(no description yet)');
      lines.push('  ' + (i + 1) + '. ' + bits.join(': '));
      if (!per.image) {
        lines.push('     No reference image — describe this person fully and identically every time.');
      }
    });

    if (withImages.length) {
      const tpl = (model && model.referenceTemplate) || DEFAULT_REF_TEMPLATE;
      const names = withImages.map(function (x) { return x.name; }).join(', ');
      lines.push(tpl.replace(/\{\{N\}\}/g, function () { return 'N'; })
        .replace(/\{\{NAME\}\}/g, names));
      withImages.forEach(function (per, i) {
        lines.push('  image ' + (i + 1) + ' = ' + (per.name || 'unnamed'));
      });
    }
    lines.push('Wardrobe stays identical to the description above unless the shot says otherwise.');
    return lines.join('\n');
  }

  /* ---- generate personas from the brand + the master script ---- */

  const GEN_SCHEMA = {
    type: 'OBJECT',
    properties: {
      personas: {
        type: 'ARRAY',
        items: {
          type: 'OBJECT',
          properties: {
            name: { type: 'STRING' },
            description: { type: 'STRING' },
            imagePrompt: { type: 'STRING' }
          },
          required: ['name', 'description', 'imagePrompt']
        }
      }
    },
    required: ['personas']
  };

  function generate(p, count, extraNote) {
    const script = (p.master.text || '').trim();
    const descs = [];
    SB.Model.eachShot(p, function (sh) {
      if (sh.description) descs.push(sh.description);
    });
    if (!script && !descs.length) {
      return Promise.reject(new Error('Nothing to work from yet — write some script or shot descriptions first.'));
    }

    const model = SB.Model.imageModel(p);
    const text = [
      'Read the script below and invent ' + count + ' recurring on-camera ' +
      (count === 1 ? 'person' : 'people') + ' for this video.',
      '',
      'For each one return:',
      '- name: a short label for the board (not a character name in the script — a handle like "Ops lead").',
      '- description: who they are on camera and, critically, exactly what they look like and are WEARING. ' +
      'Age range, build, hair, skin tone, and a specific outfit described down to fabric and colour. ' +
      'This text is what keeps them identical from shot to shot, so be concrete and complete. No gendered language.',
      '- imagePrompt: a single still-image prompt that would produce a clean, front-facing reference frame of ' +
      'this person for ' + (model ? model.name : 'an image model') + ' — plain background, natural light, ' +
      'full wardrobe visible, neutral expression. It must obey the house style.',
      '',
      extraNote ? 'Additional direction: ' + extraNote + '\n' : '',
      script ? 'SCRIPT:\n' + script.slice(0, 12000) : '',
      descs.length ? '\n\nSHOT DESCRIPTIONS:\n- ' + descs.slice(0, 40).join('\n- ') : ''
    ].join('\n');

    const system = SB.Brand.brandOf(p).enabled
      ? 'HOUSE STYLE — the reference frames you describe must obey this.\n\n' + SB.Brand.brandOf(p).text
      : '';

    return SB.Prompts.raw(text, GEN_SCHEMA, system).then(function (out) {
      const made = (out.personas || []).map(function (x) {
        return add(p, {
          name: x.name, description: x.description, imagePrompt: x.imagePrompt
        });
      });
      if (!made.length) throw new Error('No personas came back');
      return made;
    });
  }

  SB.Personas = {
    REF_TEMPLATES: REF_TEMPLATES,
    DEFAULT_REF_TEMPLATE: DEFAULT_REF_TEMPLATE,
    newPersona: newPersona, all: all, find: find, add: add, remove: remove,
    forShot: forShot, toggleOnShot: toggleOnShot, block: block, generate: generate
  };

})(window.SB);

</script>
<script>
/* ===== js/model.js ===== */
/* model.js — project schema, numbering, and all structural mutations. */
(function (SB) {
  'use strict';

  const FILE_VERSION = 1;

  const DEFAULT_SHOT_TYPES = [
    'Wide', 'Medium', 'Close-up', 'Extreme close-up', 'Over the shoulder',
    'Two shot', 'Insert', 'Cutaway', 'POV', 'Screen capture', 'Talking head'
  ];

  const IMG_TPL =
    'Write a single first-frame still-image prompt for {{MODEL}}.\n' +
    'Shot type: {{SHOT_TYPE}}. Scene: {{SCENE}}.\n' +
    'Describe subject, setting, composition, lens, lighting and mood in one dense paragraph. ' +
    'No camera motion, no narration, no preamble.\n\n' +
    'SHOT DESCRIPTION:\n{{DESCRIPTION}}';

  const VID_TPL =
    'Write a single image-to-video prompt for {{MODEL}}, starting from the first frame described below.\n' +
    'Shot type: {{SHOT_TYPE}}. Scene: {{SCENE}}.\n' +
    'Describe only what MOVES: subject action, camera move, pacing, and how the shot ends. ' +
    'Keep it one paragraph, no preamble.\n\n' +
    'SHOT DESCRIPTION:\n{{DESCRIPTION}}';

  function model(name, kind) {
    return {
      id: SB.uid('m'), name: name, kind: kind,
      imageTemplate: IMG_TPL, videoTemplate: VID_TPL,
      referenceTemplate: SB.Personas.DEFAULT_REF_TEMPLATE
    };
  }

  function defaultModels() {
    return [
      model('Wan', 'video'), model('LTX (LTXV 2.3)', 'video'), model('Veo', 'video'),
      model('Kling', 'video'), model('Sora', 'video'), model('Runway', 'video'),
      model('Hailuo (MiniMax)', 'video'), model('Seedance', 'video'),
      model('Nano Banana (Gemini Image)', 'image'), model('Qwen-Image', 'image'),
      model('FLUX', 'image'), model('GPT Image', 'image'), model('Imagen', 'image'),
      model('Ideogram', 'image'), model('Midjourney', 'image')
    ];
  }

  /* Mid-tone hues, each legible as a card edge on both the light and dark board. */
  const CARD_COLORS = [
    '#6b7280', // slate
    '#3b82f6', // blue
    '#0891b2', // cyan
    '#0d9488', // teal
    '#16a34a', // green
    '#ca8a04', // gold
    '#ea580c', // orange
    '#dc2626', // red
    '#db2777', // pink
    '#7c3aed'  // violet
  ];

  function newShot(opts) {
    opts = opts || {};
    return {
      id: SB.uid('sh'),
      type: opts.type || '',
      noShot: !!opts.noShot,
      color: opts.color || CARD_COLORS[0],
      link: opts.link || null,          // {from,to} into master, or null = freestanding
      local: opts.link ? null : SB.Doc.make(opts.text || ''),
      personaIds: [],                   // who appears in this shot
      broken: false,
      description: '',
      image: null,                      // {data,w,h}
      annotation: null,                 // transparent PNG dataURL
      comments: [],
      prompts: {}                       // modelName -> {imagePrompt, videoPrompt}
    };
  }

  function newScene(heading) {
    return { id: SB.uid('sc'), heading: heading || 'New scene', description: '', shots: [] };
  }

  function firstOfKind(models, kind) {
    const m = models.filter(function (x) { return x.kind === kind; })[0] || models[0];
    return m ? m.id : null;
  }

  function newProject() {
    const p = {
      fileVersion: FILE_VERSION,
      id: SB.uid('prj'),
      name: 'Untitled project',
      createdAt: Date.now(),
      updatedAt: Date.now(),
      master: SB.Doc.make(''),
      personas: [],
      scenes: [newScene('Scene one')],
      versionNumber: 1,
      versionName: 'v1',
      versions: [],
      settings: {
        shotTypes: DEFAULT_SHOT_TYPES.slice(),
        models: defaultModels(),
        imageModelId: null,
        videoModelId: null,
        geminiModel: SB.GeminiModels.DEFAULT,
        brand: { enabled: true, custom: false },
        // prompt boxes stay off the cards until the user asks for them
        showImagePrompt: false,
        showVideoPrompt: false
      }
    };
    p.settings.imageModelId = firstOfKind(p.settings.models, 'image');
    p.settings.videoModelId = firstOfKind(p.settings.models, 'video');
    p.scenes[0].shots.push(newShot({ type: DEFAULT_SHOT_TYPES[0] }));
    return p;
  }

  /* Fill in anything an older/hand-edited file is missing. */
  function migrate(p) {
    if (!p || typeof p !== 'object') throw new Error('not a Storyboarder project');
    p.fileVersion = FILE_VERSION;
    p.id = p.id || SB.uid('prj');
    p.name = p.name || 'Untitled project';
    p.createdAt = p.createdAt || Date.now();
    p.master = p.master && typeof p.master.text === 'string' ? p.master : SB.Doc.make('');
    p.master.marks = p.master.marks || { b: [], i: [], u: [] };
    ['b', 'i', 'u'].forEach(function (t) { p.master.marks[t] = p.master.marks[t] || []; });
    p.personas = Array.isArray(p.personas) ? p.personas : [];
    p.personas.forEach(function (x) {
      x.id = x.id || SB.uid('per');
      x.name = x.name || 'Persona';
      x.description = x.description || '';
      x.imagePrompt = x.imagePrompt || '';
    });
    p.scenes = Array.isArray(p.scenes) ? p.scenes : [];
    if (!p.scenes.length) p.scenes.push(newScene('Scene one'));
    p.versionNumber = p.versionNumber || 1;
    p.versionName = p.versionName || ('v' + p.versionNumber);
    p.versions = Array.isArray(p.versions) ? p.versions : [];
    const s = p.settings = p.settings || {};
    s.shotTypes = (s.shotTypes && s.shotTypes.length) ? s.shotTypes : DEFAULT_SHOT_TYPES.slice();
    s.models = (s.models && s.models.length) ? s.models : defaultModels();
    s.models.forEach(function (m) {
      m.id = m.id || SB.uid('m');
      m.kind = m.kind || 'video';
      m.imageTemplate = m.imageTemplate || IMG_TPL;
      m.videoTemplate = m.videoTemplate || VID_TPL;
      if (typeof m.referenceTemplate !== 'string') {
        m.referenceTemplate = SB.Personas.DEFAULT_REF_TEMPLATE;
      }
    });
    const has = function (id) { return s.models.some(function (m) { return m.id === id; }); };
    // older files carried a single activeModelId
    if (s.activeModelId && has(s.activeModelId)) {
      const old = s.models.filter(function (m) { return m.id === s.activeModelId; })[0];
      if (old.kind === 'image' && !s.imageModelId) s.imageModelId = old.id;
      if (old.kind === 'video' && !s.videoModelId) s.videoModelId = old.id;
    }
    delete s.activeModelId;
    if (!has(s.imageModelId)) s.imageModelId = firstOfKind(s.models, 'image');
    if (!has(s.videoModelId)) s.videoModelId = firstOfKind(s.models, 'video');
    // Google retires ids; move a project off anything that is gone
    s.geminiModel = SB.GeminiModels.normalize(s.geminiModel);
    s.brand = (s.brand && typeof s.brand === 'object') ? s.brand : {};
    if (typeof s.brand.enabled !== 'boolean') s.brand.enabled = true;
    // only a hand-edited house style is stored; the rest follow the app's
    if (typeof s.brand.custom !== 'boolean') s.brand.custom = false;
    if (!s.brand.custom) delete s.brand.text;
    if (typeof s.showImagePrompt !== 'boolean') s.showImagePrompt = false;
    if (typeof s.showVideoPrompt !== 'boolean') s.showVideoPrompt = false;

    p.scenes.forEach(function (sc) {
      sc.id = sc.id || SB.uid('sc');
      sc.heading = sc.heading || '';
      sc.description = sc.description || '';
      sc.shots = Array.isArray(sc.shots) ? sc.shots : [];
      sc.shots.forEach(function (sh) {
        sh.id = sh.id || SB.uid('sh');
        sh.type = sh.type || '';
        sh.noShot = !!sh.noShot;
        sh.color = sh.color || CARD_COLORS[0];
        sh.link = sh.link && typeof sh.link.from === 'number' ? sh.link : null;
        if (!sh.link) {
          sh.local = sh.local && typeof sh.local.text === 'string' ? sh.local : SB.Doc.make('');
          sh.local.marks = sh.local.marks || { b: [], i: [], u: [] };
          ['b', 'i', 'u'].forEach(function (t) { sh.local.marks[t] = sh.local.marks[t] || []; });
        } else {
          sh.link.from = SB.clamp(sh.link.from, 0, p.master.text.length);
          sh.link.to = SB.clamp(sh.link.to, sh.link.from, p.master.text.length);
        }
        sh.broken = !!sh.broken;
        sh.description = sh.description || '';
        sh.comments = Array.isArray(sh.comments) ? sh.comments : [];
        sh.prompts = sh.prompts || {};
        sh.personaIds = Array.isArray(sh.personaIds) ? sh.personaIds : [];
      });
    });
    return p;
  }

  /* ---------- lookup / numbering ---------- */

  function eachShot(p, fn) {
    for (let i = 0; i < p.scenes.length; i++) {
      const sc = p.scenes[i];
      for (let j = 0; j < sc.shots.length; j++) fn(sc.shots[j], sc, i, j);
    }
  }

  function code(sceneIdx, shotIdx) { return (sceneIdx + 1) + SB.letters(shotIdx); }

  function findShot(p, id) {
    let res = null;
    eachShot(p, function (sh, sc, i, j) {
      if (sh.id === id) res = { shot: sh, scene: sc, sceneIdx: i, shotIdx: j, code: code(i, j) };
    });
    return res;
  }

  function findScene(p, id) {
    for (let i = 0; i < p.scenes.length; i++) if (p.scenes[i].id === id) return { scene: p.scenes[i], idx: i };
    return null;
  }

  /* ---------- the shared-script window ---------- */

  /* What document + slice does this shot's script box show? */
  function windowFor(p, shot) {
    if (shot.link) return { doc: p.master, from: shot.link.from, to: shot.link.to, linked: true };
    return { doc: shot.local, from: 0, to: shot.local.text.length, linked: false };
  }

  /* The one place master-script text changes.
   * sourceShotId = the shot whose box the user typed in (null = typed in master).
   */
  function applyMasterEdit(p, start, end, text, sourceShotId) {
    if (SB.History) SB.History.push('master:' + (sourceShotId || ''));
    const op = { start: start, end: end, len: (text || '').length };
    const links = [];
    eachShot(p, function (sh) { if (sh.link) links.push(sh); });

    links.forEach(function (sh) {
      let fromLeft, toLeft;
      if (sh.id === sourceShotId) {
        // the shot being typed in grows at both edges
        fromLeft = true; toLeft = false;
      } else if (!sourceShotId) {
        // typed in master: text at a shot's end boundary extends that shot
        fromLeft = false; toLeft = false;
      } else {
        // another shot's edit: only interior insertions grow this one
        fromLeft = false; toLeft = true;
      }
      const nf = SB.Doc.mapPos(sh.link.from, start, end, op.len, fromLeft);
      const nt = SB.Doc.mapPos(sh.link.to, start, end, op.len, toLeft);
      sh.link.from = Math.min(nf, nt);
      sh.link.to = Math.max(nf, nt);
      if (sh.link.to <= sh.link.from) sh.broken = true;
      else if (sh.broken && sh.link.to > sh.link.from) sh.broken = false;
    });

    SB.Doc.replace(p.master, start, end, text);
    p.updatedAt = Date.now();
    return op;
  }

  /* Edit routed from a shot's own script box (local coords). */
  function applyShotEdit(p, shot, lStart, lEnd, text) {
    if (shot.link) {
      return applyMasterEdit(p, shot.link.from + lStart, shot.link.from + lEnd, text, shot.id);
    }
    if (SB.History) SB.History.push('local:' + shot.id);
    SB.Doc.replace(shot.local, lStart, lEnd, text);
    p.updatedAt = Date.now();
    return { start: lStart, end: lEnd, len: (text || '').length };
  }

  function breakLink(p, shot) {
    if (!shot.link) return;
    if (SB.History) { SB.History.seal(); SB.History.push('break:' + shot.id); SB.History.seal(); }
    const w = windowFor(p, shot);
    shot.local = {
      text: p.master.text.slice(w.from, w.to),
      marks: SB.Doc.sliceMarks(p.master, w.from, w.to)
    };
    shot.link = null;
    shot.broken = false;
    p.updatedAt = Date.now();
  }

  /* how many shots cover each master character (for the highlight underlay) */
  function coverage(p) {
    const n = p.master.text.length;
    const d = new Uint8Array(n);
    eachShot(p, function (sh) {
      if (!sh.link) return;
      for (let i = sh.link.from; i < sh.link.to && i < n; i++) if (d[i] < 250) d[i]++;
    });
    return d;
  }

  /* ---------- structure ---------- */

  function addScene(p, afterIdx) {
    const sc = newScene('Scene ' + (p.scenes.length + 1));
    if (typeof afterIdx === 'number') p.scenes.splice(afterIdx + 1, 0, sc);
    else p.scenes.push(sc);
    p.updatedAt = Date.now();
    return sc;
  }

  function deleteScene(p, sceneId) {
    const f = findScene(p, sceneId);
    if (!f) return;
    p.scenes.splice(f.idx, 1);
    if (!p.scenes.length) p.scenes.push(newScene('Scene one'));
    p.updatedAt = Date.now();
  }

  function addShot(p, sceneId, opts, atIdx) {
    const f = findScene(p, sceneId);
    if (!f) return null;
    const sh = newShot(Object.assign({ type: p.settings.shotTypes[0] || '' }, opts || {}));
    if (typeof atIdx === 'number') f.scene.shots.splice(atIdx, 0, sh);
    else f.scene.shots.push(sh);
    p.updatedAt = Date.now();
    return sh;
  }

  /* Deleting a shot leaves its text in the master script (resolved decision #2). */
  function deleteShot(p, shotId) {
    const f = findShot(p, shotId);
    if (!f) return;
    f.scene.shots.splice(f.shotIdx, 1);
    p.updatedAt = Date.now();
  }

  function moveShot(p, shotId, toSceneId, toIdx) {
    const f = findShot(p, shotId);
    const t = findScene(p, toSceneId);
    if (!f || !t) return;
    f.scene.shots.splice(f.shotIdx, 1);
    if (f.scene === t.scene && toIdx > f.shotIdx) toIdx--;
    toIdx = SB.clamp(toIdx, 0, t.scene.shots.length);
    t.scene.shots.splice(toIdx, 0, f.shot);
    p.updatedAt = Date.now();
  }

  function moveScene(p, sceneId, toIdx) {
    const f = findScene(p, sceneId);
    if (!f) return;
    p.scenes.splice(f.idx, 1);
    if (toIdx > f.idx) toIdx--;
    p.scenes.splice(SB.clamp(toIdx, 0, p.scenes.length), 0, f.scene);
    p.updatedAt = Date.now();
  }

  function modelById(p, id) {
    return p.settings.models.filter(function (m) { return m.id === id; })[0] || null;
  }
  function imageModel(p) { return modelById(p, p.settings.imageModelId); }
  function videoModel(p) { return modelById(p, p.settings.videoModelId); }

  SB.Model = {
    FILE_VERSION: FILE_VERSION,
    CARD_COLORS: CARD_COLORS,
    DEFAULT_SHOT_TYPES: DEFAULT_SHOT_TYPES,
    IMG_TPL: IMG_TPL, VID_TPL: VID_TPL,
    newProject: newProject, migrate: migrate, newShot: newShot, newScene: newScene,
    defaultModels: defaultModels,
    eachShot: eachShot, code: code, findShot: findShot, findScene: findScene,
    windowFor: windowFor, applyMasterEdit: applyMasterEdit, applyShotEdit: applyShotEdit,
    breakLink: breakLink, coverage: coverage,
    addScene: addScene, deleteScene: deleteScene, addShot: addShot, deleteShot: deleteShot,
    moveShot: moveShot, moveScene: moveScene,
    modelById: modelById, imageModel: imageModel, videoModel: videoModel, firstOfKind: firstOfKind
  };

})(window.SB);

</script>
<script>
/* ===== js/store.js ===== */
/* store.js — File System Access persistence + local (non-project) secrets.
 *
 * The project lives in one .storyboard JSON file the user picks once; after
 * that every change is written back to the same handle, debounced. The Gemini
 * API key NEVER goes in that file — it lives in localStorage only.
 */
(function (SB) {
  'use strict';

  const KEY_API = 'sb.geminiApiKey';
  const IDB_NAME = 'storyboarder';
  const IDB_STORE = 'handles';

  const S = {
    handle: null,
    fileName: null,
    dirty: false,
    writing: false,
    lastSaved: 0,
    onState: null,
    getProject: null,  // set by app: () => project
    /* what this session has actually pushed to disk — the numbers a backend
     * would have to carry */
    stats: { writes: 0, bytes: 0, since: Date.now(), lastBytes: 0 }
  };

  const hasFS = typeof window.showSaveFilePicker === 'function';

  function state(txt, cls) {
    if (S.onState) S.onState(txt, cls);
  }

  /* ---------- IndexedDB (remember the last file handle) ---------- */

  /* Remembering the handle is a convenience, never a precondition for saving.
   * IndexedDB is restricted on file:// (which is how this app is normally
   * opened), and a request that neither succeeds nor errors must not be able
   * to wedge anything, so every call is time-boxed. */
  function idb() {
    return new Promise(function (resolve, reject) {
      let done = false;
      const fail = function (why) { if (!done) { done = true; reject(new Error(why)); } };
      setTimeout(function () { fail('indexeddb timeout'); }, 2000);
      let r;
      try { r = indexedDB.open(IDB_NAME, 1); }
      catch (e) { fail('indexeddb unavailable'); return; }
      r.onupgradeneeded = function () {
        if (!r.result.objectStoreNames.contains(IDB_STORE)) r.result.createObjectStore(IDB_STORE);
      };
      r.onsuccess = function () { if (!done) { done = true; resolve(r.result); } };
      r.onerror = function () { fail('indexeddb error'); };
      r.onblocked = function () { fail('indexeddb blocked'); };
    });
  }

  function idbPut(k, v) {
    return idb().then(function (db) {
      return new Promise(function (res, rej) {
        const tx = db.transaction(IDB_STORE, 'readwrite');
        tx.objectStore(IDB_STORE).put(v, k);
        tx.oncomplete = function () { res(); };
        tx.onerror = function () { rej(tx.error); };
      });
    }).catch(function () { });
  }

  function idbGet(k) {
    return idb().then(function (db) {
      return new Promise(function (res) {
        const tx = db.transaction(IDB_STORE, 'readonly');
        const rq = tx.objectStore(IDB_STORE).get(k);
        rq.onsuccess = function () { res(rq.result || null); };
        rq.onerror = function () { res(null); };
      });
    }).catch(function () { return null; });
  }

  /* ---------- permissions ---------- */

  function ensurePermission(handle, interactive) {
    if (!handle || !handle.queryPermission) return Promise.resolve(true);
    return handle.queryPermission({ mode: 'readwrite' }).then(function (p) {
      if (p === 'granted') return true;
      if (!interactive) return false;
      return handle.requestPermission({ mode: 'readwrite' }).then(function (q) { return q === 'granted'; });
    });
  }

  /* ---------- write ---------- */

  function serialize(project) {
    // Belt and braces: the API key must never reach the file.
    const copy = SB.clone(project);
    if (copy.settings) delete copy.settings.geminiApiKey;
    copy.updatedAt = Date.now();
    return JSON.stringify(copy);
  }

  function writeNow() {
    const project = S.getProject && S.getProject();
    if (!project) return Promise.resolve();
    if (!S.handle) { state('no file', 'dirty'); return Promise.resolve(); }
    if (S.writing) { S.pending = true; return Promise.resolve(); }

    /* Serialising can throw (and once did leave the writing flag stuck on,
     * killing autosave for the rest of the session in silence). */
    let text;
    try {
      text = serialize(project);
    } catch (e) {
      console.error('[storyboarder] could not serialise the project', e);
      saveFailed('the project could not be encoded', e);
      return Promise.resolve();
    }
    if (!text || text.length < 2) {          // never write nothing over a board
      saveFailed('refused to write an empty project', new Error('empty serialisation'));
      return Promise.resolve();
    }

    S.writing = true;
    state('saving…', 'dirty');

    return ensurePermission(S.handle, false).then(function (ok) {
      if (!ok) { state('permission needed', 'dirty'); throw new Error('permission'); }
      /* keepExistingData means the swap file starts as a copy of the board, so
       * a write that fails part-way can never leave a 0-byte project file. */
      return S.handle.createWritable({ keepExistingData: true });
    }).then(function (w) {
      return Promise.resolve(w.write({ type: 'write', position: 0, data: text }))
        .then(function () {
          return w.truncate ? w.truncate(text.length) : null;
        })
        .then(function () { return w.close(); })
        .catch(function (e) {
          // leave the original alone rather than committing a half write
          if (w.abort) { try { w.abort(); } catch (x) { } }
          throw e;
        });
    }).then(function () {
      S.writing = false;
      S.dirty = false;
      S.lastSaved = Date.now();
