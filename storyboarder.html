    saveFeed: saveFeed,
    setImage: setImage,
    swap: doSwap,
    armSwap: armSwap,
    swapArmed: function () { return B.swapFrom || null; },
    select: selectShot,
    selection: selection,
    clearSelection: clearSelection,
    DND_SHOT: DND_SHOT
  };

})(window.SB);

</script>
<script>
/* ===== js/scriptmode.js ===== */
/* scriptmode.js — the master script panel: live editing, capture, highlights. */
(function (SB) {
  'use strict';

  let masterEl, editor, capBtn, form, panel;
  let noteBtn, noteForm, noteListEl;
  let cover = null;          // Uint8Array shot coverage over master text
  let scov = null;           // Uint8Array scene coverage — the loose layer
  let notes = null;          // Uint8Array comment coverage
  let sceneRange = null;     // selected scene's claim, drawn brighter
  let activeRange = null;    // selected shot's range, drawn with an underline
  let activeNote = null;     // the note being looked at
  let pendingSel = null;     // range captured when the user clicked "Capture shot"
  let lastSel = null;        // last real selection made in the master script

  function P() { return SB.app.project; }

  function init() {
    panel = document.getElementById('scriptPanel');
    masterEl = document.getElementById('masterScript');
    capBtn = document.getElementById('btnCapture');
    form = document.getElementById('captureForm');
    noteBtn = document.getElementById('btnScriptNote');
    noteForm = document.getElementById('noteForm');
    noteListEl = document.getElementById('noteList');

    noteBtn.addEventListener('mousedown', function (ev) { ev.preventDefault(); });
    noteBtn.addEventListener('click', function () {
      const live = SB.Editor.getSel(masterEl);
      const s = (live && live.end > live.start) ? { from: live.start, to: live.end } : lastSel;
      if (!s || s.to <= s.from) {
        SB.toast('Select the part of the script you want to comment on', true);
        return;
      }
      showNoteForm(s);
    });

    /* clicking a commented phrase in the script opens that note */
    masterEl.addEventListener('click', function (ev) {
      if (!SB.app.commentMode) return;
      const sel = SB.Editor.getSel(masterEl);
      if (!sel || sel.end !== sel.start) return;
      const hit = SB.Model.scriptComments(P()).filter(function (c) {
        return !c.broken && sel.start >= c.from && sel.start < c.to;
      })[0];
      if (hit) selectNote(hit.id);
    });

    editor = SB.Editor.attach(masterEl, {
      get: function () {
        const p = P();
        return p ? { doc: p.master, from: 0, to: p.master.text.length } : null;
      },
      edit: function (s, e, t) { SB.Model.applyMasterEdit(P(), s, e, t, null); },
      toggle: function (type, s, e) { SB.Doc.toggleMark(P().master, type, s, e); },
      after: function () { SB.app.scriptChanged(); },
      extra: extraClass
    });

    /* Remember the last real selection made in the master. Chrome drops the
     * DOM selection the moment focus moves, so without latching it the button
     * stayed lit after you clicked a card and then Capture did nothing. */
    document.addEventListener('selectionchange', function () {
      if (document.activeElement !== masterEl) return;
      const s = SB.Editor.getSel(masterEl);
      lastSel = (s && s.end > s.start) ? { from: s.start, to: s.end } : null;
      syncCaptureBtn();
    });

    /* don't let the button steal focus — keeps the selection visible too */
    capBtn.addEventListener('mousedown', function (ev) { ev.preventDefault(); });

    capBtn.addEventListener('click', function () {
      const live = SB.Editor.getSel(masterEl);
      const s = (live && live.end > live.start) ? { from: live.start, to: live.end } : lastSel;
      if (!s || s.to <= s.from) {
        SB.toast('Select some script text first', true);
        syncCaptureBtn();
        return;
      }
      pendingSel = { from: s.from, to: s.to };
      showForm();
    });

    /* clicking a dead part of the panel should land you in the script */
    panel.addEventListener('mousedown', function (ev) {
      if (ev.target === panel || ev.target.classList.contains('script-hint')) {
        ev.preventDefault();
        masterEl.focus();
      }
    });
  }

  function syncCaptureBtn() {
    if (!capBtn) return;
    const ok = !!(lastSel && lastSel.to > lastSel.from &&
      lastSel.to <= (P() ? P().master.text.length : 0));
    capBtn.disabled = !ok;
    capBtn.title = ok
      ? 'Make a shot from the selected text, or tie it to a scene'
      : 'Select some text in the script first';
    if (noteBtn) {
      noteBtn.classList.toggle('hidden', !SB.app.commentMode);
      noteBtn.disabled = !ok;
      noteBtn.title = ok
        ? 'Comment on the selected text'
        : 'Select some text in the script first';
    }
  }

  /* Any edit moves the text under a remembered selection — drop it. */
  function invalidateSelection() {
    if (document.activeElement === masterEl) return;   // still live, selectionchange owns it
    lastSel = null;
    syncCaptureBtn();
  }

  /* Shots are a background wash, scenes are a rule above the line, notes are an
   * underline — so a phrase that is all three still reads as all three. */
  function extraClass(i) {
    let c = '';
    if (cover && i < cover.length && cover[i] > 0) c = 'h' + Math.min(3, cover[i]);
    if (scov && i < scov.length && scov[i] > 0) {
      const on = sceneRange && i >= sceneRange.from && i < sceneRange.to;
      c += (c ? ' ' : '') + (on ? 'scov scov-on' : 'scov');
    }
    if (activeRange && i >= activeRange.from && i < activeRange.to) c += (c ? ' ' : '') + 'hactive';
    if (notes && i < notes.length && notes[i] > 0) c += (c ? ' ' : '') + 'cmt';
    if (activeNote && i >= activeNote.from && i < activeNote.to) c += (c ? ' ' : '') + 'cmt-on';
    return c;
  }

  function refresh() {
    if (!masterEl || !P()) return;
    cover = SB.Model.coverage(P());
    scov = SB.Model.sceneCoverage(P());
    notes = SB.Model.commentCoverage(P());
    sceneRange = null;
    if (SB.app.selectedSceneId) {
      const fs = SB.Model.findScene(P(), SB.app.selectedSceneId);
      if (fs && fs.scene.link && !fs.scene.broken) {
        sceneRange = { from: fs.scene.link.from, to: fs.scene.link.to };
      }
    }
    activeRange = null;
    if (SB.app.selectedShotId) {
      const f = SB.Model.findShot(P(), SB.app.selectedShotId);
      if (f && f.shot.link) activeRange = { from: f.shot.link.from, to: f.shot.link.to };
    }
    if (activeNote) {
      activeNote = SB.Model.scriptComments(P()).filter(function (c) {
        return c.id === activeNote.id;
      })[0] || null;
    }
    editor.render();
    renderNotes();
    syncCoverage();
    syncCaptureBtn();
  }

  /* "Have I covered it all yet?" answered rather than counted by eye. */
  function syncCoverage() {
    const el = document.getElementById('scriptCoverage');
    if (!el) return;
    const share = SB.Model.sceneCoverageShare(P());
    el.textContent = P().master.text.length
      ? 'Scenes claim ' + Math.round(share * 100) + '% of the script.'
      : '';
  }

  function open() {
    panel.classList.remove('hidden');
    document.getElementById('btnScript').classList.add('on');
    refresh();
  }
  function close() {
    panel.classList.add('hidden');
    document.getElementById('btnScript').classList.remove('on');
  }
  function toggle() { panel.classList.contains('hidden') ? open() : close(); }
  function isOpen() { return !panel.classList.contains('hidden'); }

  function scrollTo(shot) {
    const el = masterEl.querySelector('.hactive');
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function scrollToScene() {
    refresh();
    const el = masterEl.querySelector('.scov-on');
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  /* ---------- capture form ---------- */

  function showForm() {
    const p = P();
    const text = p.master.text.slice(pendingSel.from, pendingSel.to);
    const sceneId = SB.app.selectedSceneId || (p.scenes[p.scenes.length - 1] || {}).id;

    form.innerHTML = '';
    form.classList.remove('hidden');

    const prev = SB.el('div', 'preview', text);
    form.appendChild(prev);

    /* A selection can become a shot — a picture on a fragment — or a scene's
     * claim on a whole section, which is the looser, earlier way in: you know
     * roughly where this stretch belongs long before you know the shots. */
    let mode = 'shot';
    const r0 = SB.el('div', 'row cap-mode');
    r0.appendChild(SB.el('label', null, 'Make'));
    const bShot = SB.el('button', 'mini on', 'a shot');
    bShot.dataset.mode = 'shot';
    bShot.title = 'A card anchored to exactly this text';
    const bScene = SB.el('button', 'mini', 'a scene section');
    bScene.dataset.mode = 'scene';
    bScene.title = 'Mark this stretch as covered by a scene — independent of any shots in it';
    [bShot, bScene].forEach(function (b) {
      b.onclick = function () {
        mode = b.dataset.mode;
        bShot.classList.toggle('on', mode === 'shot');
        bScene.classList.toggle('on', mode === 'scene');
        applyMode();
      };
      r0.appendChild(b);
    });
    form.appendChild(r0);

    const r1 = SB.el('div', 'row row-type');
    r1.appendChild(SB.el('label', null, 'Shot type'));
    const tsel = document.createElement('select');
    p.settings.shotTypes.forEach(function (t) {
      const o = document.createElement('option'); o.value = t; o.textContent = t; tsel.appendChild(o);
    });
    r1.appendChild(tsel);
    form.appendChild(r1);

    const r2 = SB.el('div', 'row');
    r2.appendChild(SB.el('label', null, 'Scene'));
    const ssel = document.createElement('select');
    p.scenes.forEach(function (sc, i) {
      const o = document.createElement('option');
      o.value = sc.id;
      o.textContent = (i + 1) + '. ' + (sc.heading || 'untitled');
      if (sc.id === sceneId) o.selected = true;
      ssel.appendChild(o);
    });
    r2.appendChild(ssel);
    form.appendChild(r2);

    const r3 = SB.el('div', 'row row-noshot');
    const nsLbl = SB.el('label', null, '');
    nsLbl.style.minWidth = '0';
    const ns = document.createElement('input');
    ns.type = 'checkbox';
    nsLbl.appendChild(ns);
    nsLbl.appendChild(document.createTextNode(' no shot / no storyboard'));
    r3.appendChild(nsLbl);
    form.appendChild(r3);

    const note = SB.el('div', 'cap-note hidden');
    form.appendChild(note);

    const r4 = SB.el('div', 'row');
    r4.appendChild(SB.el('span', 'spacer'));
    const cancel = SB.el('button', 'mini', 'Cancel');
    cancel.dataset.act = 'cancel';
    cancel.onclick = hideForm;
    const extend = SB.el('button', 'mini hidden', 'Widen');
    extend.dataset.act = 'widen';
    extend.title = 'Keep what this scene already claims and stretch it to cover both';
    const done = SB.el('button', 'mini primary', 'Complete');
    done.dataset.act = 'complete';

    /* What the chosen scene is holding right now decides what the buttons can
     * honestly offer. */
    function chosenScene() {
      const f = SB.Model.findScene(P(), ssel.value);
      return f ? f.scene : null;
    }

    function applyMode() {
      const scene = mode === 'scene';
      r1.classList.toggle('hidden', scene);
      r3.classList.toggle('hidden', scene);
      const sc = scene ? chosenScene() : null;
      const linked = !!(sc && sc.link && !sc.broken);
      extend.classList.toggle('hidden', !linked);
      done.textContent = !scene ? 'Complete' : (linked ? 'Replace' : 'Tie to scene');
      note.classList.toggle('hidden', !scene || !sc || !(linked || sc.local));
      if (!scene || !sc) return;
      if (linked) {
        const gap = pendingSel.from > sc.link.to ? pendingSel.from - sc.link.to
          : (sc.link.from > pendingSel.to ? sc.link.from - pendingSel.to : 0);
        note.textContent = 'This scene already claims ' + (sc.link.to - sc.link.from) +
          ' characters. Widen keeps both' +
          (gap ? ', and takes in the ' + gap + ' characters between them' : '') +
          '; Replace swaps in the selection.';
      } else if (sc.local) {
        note.textContent = 'This scene’s script was unlinked from the master. Tying it here ' +
          'replaces ' + sc.local.text.length + ' characters of its own text.';
      }
    }
    ssel.onchange = applyMode;

    function tie(widen) {
      const sc = chosenScene();
      if (sc && !sc.link && sc.local && (sc.local.text || '').trim() &&
        !confirm('Replace this scene’s own script text with the selection?')) return;
      const tied = SB.Model.tieScene(P(), ssel.value, pendingSel.from, pendingSel.to, widen);
      hideForm();
      if (!tied) return;
      SB.app.selectedSceneId = tied.id;
      SB.app.changed(true);
      refresh();
      const el = document.querySelector('.scene-block[data-scene="' + tied.id + '"]');
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      SB.toast('Scene claims ' + (tied.link.to - tied.link.from) + ' characters of script');
    }
    extend.onclick = function () { tie(true); };

    done.onclick = function () {
      if (mode === 'scene') { tie(false); return; }
      const sh = SB.Model.addShot(P(), ssel.value, {
        type: tsel.value,
        noShot: ns.checked,
        link: { from: pendingSel.from, to: pendingSel.to }
      });
      hideForm();
      if (sh) {
        SB.app.selectedShotId = sh.id;
        SB.app.changed(true);
        /* changed() rebuilds the board but not the master editor, so without
         * this the new wash does not show until the next script edit. */
        refresh();
        const el = document.querySelector('.card[data-shot="' + sh.id + '"]');
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    };
    r4.appendChild(cancel); r4.appendChild(extend); r4.appendChild(done);
    form.appendChild(r4);
    applyMode();

    tsel.focus();
  }

  /* ---------- notes on the script ---------- */

  function showNoteForm(range) {
    const p = P();
    noteForm.innerHTML = '';
    noteForm.classList.remove('hidden');

    noteForm.appendChild(SB.el('div', 'preview', p.master.text.slice(range.from, range.to)));

    const ta = document.createElement('textarea');
    ta.className = 'note-input';
    ta.rows = 3;
    ta.placeholder = 'What needs saying about this line?';
    noteForm.appendChild(ta);

    const row = SB.el('div', 'row');
    row.appendChild(SB.el('span', 'spacer'));
    const cancel = SB.el('button', 'mini', 'Cancel');
    cancel.onclick = hideNoteForm;
    const add = SB.el('button', 'mini primary', 'Add comment');
    function submit() {
      const txt = ta.value.trim();
      if (!txt) { ta.focus(); return; }
      const c = SB.Model.addScriptComment(P(), range.from, range.to, txt);
      hideNoteForm();
      lastSel = null;
      if (c) {
        activeNote = c;
        SB.app.changed(false);
        refresh();
        SB.toast('Comment added to the script');
      }
    }
    add.onclick = submit;
    ta.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); submit(); }
      if (e.key === 'Escape') { e.preventDefault(); hideNoteForm(); }
    });
    row.appendChild(cancel);
    row.appendChild(add);
    noteForm.appendChild(row);
    ta.focus();
  }

  function hideNoteForm() {
    noteForm.classList.add('hidden');
    noteForm.innerHTML = '';
    syncCaptureBtn();
  }

  function selectNote(id) {
    const c = SB.Model.scriptComments(P()).filter(function (x) { return x.id === id; })[0];
    activeNote = c || null;
    refresh();
    const row = noteListEl.querySelector('.note[data-id="' + id + '"]');
    if (row) row.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    const span = masterEl.querySelector('.cmt-on');
    if (span) span.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function renderNotes() {
    if (!noteListEl) return;
    const list = SB.Model.scriptComments(P());
    const show = SB.app.commentMode || list.length > 0;
    noteListEl.classList.toggle('hidden', !show);
    if (!show) { noteListEl.innerHTML = ''; return; }

    noteListEl.innerHTML = '';
    const head = SB.el('div', 'note-head');
    head.appendChild(SB.el('span', null, 'Script comments' + (list.length ? ' (' + list.length + ')' : '')));
    noteListEl.appendChild(head);

    if (!list.length) {
      noteListEl.appendChild(SB.el('div', 'note-empty',
        'Select any part of the script and press + Comment.'));
      return;
    }

    list.forEach(function (c) {
      const row = SB.el('div', 'note' +
        (activeNote && activeNote.id === c.id ? ' on' : '') + (c.broken ? ' broken' : ''));
      row.dataset.id = c.id;

      const quote = SB.el('div', 'note-quote',
        c.broken ? '“' + c.quote + '” — this text is gone from the script'
          : '“' + P().master.text.slice(c.from, c.to) + '”');
      row.appendChild(quote);
      row.appendChild(SB.el('div', 'note-text', c.text));

      const foot = SB.el('div', 'note-foot');
      foot.appendChild(SB.el('span', 'note-when', SB.fmtDate(c.at)));
      const del = SB.el('button', 'mini danger', '✕');
      del.title = 'Delete this comment';
      del.onclick = function (ev) {
        ev.stopPropagation();
        SB.Model.deleteScriptComment(P(), c.id);
        if (activeNote && activeNote.id === c.id) activeNote = null;
        SB.app.changed(false);
        refresh();
      };
      foot.appendChild(del);
      row.appendChild(foot);

      row.onclick = function () { selectNote(c.id); };
      noteListEl.appendChild(row);
    });
  }

  function hideForm() {
    form.classList.add('hidden');
    form.innerHTML = '';
    pendingSel = null;
    lastSel = null;
    syncCaptureBtn();
  }

  SB.ScriptMode = {
    init: init, refresh: refresh, open: open, close: close, toggle: toggle,
    isOpen: isOpen, scrollTo: scrollTo, scrollToScene: scrollToScene,
    invalidateSelection: invalidateSelection, syncCaptureBtn: syncCaptureBtn,
    lastSelection: function () { return lastSel; },
    selectNote: selectNote, showNoteForm: showNoteForm
  };

})(window.SB);

</script>
<script>
/* ===== js/comments.js ===== */
/* comments.js — comment mode: per-shot comment list + transparent-PNG ink layer.
 * Comments and ink belong to the CURRENT version and are frozen into a version
 * when a new one is created (see versions.js).
 */
(function (SB) {
  'use strict';

  function P() { return SB.app.project; }

  function list(sh) {
    const wrap = SB.el('div', 'comments');
    (sh.comments || []).forEach(function (cm) {
      const row = SB.el('div', 'comment');
      row.appendChild(SB.el('span', 'when', new Date(cm.at).toLocaleDateString(undefined,
        { month: 'short', day: 'numeric' })));
      row.appendChild(SB.el('span', 'txt', cm.text));
      const d = SB.el('button', 'del', '✕');
      d.onclick = function () {
        sh.comments = sh.comments.filter(function (x) { return x.id !== cm.id; });
        SB.app.changed(true);
      };
      row.appendChild(d);
      wrap.appendChild(row);
    });

    if (SB.app.commentMode) {
      const add = SB.el('div', 'comment-add');
      const inp = document.createElement('input');
      inp.placeholder = 'Add a comment…';
      const b = SB.el('button', 'mini primary', 'Add');
      function submit() {
        const t = inp.value.trim();
        if (!t) return;
        sh.comments = sh.comments || [];
        sh.comments.push({ id: SB.uid('cm'), text: t, at: Date.now() });
        inp.value = '';
        SB.app.changed(true);
        /* The board is rebuilt from scratch, so THIS box is already gone — put
         * the caret back in the card's new one, or a second comment costs a
         * click every time. */
        const back = document.querySelector('.card[data-shot="' + sh.id + '"] .comment-add input');
        if (back) back.focus();
      }
      inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); submit(); } });
      b.onclick = submit;
      add.appendChild(inp); add.appendChild(b);
      wrap.appendChild(add);
    }
    return wrap;
  }

  /* ---------- ink ---------- */

  function draw(sh) {
    if (!sh.image) { SB.toast('Load an image first', true); return; }

    const body = SB.el('div');
    const wrap = SB.el('div', 'draw-wrap');
    const img = document.createElement('img');
    img.src = SB.Blobs.src(P(), sh.image);
    const cv = document.createElement('canvas');
    cv.width = sh.image.w; cv.height = sh.image.h;
    wrap.appendChild(img); wrap.appendChild(cv);
    body.appendChild(wrap);

    const tools = SB.el('div', 'draw-tools');
    const COLORS = ['#ff3b30', '#ffd60a', '#32d74b', '#0a84ff', '#ffffff', '#000000'];
    let color = COLORS[0], size = 4, erase = false;
    COLORS.forEach(function (c, i) {
      const sw = SB.el('button', 'sw' + (i === 0 ? ' on' : ''));
      sw.style.background = c;
      sw.onclick = function () {
        color = c; erase = false;
        tools.querySelectorAll('.sw').forEach(function (x) { x.classList.remove('on'); });
        sw.classList.add('on');
        eraseBtn.classList.remove('on');
      };
      tools.appendChild(sw);
    });
    const rng = document.createElement('input');
    rng.type = 'range'; rng.min = 1; rng.max = 20; rng.value = size; rng.style.width = '90px';
    rng.oninput = function () { size = +rng.value; };
    tools.appendChild(rng);
    const eraseBtn = SB.el('button', 'tb', 'Erase');
    eraseBtn.onclick = function () {
      erase = !erase;
      eraseBtn.classList.toggle('on', erase);
    };
    tools.appendChild(eraseBtn);
    const clr = SB.el('button', 'tb', 'Clear');
    clr.onclick = function () { ctx.clearRect(0, 0, cv.width, cv.height); };
    tools.appendChild(clr);
    body.appendChild(tools);

    const ctx = cv.getContext('2d');
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    if (sh.annotation) {
      const prev = new Image();
      prev.onload = function () { ctx.drawImage(prev, 0, 0, cv.width, cv.height); };
      prev.src = SB.Blobs.src(P(), sh.annotation);
    }

    let drawing = false, last = null;
    function pos(ev) {
      const r = cv.getBoundingClientRect();
      return {
        x: (ev.clientX - r.left) * (cv.width / r.width),
        y: (ev.clientY - r.top) * (cv.height / r.height)
      };
    }
    cv.addEventListener('pointerdown', function (ev) {
      cv.setPointerCapture(ev.pointerId);
      drawing = true; last = pos(ev);
      stroke(last, last);
    });
    cv.addEventListener('pointermove', function (ev) {
      if (!drawing) return;
      const p = pos(ev);
      stroke(last, p);
      last = p;
    });
    cv.addEventListener('pointerup', function () { drawing = false; });
    cv.addEventListener('pointerleave', function () { drawing = false; });

    function stroke(a, b) {
      ctx.globalCompositeOperation = erase ? 'destination-out' : 'source-over';
      ctx.strokeStyle = color;
      ctx.lineWidth = erase ? size * 2.5 : size;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
    }

    SB.modal({
      title: 'Draw over frame',
      body: body,
      buttons: [
        { label: 'Cancel' },
        {
          label: 'Save ink', primary: true, onClick: function (close) {
            const data = ctx.getImageData(0, 0, cv.width, cv.height).data;
            let any = false;
            for (let i = 3; i < data.length; i += 4) { if (data[i] !== 0) { any = true; break; } }
            sh.annotation = any
              ? { ref: SB.Blobs.put(P(), cv.toDataURL('image/png')) }
              : null;
            close();
            SB.app.changed(true);
          }
        }
      ]
    });
  }

  SB.Comments = { list: list, draw: draw };

})(window.SB);

</script>
<script>
/* ===== js/prompts.js ===== */
/* prompts.js — the prompt WRITER. The app never generates media.
 *
 * Which model writes them is providers.js's business: Google's Gemini, or a
 * local OpenAI-compatible server. Everything below is the same either way.
 *
 * Two roles, each with its own target model:
 *   image model -> the first-frame prompt      (stored on prompts[imageModel.id].imagePrompt)
 *   video model -> the image-to-video prompt   (stored on prompts[videoModel.id].videoPrompt)
 * Every model a shot has been run against keeps its prompts, forever.
 */
(function (SB) {
  'use strict';

  function P() { return SB.app.project; }

  function fill(tpl, ctx) {
    return String(tpl || '').replace(/\{\{(\w+)\}\}/g, function (m, k) {
      return ctx[k] == null ? '' : String(ctx[k]);
    });
  }

  function contextFor(shot) {
    const f = SB.Model.findShot(P(), shot.id);
    const w = SB.Model.windowFor(P(), shot);
    const ctx = {
      MODEL: '',
      CODE: f ? f.code : '',
      SHOT_TYPE: shot.type || 'unspecified',
      SCENE: f ? (f.scene.heading || '') : '',
      SCENE_DESC: f ? SB.Refs.plain(P(), f.scene.description) : '',
      SCRIPT: w.doc.text.slice(w.from, w.to),
      /* marks resolve to the names they have now — the writer gets prose */
      DESCRIPTION: SB.Refs.plain(P(), shot.description),
      FIELDS: SB.Fields.promptBlock(P(), shot)
    };
    /* the project's own boxes, each usable on its own: {{ART_DIRECTION}} etc. */
    const extra = SB.Fields.placeholders(P(), shot);
    Object.keys(extra).forEach(function (k) { if (!(k in ctx)) ctx[k] = extra[k]; });
    return ctx;
  }

  const PREAMBLE = 'You write prompts for generative media models. Follow the instruction ' +
    'block(s) below exactly. Return the prompts themselves only — no commentary, no markdown fences.\n\n';

  /* A template that never mentions the project's own fields would silently
   * drop them, so anything filled in is appended unless the template already
   * places it itself. */
  function extras(shot, tpl) {
    const block = SB.Fields.promptBlock(P(), shot);
    if (!block) return '';
    if (/\{\{FIELDS\}\}/.test(tpl || '')) return '';
    const placed = SB.Fields.enabled(P()).every(function (f) {
      return !SB.Fields.value(shot, f.id).trim() ||
        new RegExp('\\{\\{' + SB.Fields.placeholder(f) + '\\}\\}').test(tpl || '');
    });
    return placed ? '' : '\n\n' + block;
  }

  function imageBlock(shot, m) {
    const ctx = contextFor(shot); ctx.MODEL = m.name;
    return '=== FIRST-FRAME IMAGE PROMPT — INSTRUCTIONS ===\n' +
      fill(m.imageTemplate, ctx) + extras(shot, m.imageTemplate) + '\n';
  }
  function videoBlock(shot, m) {
    const ctx = contextFor(shot); ctx.MODEL = m.name;
    return '=== IMAGE-TO-VIDEO PROMPT — INSTRUCTIONS ===\n' +
      fill(m.videoTemplate, ctx) + extras(shot, m.videoTemplate) + '\n';
  }

  /* Build the request list for one shot given the selected roles. */
  function jobsFor(shot, im, vm, roles) {
    const jobs = [];
    const wantI = roles.image && im, wantV = roles.video && vm;
    const sys = function (role, model) {
      const parts = [SB.Brand.systemFor(P(), shot, role)];
      const cast = SB.Personas.block(P(), shot, model, role);
      if (cast) parts.push(cast);
      return parts.filter(Boolean).join('\n\n');
    };
    if (wantI && wantV && im.id === vm.id) {
      jobs.push({
        text: PREAMBLE + 'Return JSON with the keys "imagePrompt" and "videoPrompt".\n\n' +
          imageBlock(shot, im) + '\n' + videoBlock(shot, vm),
        keys: ['imagePrompt', 'videoPrompt'],
        system: sys('both', im),
        targets: [{ model: im, field: 'imagePrompt' }, { model: vm, field: 'videoPrompt' }]
      });
      return jobs;
    }
    if (wantI) {
      jobs.push({
        text: PREAMBLE + 'Return JSON with the key "imagePrompt".\n\n' + imageBlock(shot, im),
        keys: ['imagePrompt'],
        system: sys('image', im),
        targets: [{ model: im, field: 'imagePrompt' }]
      });
    }
    if (wantV) {
      jobs.push({
        text: PREAMBLE + 'Return JSON with the key "videoPrompt".\n\n' + videoBlock(shot, vm),
        keys: ['videoPrompt'],
        system: sys('video', vm),
        targets: [{ model: vm, field: 'videoPrompt' }]
      });
    }
    return jobs;
  }

  /* One POST to whichever backend is selected. The provider owns the URL, the
   * headers and the wording of a failure; everything the retry logic below
   * needs (status, raw) is attached the same way for both. */
  function request(prov, mdl, body) {
    return fetch(prov.url(mdl), {
      method: 'POST',
      headers: prov.headers(),
      body: JSON.stringify(body)
    }).catch(function (e) {
      /* fetch rejected: nothing reached the server. Say which wall it hit —
       * for a local server that is never the corporate proxy. */
      if (prov.id === 'ooba') throw SB.Providers.localError(e);
      const kind = SB.netKind(e);
      if (kind) throw SB.netError(kind);
      throw e;
    }).then(function (r) {
      return r.text().then(function (t) {
        if (!r.ok) {
          if (prov.id !== 'ooba' && SB.isInterception(r.status, t)) throw SB.netError('blocked');
          let msg = t;
          try {
            const j = JSON.parse(t);
            msg = (j.error && (j.error.message || j.error)) || j.detail || t;
            if (typeof msg !== 'string') msg = JSON.stringify(msg);
          } catch (e) { }
          const err = prov.error(r.status, msg, mdl);
          err.status = r.status;
          err.raw = msg;
          throw err;
        }
        SB.GeminiModels.bump(SB.Providers.usageKey(prov.id, mdl));
        try { return JSON.parse(t); }
        catch (e) {
          throw new Error('The server answered, but not with JSON.' +
            (prov.id === 'ooba'
              ? ' Check that the address points at an OpenAI-compatible API port.'
              : ''));
        }
      });
    });
  }

  /* Gemma has no JSON mode, and responseMimeType is accepted-then-IGNORED rather
   * than rejected (verified live 2026-08-21), so nothing ever errors -- it just
   * answers with a bulleted plan and prose that can contain no braces at all.
   * Measured over 10 runs on a reproducing prompt: the old "start with { and end
   * with }" hint parsed 5/10; this wording parsed 10/10. Prefilling a model turn
   * with "{" was tried and REJECTED -- it lifts parse rate but makes the API read
   * the turn as a function call, returning MALFORMED_FUNCTION_CALL on ~90% of
   * calls, truncating mid-object and sometimes returning no content.parts at all. */
  const NO_SCHEMA_HINT =
    '\n\nOutput format: a single JSON object and nothing else. No preamble, no plan, no bullet points, no commentary. A ```json fenced block is acceptable. Your entire reply must be the JSON.';

  /* Pull the first balanced {...} out of prose, respecting strings and escapes.
   * The old /\{[\s\S]*\}/ was greedy: in a reply holding two objects it spanned
   * from the first { to the last }, producing invalid JSON. */
  function firstObject(str) {
    const fence = str.match(/```(?:json)?[ \t]*\r?\n?([\s\S]*?)```/i);
    if (fence) str = fence[1];
    let depth = 0, start = -1, inStr = false, esc = false, q = '';
    for (let i = 0; i < str.length; i++) {
      const c = str[i];
      if (inStr) {
        if (esc) esc = false;
        else if (c === '\\') esc = true;
        else if (c === q) inStr = false;
        continue;
      }
      if (c === '"' || c === "'") { inStr = true; q = c; continue; }
      if (c === '{') { if (depth === 0) start = i; depth++; continue; }
      if (c === '}') { depth--; if (depth === 0 && start >= 0) return str.slice(start, i + 1); }
    }
    return null;
  }

  /* One JSON-shaped question to the writer model, wherever it runs. */
  function ask(text, schema, system) {
    const prov = SB.Providers.active();
    if (!prov.ready()) return Promise.reject(new Error(prov.notReady()));
    const mdl = prov.model();

    function build(withSchema) {
      return prov.body(mdl, text, {
        schema: withSchema ? schema : null,
        system: system,
        hint: NO_SCHEMA_HINT
      });
    }

    /* A local server has no JSON mode at all, and neither does Gemma — both
     * get asked in words instead. Any other model that rejects the schema is
     * given the same treatment on retry. */
    const useSchema = prov.supportsSchema && prov.schemaFor(mdl) && !!schema;

    return request(prov, mdl, build(useSchema)).catch(function (e) {
      const schemaProblem = /schema|json|mime|not supported|unsupported|invalid argument/i
        .test(String(e.raw || e.message || ''));
      if (useSchema && e.status === 400 && schemaProblem) {
        return request(prov, mdl, build(false));
      }
      throw e;
    }).then(function (data) {
      const raw = prov.text(data);
      try { return JSON.parse(raw); }
      catch (e) {
        const m = firstObject(raw);
        if (!m) throw new Error('Could not parse the reply from ' + prov.label);
        return JSON.parse(m);
      }
    });
  }

  function callWriter(text, keys, system) {
    const props = {};
    keys.forEach(function (k) { props[k] = { type: 'STRING' }; });
    return ask(text, { type: 'OBJECT', properties: props, required: keys }, system);
  }

  function store(shot, model, field, value) {
    const cur = shot.prompts[model.id] || { imagePrompt: '', videoPrompt: '' };
    cur[field] = value || '';
    cur.modelName = model.name;
    cur.at = Date.now();
    shot.prompts[model.id] = cur;
  }

  /* Write the prompts for ONE shot.
   *
   * There used to be a batch here: a queue, three lanes, a canary first request
   * to prove the network before the rest followed, progress ticks and an
   * aggregate result. All of it existed to write a whole board at once, which
   * turned out to be a fast way to produce text nobody had read — every prompt
   * it wrote was one you then opened and edited anyway. So it is one shot, and
   * at most the two jobs that shot needs.
   *
   * Resolves with what was written. Rejects if nothing could be.
   */
  function generateFor(shot, roles) {
    const p = P();
    const im = SB.Model.imageModel(p), vm = SB.Model.videoModel(p);
    roles = roles || { image: true, video: true };
    if ((!roles.image || !im) && (!roles.video || !vm)) {
      return Promise.reject(new Error('Pick a target model first'));
    }
    /* Checked up front rather than letting the job fail: the reason is what the
     * user needs, not a failure count. */
    const prov = SB.Providers.active();
    if (!prov.ready()) return Promise.reject(new Error(prov.notReady()));

    if (shot.noShot) {
      return Promise.reject(new Error('A \u201cno shot\u201d card is never generated.'));
    }
    if (!(shot.description || '').trim()) {
      return Promise.reject(new Error('Write a description first \u2014 there is nothing to work from.'));
    }

    const jobs = jobsFor(shot, im, vm, roles);
    if (!jobs.length) return Promise.reject(new Error('Nothing to write for this shot.'));

    const written = [];
    let lastError = null;

    /* One after another. Two jobs only happen when the image and the video
     * model differ, and a wall that stops the first would stop the second. */
    function step(i) {
      if (i >= jobs.length) return Promise.resolve();
      if (lastError && SB.netKind(lastError)) return Promise.resolve();
      const j = jobs[i];
      return callWriter(j.text, j.keys, j.system).then(function (res) {
        j.targets.forEach(function (t) {
          store(shot, t.model, t.field, res[t.field]);
          written.push(t.field);
        });
      }).catch(function (e) {
        lastError = e;
        console.error('[storyboarder] prompt failed', e);
      }).then(function () { return step(i + 1); });
    }

    return step(0).then(function () {
      SB.app.changed(true);
      if (!written.length) throw lastError || new Error('Nothing was written');
      return { written: written, error: lastError ? lastError.message : null };
    });
  }

  SB.Prompts = {
    generateFor: generateFor,
    jobsFor: jobsFor, fill: fill, raw: ask
  };

})(window.SB);

</script>
<script>
/* ===== js/coverage.js ===== */
/* coverage.js — turn a scene description into a short run of shots.
 *
 * Two scene-level calls to the writer model, both single-shot:
 *   generate() — the description becomes 2-3 consecutive beats of one moment
 *   rewrite()  — a rough description becomes a shootable one
 *
 * Coverage, not invention: everything returned has to be traceable to what the
 * user already wrote.
 *
 * Descriptions are PLAIN ENGLISH — what a director would say to a crew, not a
 * prompt. Nobody's appearance or wardrobe belongs in them. Continuity lives on
 * the cards instead: generate resolves the people it uses against the project's
 * personas (minting one when the scene needs somebody nobody has cast yet) and
 * pins their ids to every shot. prompts.js then hands the full cast block to
 * the prompt writer for each shot on its own — personas.js:block() — so the
 * text never has to carry the wardrobe itself.
 */
(function (SB) {
  'use strict';

  const MIN = 2, MAX = 4;

  /* ---------- shot types ---------- */

  /* The card's type dropdown only offers p.settings.shotTypes, so a returned
   * type has to land on one of them or the card would show a value it cannot
   * re-select. */
  const ALIASES = [
    [/(^|\b)(ecu|xcu)\b|extreme close|macro/, ['extreme close', 'close']],
    [/(^|\b)ots\b|over.the.shoulder/, ['over the shoulder', 'medium']],
    [/(^|\b)cu\b|close.?up|tight/, ['close', 'medium']],
    [/insert|detail|hands?\b|object/, ['insert', 'close']],
    [/cutaway|b.?roll/, ['cutaway', 'insert']],
    [/(^|\b)(ws|ews)\b|wide|establish|master shot|landscape/, ['wide', 'medium']],
    [/two.?shot/, ['two shot', 'medium']],
    [/(^|\b)(ms|mcu)\b|medium|mid\b|waist/, ['medium', 'wide']],
    [/pov|point of view/, ['pov', 'close']],
    [/screen|ui\b|monitor|laptop capture/, ['screen capture', 'insert']],
    [/talking head|interview|piece to camera/, ['talking head', 'medium']]
  ];

  function norm(s) { return String(s || '').toLowerCase().replace(/[^a-z ]+/g, ' ').replace(/\s+/g, ' ').trim(); }

  function matchType(p, raw) {
    const types = (p.settings && p.settings.shotTypes) || [];
    if (!types.length) return String(raw || '');
    const want = norm(raw);
    if (!want) return types[0];

    let hit = types.filter(function (t) { return norm(t) === want; })[0];
    if (hit) return hit;
    hit = types.filter(function (t) { return want.indexOf(norm(t)) >= 0; })[0];
    if (hit) return hit;
    /* Short abbreviations are left to the alias table below — "CU" is inside
     * "cutaway", and matching it there would be wrong every time. */
    if (want.length >= 4) {
      hit = types.filter(function (t) { return norm(t).indexOf(want) >= 0; })[0];
      if (hit) return hit;
    }

    /* "ECU on the hands" is a real answer from a model that has never seen this
     * project's list — read the intent, then take the closest thing offered. */
    for (let i = 0; i < ALIASES.length; i++) {
      if (!ALIASES[i][0].test(want)) continue;
      const prefs = ALIASES[i][1];
      for (let j = 0; j < prefs.length; j++) {
        hit = types.filter(function (t) { return norm(t).indexOf(prefs[j]) >= 0; })[0];
        if (hit) return hit;
      }
    }
    return types[0];
  }

  /* ---------- context for the call ---------- */

  /* A scene's own claim is a statement of what it covers; stitching its shots'
   * windows together is a guess derived from them. Prefer the claim — and in
   * the case this feature exists for, a scene with no shots yet, it is the only
   * script there is. Preferred, not unioned: shot ranges usually sit inside the
   * claimed stretch, so concatenating would send the model the same text twice. */
  function sceneScript(p, sc) {
    const sw = SB.Model.windowForScene(p, sc);
    if (sw) {
      const t = (sw.doc.text || '').slice(sw.from, sw.to).replace(/\s+/g, ' ').trim();
      if (t) return t;
    }
    const bits = [];
    sc.shots.forEach(function (sh) {
      const w = SB.Model.windowFor(p, sh);
      const t = (w.doc.text || '').slice(w.from, w.to).replace(/\s+/g, ' ').trim();
      if (t && bits.indexOf(t) < 0) bits.push(t);
    });
    return bits.join(' ');
  }

  function existingShots(p, sc) {
    return sc.shots.filter(function (sh) { return (sh.description || '').trim(); })
      .map(function (sh) {
        return '- ' + (sh.type || 'shot') + ': ' +
          SB.Refs.plain(p, sh.description).replace(/\s+/g, ' ').trim().slice(0, 200);
      });
  }

  /* Personas already on this scene's cards. Whoever is here is who the scene is
   * already about — the writer is told to reuse them before anyone else. */
  function castFor(p, sc) {
    const seen = {}, out = [];
    sc.shots.forEach(function (sh) {
      (sh.personaIds || []).forEach(function (id) {
        if (seen[id]) return;
        seen[id] = 1;
        const per = SB.Personas.find(p, id);
        if (per) out.push(per);
      });
    });
    return out;
  }

  /* Names are how the writer addresses a persona, so matching is by name and
   * has to survive "Ops Lead" vs "ops lead." */
  function nameKey(s) { return norm(s).replace(/\s+/g, ' ').trim(); }

  function findByName(p, name) {
    const want = nameKey(name);
    if (!want) return null;
    return SB.Personas.all(p).filter(function (per) {
      return nameKey(per.name) === want;
    })[0] || null;
  }

  function neighbours(p, idx) {
    const lines = [];
    const prev = p.scenes[idx - 1], next = p.scenes[idx + 1];
    if (prev) lines.push('The scene before this one: ' + (prev.heading || '(untitled)'));
    if (next) lines.push('The scene after this one: ' + (next.heading || '(untitled)'));
    return lines;
  }

  function sceneOf(p, sceneId) {
    const f = SB.Model.findScene(p, sceneId);
    if (!f) throw new Error('That scene is gone');
    return f;
  }

  function needKey() {
    const prov = SB.Providers.active();
    return prov.ready() ? null : new Error(prov.notReady());
  }

  /* ---------- generate shots ---------- */

  const GEN_SCHEMA = {
    type: 'OBJECT',
    properties: {
      cast: {
        type: 'ARRAY',
        items: {
          type: 'OBJECT',
          properties: {
            name: { type: 'STRING' },
            description: { type: 'STRING' },
            imagePrompt: { type: 'STRING' }
          },
          required: ['name', 'description']
        }
      },
      shots: {
        type: 'ARRAY',
        items: {
          type: 'OBJECT',
          properties: {
            beat: { type: 'STRING' },
            type: { type: 'STRING' },
            description: { type: 'STRING' },
            cast: { type: 'ARRAY', items: { type: 'STRING' } }
          },
          required: ['beat', 'type', 'description']
        }
      }
    },
    required: ['shots']
  };

  function countLine(n) {
    if (n) {
      return 'Return exactly ' + n + ' shots.';
    }
    return 'Return 2 or 3 shots — 2 when the description is a single continuous action, ' +
      '3 when there is a clear before and after. Never more than 3.';
  }

  function framingLine(n) {
    if (n === 2) return 'Both shots are tight. No wide shot in a two-shot sequence.';
    return 'Most shots are tight — close-up, extreme close-up, or an insert on hands, ' +
      'a face, an object, a screen. Exactly ONE of them is wider, used for rhythm and to ' +
      'place the action in its setting. If you return 2 shots, both are tight.';
  }

  function buildGenPrompt(p, sc, idx, n, note, onScene, roster) {
    const script = sceneScript(p, sc);
    const already = existingShots(p, sc);
    const types = (p.settings.shotTypes || []).join(', ');

    const lines = [
      'You are boarding one short scene of a video. Break the scene description below ' +
      'into a run of consecutive storyboard shots.',
      '',
      countLine(n),
      '',
      'HOW THE SEQUENCE MUST READ',
      '- The shots are consecutive beats of ONE continuous moment, in the order they cut ' +
      'together: an entry into the action, the action itself, and the beat that resolves it. ' +
      'They are not several angles on a frozen tableau.',
      '- The moment must feel complete. The last shot lands the point of the scene — a ' +
      'result, a reaction, a finished gesture. Never end mid-action.',
      '- ' + framingLine(n),
      '- No two neighbouring shots use the same framing.',
      '- Everything you describe must be traceable to the scene description. Do not invent ' +
      'new locations, new events, or people who are not implied by it.',
      '- Location, time of day, lighting and screen direction stay consistent across every shot.',
      '',
      'WHO IS ON CAMERA',
      onScene.length
        ? '- This scene is already cast (ON THIS SCENE, below). Reuse those people by their ' +
        'exact name. Do not rename them and do not invent a second version of the same person.'
        : (roster.length
          ? '- The board already has people on it (THE BOARD\'S PEOPLE, below). If one of them ' +
          'fits this scene, reuse them by their exact name rather than inventing anybody new.'
          : '- Nobody has been cast on this board yet.'),
      '- Return every person the scene needs in the "cast" array. For someone already listed ' +
      'below, return their name alone — leave description and imagePrompt out, they are already ' +
      'written. For somebody genuinely new, add them with a short handle for a name ("Ops lead", ' +
      'not a character name), a description covering age range, build, hair, skin tone and a ' +
      'specific outfit down to fabric and colour, and an imagePrompt that would produce a clean ' +
      'front-facing reference frame of them — plain background, natural light, full wardrobe ' +
      'visible, neutral expression.',
      '- Keep the cast as small as the scene honestly needs. Reuse beats inventing, every time.',
      '- Name the people each shot contains in that shot\'s own "cast" array, by the same names.',
      '',
      'EACH SHOT',
      '- beat: three or four words naming what this beat does ("hands find the label").',
      '- type: choose from this project\'s list — ' + (types || 'Wide, Medium, Close-up'),
      '- description: 2-4 sentences of PLAIN ENGLISH — what we see, written the way a director ' +
      'would say it to a crew. Who is doing what, the framing, the setting detail, the light. ' +
      'No dialogue, no camera moves, no cuts, no editorialising.',
      '',
      'THE DESCRIPTIONS ARE NOT IMAGE PROMPTS',
      '- Write sentences, not a stack of comma-separated tags. No lens or camera specifications, ' +
      'no render or style vocabulary, no quality words ("cinematic", "photorealistic", "8k", ' +
      '"highly detailed"), no aspect ratios, no artist or film references, no trailing modifiers.',
      '- Refer to people by their cast name ("Ops lead reaches past the rack"). Do NOT restate ' +
      'what anybody looks like or is wearing — appearance lives on the cast entry and is attached ' +
      'to the shot separately, so repeating it here only makes the two drift apart.',
      '- Somebody who has never read a prompt should be able to read the description and picture ' +
      'the shot.',
      '',
      note ? 'ADDITIONAL DIRECTION: ' + note + '\n' : '',
      'SCENE ' + (idx + 1) + ': ' + (sc.heading || '(untitled)'),
      /* With a section claimed and no description written, the script IS the
       * brief — an empty DESCRIPTION block would just read as a blank order. */
      (sc.description || '').trim()
        ? 'DESCRIPTION:\n' + SB.Refs.plain(p, sc.description).trim()
        : 'There is no scene description. Board directly from the script this scene covers, below.'
    ];

    neighbours(p, idx).forEach(function (l) { lines.push(l); });
    if (script) lines.push('', 'SCRIPT THIS SCENE COVERS:\n' + script.slice(0, 4000));
    if (onScene.length) {
      lines.push('', 'ON THIS SCENE — already cast here, reuse by name:');
      onScene.forEach(function (per) {
        lines.push('- ' + (per.name || 'unnamed') + ': ' + (per.description || '').trim());
      });
    }
    /* The roster is context for reuse, not a cast order — a scene is free to
     * need none of them. Only the ones not already pinned here are worth the
     * tokens. */
    const rest = roster.filter(function (per) { return onScene.indexOf(per) < 0; });
    if (rest.length) {
      lines.push('', 'THE BOARD\'S PEOPLE — reuse one of these by name if they fit this scene:');
      rest.forEach(function (per) {
        lines.push('- ' + (per.name || 'unnamed') + ': ' +
          (per.description || '').replace(/\s+/g, ' ').trim().slice(0, 300));
      });
    }
    if (already.length) {
      lines.push('', 'SHOTS ALREADY ON THIS SCENE — your shots continue the scene, they do not ' +
        'repeat these:', already.join('\n'));
    }
    return lines.join('\n');
  }

  /* The description is prose for a human, so the prompt-shop habits that leak
   * out of a writer model are cleaned off rather than argued with: a trailing
   * run of comma-separated modifiers, and the quality vocabulary that only ever
   * means "this text was meant for an image model".
   *
   * Conservative on purpose — it trims the tail, it never rewrites a sentence. */
  const TAG_WORDS = new RegExp('\\b(' + [
    '8k', '4k', 'hdr', 'uhd', 'bokeh', 'octane', 'unreal engine', 'trending on \\w+',
    'cinematic(?: lighting| composition)?', 'photorealistic', 'photo ?realistic',
    'hyper ?realistic', 'ultra[- ]detailed', 'highly detailed', 'masterpiece',
    'award[- ]winning', 'depth of field', 'shot on \\w+', '\\d+ ?mm lens',
    'f/?\\d(?:\\.\\d)?', 'aspect ratio', 'sharp focus', 'volumetric', 'film grain',
    'anamorphic', 'in the style of [^.]+', 'colou?r graded',
    /* the default house style's own Finishing line, which the writer kept
     * transcribing into descriptions verbatim */
    'capture raw', 'muted professional grade', 'professional grade', 'tonal roll ?off',
    'smooth tonal', 'cinematic grain', 'subtle grain', 'controlled contrast',
    'natural light only', 'clean exposure', 'soft contrast', 'shallow (?:depth|focus)'
  ].join('|') + ')\\b', 'i');

  /* A whole sentence whose only content is the look — "The shallow depth of
   * field keeps the focus sharp on her face." — is not a description of
   * anything happening, and the prompt writer adds it again downstream. The
   * tail-stripper above only walks off comma fragments, so this takes the
   * sentence. Never the only sentence: something is better than nothing. */
  /* A sentence whose SUBJECT is the look — "The shallow depth of field keeps
   * the focus sharp on her face." — or which is a bare finishing instruction —
   * "Capture RAW, muted professional grade." — is not a description of anything
   * happening. The prompt writer applies the house style downstream anyway, so
   * leaving these in puts the grade on the picture twice and puts it in front
   * of a human reading the card. Never the last one standing: something is
   * better than nothing.
   */
  const STYLE_SUBJECT = new RegExp('^(?:the|a|an)\\s+(?:\\w+\\s+){0,2}(?:' + [
    'depth of field', 'bokeh', 'grain', 'grade', 'grading', 'contrast', 'exposure',
    'lighting', 'light', 'palette', 'focus', 'framing', 'composition', 'lens',
    'colou?r(?: palette)?', 'tonal roll ?off', 'aperture'
  ].join('|') + ')\\b', 'i');

  const STYLE_IMPERATIVE = /^(?:capture[ds]?|shot|shoot|rendered?|lit|graded?|finish(?:ed|ing)|film(?:ed)?)\b/i;

  function dropStyleSentences(desc) {
    const d = String(desc || '').trim();
    if (!d) return '';
    const parts = d.match(/[^.!?]+[.!?]*\s*/g) || [d];
    if (parts.length < 2) return d;
    const kept = parts.filter(function (s) {
      const t = s.trim();
      if (!t) return false;
      if (!TAG_WORDS.test(t)) return true;
      if (STYLE_SUBJECT.test(t) || STYLE_IMPERATIVE.test(t)) return false;
      /* or it is mostly look and little else once the look is taken out */
      const rest = t.replace(TAG_WORDS, ' ').replace(/[^\w\s]+/g, ' ')
        .split(/\s+/).filter(Boolean);
      return rest.length >= 5;
    });
    return (kept.length ? kept : parts).join('').trim();
  }

  function deprompt(desc) {
    let d = dropStyleSentences(String(desc || '').replace(/\s+/g, ' ').trim());
    if (!d) return '';
    /* "--ar 16:9", "::2" and friends are never part of a sentence. */
    d = d.replace(/\s*(?:--|——)\w+[^,.]*$/, '').trim();
    /* Walk the final comma-separated tail off while each fragment reads as a
     * bare modifier rather than a clause with something happening in it. */
    for (let guard = 0; guard < 8; guard++) {
      const m = /,\s*([^,.]{2,60})\s*\.?\s*$/.exec(d);
      if (!m) break;
      const frag = m[1].trim();
      const words = frag.split(' ').length;
      if (!TAG_WORDS.test(frag) && words > 2) break;
      d = d.slice(0, m.index).trim();
    }
    if (d && !/[.!?]$/.test(d)) d += '.';
    return d;
  }

  /* A card nobody has touched yet — the one every new scene starts with. */
  function isBlank(p, sh) {
    if ((sh.description || '').trim()) return false;
    if (sh.image || sh.link || (sh.personaIds || []).length) return false;
    if (Object.keys(sh.prompts || {}).length) return false;
    if (Object.keys(sh.fields || {}).some(function (k) { return (sh.fields[k] || '').trim(); })) return false;
    const w = SB.Model.windowFor(p, sh);
    return !(w.doc.text || '').slice(w.from, w.to).trim();
  }

  /* opts = { count, note } — count 0/undefined lets the writer choose. */
  function generate(p, sceneId, opts) {
    opts = opts || {};
    let f;
    try { f = sceneOf(p, sceneId); } catch (e) { return Promise.reject(e); }
    const sc = f.scene;
    /* Either brief will do: a description written by hand, or a stretch of the
     * script this scene has claimed — which is the whole point of claiming one. */
    if (!(sc.description || '').trim() && !sceneScript(p, sc)) {
      return Promise.reject(new Error('Write a scene description first, or tie this scene to a ' +
        'stretch of the master script — the shots are built from one of them.'));
    }
    const miss = needKey();
    if (miss) return Promise.reject(miss);

    const n = opts.count ? SB.clamp(opts.count | 0, MIN, MAX) : 0;
    const onScene = castFor(p, sc);
    const roster = SB.Personas.all(p).slice();
    const text = buildGenPrompt(p, sc, f.idx, n, (opts.note || '').trim(), onScene, roster);

    const brand = SB.Brand.brandOf(p);
    const system = [
      'You are a director laying out coverage for a short video. You answer with shots, ' +
      'not with commentary.',
      /* First, not last. Said at the end it read as a footnote to the house
       * style and was ignored on every shot: descriptions came back carrying
       * "Capture RAW, muted professional grade" and "shallow depth of field",
       * which then get applied AGAIN by the prompt writer downstream. */
      'Name the places and things you use exactly as they are named in the roster above, so ' +
      'the board can attach their reference pictures. Do not rename them or describe them ' +
      'generically.',
      'Name the places and things you use exactly as they are named in the roster above, so ' +
      'the board can attach their reference pictures. Do not rename them or describe them ' +
      'generically.',
      'A DESCRIPTION IS PROSE, NOT A PROMPT. Write what happens and where, as a director would ' +
      'say it to a crew. Never write the grade, the grain, the contrast, the lens, the focal ' +
      'length, the aperture, the depth of field or any finishing instruction into a description. ' +
      'Those are applied later by something else, and writing them here puts them in twice.',
      /* The house style belongs to the prompt writer, which is shown it again
       * downstream. Here it is a constraint, not something to transcribe —
       * folding it into the descriptions is what made them read as prompts. */
      brand.enabled ? '\nHOUSE STYLE — nothing you describe may contradict this.\n\n' + brand.text : '',
      brand.enabled ? '\nDo not quote these rules back or write them into the descriptions — the ' +
        'prompt writer applies them later.' : ''
    ].filter(Boolean).join('\n');

    return SB.Prompts.raw(text, GEN_SCHEMA, system).then(function (out) {
      let list = (out && out.shots) || [];
      if (!list.length) throw new Error('No shots came back — try again, or say more in the description.');
      if (n) list = list.slice(0, n);
      else if (list.length > 3) list = list.slice(0, 3);

      /* Resolve the cast before any card is written. A returned name that
       * already exists is reused as it stands — the roster entry is the user's,
       * and a generated description does not get to overwrite it. */
      const byName = {}, created = [];
      (out.cast || []).forEach(function (c) {
        const nm = String((c && c.name) || '').trim();
        if (!nm || byName[nameKey(nm)]) return;
        let per = findByName(p, nm);
        if (!per) {
          per = SB.Personas.add(p, {
            name: nm,
            description: String(c.description || '').trim(),
            imagePrompt: String(c.imagePrompt || '').trim()
          });
          created.push(per);
        }
        byName[nameKey(nm)] = per;
      });
      /* Whoever the scene already had stays addressable even if the writer
       * forgot to list them. */
      onScene.forEach(function (per) {
        if (!byName[nameKey(per.name)]) byName[nameKey(per.name)] = per;
      });
      const all = Object.keys(byName).map(function (k) { return byName[k]; });

      function idsFor(x) {
        const named = ((x && x.cast) || []).map(function (nm) { return byName[nameKey(nm)]; })
          .filter(Boolean);
        if (named.length) {
          return named.filter(function (per, i) { return named.indexOf(per) === i; })
            .map(function (per) { return per.id; });
        }
        /* An insert on hands or on a screen often names nobody. With a single
         * person in play those hands are still theirs, so the reference frame
         * should follow; with several there is no honest guess to make. */
        return all.length === 1 ? [all[0].id] : [];
      }

      const made = [];
      list.forEach(function (x) {
        const type = matchType(p, x.type);
        const description = deprompt(x.description);
        /* Reuse the scene's own empty starter card before adding beside it. */
        const blank = sc.shots.filter(function (sh) { return isBlank(p, sh); })[0];
        const sh = (blank && !made.length && sc.shots.length === 1)
          ? blank : SB.Model.addShot(p, sc.id, {});
        if (!sh) return;
        sh.type = type;
        const pid = idsFor(x);
        if (pid.length) sh.personaIds = pid;
        /* The writer hands back prose naming the people it used. Linking those
           names here is what makes a generated card arrive already saying which
           pictures go with it, rather than looking finished and feeding none. */
        sh.description = SB.Refs.linkAll(p, description);
        made.push(sh);
      });
      if (!made.length) {
        /* Nothing landed, so the people invented for it should not linger. */
        created.forEach(function (per) { SB.Personas.remove(p, per.id); });
        throw new Error('Nothing could be added to this scene');
      }
      p.updatedAt = Date.now();
      return {
        ids: made.map(function (sh) { return sh.id; }),
        shots: made,
        cast: all,
        created: created,
        personaIds: created.map(function (per) { return per.id; }),
        beats: list.map(function (x) { return String(x.beat || '').trim(); })
      };
    });
  }

  /* Structural changes are outside SB.History on purpose, so generate hands
   * back its own way out. personaIds are the people that run invented; one that
   * something else has been cast in since stays. */
  function undo(p, ids, personaIds) {
    (ids || []).forEach(function (id) { SB.Model.deleteShot(p, id); });
    (personaIds || []).forEach(function (pid) {
      let used = false;
      SB.Model.eachShot(p, function (sh) {
        if ((sh.personaIds || []).indexOf(pid) >= 0) used = true;
      });
      if (!used) SB.Personas.remove(p, pid);
    });
    p.updatedAt = Date.now();
  }

  /* ---------- descriptions that still carry a wardrobe ---------- */

  /* Boards written before descriptions became prose had the subject's clothes
   * stapled onto the end of every one of them. That copy froze the moment it
   * was written: edit the persona, or put a DIFFERENT person on the card, and
   * the description is now describing somebody who is not in the shot.
   *
   * The cast block overrides it at prompt time (personas.js), but the text on
   * the card is still wrong to read, so it is worth actually repairing. */

  const GARMENTS = ('jacket coat parka anorak hoodie hoody fleece shirt tee blouse sweater ' +
    'jumper cardigan waistcoat gilet overalls coveralls dungarees trousers jeans chinos ' +
    'slacks skirt dress shorts boots shoes trainers sneakers loafers cap beanie hat helmet ' +
    'scarf gloves apron lanyard tie belt uniform scrubs hi-vis high-vis vest sleeves cuffs ' +
    'collar hem lapel').split(' ');

  /* Phrases that only ever appear when a description is introducing a person
   * rather than showing one doing something. */
  const APPEARANCE = [
    /\b(?:wearing|wears|dressed in|clad in)\b/i,
    /\b(?:early|mid|late)[- ](?:teens|twenties|thirties|forties|fifties|sixties)\b/i,
    /\bin their (?:teens|twenties|thirties|forties|fifties|sixties)\b/i,
    /\b(?:wiry|stocky|slight|broad[- ]shouldered|heavy[- ]set|willowy)\b/i,
    /\b(?:cropped|shaved|buzzed|braided|dreadlocked|greying|graying|salt[- ]and[- ]pepper|shoulder[- ]length)\b/i,
    /\bskin tone\b/i
  ];

  const GARMENT_RE = new RegExp('\\b(' + GARMENTS.join('|') + ')\\b', 'ig');

  /* The terms that made this description look like a character sheet, or [] if
   * it reads as plain action. */
  function wardrobeTerms(desc) {
    const d = String(desc || '');
    if (!d.trim()) return [];
    const hits = [];
    APPEARANCE.forEach(function (re) {
      const m = re.exec(d);
      if (m) hits.push(m[0].toLowerCase());
    });
    const seen = {}, garments = [];
    let g;
    GARMENT_RE.lastIndex = 0;
    while ((g = GARMENT_RE.exec(d))) {
      const w = g[1].toLowerCase();
      if (seen[w]) continue;
      seen[w] = 1;
      garments.push(w);
    }
    /* One garment on its own is usually the thing being photographed — an
     * insert on a cuff, a hand pulling a strap. Two or more, or any of the
     * phrases above, and the description is introducing somebody. */
    if (hits.length || garments.length >= 2) return hits.concat(garments);
    return [];
  }

  /* Only a card that HAS cast can be carrying it redundantly. With nobody
   * attached the wardrobe in the text is the only record there is, and taking
   * it out would lose the shot. */
  function carriesWardrobe(p, sh) {
    if (!(sh.description || '').trim()) return null;
    /* People only. A location or an object cast on the card says nothing about
     * whose clothes the description is describing, and a "vest" in a shot with
     * only a room attached is somebody's prose, not a stale copy. */
    const people = SB.Personas.forShot(p, sh).filter(function (per) {
      return SB.Personas.kindOf(per).id === 'person';
    });
    if (!people.length) return null;
    const terms = wardrobeTerms(SB.Refs.plain(p, sh.description));
    return terms.length ? terms : null;
  }

  function shotsCarryingWardrobe(p) {
    const out = [];
    SB.Model.eachShot(p, function (sh) {
      if (carriesWardrobe(p, sh)) out.push(sh);
    });
    return out;
  }

  function sentences(d) {
    return String(d || '').match(/[^.!?]+[.!?]*\s*/g) || [];
  }

  const SKIP = ('the and a an of in on at to with for is are as its their this that from ' +
    'over into onto they them shot scene frame close wide medium camera').split(' ');

  function words(str) {
    return norm(str).split(' ').filter(function (w) {
      return w.length >= 4 && SKIP.indexOf(w) < 0;
    });
  }

  /* The free half of the repair: the old code APPENDED the subject verbatim, so
   * where the persona has not been edited since, the tail is still an exact
   * copy and can be lifted straight back off. No model, no judgement. */
  function stripCast(desc, personas) {
    let d = String(desc || '').trim();
    if (!d || !(personas || []).length) return d;
    const pool = personas.map(function (per) { return words(per.description || ''); })
      .filter(function (w) { return w.length >= 3; });
    if (!pool.length) return d;

    for (let guard = 0; guard < 4; guard++) {
      const parts = sentences(d);
      if (parts.length < 2) break;                 // never strip the only sentence
      const tail = parts[parts.length - 1];
      const tw = words(tail);
      if (tw.length < 3) break;
      const matched = pool.some(function (pw) {
        let shared = 0;
        tw.forEach(function (w) { if (pw.indexOf(w) >= 0) shared++; });
        /* Most of the tail has to be the persona's own words — a sentence that
         * merely mentions them is a real sentence and stays. */
        return shared / tw.length >= 0.7;
      });
      if (!matched) break;
      d = parts.slice(0, -1).join('').trim();
    }
    return d;
  }

  const CLEAN_SCHEMA = {
    type: 'OBJECT',
    properties: { description: { type: 'STRING' } },
    required: ['description']
  };

  function cleanPrompt(p, sh, cast) {
    const names = cast.map(function (per) { return per.name || 'unnamed'; });
    return [
      'Rewrite the shot description below so it no longer describes what anybody LOOKS LIKE.',
      '',
      '- Take out every mention of appearance, wardrobe, hair, age, build and skin tone. ' +
      'That information is held separately, on the cast, and repeating it here only lets the ' +
      'two drift apart.',
      '- Refer to the people in the shot by their cast name instead' +
      (names.length ? ' — ' + names.join(', ') : '') + '.',
      '- Keep everything else exactly as it is: the same action, the same place, the same ' +
      'framing, the same light, the same props. Change nothing about what happens.',
      '- Do not add anything. If removing the appearance leaves a short description, leave it short.',
      '- Plain English sentences. No prompt tags, no camera or lens specifications, no ' +
      'quality words, no dialogue.',
      '',
      cast.length ? 'THE CAST ON THIS CARD (do not restate any of this in the description):\n' +
        cast.map(function (per) {
          return '- ' + (per.name || 'unnamed') + ': ' +
            (per.description || '').replace(/\s+/g, ' ').trim();
        }).join('\n') + '\n' : '',
      'DESCRIPTION:\n' + SB.Refs.plain(p, sh.description).trim()
    ].filter(Boolean).join('\n');
  }

  /* Repair a run of cards. The deterministic strip runs first and for free; only
   * what it cannot settle costs a request — on a board whose personas were never
   * edited that is usually nothing at all.
   *
   * opts = { onProgress(done, total), dryRun }
   * Resolves { cleaned, stripped, asked, failed, changes: [{id, from, to}] } */
  function cleanWardrobe(p, shots, opts) {
    opts = opts || {};
    const list = (shots || []).filter(function (sh) { return !!carriesWardrobe(p, sh); });
    const changes = [];
    let stripped = 0;

    const queue = [];
    list.forEach(function (sh) {
      const cast = SB.Personas.forShot(p, sh);
      const cut = stripCast(SB.Refs.plain(p, sh.description), cast);
      if (cut !== SB.Refs.plain(p, sh.description).trim() && !wardrobeTerms(cut).length) {
        /* relink, not linkAll: only what was marked before is marked again.
           linkAll knew nothing about shot codes, so an earlier frame dropped
           out of the feed, and it linked names the writer had deliberately
           left as prose. */
        changes.push({ id: sh.id, from: sh.description, to: SB.Refs.relink(p, cut, sh.description) });
        stripped++;
        return;
      }
      queue.push({ shot: sh, cast: cast, seed: cut });
    });

    const total = list.length;
    let done = stripped, failed = 0;
    const tick = function () { if (opts.onProgress) opts.onProgress(done, total); };

    function finish() {
      if (!opts.dryRun) {
        changes.forEach(function (ch) {
          const f = SB.Model.findShot(p, ch.id);
          if (f) f.shot.description = ch.to;
        });
        if (changes.length) p.updatedAt = Date.now();
      }
      return {
        cleaned: changes.length, stripped: stripped, asked: queue.length,
        failed: failed, changes: changes
      };
    }

    if (!queue.length) { tick(); return Promise.resolve(finish()); }

    const miss = needKey();
    if (miss) {
      /* Whatever the strip already settled is real work — keep it rather than
       * throwing the lot away over the ones that needed a model. */
      if (changes.length) { finish(); }
      return Promise.reject(miss);
    }

    const brand = SB.Brand.brandOf(p);
    const system = [
      'You edit storyboard shot descriptions. You return the rewritten description only — ' +
      'no commentary, no headings.'
    ].filter(Boolean).join('\n');

    tick();
    const pending = queue.slice();
    function worker() {
      const j = pending.shift();
      if (!j) return Promise.resolve();
      return SB.Prompts.raw(cleanPrompt(p, j.shot, j.cast), CLEAN_SCHEMA, system)
        .then(function (out) {
          const next = String((out && out.description) || '').trim();
          if (next) {
            changes.push({
              id: j.shot.id, from: j.shot.description,
              /* it came back as prose — put back the marks it flattened */
              to: SB.Refs.relink(p, deprompt(next), j.shot.description)
            });
          }
          else failed++;
        })
        .catch(function (e) {
          failed++;
          console.error('[storyboarder] clean failed', e);
        })
        .then(function () { done++; tick(); return worker(); });
    }

    /* Same shape as the prompt writer: one canary, then two more lanes, so a
     * blocked network costs one request instead of forty. */
    return worker().then(function () {
      if (!pending.length) return;
      const lanes = [];
      for (let i = 0; i < Math.min(2, pending.length); i++) lanes.push(worker());
      return Promise.all(lanes);
    }).then(finish);
  }

  /* ---------- rewrite the description ---------- */

  const REWRITE_SCHEMA = {
    type: 'OBJECT',
    properties: { description: { type: 'STRING' } },
    required: ['description']
  };

  function rewrite(p, sceneId, note) {
    let f;
    try { f = sceneOf(p, sceneId); } catch (e) { return Promise.reject(e); }
    const sc = f.scene;
    const draft = SB.Refs.plain(p, sc.description).trim();
    if (!draft) return Promise.reject(new Error('Nothing to rewrite yet — write a rough description first.'));
    const miss = needKey();
    if (miss) return Promise.reject(miss);

    const script = sceneScript(p, sc);
    const text = [
      'Rewrite the scene description below so it is strong enough to board from.',
      '',
      '- Keep every fact the draft states: the same subject, the same place, the same action, ' +
      'the same point. This is a rewrite, not a new scene.',
      '- Make it concrete and visual. Name what is actually on screen — the action, the setting, ' +
      'the objects, the light. Replace abstractions ("shows the value of the platform") with the ' +
      'thing a camera could photograph.',
      '- Cut hedging, throat-clearing and restatement.',
      '- One paragraph, roughly 40-90 words. Prose, not a shot list.',
      '- No camera directions, no shot types, no dialogue, no cuts — that comes later.',
      '- Do not invent new events, people or locations.',
      '',
      note ? 'ADDITIONAL DIRECTION: ' + note + '\n' : '',
      'SCENE HEADING: ' + (sc.heading || '(untitled)'),
      'DRAFT:\n' + draft
    ];
    if (script) text.push('', 'SCRIPT THIS SCENE COVERS (context only, do not summarise it):\n' +
      script.slice(0, 4000));

    const brand = SB.Brand.brandOf(p);
    const system = [
      'You sharpen scene descriptions for a storyboard. You return the rewritten ' +
      'description only — no commentary, no headings.',
      brand.enabled ? '\nHOUSE STYLE — the rewrite must obey this.\n\n' + brand.text : ''
    ].filter(Boolean).join('\n');

    return SB.Prompts.raw(text.join('\n'), REWRITE_SCHEMA, system).then(function (out) {
      const next = String((out && out.description) || '').trim();
      if (!next) throw new Error('The rewrite came back empty');
      return next;
    });
  }

  SB.Coverage = {
    MIN: MIN, MAX: MAX,
    generate: generate, rewrite: rewrite, undo: undo,
    matchType: matchType, deprompt: deprompt, isBlank: isBlank,
    dropStyleSentences: dropStyleSentences,
    wardrobeTerms: wardrobeTerms, carriesWardrobe: carriesWardrobe,
    shotsCarryingWardrobe: shotsCarryingWardrobe, stripCast: stripCast,
    cleanWardrobe: cleanWardrobe,
    sceneScript: sceneScript
  };

})(window.SB);

</script>
<script>
/* ===== js/promptpanel.js ===== */
/* promptpanel.js — the prompt table.
 *
 * A board is made one card at a time; prompts are written a whole film at a
 * time. Doing that on the cards means scrolling a wall of pictures to find the
 * three shots that have no video prompt yet, and editing a paragraph in a box
 * the width of a thumbnail. So this is a table: one row per shot, the columns
 * being the four things that matter at this stage — what it is, what it says,
 * the two prompts, and which pictures go with it.
 *
 * It is the same data as the cards. Editing here edits the board; the boxes are
 * simply the right shape for the job, and the filters (missing, stale, this
 * scene) turn "what is left to do" into a list you can act on.
 */
(function (SB) {
  'use strict';

  let root = null;
  let bodyEl, statusEl, usageEl, limitEl, headEl;
  let filter = 'all';

  function P() { return SB.app.project; }

  function init() { /* built on open */ }

  /* ---------------------------------------------------------------- shell */

  function open() {
    if (root) { render(); return; }
    root = SB.el('div', 'lib-back');
    const box = SB.el('div', 'lib');
    headEl = SB.el('header', 'lib-head');
    box.appendChild(headEl);
    bodyEl = SB.el('section', 'pt-body');
    box.appendChild(bodyEl);
    root.appendChild(box);
    root.addEventListener('mousedown', function (ev) { if (ev.target === root) close(); });
    document.addEventListener('keydown', onKey);
    document.getElementById('modalRoot').appendChild(root);
    document.getElementById('btnPrompts').classList.add('on');
    render();
  }

  function onKey(e) {
    if (e.key !== 'Escape' || !root) return;
    if (document.querySelector('.modal-back')) return;
    if (document.querySelector('.lib-pop') || document.querySelector('.men-pop')) return;
    /* Another takeover may be sitting on top of this one; whatever is last in
       the root is the one in front, and only it should answer. */
    const backs = document.querySelectorAll('#modalRoot .lib-back');
    if (backs.length && backs[backs.length - 1] !== root) return;
    close();
  }

  function close() {
    if (!root) return;
    root.remove();
    root = null;
    bodyEl = statusEl = usageEl = limitEl = headEl = null;
    document.removeEventListener('keydown', onKey);
    document.getElementById('btnPrompts').classList.remove('on');
  }

  function toggle() { root ? close() : open(); }
  function isOpen() { return !!root; }
  function refresh() { if (root) render(); }

  /* Called from app.changed(): the board moved under the table. */
  function follow() { if (root) render(); }

  function setStatus(txt, isErr) {
    if (!statusEl) return;
    statusEl.textContent = txt || '';
    /* the line is one row and ellipsised, and errors are the longest thing it
       ever holds — so the whole of it is on the hover */
    statusEl.title = txt || '';
    statusEl.classList.toggle('err', !!isErr);
  }

  /* ---------------------------------------------------------------- rows */

  /* Every shot on the board, with the scene it belongs to and its code, in the
   * order it plays. "no shot" cards come too — they are part of the film, and
   * the table is where you notice one is still marked that way. */
  function allRows() {
    const p = P();
    const out = [];
    p.scenes.forEach(function (sc, si) {
      sc.shots.forEach(function (sh, sj) {
        out.push({ shot: sh, scene: sc, si: si, sj: sj, code: SB.Model.code(si, sj) });
      });
    });
    return out;
  }

  function isMissing(r, im, vm) {
    return missingCount(r, im, vm) > 0;
  }

  /* How many prompts this row still needs. Counting rows meant the number did
   * not move when you finished one of a row's two prompts — on the one screen
   * whose job is "what is left to do". */
  function missingCount(r, im, vm) {
    if (r.shot.noShot) return 0;
    const pi = im && r.shot.prompts[im.id];
    const pv = vm && r.shot.prompts[vm.id];
    let n = 0;
    if (im && !(pi && pi.imagePrompt)) n++;
    if (vm && !(pv && pv.videoPrompt)) n++;
    return n;
  }

  function isStale(r, im, vm) {
    const one = function (m, field) {
      const pr = m && r.shot.prompts[m.id];
      return !!(pr && pr[field] && SB.Personas.staleFor(P(), r.shot, pr.at));
    };
    return one(im, 'imagePrompt') || one(vm, 'videoPrompt');
  }

  function visible(im, vm) {
    const rows = allRows();
    if (filter === 'missing') return rows.filter(function (r) { return isMissing(r, im, vm); });
    if (filter === 'stale') return rows.filter(function (r) { return isStale(r, im, vm); });
    if (filter === 'scene') {
      return rows.filter(function (r) { return r.scene.id === SB.app.selectedSceneId; });
    }
    return rows;
  }

  /* --------------------------------------------------------------- header */

  function modelSelect(role) {
    const p = P();
    const sel = document.createElement('select');
    sel.className = 'pt-model';
    sel.title = role === 'image' ? 'Which model the first-frame prompts are written for'
      : 'Which model the image→video prompts are written for';
    const none = document.createElement('option');
    none.value = ''; none.textContent = role === 'image' ? '(no image model)' : '(no video model)';
    sel.appendChild(none);
    [['image', 'Image models'], ['video', 'Video models']].forEach(function (g) {
      const list = p.settings.models.filter(function (m) { return m.kind === g[0]; });
      if (!list.length) return;
      const og = document.createElement('optgroup');
      og.label = g[1];
      list.forEach(function (m) {
        const o = document.createElement('option');
        o.value = m.id; o.textContent = m.name;
        if (m.id === (role === 'image' ? p.settings.imageModelId : p.settings.videoModelId)) {
          o.selected = true;
        }
        og.appendChild(o);
      });
      sel.appendChild(og);
    });
    sel.addEventListener('change', function () {
      if (role === 'image') p.settings.imageModelId = sel.value;
      else p.settings.videoModelId = sel.value;
      SB.app.changed(true);            // the cards relabel to the new model
      render();
    });
    return sel;
  }

  /* Two rows on purpose: what you are looking at, then what you are working
   * with. Crammed into one they wrapped unpredictably as the model names
   * changed length, and the close button ended up beside the run button. */
