      S.lastGood = text;                     // the rescue copy
      S.stats.writes++;
      S.stats.lastBytes = (SB.Usage ? SB.Usage.bytes(text) : text.length);
      S.stats.bytes += S.stats.lastBytes;
      state('saved ' + new Date().toLocaleTimeString(), 'saved');
      if (S.onSaved) S.onSaved(S.stats);
      if (S.pending) { S.pending = false; return writeNow(); }
    }).catch(function (e) {
      S.writing = false;
      S.pending = false;
      if (String(e && e.message) === 'permission') return;
      saveFailed('the file could not be written', e);
    });
  }

  /* A failed save is the one thing in this app the user must not miss. */
  function saveFailed(what, err) {
    S.writing = false;
    state('SAVE FAILED', 'dirty');
    console.error('[storyboarder] save failed —', what, err);
    if (S.onFailure) S.onFailure(what, err);
  }

  const debouncedWrite = SB.debounce(writeNow, 500);

  function touch() {
    S.dirty = true;
    if (S.handle) state('unsaved…', 'dirty');
    debouncedWrite();
  }

  /* ---------- open / save-as ---------- */

  const PICKER_TYPES = [{
    description: 'Storyboard project',
    accept: { 'application/json': ['.storyboard', '.json'] }
  }];

  function saveAs(project) {
    if (!hasFS) return Promise.reject(new Error('This browser has no File System Access API. Use Chrome or Edge.'));
    return window.showSaveFilePicker({
      suggestedName: (project.name || 'storyboard').replace(/[\\/:*?"<>|]+/g, '_') + '.storyboard',
      types: PICKER_TYPES
    }).then(function (h) {
      S.handle = h;
      S.fileName = h.name;
      idbPut('last', h);          // fire and forget — never gate the write on it
      return writeNow();
    }).then(function () {
      return S.fileName;
    });
  }

  function openFile() {
    if (!hasFS) return Promise.reject(new Error('This browser has no File System Access API. Use Chrome or Edge.'));
    return window.showOpenFilePicker({ types: PICKER_TYPES, multiple: false })
      .then(function (hs) { return loadFromHandle(hs[0], true); });
  }

  function loadFromHandle(handle, interactive) {
    return ensurePermission(handle, interactive).then(function (ok) {
      if (!ok) throw new Error('Permission to the project file was denied.');
      return handle.getFile();
    }).then(function (f) {
      return f.text();
    }).then(function (txt) {
      const p = SB.Model.migrate(JSON.parse(txt));
      S.handle = handle;
      S.fileName = handle.name;
      S.dirty = false;
      idbPut('last', handle);
      state('opened ' + handle.name, 'saved');
      return p;
    });
  }

  function lastHandle() { return idbGet('last'); }

  function detach() {
    S.handle = null;
    S.fileName = null;
    idbPut('last', null);
    state('no file', 'dirty');
  }

  /* ---------- API key (local only) ---------- */

  function getApiKey() { try { return localStorage.getItem(KEY_API) || ''; } catch (e) { return ''; } }
  function setApiKey(v) { try { v ? localStorage.setItem(KEY_API, v) : localStorage.removeItem(KEY_API); } catch (e) { } }

  /* ---------- escape hatch ---------- */

  /* Always available, even when the file handle is gone or unwritable: hand
   * the project back as a download. */
  function downloadCopy(project, why) {
    let text;
    try { text = serialize(project || (S.getProject && S.getProject())); }
    catch (e) { text = S.lastGood || ''; }
    if (!text) return false;
    const name = ((project && project.name) || 'storyboard')
      .replace(/[\\/:*?"<>|]+/g, '_') + (why ? '-' + why : '') + '.storyboard';
    const url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    return true;
  }

  /* Saves per day at the rate this session has been going. Needs a few
   * minutes of real work before it means anything. */
  function saveRate() {
    const mins = (Date.now() - S.stats.since) / 60000;
    if (S.stats.writes < 3 || mins < 1) return null;
    return { perHour: S.stats.writes / (mins / 60), perDay: (S.stats.writes / (mins / 60)) * 8 };
  }

  /* Does this context have a working IndexedDB? On file:// it hangs rather
   * than failing, so "remember the last project" quietly cannot work there. */
  function storageUsable() {
    return idb().then(function () { return true; }).catch(function () { return false; });
  }

  SB.Store = {
    hasFS: hasFS,
    S: S,
    touch: touch,
    saveNow: function () { debouncedWrite.flush ? debouncedWrite.flush() : null; return writeNow(); },
    saveAs: saveAs,
    open: openFile,
    loadFromHandle: loadFromHandle,
    lastHandle: lastHandle,
    detach: detach,
    getApiKey: getApiKey,
    setApiKey: setApiKey,
    serialize: serialize,
    downloadCopy: downloadCopy,
    storageUsable: storageUsable,
    saveRate: saveRate
  };

})(window.SB);

</script>
<script>
/* ===== js/usage.js ===== */
/* usage.js — how much data a board is, and what it would cost to sync.
 *
 * Everything here is measured, not estimated: the byte counts come from the
 * exact string the app writes to disk, so what you see is what a backend would
 * have to store and move.
 */
(function (SB) {
  'use strict';

  const enc = (typeof TextEncoder === 'function') ? new TextEncoder() : null;

  function bytes(s) {
    if (!s) return 0;
    return enc ? enc.encode(s).length : String(s).length;
  }

  function fmt(n) {
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
    if (n < 1024 * 1024 * 1024) return (n / (1024 * 1024)).toFixed(2) + ' MB';
    return (n / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
  }

  /* Fixed order, validated for colour-vision deficiency against both the light
   * and the dark board surface. Never reorder or cycle these. */
  const SECTION_COLORS = ['#3b82f6', '#d97706', '#0d9488', '#c026d3', '#65a30d'];
  const OTHER_COLOR = '#8b93a3';

  function measure(p) {
    const total = bytes(SB.Store.serialize(p));

    let frames = 0, framesN = 0, ink = 0, inkN = 0;
    SB.Model.eachShot(p, function (sh) {
      if (sh.image && sh.image.data) { frames += bytes(sh.image.data); framesN++; }
      if (sh.annotation) { ink += bytes(sh.annotation); inkN++; }
    });

    let refs = 0, refsN = 0;
    (p.personas || []).forEach(function (per) {
      if (per.image && per.image.data) { refs += bytes(per.image.data); refsN++; }
    });

    const versions = (p.versions && p.versions.length) ? bytes(JSON.stringify(p.versions)) : 0;
    const rest = Math.max(0, total - frames - refs - ink - versions);

    let shots = 0;
    SB.Model.eachShot(p, function () { shots++; });

    const sections = [
      { key: 'frames', label: 'Shot frames', n: framesN, b: frames, color: SECTION_COLORS[0] },
      { key: 'refs', label: 'Persona references', n: refsN, b: refs, color: SECTION_COLORS[1] },
      { key: 'ink', label: 'Comment ink', n: inkN, b: ink, color: SECTION_COLORS[2] },
      { key: 'versions', label: 'Saved versions', n: (p.versions || []).length, b: versions, color: SECTION_COLORS[3] },
      { key: 'text', label: 'Script, prompts, structure', n: shots, b: rest, color: SECTION_COLORS[4] }
    ].filter(function (s) { return s.b > 0; });

    /* the individual images worth knowing about */
    const heavy = [];
    SB.Model.eachShot(p, function (sh, sc, i, j) {
      if (sh.image && sh.image.data) {
        heavy.push({ label: SB.Model.code(i, j) + ' frame', b: bytes(sh.image.data) });
      }
      if (sh.annotation) heavy.push({ label: SB.Model.code(i, j) + ' ink', b: bytes(sh.annotation) });
    });
    (p.personas || []).forEach(function (per) {
      if (per.image && per.image.data) {
        heavy.push({ label: (per.name || 'persona') + ' reference', b: bytes(per.image.data) });
      }
    });
    heavy.sort(function (a, b) { return b.b - a.b; });

    return {
      total: total,
      sections: sections,
      heaviest: heavy.slice(0, 6),
      imageBytes: frames + refs + ink,
      textBytes: total - frames - refs - ink - versions,
      versionBytes: versions,
      counts: {
        scenes: p.scenes.length, shots: shots, personas: (p.personas || []).length,
        versions: (p.versions || []).length, images: framesN + refsN + inkN,
        scriptChars: p.master.text.length
      }
    };
  }

  /* ---- what this would mean on Firebase ----
   * Figures checked against Google's docs, Aug 2026:
   *   Firestore document ceiling ....... 1 MiB (1,048,576 bytes), hard
   *   Spark (free) Firestore ........... 1 GiB stored, 20k writes/day,
   *                                      50k reads/day, 20k deletes/day
   *   Cloud Storage .................... not on Spark — needs Blaze
   */
  const FS_DOC_LIMIT = 1048576;
  const SPARK_STORE = 1024 * 1024 * 1024;
  const SPARK_WRITES = 20000;
  const SPARK_READS = 50000;

  function firebase(m, stats) {
    const perDay = stats && stats.perDay ? stats.perDay : null;
    const checks = [];

    const pct = Math.round(m.total / FS_DOC_LIMIT * 100);
    checks.push({
      ok: m.total <= FS_DOC_LIMIT,
      warn: m.total <= FS_DOC_LIMIT && pct >= 75,
      label: 'Fits in one Firestore document',
      detail: fmt(m.total) + ' of the hard 1 MiB ceiling' +
        (m.total > FS_DOC_LIMIT
          ? ' — over by ' + fmt(m.total - FS_DOC_LIMIT) + '. A board this size cannot be one document at any price.'
          : ' (' + pct + '% used)' + (pct >= 75 ? ' — a few more frames and it stops fitting.' : '.'))
    });

    const textOnly = m.textBytes + m.versionBytes;
    checks.push({
      ok: textOnly <= FS_DOC_LIMIT,
      label: 'Fits if the images live elsewhere',
      detail: 'Without images the board is ' + fmt(textOnly) + ' — ' +
        (textOnly <= FS_DOC_LIMIT
          ? 'comfortably inside one document.'
          : 'still over the 1 MiB ceiling; it would have to be split per scene.')
    });

    const boards = m.total > 0 ? Math.floor(SPARK_STORE / m.total) : 0;
    checks.push({
      ok: boards >= 20,
      label: 'Boards inside the free 1 GiB',
      detail: '≈ ' + boards.toLocaleString() + ' boards this size' +
        (boards < 20 ? ' — the free tier fills up fast at this weight.' : '.')
    });

    checks.push({
      ok: perDay === null || perDay <= SPARK_WRITES,
      label: 'Autosave writes inside 20,000/day',
      detail: perDay === null
        ? 'No save activity measured yet in this session.'
        : '≈ ' + Math.round(perDay).toLocaleString() + ' writes/day at the rate you have been working' +
        (perDay > SPARK_WRITES
          ? ' — over the free ceiling on its own.'
          : ' (' + Math.round(perDay / SPARK_WRITES * 100) + '% of it, one editor).')
    });

    const dailyBytes = perDay ? perDay * m.total : 0;
    checks.push({
      ok: true,
      label: 'Data moved per day, one editor',
      detail: perDay
        ? '≈ ' + fmt(dailyBytes) + ' uploaded — every autosave sends the whole board unless writes are made incremental.'
        : 'Nothing measured yet.'
    });

    const verdict = (m.total <= FS_DOC_LIMIT && pct >= 75)
      ? 'It fits today, at ' + pct + '% of the 1 MiB document ceiling — but frames are ' +
      Math.round(m.imageBytes / Math.max(1, m.total) * 100) + '% of this board, so the next few shots break it.'
      : m.total > FS_DOC_LIMIT
      ? 'Not as one document. The images are what break it — Firestore\'s 1 MiB ceiling is hard, and Cloud Storage (the natural home for the frames) is not on the free Spark plan at all.'
      : (perDay && perDay > SPARK_WRITES
        ? 'Storage fits, but autosave-per-pause would burn through the 20,000 free writes a day.'
        : 'This board would fit the free tier as a single document — keep an eye on it as frames get added.');

    return { checks: checks, verdict: verdict, docLimit: FS_DOC_LIMIT, sparkWrites: SPARK_WRITES, sparkReads: SPARK_READS };
  }

  SB.Usage = {
    measure: measure, firebase: firebase, fmt: fmt, bytes: bytes,
    SECTION_COLORS: SECTION_COLORS, OTHER_COLOR: OTHER_COLOR,
    FS_DOC_LIMIT: FS_DOC_LIMIT, SPARK_STORE: SPARK_STORE, SPARK_WRITES: SPARK_WRITES
  };

})(window.SB);

</script>
<script>
/* ===== js/history.js ===== */
/* history.js — undo/redo for script text.
 *
 * The editor suppresses the browser's own undo (we own the DOM), so this
 * supplies it. A step snapshots the script layer only: the master document
 * plus every shot's link range / freestanding text. Structural changes —
 * adding, deleting or moving shots and scenes — are deliberately NOT undone,
 * so Ctrl+Z can never make a card disappear out from under you.
 *
 * Consecutive typing in the same window coalesces into one step.
 */
(function (SB) {
  'use strict';

  const LIMIT = 200;
  const COALESCE_MS = 700;

  const H = { past: [], future: [], applying: false, lastTag: null, lastAt: 0 };

  function P() { return SB.app && SB.app.project; }

  function snap(p) {
    const shots = [];
    SB.Model.eachShot(p, function (s) {
      shots.push({
        id: s.id,
        link: s.link ? { from: s.link.from, to: s.link.to } : null,
        broken: !!s.broken,
        local: s.local ? SB.clone(s.local) : null
      });
    });
    return { text: p.master.text, marks: SB.clone(p.master.marks), shots: shots };
  }

  function apply(p, s) {
    p.master.text = s.text;
    p.master.marks = SB.clone(s.marks);
    const byId = {};
    s.shots.forEach(function (x) { byId[x.id] = x; });
    SB.Model.eachShot(p, function (sh) {
      const x = byId[sh.id];
      if (!x) return;                    // shot created after this snapshot — leave it alone
      sh.link = x.link ? { from: x.link.from, to: x.link.to } : null;
      sh.broken = x.broken;
      sh.local = x.local ? SB.clone(x.local) : null;
    });
  }

  /* Called just BEFORE a script edit lands. tag identifies the window so that
   * a run of keystrokes in one box becomes a single undo step. */
  function push(tag) {
    const p = P();
    if (!p || H.applying) return;
    const now = Date.now();
    if (H.past.length && tag && tag === H.lastTag && (now - H.lastAt) < COALESCE_MS) {
      H.lastAt = now;
      return;                            // already have the pre-typing state
    }
    H.past.push(snap(p));
    if (H.past.length > LIMIT) H.past.shift();
    H.future.length = 0;
    H.lastTag = tag || null;
    H.lastAt = now;
  }

  /* A discrete action (capture, break link, paste) shouldn't merge with typing. */
  function seal() { H.lastTag = null; H.lastAt = 0; }

  function step(from, to) {
    const p = P();
    if (!p || !from.length) return false;
    H.applying = true;
    to.push(snap(p));
    apply(p, from.pop());
    H.applying = false;
    seal();
    SB.app.scriptChanged();
    SB.Board.renderScriptWindows();
    return true;
  }

  function undo() { return step(H.past, H.future); }
  function redo() { return step(H.future, H.past); }

  function reset() {
    H.past.length = 0;
    H.future.length = 0;
    seal();
  }

  SB.History = {
    push: push, undo: undo, redo: redo, reset: reset, seal: seal,
    depth: function () { return H.past.length; },
    redoDepth: function () { return H.future.length; }
  };

})(window.SB);

</script>
<script>
/* ===== js/editor.js ===== */
/* editor.js — a contenteditable "window" onto a slice of a Doc.
 *
 * The browser is never allowed to mutate the DOM: every keystroke is
 * intercepted, turned into a replace(start,end,text) op against the model, and
 * the view is re-rendered from the model. That is what lets several windows
 * share (and overlap on) the same underlying characters.
 */
(function (SB) {
  'use strict';

  /* ---------- offset <-> DOM selection ---------- */

  function walk(el, fn) {
    const it = document.createTreeWalker(el, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT, null);
    let n;
    while ((n = it.nextNode())) fn(n);
  }

  function textOf(el) {
    let out = '';
    walk(el, function (n) {
      if (n.nodeType === 3) out += n.data;
      else if (n.nodeName === 'BR' && !n.classList.contains('pad')) out += '\n';
    });
    return out;
  }

  /* Character offset of a DOM position within el.
   *
   * A click can land on an ELEMENT container (Chrome reports the highlight
   * span or a <b> run with a child index, not a text node) — measuring the
   * range text handles every container kind, which hand-walking did not:
   * it used to ignore the child index and snap to the start of the span, so
   * typing at the edge of a highlight jumped backwards. */
  function offsetOf(el, node, off) {
    const r = document.createRange();
    try {
      r.setStart(el, 0);
      r.setEnd(node, off);
    } catch (e) {
      return 0;
    }
    return r.toString().length;
  }

  function getSel(el) {
    const sel = window.getSelection();
    if (!sel || !sel.rangeCount) return null;
    const r = sel.getRangeAt(0);
    if (!el.contains(r.startContainer) || !el.contains(r.endContainer)) return null;
    let a = offsetOf(el, r.startContainer, r.startOffset);
    let b = offsetOf(el, r.endContainer, r.endOffset);
    return { start: Math.min(a, b), end: Math.max(a, b) };
  }

  function locate(el, target) {
    // find [textNode, offset] for a character offset
    let seen = 0, res = null;
    const it = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null);
    let n, last = null;
    while ((n = it.nextNode())) {
      last = n;
      if (seen + n.data.length >= target) { res = [n, target - seen]; break; }
      seen += n.data.length;
    }
    if (res) return res;
    if (last) return [last, last.data.length];
    return [el, 0];
  }

  function setSel(el, start, end) {
    const sel = window.getSelection();
    if (!sel) return;
    const r = document.createRange();
    const a = locate(el, start), b = locate(el, end == null ? start : end);
    try {
      r.setStart(a[0], Math.min(a[1], a[0].nodeType === 3 ? a[0].data.length : 0));
      r.setEnd(b[0], Math.min(b[1], b[0].nodeType === 3 ? b[0].data.length : 0));
    } catch (e) { return; }
    sel.removeAllRanges();
    sel.addRange(r);
  }

  /* ---------- word boundaries ---------- */

  const WORD = /[A-Za-z0-9_'À-ɏ]/;

  function wordBack(s, i) {
    while (i > 0 && /\s/.test(s.charAt(i - 1))) i--;
    if (i > 0 && !WORD.test(s.charAt(i - 1))) return i - 1;
    while (i > 0 && WORD.test(s.charAt(i - 1))) i--;
    return i;
  }

  function wordFwd(s, i) {
    const n = s.length;
    while (i < n && /\s/.test(s.charAt(i))) i++;
    if (i < n && !WORD.test(s.charAt(i))) return i + 1;
    while (i < n && WORD.test(s.charAt(i))) i++;
    return i;
  }

  /* ---------- attach ---------- */

  /* cfg = {
   *   get()            -> {doc, from, to} | null
   *   edit(s,e,text)   -> apply to model (local coords)
   *   toggle(type,s,e) -> toggle a mark (local coords)
   *   after()          -> tell the app to re-render every window
   *   extra(absIdx)    -> extra css class for that master character
   *   readOnly         -> bool
   * } */
  function attach(el, cfg) {
    const api = { el: el, cfg: cfg, composing: false, pending: null };
    el.__sbEditor = api;
    if (!cfg.readOnly) el.setAttribute('contenteditable', 'true');

    function win() { return cfg.get(); }

    api.render = function () {
      const w = win();
      if (!w) { el.innerHTML = ''; return; }
      if (api.composing) return;
      const focused = document.activeElement === el;
      const keep = api.pending || (focused ? getSel(el) : null);
      const scroll = el.scrollTop;
      el.innerHTML = SB.Doc.renderHTML(w.doc, w.from, w.to, cfg.extra || null);
      if (el.scrollTop !== scroll) el.scrollTop = scroll;
      if (focused && keep) {
        const max = w.to - w.from;
        setSel(el, SB.clamp(keep.start, 0, max), SB.clamp(keep.end == null ? keep.start : keep.end, 0, max));
      }
      api.pending = null;
    };

    if (cfg.readOnly) { api.render(); return api; }

    function mark(type, s, e) {
      if (e <= s) return;
      SB.History.seal();
      SB.History.push('mark');
      SB.History.seal();
      cfg.toggle(type, s, e);
      api.pending = { start: s, end: e };
      cfg.after();
    }

    function doEdit(s, e, text, caret) {
      const w = win();
      if (!w) return;
      const max = w.to - w.from;
      s = SB.clamp(s, 0, max); e = SB.clamp(e, s, max);
      if (s === e && !text) return;
      cfg.edit(s, e, text);
      api.pending = { start: caret == null ? s + (text || '').length : caret };
      cfg.after();
    }

    el.addEventListener('beforeinput', function (ev) {
      const w = win();
      if (!w) { ev.preventDefault(); return; }
      const sel = getSel(el);
      if (!sel) return;
      const t = ev.inputType;
      const text = w.doc.text.slice(w.from, w.to);

      if (t === 'insertCompositionText' || t === 'deleteCompositionText' ||
        t === 'insertFromComposition') return; // handled on compositionend

      ev.preventDefault();

      let s = sel.start, e = sel.end, ins = null;

      switch (t) {
        case 'insertText': ins = ev.data == null ? '' : ev.data; break;
        case 'insertReplacementText': ins = ev.data == null ? '' : ev.data; break;
        case 'insertLineBreak':
        case 'insertParagraph': ins = '\n'; break;
        case 'insertFromPaste':
        case 'insertFromDrop': {
          const dt = ev.dataTransfer;
          ins = dt ? (dt.getData('text/plain') || '') : '';
          break;
        }
        case 'deleteContentBackward':
          if (s === e) s = Math.max(0, s - 1);
          ins = ''; break;
        case 'deleteContentForward':
          if (s === e) e = Math.min(text.length, e + 1);
          ins = ''; break;
        case 'deleteWordBackward':
          if (s === e) s = wordBack(text, s);
          ins = ''; break;
        case 'deleteWordForward':
          if (s === e) e = wordFwd(text, e);
          ins = ''; break;
        case 'deleteSoftLineBackward':
        case 'deleteHardLineBackward':
          if (s === e) s = text.lastIndexOf('\n', Math.max(0, s - 1)) + 1;
          ins = ''; break;
        case 'deleteByCut':
        case 'deleteByDrag':
        case 'deleteContent':
          ins = ''; break;
        case 'formatBold': mark('b', s, e); return;
        case 'formatItalic': mark('i', s, e); return;
        case 'formatUnderline': mark('u', s, e); return;
        default: return;
      }
      if (ins === null) return;
      doEdit(s, e, ins);
    });

    el.addEventListener('paste', function (ev) {
      ev.preventDefault();
      const sel = getSel(el);
      if (!sel) return;
      const txt = (ev.clipboardData && ev.clipboardData.getData('text/plain')) || '';
      if (txt) doEdit(sel.start, sel.end, txt);
    });

    el.addEventListener('keydown', function (ev) {
      if (!(ev.ctrlKey || ev.metaKey) || ev.altKey) return;
      const k = ev.key.toLowerCase();

      /* undo / redo — we suppress the browser's own history (we own the DOM),
       * so without this Ctrl+Z did nothing at all. */
      if (k === 'z' || k === 'y') {
        ev.preventDefault();
        const redo = (k === 'y') || ev.shiftKey;
        const moved = redo ? SB.History.redo() : SB.History.undo();
        if (!moved) SB.toast(redo ? 'Nothing to redo' : 'Nothing to undo');
        return;
      }
      if (k !== 'b' && k !== 'i' && k !== 'u') return;
      const sel = getSel(el);
      ev.preventDefault();
      if (!sel || sel.start === sel.end) return;
      mark(k, sel.start, sel.end);
    });

    el.addEventListener('compositionstart', function () { api.composing = true; });
    el.addEventListener('compositionend', function () {
      api.composing = false;
      reconcile();
    });

    /* safety net: if anything slipped past the interceptors, diff and repair */
    el.addEventListener('input', function () {
      if (api.composing) return;
      setTimeout(reconcile, 0);
    });

    function reconcile() {
      const w = win();
      if (!w || api.composing) return;
      const cur = textOf(el);
      const exp = w.doc.text.slice(w.from, w.to);
      if (cur === exp) return;
      let p = 0;
      const n = Math.min(cur.length, exp.length);
      while (p < n && cur.charAt(p) === exp.charAt(p)) p++;
      let sfx = 0;
      while (sfx < n - p && cur.charAt(cur.length - 1 - sfx) === exp.charAt(exp.length - 1 - sfx)) sfx++;
      const s = p, e = exp.length - sfx, ins = cur.slice(p, cur.length - sfx);
      cfg.edit(s, e, ins);
      api.pending = { start: s + ins.length };
      cfg.after();
    }

    api.render();
    return api;
  }

  SB.Editor = {
    attach: attach, getSel: getSel, setSel: setSel, textOf: textOf
  };

})(window.SB);

</script>
<script>
/* ===== js/board.js ===== */
/* board.js — scene list, scene blocks, shot cards, drag & drop. */
(function (SB) {
  'use strict';

  const DND_SHOT = 'application/x-sb-shot';
  const DND_SCENE = 'application/x-sb-scene';

  const B = {
    scriptEditors: {},   // shotId -> editor api
    scriptEls: {}        // shotId -> element
  };

  function P() { return SB.app.project; }

  /* ---------------- scene navigator ---------------- */

  function renderSceneList() {
    const host = document.getElementById('sceneList');
    host.innerHTML = '';
    P().scenes.forEach(function (sc, idx) {
      const it = SB.el('div', 'scene-item' + (SB.app.selectedSceneId === sc.id ? ' sel' : ''));
      it.draggable = true;
      it.dataset.scene = sc.id;
      const t = SB.el('div');
      t.innerHTML = '<span class="num">' + (idx + 1) + '</span><span class="ttl">' +
        SB.esc(sc.heading || '(untitled scene)') + '</span>';
      it.appendChild(t);
      it.appendChild(SB.el('div', 'cnt', sc.shots.length + ' shot' + (sc.shots.length === 1 ? '' : 's')));

      it.addEventListener('click', function () {
        SB.app.selectedSceneId = sc.id;
        renderSceneList();
        const blk = document.querySelector('.scene-block[data-scene="' + sc.id + '"]');
        if (blk) blk.scrollIntoView({ behavior: 'smooth', block: 'start' });
        document.querySelectorAll('.scene-head').forEach(function (h) {
          h.classList.toggle('sel', h.parentNode.dataset.scene === sc.id);
        });
      });

      it.addEventListener('dragstart', function (ev) {
        ev.dataTransfer.setData(DND_SCENE, sc.id);
        ev.dataTransfer.effectAllowed = 'move';
      });
      it.addEventListener('dragover', function (ev) {
        const types = ev.dataTransfer.types;
        /* dropping a CARD on a scene here moves it into that scene — the
         * shortest way to reach a scene that is off-screen on the board */
        if (types.indexOf(DND_SHOT) >= 0) {
          ev.preventDefault();
          it.classList.add('drop-shot');
          return;
        }
        if (types.indexOf(DND_SCENE) < 0) return;
        ev.preventDefault();
        it.classList.add('drag-over');
      });
      it.addEventListener('dragleave', function () {
        it.classList.remove('drag-over');
        it.classList.remove('drop-shot');
      });
      it.addEventListener('drop', function (ev) {
        it.classList.remove('drag-over');
        it.classList.remove('drop-shot');
        const shotId = ev.dataTransfer.getData(DND_SHOT);
        if (shotId) {
          ev.preventDefault();
          SB.Model.moveShot(P(), shotId, sc.id, sc.shots.length);
          SB.app.selectedSceneId = sc.id;
          SB.app.changed(true);
          const f = SB.Model.findShot(P(), shotId);
          if (f) SB.toast('Moved to scene ' + (idx + 1) + ' — now ' + f.code);
          return;
        }
        const id = ev.dataTransfer.getData(DND_SCENE);
        if (!id) return;
        ev.preventDefault();
        const r = it.getBoundingClientRect();
        const before = ev.clientY < r.top + r.height / 2;
        SB.Model.moveScene(P(), id, before ? idx : idx + 1);
        SB.app.changed(true);
      });

      host.appendChild(it);
    });
  }

  /* ---------------- board ---------------- */

  /* Dragging a card to a scene further down the board needs the board to
   * follow — Chrome will not scroll a container on its own. */
  function armAutoScroll() {
    if (B.autoScroll) return;
    B.autoScroll = true;
    const panel = document.getElementById('boardPanel');
    panel.addEventListener('dragover', function (ev) {
      if (ev.dataTransfer.types.indexOf(DND_SHOT) < 0) return;
      const r = panel.getBoundingClientRect();
      const edge = 70;
      if (ev.clientY < r.top + edge) panel.scrollTop -= 18;
      else if (ev.clientY > r.bottom - edge) panel.scrollTop += 18;
    });
    document.addEventListener('dragend', function () {
      document.querySelectorAll('.drag-over,.drop-shot,.dragging').forEach(function (el) {
        el.classList.remove('drag-over');
        el.classList.remove('drop-shot');
        el.classList.remove('dragging');
      });
    });
  }

  function render() {
    armAutoScroll();
    B.scriptEditors = {};
    B.scriptEls = {};
    const board = document.getElementById('board');
    board.innerHTML = '';
    P().scenes.forEach(function (sc, si) { board.appendChild(sceneBlock(sc, si)); });
    renderSceneList();
    SB.ScriptMode.refresh();
  }

  function sceneBlock(sc, si) {
    const blk = SB.el('div', 'scene-block');
    blk.dataset.scene = sc.id;

    const head = SB.el('div', 'scene-head' + (SB.app.selectedSceneId === sc.id ? ' sel' : ''));
    head.appendChild(SB.el('div', 'snum', 'Scene ' + (si + 1)));

    const fields = SB.el('div', 'fields');
    const h = document.createElement('input');
    h.className = 'sh-heading';
    h.value = sc.heading || '';
    h.placeholder = 'Scene heading';
    h.addEventListener('input', function () {
      sc.heading = h.value; SB.app.changed(false); renderSceneList();
    });
    const d = document.createElement('textarea');
    d.className = 'sh-desc';
    d.rows = 1;
    d.value = sc.description || '';
    d.placeholder = 'Scene description';
    d.addEventListener('input', function () { sc.description = d.value; SB.app.changed(false); });
    fields.appendChild(h); fields.appendChild(d);
    head.appendChild(fields);

    const acts = SB.el('div', 'scene-actions');
    const bAdd = SB.el('button', 'mini', '+ Shot');
    bAdd.onclick = function () {
      const sh = SB.Model.addShot(P(), sc.id, {});
      SB.app.selectedShotId = sh.id;
      SB.app.changed(true);
    };
    const bAddScene = SB.el('button', 'mini', '+ Scene below');
    bAddScene.onclick = function () { SB.Model.addScene(P(), si); SB.app.changed(true); };
    const bDel = SB.el('button', 'mini danger', 'Delete scene');
    bDel.onclick = function () {
      if (sc.shots.length && !confirm('Delete "' + (sc.heading || 'scene') + '" and its ' +
        sc.shots.length + ' shot(s)? Script text stays in the master script.')) return;
      SB.Model.deleteScene(P(), sc.id);
      SB.app.changed(true);
    };
    acts.appendChild(bAdd); acts.appendChild(bAddScene); acts.appendChild(bDel);
    head.appendChild(acts);
    blk.appendChild(head);

    const shots = SB.el('div', 'shots');
    shots.dataset.scene = sc.id;
    sc.shots.forEach(function (sh, sj) { shots.appendChild(card(sh, sc, si, sj)); });

    const add = SB.el('button', 'add-shot', '+ Add shot');
    add.onclick = function () {
      const s = SB.Model.addShot(P(), sc.id, {});
      SB.app.selectedShotId = s.id;
      SB.app.changed(true);
    };
    shots.appendChild(add);

    shots.addEventListener('dragover', function (ev) {
      if (ev.dataTransfer.types.indexOf(DND_SHOT) < 0) return;
      ev.preventDefault();
      ev.stopPropagation();
      shots.classList.add('drag-over');
    });
    shots.addEventListener('dragleave', function (ev) {
      if (!shots.contains(ev.relatedTarget)) shots.classList.remove('drag-over');
    });
    shots.addEventListener('drop', function (ev) {
      if (ev.dataTransfer.types.indexOf(DND_SHOT) < 0) return;
      ev.preventDefault();
      ev.stopPropagation();
      shots.classList.remove('drag-over');
      const id = ev.dataTransfer.getData(DND_SHOT);
      if (!id) return;
      SB.Model.moveShot(P(), id, sc.id, sc.shots.length);
      SB.app.changed(true);
    });

    blk.appendChild(shots);

    /* Anywhere in the scene block — including its heading — accepts a card.
     * Aiming at a scene's title is the obvious gesture; it used to do nothing. */
    blk.addEventListener('dragover', function (ev) {
      if (ev.dataTransfer.types.indexOf(DND_SHOT) < 0) return;
      ev.preventDefault();
      blk.classList.add('drag-over');
    });
    blk.addEventListener('dragleave', function (ev) {
      if (!blk.contains(ev.relatedTarget)) blk.classList.remove('drag-over');
    });
    blk.addEventListener('drop', function (ev) {
      if (ev.dataTransfer.types.indexOf(DND_SHOT) < 0) return;
      ev.preventDefault();
      blk.classList.remove('drag-over');
      const id = ev.dataTransfer.getData(DND_SHOT);
      if (!id) return;
      SB.Model.moveShot(P(), id, sc.id, sc.shots.length);
      SB.app.changed(true);
    });

    return blk;
  }

  /* ---------------- one card ---------------- */

  function card(sh, sc, si, sj) {
    const c = SB.el('div', 'card' + (sh.noShot ? ' noshot' : '') +
      (SB.app.selectedShotId === sh.id ? ' sel' : ''));
    c.dataset.shot = sh.id;
    c.style.borderLeftColor = sh.color;

    c.addEventListener('dragover', function (ev) {
      if (ev.dataTransfer.types.indexOf(DND_SHOT) < 0) return;
      ev.preventDefault(); ev.stopPropagation();
      c.classList.add('drag-over');
    });
    c.addEventListener('dragleave', function () { c.classList.remove('drag-over'); });
    c.addEventListener('drop', function (ev) {
      if (ev.dataTransfer.types.indexOf(DND_SHOT) < 0) return;
      ev.preventDefault(); ev.stopPropagation();
      c.classList.remove('drag-over');
      const id = ev.dataTransfer.getData(DND_SHOT);
      if (!id || id === sh.id) return;
      const r = c.getBoundingClientRect();
      const before = ev.clientX < r.left + r.width / 2;
      SB.Model.moveShot(P(), id, sc.id, sj + (before ? 0 : 1));
      SB.app.changed(true);
    });
    c.addEventListener('mousedown', function () {
      if (SB.app.selectedShotId === sh.id) return;
      SB.app.selectedShotId = sh.id;
      document.querySelectorAll('.card.sel').forEach(function (x) { x.classList.remove('sel'); });
      c.classList.add('sel');
      SB.ScriptMode.refresh();
    });

    /* --- head --- */
    const head = SB.el('div', 'card-head');
    head.draggable = true;
    head.addEventListener('dragstart', function (ev) {
      ev.dataTransfer.setData(DND_SHOT, sh.id);
      ev.dataTransfer.effectAllowed = 'move';
      c.classList.add('dragging');
    });
    head.addEventListener('dragend', function () { c.classList.remove('dragging'); });

    head.appendChild(SB.el('span', 'code', SB.Model.code(si, sj)));

    const sel = document.createElement('select');
    sel.className = 'type';
    const types = P().settings.shotTypes.slice();
    if (sh.type && types.indexOf(sh.type) < 0) types.unshift(sh.type);
    types.forEach(function (t) {
      const o = document.createElement('option');
      o.value = t; o.textContent = t;
      if (t === sh.type) o.selected = true;
      sel.appendChild(o);
    });
    sel.addEventListener('change', function () { sh.type = sel.value; SB.app.changed(false); });
    head.appendChild(sel);

    if (sh.noShot) head.appendChild(SB.el('span', 'badge noshot', 'no shot'));

    const acts = SB.el('div', 'ch-actions');
    const col = SB.el('button', 'swatch');
    col.style.background = sh.color;
    col.title = 'Card colour';
    col.onclick = function (ev) {
      ev.stopPropagation();
      palette(col, sh.color, function (hex) {
        sh.color = hex;
        col.style.background = hex;
        c.style.borderLeftColor = hex;
        SB.app.changed(false);
      });
    };
    acts.appendChild(col);

    const ns = SB.el('button', 'mini', sh.noShot ? 'shot' : 'no shot');
    ns.title = 'Mark as “no shot” — stays on the board, excluded from prompts and PDF';
    ns.onclick = function () { sh.noShot = !sh.noShot; SB.app.changed(true); };
    acts.appendChild(ns);

    const del = SB.el('button', 'mini danger', '✕');
    del.title = 'Delete shot (script text stays in the master)';
    del.onclick = function () {
      if (!confirm('Delete shot ' + SB.Model.code(si, sj) + '? The script text stays in the master script.')) return;
      SB.Model.deleteShot(P(), sh.id);
      SB.app.changed(true);
    };
    acts.appendChild(del);
    head.appendChild(acts);
    c.appendChild(head);

    /* --- frame --- */
    c.appendChild(frame(sh));

    /* --- cast --- */
    if (SB.Personas.all(P()).length) c.appendChild(castRow(sh));

    /* --- script box --- */
    const linked = !!sh.link;
    const lbl = SB.el('div', 'box-label');
    const dot = SB.el('span', 'link-dot' + (sh.broken ? ' broken' : (linked ? '' : ' free')));
    lbl.appendChild(dot);
    lbl.appendChild(SB.el('span', null,
      sh.broken ? 'script — link broken' : (linked ? 'script — linked' : 'script — freestanding')));
    const la = SB.el('div', 'lbl-actions');
    if (linked) {
      const bl = SB.el('button', null, 'break link');
      bl.title = 'Stop syncing with the master script; keep the text as this shot’s own';
      bl.onclick = function () { SB.Model.breakLink(P(), sh); SB.app.changed(true); };
      la.appendChild(bl);
      const go = SB.el('button', null, 'show');
      go.onclick = function () {
        SB.app.selectedShotId = sh.id;
        SB.ScriptMode.open();
        SB.ScriptMode.scrollTo(sh);
      };
      la.appendChild(go);
    }
    lbl.appendChild(la);
    c.appendChild(lbl);

    const box = SB.el('div', 'script-box' + (sh.broken ? ' broken' : ''));
    box.dataset.shot = sh.id;
    B.scriptEls[sh.id] = box;
    B.scriptEditors[sh.id] = SB.Editor.attach(box, {
      get: function () {
        const f = SB.Model.findShot(P(), sh.id);
        return f ? SB.Model.windowFor(P(), f.shot) : null;
      },
      edit: function (s, e, t) { SB.Model.applyShotEdit(P(), sh, s, e, t); },
      toggle: function (type, s, e) {
        const w = SB.Model.windowFor(P(), sh);
        SB.Doc.toggleMark(w.doc, type, w.from + s, w.from + e);
      },
      after: function () { SB.app.scriptChanged(); }
    });
    c.appendChild(box);

    /* --- description --- */
    const dl = SB.el('div', 'box-label');
    dl.appendChild(SB.el('span', null, 'description'));
    c.appendChild(dl);

    const desc = document.createElement('textarea');
    desc.className = 'desc-box';
    desc.value = sh.description || '';
    desc.placeholder = 'What we see. This is what the prompt writer reads.';
    desc.addEventListener('input', function () { sh.description = desc.value; SB.app.changed(false); });
    c.appendChild(desc);

    /* --- prompts (hidden until asked for, in the Prompts panel) --- */
    const st = P().settings;
    if (st.showImagePrompt) {
      const im = SB.Model.imageModel(P());
      if (im) c.appendChild(promptBox(sh, im, 'imagePrompt', 'first-frame prompt'));
    }
    if (st.showVideoPrompt) {
      const vm = SB.Model.videoModel(P());
      if (vm) c.appendChild(promptBox(sh, vm, 'videoPrompt', 'image→video prompt'));
    }

    /* --- comments --- */
    if (SB.app.commentMode || (sh.comments && sh.comments.length)) {
      c.appendChild(SB.Comments.list(sh));
    }

    return c;
  }

  /* Who is in this shot. The order is the order their reference images are fed
   * to the model, so it is shown. */
  function castRow(sh) {
    const row = SB.el('div', 'cast-row');
    row.dataset.shot = sh.id;
    const cast = SB.Personas.forShot(P(), sh);
    cast.forEach(function (per) {
      const chip = SB.el('span', 'cast-chip' + (per.image ? ' has-img' : ''),
        (per.image ? '◉ ' : '') + (per.name || 'unnamed'));
      chip.title = per.image
        ? (per.name + ' — reference image supplied')
        : (per.name + ' — no reference image, described in full');
      row.appendChild(chip);
    });
    if (!cast.length) row.appendChild(SB.el('span', 'cast-empty', 'no cast'));

    const b = SB.el('button', 'mini cast-edit', cast.length ? 'edit' : '+ cast');
    b.onclick = function (ev) {
      ev.stopPropagation();
      castPicker(b, sh);
    };
    row.appendChild(b);
    return row;
  }

  function castPicker(anchor, sh) {
    const old = document.querySelector('.cast-pop');
    if (old) old.remove();
    const pop = SB.el('div', 'cast-pop');
    SB.Personas.all(P()).forEach(function (per) {
      const l = SB.el('label', 'cast-opt');
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = (sh.personaIds || []).indexOf(per.id) >= 0;
      cb.onchange = function () {
        SB.Personas.toggleOnShot(P(), sh, per.id);
        SB.Store.touch();
        refreshCast();
      };
      l.appendChild(cb);
      l.appendChild(document.createTextNode(' ' + (per.name || 'unnamed')));
      pop.appendChild(l);
    });
    const manage = SB.el('button', 'mini', 'manage personas…');
    manage.onclick = function () { pop.remove(); SB.PersonaPanel.open(); };
    pop.appendChild(manage);

    document.body.appendChild(pop);
    const r = anchor.getBoundingClientRect();
    pop.style.left = Math.min(r.left, window.innerWidth - pop.offsetWidth - 8) + 'px';
    pop.style.top = Math.min(r.bottom + 4, window.innerHeight - pop.offsetHeight - 8) + 'px';
    setTimeout(function () {
      document.addEventListener('mousedown', function away(ev) {
        if (pop.contains(ev.target)) return;
        pop.remove();
        document.removeEventListener('mousedown', away);
      });
    }, 0);
  }

  /* Redraw just the cast rows — cheaper than rebuilding every card. */
  function refreshCast() {
    document.querySelectorAll('.cast-row').forEach(function (row) {
      const f = SB.Model.findShot(P(), row.dataset.shot);
      if (!f) return;
      const fresh = castRow(f.shot);
      row.parentNode.replaceChild(fresh, row);
    });
    SB.PersonaPanel.refresh();
  }

  /* a small popover of card colours that read on both themes */
  function palette(anchor, current, pick) {
    const old = document.querySelector('.pal-pop');
    if (old) old.remove();
    const pop = SB.el('div', 'pal-pop');
    SB.Model.CARD_COLORS.forEach(function (hex) {
      const b = SB.el('button', hex.toLowerCase() === String(current).toLowerCase() ? 'on' : '');
      b.style.background = hex;
      b.onclick = function (ev) { ev.stopPropagation(); pop.remove(); pick(hex); };
      pop.appendChild(b);
    });
    document.body.appendChild(pop);
    const r = anchor.getBoundingClientRect();
    pop.style.left = Math.min(r.left, window.innerWidth - pop.offsetWidth - 8) + 'px';
    pop.style.top = Math.min(r.bottom + 4, window.innerHeight - pop.offsetHeight - 8) + 'px';
    setTimeout(function () {
      document.addEventListener('mousedown', function away(ev) {
        if (pop.contains(ev.target)) return;
        pop.remove();
        document.removeEventListener('mousedown', away);
      });
    }, 0);
  }

  function promptBox(sh, m, field, title) {
    const pr = sh.prompts[m.id] || null;
    const wrap = SB.el('div', 'prompt-box');
    const t = SB.el('div', 'ptitle');
    t.appendChild(SB.el('span', null, title + ' · ' + m.name));

    /* the brand forbids gendered language; say so if some got through */
    const flagged = (pr && pr.flagged && pr.flagged[field]) || null;
    if (flagged && flagged.length) {
      const warn = SB.el('span', 'badge warn', 'gendered');
      warn.title = 'This prompt still contains: ' + flagged.join(', ') +
        '. The rewrite pass could not clear it — edit it or generate again.';
      t.appendChild(warn);
    }
    const gen = SB.el('button', 'mini', 'generate');
    gen.style.marginLeft = 'auto';
    gen.onclick = function () {
      gen.disabled = true; gen.textContent = '…';
      const roles = field === 'imagePrompt' ? { image: true } : { video: true };
      SB.Prompts.generateFor([sh], { roles: roles })
        .catch(function (e) {
          SB.toast(e.message || String(e), true);
          gen.disabled = false; gen.textContent = 'generate';
        });
    };
    t.appendChild(gen);
    wrap.appendChild(t);
    const ta = document.createElement('textarea');
    ta.value = (pr && pr[field]) || '';
    ta.placeholder = sh.noShot ? '(“no shot” — excluded from generation)' : 'not generated yet';
    ta.addEventListener('input', function () {
      sh.prompts[m.id] = sh.prompts[m.id] || { imagePrompt: '', videoPrompt: '', modelName: m.name };
      sh.prompts[m.id][field] = ta.value;
      sh.prompts[m.id].modelName = m.name;
      SB.app.changed(false);
    });
    wrap.appendChild(ta);
    return wrap;
  }

  /* ---------------- image frame ---------------- */

  function frame(sh) {
    const f = SB.el('div', 'frame');
    if (sh.image) {
      const img = document.createElement('img');
      img.className = 'shot-img';
      img.src = sh.image.data;
      f.appendChild(img);
      if (sh.annotation) {
        const a = document.createElement('img');
        a.className = 'anno';
        a.src = sh.annotation;
        f.appendChild(a);
      }
    } else {
      f.appendChild(SB.el('div', 'drop-hint', 'drop / paste an image, or click to load'));
    }

    const tools = SB.el('div', 'frame-tools');
    if (SB.app.commentMode && sh.image) {
      const dr = SB.el('button', 'mini', 'draw');
      dr.onclick = function (ev) { ev.stopPropagation(); SB.Comments.draw(sh); };
      tools.appendChild(dr);
      if (sh.annotation) {
        const cl = SB.el('button', 'mini danger', 'clear ink');
        cl.onclick = function (ev) { ev.stopPropagation(); sh.annotation = null; SB.app.changed(true); };
        tools.appendChild(cl);
      }
    }
    if (sh.image) {
      const rm = SB.el('button', 'mini danger', '✕');
      rm.title = 'Remove image';
      rm.onclick = function (ev) { ev.stopPropagation(); sh.image = null; SB.app.changed(true); };
      tools.appendChild(rm);
    }
    f.appendChild(tools);

    f.addEventListener('click', function () {
      SB.pickImageFile().then(function (file) { if (file) setImage(sh, file); });
    });
    f.addEventListener('dragover', function (ev) {
      if (ev.dataTransfer.types.indexOf(DND_SHOT) >= 0) return;
      ev.preventDefault();
      ev.dataTransfer.dropEffect = 'copy';
      f.classList.add('drag-over');
    });
    f.addEventListener('dragleave', function () { f.classList.remove('drag-over'); });
    f.addEventListener('drop', function (ev) {
      if (ev.dataTransfer.types.indexOf(DND_SHOT) >= 0) return;
      ev.preventDefault();
      f.classList.remove('drag-over');
      SB.imageFromTransfer(ev.dataTransfer).then(function (src) {
        if (!src) { SB.toast('No image found in that drop', true); return; }
        setImage(sh, src);
      });
    });
    return f;
  }

  function setImage(sh, src) {
    return SB.downscaleImage(src).then(function (img) {
      sh.image = img;
      SB.app.changed(true);
    }).catch(function (e) { SB.toast('Image failed: ' + e.message, true); });
  }

  /* ---------------- live script sync ---------------- */

  function renderScriptWindows() {
    Object.keys(B.scriptEditors).forEach(function (id) {
      const f = SB.Model.findShot(P(), id);
      const el = B.scriptEls[id];
      if (!f || !el) return;
      el.classList.toggle('broken', !!f.shot.broken);
      B.scriptEditors[id].render();
      const lbl = el.previousSibling;
      if (lbl && lbl.classList && lbl.classList.contains('box-label')) {
        const dot = lbl.querySelector('.link-dot');
        const txt = lbl.querySelector('span:nth-child(2)');
        const linked = !!f.shot.link;
        if (dot) dot.className = 'link-dot' + (f.shot.broken ? ' broken' : (linked ? '' : ' free'));
        if (txt) txt.textContent = f.shot.broken ? 'script — link broken' :
          (linked ? 'script — linked' : 'script — freestanding');
      }
    });
  }

  SB.Board = {
    render: render,
    renderSceneList: renderSceneList,
    renderScriptWindows: renderScriptWindows,
    refreshCast: refreshCast,
    setImage: setImage,
    DND_SHOT: DND_SHOT
  };

})(window.SB);

</script>
<script>
/* ===== js/scriptmode.js ===== */
/* scriptmode.js — the master script panel: live editing, capture, highlights. */
(function (SB) {
  'use strict';

  let masterEl, editor, capBtn, form, panel;
  let cover = null;          // Uint8Array coverage over master text
  let activeRange = null;    // selected shot's range, drawn with an underline
  let pendingSel = null;     // range captured when the user clicked "Capture shot"
  let lastSel = null;        // last real selection made in the master script

  function P() { return SB.app.project; }

  function init() {
    panel = document.getElementById('scriptPanel');
    masterEl = document.getElementById('masterScript');
    capBtn = document.getElementById('btnCapture');
    form = document.getElementById('captureForm');

    editor = SB.Editor.attach(masterEl, {
      get: function () {
        const p = P();
        return p ? { doc: p.master, from: 0, to: p.master.text.length } : null;
      },
      edit: function (s, e, t) { SB.Model.applyMasterEdit(P(), s, e, t, null); },
      toggle: function (type, s, e) { SB.Doc.toggleMark(P().master, type, s, e); },
      after: function () { SB.app.scriptChanged(); },
      extra: extraClass
    });

    /* Remember the last real selection made in the master. Chrome drops the
     * DOM selection the moment focus moves, so without latching it the button
     * stayed lit after you clicked a card and then Capture did nothing. */
    document.addEventListener('selectionchange', function () {
      if (document.activeElement !== masterEl) return;
      const s = SB.Editor.getSel(masterEl);
      lastSel = (s && s.end > s.start) ? { from: s.start, to: s.end } : null;
      syncCaptureBtn();
    });

    /* don't let the button steal focus — keeps the selection visible too */
    capBtn.addEventListener('mousedown', function (ev) { ev.preventDefault(); });

    capBtn.addEventListener('click', function () {
      const live = SB.Editor.getSel(masterEl);
      const s = (live && live.end > live.start) ? { from: live.start, to: live.end } : lastSel;
      if (!s || s.to <= s.from) {
        SB.toast('Select some script text first', true);
        syncCaptureBtn();
        return;
      }
      pendingSel = { from: s.from, to: s.to };
      showForm();
    });

    /* clicking a dead part of the panel should land you in the script */
    panel.addEventListener('mousedown', function (ev) {
      if (ev.target === panel || ev.target.classList.contains('script-hint')) {
        ev.preventDefault();
        masterEl.focus();
      }
    });
  }

  function syncCaptureBtn() {
    if (!capBtn) return;
    const ok = !!(lastSel && lastSel.to > lastSel.from &&
      lastSel.to <= (P() ? P().master.text.length : 0));
    capBtn.disabled = !ok;
    capBtn.title = ok
      ? 'Make a shot from the selected text'
      : 'Select some text in the script first';
  }

  /* Any edit moves the text under a remembered selection — drop it. */
  function invalidateSelection() {
    if (document.activeElement === masterEl) return;   // still live, selectionchange owns it
    lastSel = null;
    syncCaptureBtn();
  }

  function extraClass(i) {
    let c = '';
    if (cover && i < cover.length && cover[i] > 0) c = 'h' + Math.min(3, cover[i]);
    if (activeRange && i >= activeRange.from && i < activeRange.to) c += (c ? ' ' : '') + 'hactive';
    return c;
  }

  function refresh() {
    if (!masterEl || !P()) return;
    cover = SB.Model.coverage(P());
    activeRange = null;
    if (SB.app.selectedShotId) {
      const f = SB.Model.findShot(P(), SB.app.selectedShotId);
      if (f && f.shot.link) activeRange = { from: f.shot.link.from, to: f.shot.link.to };
    }
    editor.render();
  }

  function open() {
    panel.classList.remove('hidden');
    document.getElementById('btnScript').classList.add('on');
    refresh();
  }
  function close() {
    panel.classList.add('hidden');
    document.getElementById('btnScript').classList.remove('on');
  }
  function toggle() { panel.classList.contains('hidden') ? open() : close(); }
  function isOpen() { return !panel.classList.contains('hidden'); }

  function scrollTo(shot) {
    const el = masterEl.querySelector('.hactive');
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  /* ---------- capture form ---------- */

  function showForm() {
    const p = P();
    const text = p.master.text.slice(pendingSel.from, pendingSel.to);
    const sceneId = SB.app.selectedSceneId || (p.scenes[p.scenes.length - 1] || {}).id;

    form.innerHTML = '';
    form.classList.remove('hidden');

    const prev = SB.el('div', 'preview', text);
    form.appendChild(prev);

    const r1 = SB.el('div', 'row');
    r1.appendChild(SB.el('label', null, 'Shot type'));
    const tsel = document.createElement('select');
    p.settings.shotTypes.forEach(function (t) {
      const o = document.createElement('option'); o.value = t; o.textContent = t; tsel.appendChild(o);
    });
    r1.appendChild(tsel);
    form.appendChild(r1);

    const r2 = SB.el('div', 'row');
    r2.appendChild(SB.el('label', null, 'Scene'));
    const ssel = document.createElement('select');
    p.scenes.forEach(function (sc, i) {
      const o = document.createElement('option');
      o.value = sc.id;
      o.textContent = (i + 1) + '. ' + (sc.heading || 'untitled');
      if (sc.id === sceneId) o.selected = true;
      ssel.appendChild(o);
    });
    r2.appendChild(ssel);
    form.appendChild(r2);

    const r3 = SB.el('div', 'row');
    const nsLbl = SB.el('label', null, '');
    nsLbl.style.minWidth = '0';
    const ns = document.createElement('input');
    ns.type = 'checkbox';
    nsLbl.appendChild(ns);
    nsLbl.appendChild(document.createTextNode(' no shot / no storyboard'));
    r3.appendChild(nsLbl);
    form.appendChild(r3);

    const r4 = SB.el('div', 'row');
    r4.appendChild(SB.el('span', 'spacer'));
    const cancel = SB.el('button', 'mini', 'Cancel');
    cancel.onclick = hideForm;
    const done = SB.el('button', 'mini primary', 'Complete');
    done.onclick = function () {
      const sh = SB.Model.addShot(P(), ssel.value, {
        type: tsel.value,
        noShot: ns.checked,
        link: { from: pendingSel.from, to: pendingSel.to }
      });
      hideForm();
      if (sh) {
        SB.app.selectedShotId = sh.id;
        SB.app.changed(true);
        const el = document.querySelector('.card[data-shot="' + sh.id + '"]');
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    };
    r4.appendChild(cancel); r4.appendChild(done);
    form.appendChild(r4);

    tsel.focus();
  }

  function hideForm() {
    form.classList.add('hidden');
    form.innerHTML = '';
    pendingSel = null;
    lastSel = null;
    syncCaptureBtn();
  }

  SB.ScriptMode = {
    init: init, refresh: refresh, open: open, close: close, toggle: toggle,
    isOpen: isOpen, scrollTo: scrollTo,
    invalidateSelection: invalidateSelection, syncCaptureBtn: syncCaptureBtn,
    lastSelection: function () { return lastSel; }
  };

})(window.SB);

</script>
<script>
/* ===== js/comments.js ===== */
/* comments.js — comment mode: per-shot comment list + transparent-PNG ink layer.
 * Comments and ink belong to the CURRENT version and are frozen into a version
 * when a new one is created (see versions.js).
 */
(function (SB) {
  'use strict';

  function P() { return SB.app.project; }

  function list(sh) {
    const wrap = SB.el('div', 'comments');
    (sh.comments || []).forEach(function (cm) {
      const row = SB.el('div', 'comment');
      row.appendChild(SB.el('span', 'when', new Date(cm.at).toLocaleDateString(undefined,
        { month: 'short', day: 'numeric' })));
      row.appendChild(SB.el('span', 'txt', cm.text));
      const d = SB.el('button', 'del', '✕');
      d.onclick = function () {
        sh.comments = sh.comments.filter(function (x) { return x.id !== cm.id; });
        SB.app.changed(true);
      };
      row.appendChild(d);
      wrap.appendChild(row);
    });

    if (SB.app.commentMode) {
      const add = SB.el('div', 'comment-add');
      const inp = document.createElement('input');
      inp.placeholder = 'Add a comment…';
      const b = SB.el('button', 'mini primary', 'Add');
      function submit() {
        const t = inp.value.trim();
        if (!t) return;
        sh.comments.push({ id: SB.uid('cm'), text: t, at: Date.now() });
        inp.value = '';
        SB.app.changed(true);
      }
      inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); submit(); } });
      b.onclick = submit;
      add.appendChild(inp); add.appendChild(b);
      wrap.appendChild(add);
    }
    return wrap;
  }

  /* ---------- ink ---------- */

  function draw(sh) {
    if (!sh.image) { SB.toast('Load an image first', true); return; }

    const body = SB.el('div');
    const wrap = SB.el('div', 'draw-wrap');
    const img = document.createElement('img');
    img.src = sh.image.data;
    const cv = document.createElement('canvas');
    cv.width = sh.image.w; cv.height = sh.image.h;
    wrap.appendChild(img); wrap.appendChild(cv);
    body.appendChild(wrap);

    const tools = SB.el('div', 'draw-tools');
    const COLORS = ['#ff3b30', '#ffd60a', '#32d74b', '#0a84ff', '#ffffff', '#000000'];
    let color = COLORS[0], size = 4, erase = false;
    COLORS.forEach(function (c, i) {
      const sw = SB.el('button', 'sw' + (i === 0 ? ' on' : ''));
      sw.style.background = c;
      sw.onclick = function () {
        color = c; erase = false;
        tools.querySelectorAll('.sw').forEach(function (x) { x.classList.remove('on'); });
        sw.classList.add('on');
        eraseBtn.classList.remove('on');
      };
      tools.appendChild(sw);
    });
    const rng = document.createElement('input');
    rng.type = 'range'; rng.min = 1; rng.max = 20; rng.value = size; rng.style.width = '90px';
    rng.oninput = function () { size = +rng.value; };
    tools.appendChild(rng);
    const eraseBtn = SB.el('button', 'tb', 'Erase');
    eraseBtn.onclick = function () {
      erase = !erase;
      eraseBtn.classList.toggle('on', erase);
    };
    tools.appendChild(eraseBtn);
    const clr = SB.el('button', 'tb', 'Clear');
    clr.onclick = function () { ctx.clearRect(0, 0, cv.width, cv.height); };
    tools.appendChild(clr);
    body.appendChild(tools);

    const ctx = cv.getContext('2d');
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    if (sh.annotation) {
      const prev = new Image();
      prev.onload = function () { ctx.drawImage(prev, 0, 0, cv.width, cv.height); };
      prev.src = sh.annotation;
    }

    let drawing = false, last = null;
    function pos(ev) {
      const r = cv.getBoundingClientRect();
      return {
        x: (ev.clientX - r.left) * (cv.width / r.width),
        y: (ev.clientY - r.top) * (cv.height / r.height)
      };
    }
    cv.addEventListener('pointerdown', function (ev) {
      cv.setPointerCapture(ev.pointerId);
      drawing = true; last = pos(ev);
      stroke(last, last);
    });
    cv.addEventListener('pointermove', function (ev) {
      if (!drawing) return;
      const p = pos(ev);
      stroke(last, p);
      last = p;
    });
    cv.addEventListener('pointerup', function () { drawing = false; });
    cv.addEventListener('pointerleave', function () { drawing = false; });

    function stroke(a, b) {
      ctx.globalCompositeOperation = erase ? 'destination-out' : 'source-over';
      ctx.strokeStyle = color;
      ctx.lineWidth = erase ? size * 2.5 : size;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
    }

    SB.modal({
      title: 'Draw over frame',
      body: body,
      buttons: [
        { label: 'Cancel' },
        {
          label: 'Save ink', primary: true, onClick: function (close) {
            const data = ctx.getImageData(0, 0, cv.width, cv.height).data;
            let any = false;
            for (let i = 3; i < data.length; i += 4) { if (data[i] !== 0) { any = true; break; } }
            sh.annotation = any ? cv.toDataURL('image/png') : null;
            close();
            SB.app.changed(true);
          }
        }
      ]
    });
  }

  SB.Comments = { list: list, draw: draw };

})(window.SB);

</script>
<script>
/* ===== js/prompts.js ===== */
/* prompts.js — Gemini is the prompt WRITER. The app never generates media.
 *
 * Two roles, each with its own target model:
 *   image model -> the first-frame prompt      (stored on prompts[imageModel.id].imagePrompt)
 *   video model -> the image-to-video prompt   (stored on prompts[videoModel.id].videoPrompt)
 * Every model a shot has been run against keeps its prompts, forever.
 */
(function (SB) {
  'use strict';

  const ENDPOINT = 'https://generativelanguage.googleapis.com/v1beta/models/';

  function P() { return SB.app.project; }

  function fill(tpl, ctx) {
    return String(tpl || '').replace(/\{\{(\w+)\}\}/g, function (m, k) {
      return ctx[k] == null ? '' : String(ctx[k]);
    });
  }

  function contextFor(shot) {
    const f = SB.Model.findShot(P(), shot.id);
    const w = SB.Model.windowFor(P(), shot);
    return {
      MODEL: '',
      CODE: f ? f.code : '',
      SHOT_TYPE: shot.type || 'unspecified',
      SCENE: f ? (f.scene.heading || '') : '',
      SCENE_DESC: f ? (f.scene.description || '') : '',
      SCRIPT: w.doc.text.slice(w.from, w.to),
      DESCRIPTION: shot.description || ''
    };
  }

  const PREAMBLE = 'You write prompts for generative media models. Follow the instruction ' +
    'block(s) below exactly. Return the prompts themselves only — no commentary, no markdown fences.\n\n';

  function imageBlock(shot, m) {
    const ctx = contextFor(shot); ctx.MODEL = m.name;
    return '=== FIRST-FRAME IMAGE PROMPT — INSTRUCTIONS ===\n' + fill(m.imageTemplate, ctx) + '\n';
  }
  function videoBlock(shot, m) {
    const ctx = contextFor(shot); ctx.MODEL = m.name;
    return '=== IMAGE-TO-VIDEO PROMPT — INSTRUCTIONS ===\n' + fill(m.videoTemplate, ctx) + '\n';
  }

  /* Build the request list for one shot given the selected roles. */
  function jobsFor(shot, im, vm, roles) {
    const jobs = [];
    const wantI = roles.image && im, wantV = roles.video && vm;
    const sys = function (role, model) {
      const parts = [SB.Brand.systemFor(P(), shot, role)];
      const cast = SB.Personas.block(P(), shot, model);
      if (cast) parts.push(cast);
      return parts.filter(Boolean).join('\n\n');
    };
    if (wantI && wantV && im.id === vm.id) {
      jobs.push({
        text: PREAMBLE + 'Return JSON with the keys "imagePrompt" and "videoPrompt".\n\n' +
          imageBlock(shot, im) + '\n' + videoBlock(shot, vm),
        keys: ['imagePrompt', 'videoPrompt'],
        system: sys('both', im),
        targets: [{ model: im, field: 'imagePrompt' }, { model: vm, field: 'videoPrompt' }]
      });
      return jobs;
    }
    if (wantI) {
      jobs.push({
        text: PREAMBLE + 'Return JSON with the key "imagePrompt".\n\n' + imageBlock(shot, im),
        keys: ['imagePrompt'],
        system: sys('image', im),
        targets: [{ model: im, field: 'imagePrompt' }]
      });
    }
    if (wantV) {
      jobs.push({
        text: PREAMBLE + 'Return JSON with the key "videoPrompt".\n\n' + videoBlock(shot, vm),
        keys: ['videoPrompt'],
        system: sys('video', vm),
        targets: [{ model: vm, field: 'videoPrompt' }]
      });
    }
    return jobs;
  }

  function request(mdl, key, body) {
    return fetch(ENDPOINT + encodeURIComponent(mdl) + ':generateContent?key=' + encodeURIComponent(key), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function (r) {
      return r.text().then(function (t) {
        if (!r.ok) {
          let msg = t;
          try { msg = JSON.parse(t).error.message; } catch (e) { }
          let err;
          if (r.status === 429) {
            SB.GeminiModels.markExhausted(mdl);
            err = new Error('Gemini 429 — daily/rate limit reached for ' + mdl +
              '. Pick another model in the Prompts panel. (' + msg + ')');
          } else if (r.status === 404) {
            err = new Error('Gemini 404 — "' + mdl + '" is not available to this key. ' +
              'Settings → API → refresh the model list. (' + msg + ')');
          } else {
            err = new Error('Gemini ' + r.status + ': ' + msg);
          }
          err.status = r.status;
          err.raw = msg;
          throw err;
        }
        SB.GeminiModels.bump(mdl);
        return JSON.parse(t);
      });
    });
  }

  const NO_SCHEMA_HINT =
    '\n\nReply with ONLY the JSON object — start with { and end with }, no markdown fences.';

  /* One JSON-shaped question to the writer model. */
  function ask(text, schema, system) {
    const key = SB.Store.getApiKey();
    if (!key) return Promise.reject(new Error('No Google API key. Add one in Settings → API.'));
    const mdl = P().settings.geminiModel || SB.GeminiModels.DEFAULT;

    /* Gemma takes neither a response schema nor a systemInstruction — it gets
     * both folded into the one user turn instead. */
    const plain = SB.GeminiModels.isGemma(mdl);

    function build(withSchema) {
      const gen = { temperature: 0.8 };
      if (withSchema) {
        gen.responseMimeType = 'application/json';
        gen.responseSchema = schema;
      }
      let user = withSchema ? text : text + NO_SCHEMA_HINT;
      const body = { generationConfig: gen };
      if (system) {
        if (plain) user = system + '\n\n----\n\n' + user;
        else body.systemInstruction = { parts: [{ text: system }] };
      }
      body.contents = [{ role: 'user', parts: [{ text: user }] }];
      return body;
    }

    /* Gemma runs on the same endpoint but has no JSON mode — ask it in words.
     * Any other model that rejects the schema gets the same treatment on retry. */
    const useSchema = !plain;

    return request(mdl, key, build(useSchema)).catch(function (e) {
      const schemaProblem = /schema|json|mime|not supported|unsupported|invalid argument/i
        .test(String(e.raw || e.message || ''));
      if (useSchema && e.status === 400 && schemaProblem) {
        return request(mdl, key, build(false));
      }
      throw e;
    }).then(function (data) {
      const cand = data.candidates && data.candidates[0];
      const part = cand && cand.content && cand.content.parts && cand.content.parts[0];
      const raw = part && part.text;
      if (!raw) throw new Error('Gemini returned no text' + (cand && cand.finishReason ? ' (' + cand.finishReason + ')' : ''));
      try { return JSON.parse(raw); }
      catch (e) {
        const m = raw.match(/\{[\s\S]*\}/);
        if (!m) throw new Error('Could not parse the Gemini response');
        return JSON.parse(m[0]);
      }
    });
  }

  function callGemini(text, keys, system) {
    const props = {};
    keys.forEach(function (k) { props[k] = { type: 'STRING' }; });
    return ask(text, { type: 'OBJECT', properties: props, required: keys }, system);
  }

  function store(shot, model, field, value, flagged) {
    const cur = shot.prompts[model.id] || { imagePrompt: '', videoPrompt: '' };
    cur[field] = value || '';
    cur.modelName = model.name;
    cur.at = Date.now();
    cur.flagged = cur.flagged || {};
    if (flagged && flagged.length) cur.flagged[field] = flagged;
    else delete cur.flagged[field];
    shot.prompts[model.id] = cur;
  }

  /* "No gender references" is a hard brand rule, so it gets verified rather
   * than hoped for: one corrective rewrite, then a visible flag on the card if
   * the writer still won't let go of it. */
  function enforceNeutral(job, res) {
    if (!SB.Brand.brandOf(P()).enabled) return Promise.resolve({ res: res, flags: {} });
    const bad = {};
    let any = false;
    job.keys.forEach(function (k) {
      const terms = SB.Brand.genderedTerms(res[k]);
      if (terms.length) { bad[k] = terms; any = true; }
    });
    if (!any) return Promise.resolve({ res: res, flags: {} });

    const all = Object.keys(bad).reduce(function (a, k) { return a.concat(bad[k]); }, []);
    const fix = job.text +
      '\n\nYour previous draft used gendered language (' + all.join(', ') + '). ' +
      'Rewrite it with no gendered nouns, adjectives, titles or pronouns — ' +
      'use "the subject", "the person", or no pronoun at all. Keep everything else the same.';

    return callGemini(fix, job.keys, job.system).then(function (res2) {
      const still = {};
      job.keys.forEach(function (k) {
        const terms = SB.Brand.genderedTerms(res2[k]);
        if (terms.length) still[k] = terms;
      });
      return { res: res2, flags: still };
    }).catch(function () {
      return { res: res, flags: bad };   // rewrite failed — keep the draft, flag it
    });
  }

  /* opts = { roles:{image,video}, onProgress(done,total,failed) } */
  function generateFor(shots, opts) {
    opts = opts || {};
    const p = P();
    const im = SB.Model.imageModel(p), vm = SB.Model.videoModel(p);
    const roles = opts.roles || { image: true, video: true };
    if ((!roles.image || !im) && (!roles.video || !vm)) {
      return Promise.reject(new Error('Pick a target model first'));
    }

    const jobs = [];
    shots.forEach(function (s) {
      if (s.noShot) return;                        // "no shot" fragments never generate
      if (!(s.description || '').trim()) return;   // nothing for the writer to work from
      jobsFor(s, im, vm, roles).forEach(function (j) { j.shot = s; jobs.push(j); });
    });
    if (!jobs.length) {
      return Promise.reject(new Error('Nothing to generate — “no shot” cards and empty descriptions are skipped.'));
    }

    let done = 0, failed = 0;
    const total = jobs.length;
    const tick = function () { if (opts.onProgress) opts.onProgress(done, total, failed); };
    tick();

    const queue = jobs.slice();
    function worker() {
      const j = queue.shift();
      if (!j) return Promise.resolve();
      return callGemini(j.text, j.keys, j.system).then(function (res) {
        return enforceNeutral(j, res);
      }).then(function (out) {
        j.targets.forEach(function (t) {
          store(j.shot, t.model, t.field, out.res[t.field], out.flags[t.field]);
        });
        done++;
      }).catch(function (e) {
        failed++;
        console.error('[storyboarder] prompt failed', e);
        if (failed === 1) SB.toast(e.message, true);
      }).then(function () { tick(); return worker(); });
    }
    const lanes = [];
    for (let i = 0; i < Math.min(3, jobs.length); i++) lanes.push(worker());
    return Promise.all(lanes).then(function () {
      SB.app.changed(true);
      return { done: done, failed: failed, total: total };
    });
  }

  function allShots() {
    const all = [];
    SB.Model.eachShot(P(), function (sh) { all.push(sh); });
    return all;
  }

  function sceneShots(sceneId) {
    const f = SB.Model.findScene(P(), sceneId);
    return f ? f.scene.shots.slice() : [];
  }

  SB.Prompts = {
    generateFor: generateFor, allShots: allShots, sceneShots: sceneShots,
    jobsFor: jobsFor, fill: fill, raw: ask
  };

})(window.SB);

</script>
<script>
/* ===== js/promptpanel.js ===== */
/* promptpanel.js — everything prompt-related in one panel, opened when the
 * user is ready for prompts. Cards stay clean until they ask for them.
 */
(function (SB) {
  'use strict';

  let panel, bodyEl, statusEl, usageEl, limitEl;
  const write = { image: true, video: true };   // which prompts to write this run

  function P() { return SB.app.project; }

  function init() {
    panel = document.getElementById('promptPanel');
    bodyEl = document.getElementById('promptBody');
  }

  function block(title) {
    const b = SB.el('div', 'pp-block');
    if (title) b.appendChild(SB.el('div', 't', title));
    return b;
  }

  function modelSelect(role) {
    const p = P();
    const sel = document.createElement('select');
    [['image', 'Image models'], ['video', 'Video models']].forEach(function (g) {
      const list = p.settings.models.filter(function (m) { return m.kind === g[0]; });
      if (!list.length) return;
      const og = document.createElement('optgroup');
      og.label = g[1];
      list.forEach(function (m) {
        const o = document.createElement('option');
        o.value = m.id; o.textContent = m.name;
        if (m.id === (role === 'image' ? p.settings.imageModelId : p.settings.videoModelId)) o.selected = true;
        og.appendChild(o);
      });
      sel.appendChild(og);
    });
    sel.addEventListener('change', function () {
      if (role === 'image') p.settings.imageModelId = sel.value;
      else p.settings.videoModelId = sel.value;
      SB.app.changed(true);   // cards relabel to the new model
    });
    return sel;
  }

  function row(labelText, control) {
    const r = SB.el('div', 'pp-row');
    r.appendChild(SB.el('label', null, labelText));
    r.appendChild(control);
    return r;
  }

  function checkRow(labelText, checked, onChange) {
    const l = SB.el('label', 'pp-toggle');
    const c = document.createElement('input');
    c.type = 'checkbox';
    c.checked = !!checked;
    c.addEventListener('change', function () { onChange(c.checked); });
    l.appendChild(c);
    l.appendChild(document.createTextNode(labelText));
    return l;
  }

  function render() {
    if (!panel || !P()) return;
    const p = P();
    bodyEl.innerHTML = '';

    /* --- target models --- */
    const b1 = block('target models');
    b1.appendChild(row('First frame', modelSelect('image')));
    b1.appendChild(row('Video', modelSelect('video')));
    b1.appendChild(SB.el('div', 'pp-note',
      'Each shot keeps its prompts per model — switching models here never loses the old ones.'));
    bodyEl.appendChild(b1);

    /* --- generate --- */
    const b2 = block('write prompts');
    b2.appendChild(checkRow(' first-frame prompt', write.image, function (v) { write.image = v; }));
    b2.appendChild(checkRow(' image→video prompt', write.video, function (v) { write.video = v; }));

    const brand = SB.Brand.brandOf(p);
    const bRow = checkRow(' apply house style', brand.enabled, function (v) {
      p.settings.brand = p.settings.brand || {};
      p.settings.brand.enabled = v;
      SB.Store.touch();
    });
    bRow.title = 'Continuity, camera, tone and the no-gendered-language rule — Settings → Brand style';
    b2.appendChild(bRow);

    const scope = document.createElement('select');
    [['project', 'Whole project'], ['scene', 'Selected scene'], ['shot', 'Selected shot']]
      .forEach(function (o) {
        const op = document.createElement('option');
        op.value = o[0]; op.textContent = o[1];
        scope.appendChild(op);
      });
    b2.appendChild(row('Scope', scope));

    const acts = SB.el('div', 'pp-actions');
    const gen = SB.el('button', 'tb on', 'Generate');
    acts.appendChild(gen);
    b2.appendChild(acts);

    statusEl = SB.el('div', 'pp-status', SB.Store.getApiKey() ? '' : 'No API key yet — Settings → API.');
    if (!SB.Store.getApiKey()) statusEl.classList.add('err');
    b2.appendChild(statusEl);
    bodyEl.appendChild(b2);

    gen.addEventListener('click', function () {
      const shots = scope.value === 'project' ? SB.Prompts.allShots()
        : scope.value === 'scene' ? SB.Prompts.sceneShots(SB.app.selectedSceneId)
          : (function () {
            const f = SB.app.selectedShotId && SB.Model.findShot(p, SB.app.selectedShotId);
            return f ? [f.shot] : [];
          })();
      if (!shots.length) { setStatus('Nothing in scope — select a scene or shot first.', true); return; }
      run(shots, { image: write.image, video: write.video }, gen);
    });

    /* --- show on cards --- */
    const b3 = block('show on cards');
    b3.appendChild(checkRow(' first-frame prompt', p.settings.showImagePrompt, function (v) {
      p.settings.showImagePrompt = v; SB.app.changed(true);
    }));
    b3.appendChild(checkRow(' image→video prompt', p.settings.showVideoPrompt, function (v) {
      p.settings.showVideoPrompt = v; SB.app.changed(true);
    }));
    b3.appendChild(SB.el('div', 'pp-note',
      'Off by default so cards stay compact. Generating turns the matching box on for you.'));
    bodyEl.appendChild(b3);

    /* --- engine --- */
    const b4 = block('prompt writer');
    const pick = SB.GeminiModels.picker(p.settings.geminiModel, function (id) {
      p.settings.geminiModel = id || SB.GeminiModels.DEFAULT;
      SB.Store.touch();
      refreshUsage();
    });
    b4.appendChild(row('Gemini', pick.el));

    const uRow = SB.el('div', 'pp-row');
    uRow.appendChild(SB.el('label', null, 'Free calls'));
    usageEl = SB.el('span', 'pp-usage');
    uRow.appendChild(usageEl);
    limitEl = document.createElement('input');
    limitEl.type = 'number';
    limitEl.min = '0';
    limitEl.className = 'pp-limit';
    limitEl.title = 'Your free-tier requests per day for this model (AI Studio shows the real number). Blank = just count.';
    limitEl.placeholder = 'limit';
    limitEl.addEventListener('change', function () {
      SB.GeminiModels.setLimit(p.settings.geminiModel, parseInt(limitEl.value, 10) || 0);
      refreshUsage();
    });
    uRow.appendChild(limitEl);
    b4.appendChild(uRow);
    b4.appendChild(SB.el('div', 'pp-note',
      'Counted in this browser and reset at midnight. Google no longer publishes the free-tier ' +
      'daily cap per model — set it from your AI Studio rate-limit page.'));

    b4.appendChild(SB.el('div', 'pp-note', SB.Store.getApiKey()
      ? 'API key is set in this browser.' : 'No API key — add one in Settings → API.'));
    bodyEl.appendChild(b4);

    refreshUsage();
  }

  function refreshUsage() {
    if (!usageEl || !P()) return;
    const id = P().settings.geminiModel;
    usageEl.textContent = SB.GeminiModels.usageText(id);
    const rem = SB.GeminiModels.remaining(id);
    usageEl.classList.toggle('spent', rem === 0);
    if (limitEl && document.activeElement !== limitEl) {
      const lim = SB.GeminiModels.limit(id);
      limitEl.value = lim ? lim : '';
    }
  }

  function setStatus(txt, isErr) {
    if (!statusEl) return;
    statusEl.textContent = txt;
    statusEl.classList.toggle('err', !!isErr);
  }

  function run(shots, roles, btn) {
    if (!roles.image && !roles.video) { setStatus('Tick at least one prompt to write.', true); return; }
    btn.disabled = true;
    SB.Prompts.generateFor(shots, {
      roles: roles,
      onProgress: function (done, total, failed) {
        setStatus('writing ' + done + '/' + total + (failed ? ' · ' + failed + ' failed' : ''), false);
        refreshUsage();
      }
    }).then(function (r) {
      btn.disabled = false;
      // reveal what was just written
      const s = P().settings;
      if (roles.image && r.done) s.showImagePrompt = true;
      if (roles.video && r.done) s.showVideoPrompt = true;
      SB.app.changed(true);
      setStatus('done — ' + r.done + ' of ' + r.total + (r.failed ? ' · ' + r.failed + ' failed' : ''), !!r.failed);
    }).catch(function (e) {
      btn.disabled = false;
      setStatus(e.message || String(e), true);
    });
  }

  function open() {
    panel.classList.remove('hidden');
    document.getElementById('btnPrompts').classList.add('on');
    render();
  }
  function close() {
    panel.classList.add('hidden');
    document.getElementById('btnPrompts').classList.remove('on');
  }
