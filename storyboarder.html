     * Everything on the board is a ≤480p proxy, which is right for a portable
     * file and useless as a reference to feed back into an image model. With a
     * folder connected the original is kept beside the board instead of being
     * thrown away, and the app can hand you the real thing. */
    panels.general.appendChild(rendersBlock());

    /* ---------------- Card fields ---------------- */
    panels.fields.appendChild(SB.el('div', 'pp-note',
      'Extra text boxes under each card’s description, chosen per project. Anything filled ' +
      'in is handed to the prompt writer too, and each one is available in a model template ' +
      'as a placeholder.'));

    const fieldHost = SB.el('div');
    fieldHost.style.marginTop = '10px';
    panels.fields.appendChild(fieldHost);

    /* Edit a copy, like the model list does: Cancel has to leave the project
     * exactly as it was — renaming a field, switching one off, and above all
     * removing one (which takes its text off every card with it) used to land
     * the moment it was typed, whichever button was pressed afterwards. */
    const workingFields = SB.clone(SB.Fields.all(p));

    function drawFields() {
      fieldHost.innerHTML = '';
      workingFields.forEach(function (f) {
        const row = SB.el('div', 'field-row');

        const on = document.createElement('input');
        on.type = 'checkbox';
        on.checked = !!f.enabled;
        on.title = 'Show this box on every card';
        on.onchange = function () { f.enabled = on.checked; };
        row.appendChild(on);

        const name = document.createElement('input');
        name.type = 'text';
        name.value = f.label;
        name.className = 'field-name';
        name.oninput = function () {
          f.label = name.value;
          tag.textContent = '{{' + SB.Fields.placeholder(f) + '}}';
        };
        if (f.builtin) name.readOnly = true;
        row.appendChild(name);

        const tag = SB.el('code', 'field-tag', '{{' + SB.Fields.placeholder(f) + '}}');
        row.appendChild(tag);

        if (f.builtin) {
          row.appendChild(SB.el('span', 'vmeta', 'built in'));
        } else {
          const del = SB.el('button', 'mini danger', 'remove');
          del.onclick = function () {
            let used = 0;
            SB.Model.eachShot(p, function (sh) { if (SB.Fields.value(sh, f.id).trim()) used++; });
            if (used && !confirm('Remove “' + f.label + '”? Text in it on ' + used +
              ' card(s) is deleted with it.')) return;
            const at = workingFields.indexOf(f);
            if (at >= 0) workingFields.splice(at, 1);
            drawFields();
          };
          row.appendChild(del);
        }
        fieldHost.appendChild(row);
      });

      const add = SB.el('button', 'tb', '+ Add a field');
      add.onclick = function () {
        workingFields.push({ id: SB.uid('fld'), label: 'New field', enabled: true, builtin: false });
        drawFields();
      };
      fieldHost.appendChild(add);
    }
    drawFields();

    /* ---------------- Brand style ---------------- */
    const brand = SB.Brand.brandOf(p);
    const bOn = SB.el('label', 'pp-toggle');
    const bChk = document.createElement('input');
    bChk.type = 'checkbox';
    bChk.checked = brand.enabled;
    bOn.appendChild(bChk);
    bOn.appendChild(document.createTextNode(' Apply the house style to every prompt'));
    panels.brand.appendChild(bOn);

    panels.brand.appendChild(SB.el('div', 'pp-note',
      'Rides along with every prompt the app writes, on top of the per-model templates. ' +
      'The app adds the scene’s beat list underneath it automatically, so “same subject, same ' +
      'wardrobe, same location across the sequence” is something the writer can actually act on.'));

    const bText = document.createElement('textarea');
    bText.rows = 22;
    bText.value = (p.settings.brand && p.settings.brand.text) || SB.Brand.DEFAULT;
    bText.style.fontSize = '11.5px';
    const bField = field('House style', bText);
    bField.style.marginTop = '10px';
    panels.brand.appendChild(bField);

    const bActs = SB.el('div', 'pp-actions');
    const bReset = SB.el('button', 'tb', 'Restore the default style');
    bReset.onclick = function () { bText.value = SB.Brand.DEFAULT; };
    const bPreview = SB.el('button', 'tb', 'Preview what a shot sends');
    bPreview.onclick = function () {
      const f = SB.app.selectedShotId && SB.Model.findShot(p, SB.app.selectedShotId);
      const shot = f ? f.shot : (p.scenes[0] && p.scenes[0].shots[0]);
      if (!shot) { SB.toast('Add a shot first', true); return; }
      const saved = p.settings.brand.text;
      p.settings.brand.text = bText.value;      // preview what is on screen
      const body = SB.el('div');
      const pre = document.createElement('textarea');
      pre.rows = 24;
      pre.readOnly = true;
      pre.value = SB.Brand.systemFor(p, shot, 'both');
      pre.style.fontSize = '11px';
      body.appendChild(pre);
      p.settings.brand.text = saved;
      SB.modal({
        title: 'System instruction for this shot', width: '760px', body: body,
        buttons: [{ label: 'Close', primary: true }]
      });
    };
    bActs.appendChild(bReset);
    bActs.appendChild(bPreview);
    panels.brand.appendChild(bActs);

    /* ---------------- Models & templates ---------------- */
    panels.models.appendChild(SB.el('div', 'pp-note',
      'One entry per target model. The templates tell Gemini how to write for that model — ' +
      'Midjourney-style parameters, natural language, whatever it needs.'));
    const fieldTags = SB.Fields.enabled(p).map(function (f) {
      return '{{' + SB.Fields.placeholder(f) + '}}';
    }).join(' ');
    const hint = SB.el('div', 'vmeta',
      'Placeholders: {{MODEL}} {{SHOT_TYPE}} {{SCENE}} {{SCENE_DESC}} {{SCRIPT}} {{DESCRIPTION}} {{CODE}}' +
      (fieldTags ? ' · your fields: ' + fieldTags + ' (or {{FIELDS}} for all of them)' : ''));
    hint.style.margin = '6px 0 10px';
    panels.models.appendChild(hint);

    const listHost = SB.el('div');
    panels.models.appendChild(listHost);

    const working = SB.clone(p.settings.models);

    function drawModels() {
      listHost.innerHTML = '';
      working.forEach(function (m, i) {
        const row = SB.el('div', 'model-row');
        const top = SB.el('div', 'top');
        const name = document.createElement('input');
        name.type = 'text'; name.value = m.name; name.placeholder = 'Model name';
        name.oninput = function () { m.name = name.value; };
        const kind = document.createElement('select');
        [['video', 'video'], ['image', 'image']].forEach(function (k) {
          const o = document.createElement('option');
          o.value = k[0]; o.textContent = k[1];
          if (m.kind === k[0]) o.selected = true;
          kind.appendChild(o);
        });
        kind.onchange = function () { m.kind = kind.value; };
        const tpl = SB.el('button', 'mini', m.__open ? 'hide templates' : 'templates');
        tpl.onclick = function () { m.__open = !m.__open; drawModels(); };
        const rst = SB.el('button', 'mini', 'reset');
        rst.title = 'Restore the default templates for this model';
        rst.onclick = function () {
          const t = SB.Model.tplsFor(m.name);
          m.imageTemplate = t.image; m.videoTemplate = t.video;
          m.referenceTemplate = t.reference;
          m.__open = true; drawModels();
        };
        const del = SB.el('button', 'mini danger', 'remove');
        del.onclick = function () { working.splice(i, 1); drawModels(); };
        top.appendChild(name); top.appendChild(kind);
        top.appendChild(tpl); top.appendChild(rst); top.appendChild(del);
        row.appendChild(top);

        if (m.__open) {
          const ti = document.createElement('textarea');
          ti.rows = 5; ti.value = m.imageTemplate;
          ti.oninput = function () { m.imageTemplate = ti.value; };
          row.appendChild(field('first-frame (image) template', ti));

          const tv = document.createElement('textarea');
          tv.rows = 5; tv.value = m.videoTemplate;
          tv.oninput = function () { m.videoTemplate = tv.value; };
          row.appendChild(field('image→video template', tv));

          const tr = document.createElement('textarea');
          tr.rows = 3;
          /* Shown as stored, so a box left blank stays blank instead of the
             default reappearing and looking like the clearing never took. */
          tr.value = typeof m.referenceTemplate === 'string'
            ? m.referenceTemplate : SB.Personas.DEFAULT_REF_TEMPLATE;
          tr.placeholder = 'blank — no reference wording is sent for this model';
          tr.oninput = function () { m.referenceTemplate = tr.value; };
          const trF = field('reference-image wording — how THIS model expects to be told about ' +
            'reference images ({{N}} = image number, {{NAME}} = names)', tr);
          row.appendChild(trF);
          const trHint = SB.el('div', 'pp-note',
            'Only used on shots that have cast. Leave blank for a model that takes no references.');
          row.appendChild(trHint);
        }
        listHost.appendChild(row);
      });
      const add = SB.el('button', 'tb', '+ Add model');
      add.onclick = function () {
        working.push({
          id: SB.uid('m'), name: 'New model', kind: 'video',
          imageTemplate: SB.Model.IMG_TPL, videoTemplate: SB.Model.VID_TPL, __open: true
        });
        drawModels();
      };
      listHost.appendChild(add);
    }
    drawModels();

    /* ---------------- API ----------------
     * Two backends, picked at the top: Google's Gemini, or any local
     * OpenAI-compatible server (oobabooga's text-generation-webui, LM Studio,
     * llama.cpp, KoboldCpp). Each keeps its own settings, so switching back
     * and forth costs nothing — the one you left is exactly as you left it.
     *
     * The Gemini key field on its own only helps someone who already has a
     * key. The path from "no Google account set up" to a working key is five
     * steps, and step 2 is also what clears the blocked-API dialog on this
     * network, so it is spelled out here rather than left to be asked about.
     */
    let chosenProvider = SB.Providers.normalize(p.settings.aiProvider);

    const provRow = SB.el('div', 'prov-pick');
    const provBtns = {};
    const provBlocks = {};

    function showProvider(id) {
      chosenProvider = SB.Providers.normalize(id);
      Object.keys(provBtns).forEach(function (k) {
        provBtns[k].classList.toggle('on', k === chosenProvider);
      });
      Object.keys(provBlocks).forEach(function (k) {
        provBlocks[k].classList.toggle('hidden', k !== chosenProvider);
      });
    }

    SB.Providers.list().forEach(function (prov) {
      const b = SB.el('button', 'tb toggle', prov.label);
      b.onclick = function () { showProvider(prov.id); };
      provBtns[prov.id] = b;
      provRow.appendChild(b);
      /* Named, so the two providers' panels are told apart from the outside —
         both hold a model picker of the same shape. */
      provBlocks[prov.id] = SB.el('div', 'prov-block');
      provBlocks[prov.id].dataset.prov = prov.id;
    });
    panels.api.appendChild(SB.el('div', 'pp-label', 'Who writes the prompts'));
    panels.api.appendChild(provRow);
    panels.api.appendChild(SB.el('div', 'pp-note',
      'The choice is saved with the project. Both sides keep their own model and ' +
      'credentials in this browser, so switching back is lossless.'));
    SB.Providers.list().forEach(function (prov) {
      panels.api.appendChild(provBlocks[prov.id]);
    });

    const gemPanel = provBlocks.gemini;
    const oobaPanel = provBlocks.ooba;

    const how = SB.el('div', 'setup');
    how.appendChild(SB.el('div', 't', 'Getting a key'));
    const steps = document.createElement('ol');
    steps.className = 'setup-steps';

    function step(parts) {
      const li = document.createElement('li');
      parts.forEach(function (x) {
        li.appendChild(typeof x === 'string' ? document.createTextNode(x) : x);
      });
      steps.appendChild(li);
      return li;
    }
    function mono(text) { return SB.el('code', 'setup-mono', text); }
    function ext(href, text) {
      const a = document.createElement('a');
      a.href = href; a.target = '_blank'; a.rel = 'noopener';
      a.textContent = text;
      return a;
    }

    step(['Open ', ext(SB.AISTUDIO_URL, 'aistudio.google.com ↗'),
      ' and sign in with the Google account this board should bill to.']);
    const s2 = step(['Accept the terms when prompted. ']);
    s2.appendChild(SB.el('span', 'dim',
      'This is also the step that clears the “API is being blocked” dialog on the Pega ' +
      'network — it only has to be done once in this browser.'));
    step([mono('Get API key'), ' → ', mono('Create API key'),
      '. Pick an existing Google Cloud project or let it make one. ']);
    steps.lastChild.appendChild(SB.el('span', 'dim',
      'The free-tier daily allowance is counted per project, so a project of your own keeps ' +
      'your quota separate from anyone else’s.'));
    step(['Copy the ', mono('AIza…'), ' string and paste it into the field below.']);
    step(['Press ', mono('Refresh list from my key'),
      ' — if it comes back with a model count, everything downstream works.']);

    how.appendChild(steps);
    gemPanel.appendChild(how);

    const key = document.createElement('input');
    key.type = 'password';
    key.value = SB.Store.getApiKey();
    key.placeholder = 'AIza…';
    gemPanel.appendChild(field('Google (Gemini) API key', key));
    gemPanel.appendChild(SB.el('div', 'pp-note',
      'Stored in this browser only — never written into the .storyboard file, so a board can be shared without leaking the key.'));
    gemPanel.appendChild(SB.el('div', 'pp-note',
      'The free tier is counted per Google Cloud project per day. What this browser has spent ' +
      'today is shown as “Free calls” in the Prompts panel.'));

    let chosenModel = p.settings.geminiModel || SB.GeminiModels.DEFAULT;
    const pick = SB.GeminiModels.picker(chosenModel, function (id) { chosenModel = id; });
    const gmField = field('Gemini model used to write prompts', pick.el);
    gmField.style.marginTop = '14px';
    gemPanel.appendChild(gmField);

    const refreshRow = SB.el('div', 'pp-actions');
    const refresh = SB.el('button', 'tb', 'Refresh list from my key');
    const refreshNote = SB.el('span', 'pp-note', '');
    refresh.onclick = function () {
      SB.Store.setApiKey(key.value.trim());   // use whatever is typed right now
      refresh.disabled = true;
      refreshNote.textContent = 'asking Google…';
      refreshNote.classList.remove('err');
      SB.GeminiModels.fetchAvailable().then(function (models) {
        pick.rebuild(chosenModel);
        refresh.disabled = false;
        refreshNote.textContent = models.length + ' models this key can reach.';
      }).catch(function (e) {
        refresh.disabled = false;
        if (SB.apiBlocked(e, function () { refresh.onclick(); })) {
          refreshNote.textContent = 'blocked — see the dialog';
          refreshNote.classList.add('err');
          return;
        }
        refreshNote.textContent = e.message || String(e);
        refreshNote.classList.add('err');
      });
    };
    const useCurated = SB.el('button', 'tb', 'Back to curated list');
    useCurated.onclick = function () {
      SB.GeminiModels.clearCache();
      pick.rebuild(chosenModel);
      refreshNote.textContent = 'showing the built-in list.';
      refreshNote.classList.remove('err');
    };
    refreshRow.appendChild(refresh);
    refreshRow.appendChild(useCurated);
    gemPanel.appendChild(refreshRow);
    gemPanel.appendChild(refreshNote);
    gemPanel.appendChild(SB.el('div', 'pp-note',
      'Google retires model ids on its own schedule. If a prompt run comes back 404, ' +
      'refresh this list — it asks your key what it can actually reach today.'));


    /* ---- local / OpenAI-compatible server ---- */
    const oobaSaved = SB.Store.getOoba();

    oobaPanel.appendChild(SB.el('div', 'pp-note',
      'Any server speaking the OpenAI chat API: oobabooga’s text-generation-webui started ' +
      'with --api, LM Studio, llama.cpp’s server, KoboldCpp. Nothing leaves your machine, ' +
      'there is no quota, and no key is needed unless you launched the server with one.'));

    const oUrl = document.createElement('input');
    oUrl.type = 'text';
    oUrl.value = oobaSaved.url || '';
    oUrl.placeholder = SB.Providers.DEFAULT_OOBA_URL;
    oobaPanel.appendChild(field('Server address', oUrl));
    oobaPanel.appendChild(SB.el('div', 'pp-note',
      'Just the host and port — /v1/chat/completions is added for you. ' +
      'Blank means ' + SB.Providers.DEFAULT_OOBA_URL + '.'));

    /* Same shape as the Gemini picker: a list when the server has told us
     * what it has, and a free-text box for when it hasn't. */
    let oobaModel = oobaSaved.model || '';
    const oSel = document.createElement('select');
    const oCustom = document.createElement('input');
    oCustom.type = 'text';
    oCustom.className = 'gm-custom';
    oCustom.placeholder = 'model name as the server reports it';
    const oWrap = SB.el('div', 'gm-picker');
    oWrap.appendChild(oSel);
    oWrap.appendChild(oCustom);

    function buildOoba(list) {
      oSel.innerHTML = '';
      const none = document.createElement('option');
      none.value = '';
      none.textContent = 'whatever is loaded (send no model name)';
      oSel.appendChild(none);
      let matched = !oobaModel;
      (list || []).forEach(function (m) {
        const o = document.createElement('option');
        o.value = m.id; o.textContent = m.label || m.id;
        if (m.id === oobaModel) { o.selected = true; matched = true; }
        oSel.appendChild(o);
      });
      if (oobaModel && !matched) {
        const o = document.createElement('option');
        o.value = oobaModel; o.textContent = oobaModel + ' — (not listed)';
        o.selected = true;
        oSel.insertBefore(o, oSel.firstChild.nextSibling);
      }
      const oc = document.createElement('option');
      oc.value = '__custom'; oc.textContent = 'Custom…';
      oSel.appendChild(oc);
      oCustom.classList.add('hidden');
    }
    buildOoba(null);

    oSel.addEventListener('change', function () {
      if (oSel.value === '__custom') {
        oCustom.classList.remove('hidden');
        oCustom.value = oobaModel || '';
        oCustom.focus();
        return;
      }
      oCustom.classList.add('hidden');
      oobaModel = oSel.value;
    });
    oCustom.addEventListener('input', function () { oobaModel = oCustom.value.trim(); });

    oobaPanel.appendChild(field('Model', oWrap));
    oobaPanel.appendChild(SB.el('div', 'pp-note',
      'text-generation-webui serves the one model you have loaded and ignores this. ' +
      'LM Studio and llama-server want the name — load the list to fill it in.'));

    const oKey = document.createElement('input');
    oKey.type = 'password';
    oKey.value = oobaSaved.key || '';
    oKey.placeholder = 'usually blank';
    oobaPanel.appendChild(field('API key (only if the server asks for one)', oKey));

    const oActs = SB.el('div', 'pp-actions');
    const oLoad = SB.el('button', 'tb', 'Load models from the server');
    const oTest = SB.el('button', 'tb', 'Test connection');
    const oNote = SB.el('span', 'pp-note', '');

    /* Both buttons work off what is typed right now, not what was saved —
     * otherwise the first thing anyone does is press Save to find out whether
     * the address they just typed is right. */
    function liveOoba() {
      SB.Store.setOoba({ url: oUrl.value, model: oobaModel, key: oKey.value });
    }
    function oobaFail(e) {
      oNote.textContent = e.message || String(e);
      oNote.classList.add('err');
    }

    oLoad.onclick = function () {
      liveOoba();
      oLoad.disabled = true;
      oNote.textContent = 'asking the server…';
      oNote.classList.remove('err');
      SB.Providers.get('ooba').listModels(oUrl.value).then(function (list) {
        oLoad.disabled = false;
        buildOoba(list);
        oNote.textContent = list.length + ' model' + (list.length === 1 ? '' : 's') + ' loaded.';
      }).catch(function (e) { oLoad.disabled = false; oobaFail(e); });
    };

    /* A model list can come back from a server with nothing loaded, so the
     * only honest test is a real completion. */
    oTest.onclick = function () {
      liveOoba();
      const wasProvider = p.settings.aiProvider;
      p.settings.aiProvider = 'ooba';
      oTest.disabled = true;
      oNote.textContent = 'sending a test prompt…';
      oNote.classList.remove('err');
      const started = Date.now();
      SB.Prompts.raw('Reply with the JSON object {"ok":true} and nothing else.',
        { type: 'OBJECT', properties: { ok: { type: 'BOOLEAN' } }, required: ['ok'] })
        .then(function () {
          oNote.textContent = 'answered in ' + (Date.now() - started) + ' ms — ready to write prompts.';
        })
        .catch(oobaFail)
        .then(function () {
          oTest.disabled = false;
          p.settings.aiProvider = wasProvider;
        });
    };

    oActs.appendChild(oLoad);
    oActs.appendChild(oTest);
    oobaPanel.appendChild(oActs);
    oobaPanel.appendChild(oNote);

    showProvider(chosenProvider);

    select(startTab && panels[startTab] ? startTab : 'general');

    SB.modal({
      title: 'Settings',
      width: '720px',
      body: body,
      buttons: [
        { label: 'Cancel' },
        {
          label: 'Save', primary: true, onClick: function (close) {
            const t = types.value.split('\n').map(function (s) { return s.trim(); })
              .filter(function (s) { return s; });
            p.settings.shotTypes = t.length ? t : SB.Model.DEFAULT_SHOT_TYPES.slice();

            /* Card fields: removals take their text off every card, so they are
             * applied here rather than while the dialog is open. */
            const kept = {};
            workingFields.forEach(function (f) { kept[f.id] = 1; });
            SB.Fields.all(p).slice().forEach(function (f) {
              if (!kept[f.id]) SB.Fields.remove(p, f.id);
            });
            p.settings.fields = workingFields.map(function (f) {
              return {
                id: f.id,
                label: (f.label || '').trim() || 'Field',
                enabled: !!f.enabled,
                builtin: !!f.builtin
              };
            });

            const bTxt = bText.value.trim();
            p.settings.brand = (bTxt && bTxt !== SB.Brand.DEFAULT.trim())
              ? { enabled: bChk.checked, custom: true, text: bTxt }
              : { enabled: bChk.checked, custom: false };
            p.settings.aiProvider = SB.Providers.normalize(chosenProvider);
            p.settings.geminiModel = (chosenModel || '').trim() || SB.GeminiModels.DEFAULT;
            p.settings.models = working.filter(function (m) { return (m.name || '').trim(); })
              .map(function (m) { delete m.__open; return m; });
            if (!p.settings.models.length) p.settings.models = SB.Model.defaultModels();
            const has = function (id) {
              return p.settings.models.some(function (m) { return m.id === id; });
            };
            if (!has(p.settings.imageModelId)) {
              p.settings.imageModelId = SB.Model.firstOfKind(p.settings.models, 'image');
            }
            if (!has(p.settings.videoModelId)) {
              p.settings.videoModelId = SB.Model.firstOfKind(p.settings.models, 'video');
            }
            SB.Store.setApiKey(key.value.trim());
            SB.Store.setOoba({ url: oUrl.value, model: oobaModel, key: oKey.value });
            close();
            SB.app.changed(true);
            SB.PromptPanel.refresh();
            SB.toast('Settings saved');
          }
        }
      ]
    });
  }

  SB.Settings = { open: open };

})(window.SB);

</script>
<script>
/* ===== js/versions.js ===== */
/* versions.js — whole-project versions. Comments and ink freeze with the
 * version they were made in and do NOT carry forward into the new one.
 */
(function (SB) {
  'use strict';

  function P() { return SB.app.project; }

  function core(p) {
    return {
      master: SB.clone(p.master),
      scenes: SB.clone(p.scenes),
      /* The cast, the locations and the objects freeze with the version too.
       * Without them a snapshot held cards naming subjects it did not carry:
       * delete one afterwards and its reference frames were collected as
       * orphans, so restoring that version brought back cards whose cast had
       * quietly evaporated. Frames are stored by content hash, so a subject
       * appearing in ten versions still costs its bytes once. */
      personas: SB.clone(p.personas || []),
      scriptComments: SB.clone(p.scriptComments || []),
      versionNumber: p.versionNumber,
      versionName: p.versionName
    };
  }

  function freeze(p, note) {
    p.versions.push({
      n: p.versionNumber,
      name: p.versionName + (note ? ' — ' + note : ''),
      createdAt: Date.now(),
      snapshot: core(p)
    });
  }

  function countComments(snap) {
    let n = 0, ink = 0;
    (snap.scenes || []).forEach(function (sc) {
      sc.shots.forEach(function (sh) {
        n += (sh.comments || []).length;
        if (sh.annotation) ink++;
      });
    });
    return { comments: n, ink: ink, script: (snap.scriptComments || []).length };
  }

  function newVersion() {
    const p = P();
    const suggested = 'v' + (p.versionNumber + 1);
    const name = prompt('Name for the new version:', suggested);
    if (name === null) return;
    freeze(p, null);
    p.versionNumber = p.versionNumber + 1;
    p.versionName = (name || '').trim() || suggested;
    // fresh start: comments and drawings stay with the version they were made in
    SB.Model.eachShot(p, function (sh) { sh.comments = []; sh.annotation = null; });
    p.scriptComments = [];
    SB.app.changed(true);
    SB.toast('Now working in ' + p.versionName + ' — comments and ink start clean');
  }

  function restore(v) {
    const p = P();
    if (!confirm('Restore "' + v.name + '"?\n\nThe current state is saved as a version first, so nothing is lost.')) return;
    freeze(p, 'before restoring ' + v.name);
    p.master = SB.clone(v.snapshot.master);
    p.scenes = SB.clone(v.snapshot.scenes);
    /* The snapshot's cast wins for the cards it belongs to — that is what
     * restoring means — but anything created since is kept rather than thrown
     * away. It simply arrives unused, sitting in the library where it was. */
    const was = SB.clone(v.snapshot.personas || []);
    const ids = {};
    was.forEach(function (x) { ids[x.id] = 1; });
    p.personas = was.concat((p.personas || []).filter(function (x) { return !ids[x.id]; }));
    p.scriptComments = SB.clone(v.snapshot.scriptComments || []);
    p.versionNumber = p.versions.reduce(function (a, x) { return Math.max(a, x.n); }, p.versionNumber) + 1;
    p.versionName = v.name + ' (restored)';
    /* The undo stack holds snapshots of the script we just replaced — a Ctrl+Z
     * after a restore would paste the old master text back under the restored
     * cards' link ranges. */
    SB.History.reset();
    SB.app.selectedShotId = null;
    SB.app.selection = [];
    SB.app.changed(true);
    /* A snapshot from before the cast froze with versions can name subjects
     * that are simply gone. Restoring used to drop them off the cards in
     * silence; counted here, the loss is at least visible. */
    let lost = 0;
    SB.Model.eachShot(p, function (sh) {
      (sh.personaIds || []).forEach(function (id) {
        if (!SB.Personas.find(p, id)) lost++;
      });
    });
    SB.toast('Restored ' + v.name +
      (lost ? ' — ' + lost + ' cast entr' + (lost === 1 ? 'y' : 'ies') +
        ' could not be found and are not on the cards' : ''), !!lost);
  }

  function viewComments(v) {
    const body = SB.el('div');
    let any = false;

    const notes = v.snapshot.scriptComments || [];
    if (notes.length) {
      any = true;
      const h = SB.el('div', 'ver-row');
      h.appendChild(SB.el('b', null, 'On the script'));
      body.appendChild(h);
      notes.forEach(function (c) {
        const r = SB.el('div', 'comment');
        r.appendChild(SB.el('span', 'when', SB.fmtDate(c.at)));
        const txt = SB.el('span', 'txt');
        txt.appendChild(SB.el('div', 'note-quote', '“' + (c.quote || '') + '”'));
        txt.appendChild(document.createTextNode(c.text));
        r.appendChild(txt);
        body.appendChild(r);
      });
    }
    (v.snapshot.scenes || []).forEach(function (sc, si) {
      sc.shots.forEach(function (sh, sj) {
        if (!(sh.comments || []).length && !sh.annotation) return;
        any = true;
        const h = SB.el('div', 'ver-row');
        h.appendChild(SB.el('b', null, SB.Model.code(si, sj) + ' · ' + (sc.heading || '')));
        if (sh.annotation) h.appendChild(SB.el('span', 'vmeta', ' (has ink)'));
        body.appendChild(h);
        (sh.comments || []).forEach(function (cm) {
          const r = SB.el('div', 'comment');
          r.appendChild(SB.el('span', 'when', SB.fmtDate(cm.at)));
          r.appendChild(SB.el('span', 'txt', cm.text));
          body.appendChild(r);
        });
      });
    });
    if (!any) body.appendChild(SB.el('div', 'vmeta', 'No comments or drawings in this version.'));
    SB.modal({ title: 'Comments in ' + v.name, body: body, buttons: [{ label: 'Close', primary: true }] });
  }

  function open() {
    const p = P();
    const body = SB.el('div');

    const cur = SB.el('div', 'ver-row current');
    const c = countComments(p);
    cur.appendChild(SB.el('span', 'vname', p.versionName + '  (working)'));
    cur.appendChild(SB.el('span', 'vmeta', c.comments + ' card · ' + c.script + ' script · ' + c.ink + ' inked'));
    const nv = SB.el('button', 'mini primary', 'New version…');
    nv.onclick = function () { m.close(); newVersion(); };
    cur.appendChild(nv);
    body.appendChild(cur);

    p.versions.slice().reverse().forEach(function (v) {
      const cc = countComments(v.snapshot);
      const row = SB.el('div', 'ver-row');
      row.appendChild(SB.el('span', 'vname', v.name));
      row.appendChild(SB.el('span', 'vmeta', SB.fmtDate(v.createdAt) + ' · ' +
        cc.comments + ' card · ' + cc.script + ' script · ' + cc.ink + ' inked'));
      const bc = SB.el('button', 'mini', 'comments');
      bc.onclick = function () { viewComments(v); };
      const br = SB.el('button', 'mini', 'restore');
      br.onclick = function () { m.close(); restore(v); };
      row.appendChild(bc); row.appendChild(br);
      body.appendChild(row);
    });

    if (!p.versions.length) body.appendChild(SB.el('div', 'vmeta', 'No earlier versions yet.'));

    const m = SB.modal({
      title: 'Versions', width: '560px', body: body,
      buttons: [{ label: 'Close', primary: true }]
    });
  }

  SB.Versions = { open: open, newVersion: newVersion };

})(window.SB);

</script>
<script>
/* ===== js/pdf.js ===== */
/* pdf.js — print sheets via Chrome's Print → Save as PDF.
 *
 * A named preset fixes the paper orientation and the grid; the rest of the
 * sheet — which boxes appear on a card, whether card colour is carried over,
 * whether scenes get a banner or a page of their own — comes from
 * project.settings.export, edited in SB.ExportOptions.
 *
 * Still excludes comments, ink, and "no shot" fragments.
 */
(function (SB) {
  'use strict';

  /* Each preset is one shape of sheet.
   *   orient  — portrait or landscape; also what @page asks the print dialog for
   *   cols/rows — the grid; cols*rows cards per sheet
   *   dir     — 'col' stacks the frame above the words, 'row' puts it beside them
   *   frame   — the frame's fixed dimension: its height in a column cell, its
   *             width in a row cell. 'fill' lets it take whatever is left.
   *   script/desc — -webkit-line-clamp for those boxes; 0 means print it all,
   *             which is only safe where there is room for it.
   * The numbers are tuned against the measured overflow check in ui-scenario.js —
   * if you change a grid, run test-ui.mjs before believing it.
   */
  const PRESETS = [
    {
      id: 'sheet6', label: 'Contact sheet — 6 up (portrait)',
      orient: 'portrait', cols: 2, rows: 3, dir: 'col', frame: '40mm',
      script: 2, desc: 3, font: 11
    },
    {
      id: 'sheet12', label: 'Index sheet — 12 up (portrait)',
      orient: 'portrait', cols: 3, rows: 4, dir: 'col', frame: '34mm',
      script: 1, desc: 1, font: 10
    },
    {
      id: 'notes4', label: 'Script pass — 4 up (portrait)',
      orient: 'portrait', cols: 1, rows: 4, dir: 'row', frame: '96mm',
      script: 4, desc: 5, font: 11
    },
    {
      id: 'wide6', label: 'Wide — 6 up (landscape)',
      orient: 'landscape', cols: 3, rows: 2, dir: 'col', frame: '44mm',
      script: 2, desc: 3, font: 11
    },
    {
      id: 'wide3', label: 'Wide notes — 3 up (landscape)',
      orient: 'landscape', cols: 3, rows: 1, dir: 'col', frame: '48mm',
      script: 8, desc: 12, font: 11
    },
    {
      id: 'show1', label: 'Presentation — 1 up (landscape)',
      orient: 'landscape', cols: 1, rows: 1, dir: 'col', frame: 'fill',
      script: 0, desc: 0, font: 14
    }
  ];

  /* The sheet is sized to fit BOTH A4 and Letter with 12mm margins, so it
   * prints whole on either: portrait takes A4's printable width and Letter's
   * printable height, landscape the other way round. The portrait height used
   * to claim 262mm, more than Letter actually has, which pushed a blank second
   * sheet out for every page — do not round these up.
   */
  const PAPER = {
    portrait: { w: '186mm', h: '251mm' },   // A4 width ∩ Letter height
    landscape: { w: '255mm', h: '186mm' }   // Letter width ∩ A4 height
  };

  /* The fixed part of the palette, also what a colourless card falls back to. */
  const INK = {
    line: '#c3c6cc',
    meta: '#eef0f3',
    soft: '#dfe1e5'
  };

  function P() { return SB.app.project; }

  function preset(id) {
    return PRESETS.filter(function (x) { return x.id === id; })[0] || PRESETS[0];
  }

  /* Normalise into a full options object without touching the caller's copy,
   * so a half-filled object from a test or an old file still prints. */
  function options(o) {
    const base = SB.Model.defaultExport();
    const src = o || (P().settings && P().settings.export) || {};
    const out = {};
    Object.keys(base).forEach(function (k) {
      out[k] = (typeof src[k] === typeof base[k]) ? src[k] : base[k];
    });
    out.silent = !!src.silent;   // a render flag, never stored on the project
    return out;
  }

  /* ---------- colour ---------- */

  function rgb(s) {
    const m = /^#([0-9a-f]{6})$/i.exec(String(s || ''));
    if (!m) return null;
    return [parseInt(m[1].slice(0, 2), 16), parseInt(m[1].slice(2, 4), 16),
      parseInt(m[1].slice(4, 6), 16)];
  }

  /* CARD_COLORS are mid-tones picked to read on a screen; at full strength on a
   * small printed card they swamp it. Mixing here in JS rather than with CSS
   * color-mix keeps one less thing that could rasterise differently. */
  function mix(a, b, t) {
    const pa = rgb(a), pb = rgb(b);
    if (!pa || !pb) return b;
    return '#' + [0, 1, 2].map(function (i) {
      const v = Math.round(pa[i] + (pb[i] - pa[i]) * t);
      return ('0' + v.toString(16)).slice(-2);
    }).join('');
  }

  /* ---------- the flat list of what prints ---------- */

  function cells() {
    const out = [];
    const p = P();
    p.scenes.forEach(function (sc, si) {
      let first = true;
      sc.shots.forEach(function (sh, sj) {
        if (sh.noShot) return;
        const w = SB.Model.windowFor(p, sh);
        out.push({
          code: SB.Model.code(si, sj),
          scene: sc.heading || '',
          sceneDesc: SB.Refs.plain(p, sc.description),
          sceneIdx: si,
          /* the first card of the scene that actually prints — a scene whose
           * opening shots are all "no shot" still gets its banner */
          sceneFirst: first,
          type: sh.type || '',
          color: sh.color || SB.Model.CARD_COLORS[0],
          img: sh.image ? SB.Blobs.src(p, sh.image) : null,
          script: SB.Doc.renderHTML(w.doc, w.from, w.to, null),
          desc: SB.Refs.plain(p, sh.description)
        });
        first = false;
      });
    });
    return out;
  }

  /* ---------- pagination ---------- */

  /* Returns [{banner, items}]. A banner is a cell whose scene heading and
   * description head the sheet; it sits in the grid as a full-width item, so it
   * costs one row's worth of cards rather than squeezing the rows shorter and
   * spilling their text. */
  function paginate(list, pr, o) {
    const perPage = pr.cols * pr.rows;
    const pages = [];
    let page = null;

    function add(banner) { page = { banner: banner || null, items: [] }; pages.push(page); }
    function full() { return page.items.length >= perPage - (page.banner ? pr.cols : 0); }

    /* runs of cards that must not share a sheet with the next run */
    const runs = [];
    list.forEach(function (c) {
      if (o.scenePageBreak && (!runs.length || c.sceneFirst)) runs.push([]);
      else if (!runs.length) runs.push([]);
      runs[runs.length - 1].push(c);
    });

    runs.forEach(function (run) {
      page = null;
      run.forEach(function (c) {
        if (o.sceneBanner && c.sceneFirst) {
          /* a 1-up sheet has no room for both, so the banner becomes a title sheet */
          if (pr.cols >= perPage) { pages.push({ banner: c, items: [] }); add(null); }
          else add(c);
        } else if (!page || full()) {
          add(null);
        }
        page.items.push(c);
      });
    });
    return pages;
  }

  function layout(o) {
    o = options(o);
    const pr = preset(o.preset);
    const list = cells();
    return {
      preset: pr, opts: o, perPage: pr.cols * pr.rows,
      paper: PAPER[pr.orient], shots: list.length,
      sheets: paginate(list, pr, o).length
    };
  }

  /* ---------- the sheet ---------- */

  function cellHTML(c, pr, o) {
    const accent = o.color === 'accent';
    const cls = 'cell' + (pr.dir === 'row' ? ' row' : '') + (pr.frame === 'fill' ? ' fill' : '');
    const style = accent ? ' style="border-color:' + mix(c.color, INK.line, .55) + '"' : '';

    /* The meta bar only gets a wash of the colour — the shot type on it is
     * printed in grey, and at anything like full strength it disappeared. The
     * stripe carries the colour itself, so cards stay tellable apart even on a
     * greyscale printer. */
    const metaStyle = accent ? ' style="background:' + mix(c.color, INK.meta, .86) + '"' : '';
    const stripe = accent ? '<div class="stripe" style="background:' + c.color + '"></div>' : '';

    let meta = '<div class="meta"' + metaStyle + '><span class="code">' + SB.esc(c.code) + '</span>';
    if (o.showSceneHeading) meta += '<span class="scene">' + SB.esc(c.scene) + '</span>';
    else meta += '<span class="scene"></span>';
    if (o.showType && c.type) meta += '<span class="type">' + SB.esc(c.type) + '</span>';
    meta += '</div>';

    /* Whichever text box comes last takes the leftover height. It used to be
     * hardcoded to .desc, which left a gap under the script once description
     * was switched off. */
    const boxes = [];
    if (o.showScript) {
      boxes.push({ cls: 'script', inner: c.script || '<i class="dim">(no script)</i>' });
    }
    if (o.showDesc) boxes.push({ cls: 'desc', inner: SB.esc(c.desc) });
    const text = boxes.map(function (b, i) {
      return '<div class="' + b.cls + (i === boxes.length - 1 ? ' grow' : '') + '">' +
        '<div class="clip">' + b.inner + '</div></div>';
    }).join('');

    return '<figure class="' + cls + '"' + style + '>' + stripe +
      '<div class="frame">' +
      (c.img ? '<img src="' + c.img + '">' : '<div class="empty">no frame</div>') +
      '</div>' +
      '<div class="side">' + meta + text + '</div>' +
      '</figure>';
  }

  function bannerHTML(c, o) {
    const accent = o.color === 'accent';
    const style = accent ? ' style="border-left-color:' + c.color + '"' : '';
    return '<div class="banner"' + style + '>' +
      '<div class="bh">' + SB.esc(c.scene || 'Scene') + '</div>' +
      (c.sceneDesc ? '<div class="bd">' + SB.esc(c.sceneDesc) + '</div>' : '') +
      '</div>';
  }

  function sheetCSS(pr, o) {
    const paper = PAPER[pr.orient];
    const css = [
      '@page{size:' + pr.orient + ';margin:12mm}',
      '*{box-sizing:border-box}',
      ':root{--page-w:' + paper.w + ';--page-h:' + paper.h + ';--gap:5mm}',
      'html,body{margin:0;padding:0}',
      'body{font:' + pr.font + 'px/1.4 "Segoe UI",system-ui,sans-serif;color:#111;background:#e9eaee;' +
      '-webkit-print-color-adjust:exact;print-color-adjust:exact}',

      /* one sheet */
      '.page{width:var(--page-w);height:var(--page-h);margin:8mm auto;padding:0;background:#fff;' +
      'display:flex;flex-direction:column;box-shadow:0 1px 8px rgba(0,0,0,.22);break-after:page}',
      '.page:last-child{break-after:auto}',

      /* cells that can never grow past their share of the sheet */
      '.grid{flex:1;min-height:0;display:grid;' +
      'grid-template-columns:repeat(' + pr.cols + ',minmax(0,1fr));' +
      'grid-template-rows:repeat(' + pr.rows + ',minmax(0,1fr));gap:var(--gap)}',
      /* margin:0 matters — a <figure> carries 40px of it by default, which
       * quietly narrowed every cell by 80px */
      '.cell{margin:0;min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden;' +
      'border:1px solid ' + INK.line + ';border-radius:3px;background:#fff}',
      '.cell.row{flex-direction:row}',
      '.side{flex:1 1 auto;min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden}',
      /* in a row cell the stripe becomes the left edge for free */
      '.stripe{flex:0 0 2.5mm}',

      /* A fixed frame dimension, not an aspect-ratio: in a flex box the ratio
       * ends up sized by whatever space the text leaves, so the pictures moved
       * around as descriptions changed length. Any shape letterboxes inside. */
      '.frame{background:#f2f3f5;border-bottom:1px solid ' + INK.soft + ';' +
      'display:flex;align-items:center;justify-content:center;overflow:hidden}',
      pr.frame === 'fill'
        ? '.cell .frame{flex:1 1 auto;min-height:0}'
        : '.cell .frame{flex:0 0 ' + pr.frame + ';height:' + pr.frame + '}',
      '.cell.row .frame{height:auto;border-bottom:none;border-right:1px solid ' + INK.soft + '}',
      pr.dir === 'row' && pr.frame !== 'fill'
        ? '.cell.row .frame{flex:0 0 ' + pr.frame + ';width:' + pr.frame + '}' : '',
      '.frame img{max-width:100%;max-height:100%;width:auto;height:auto;display:block;' +
      'object-fit:contain}',
      '.empty{color:#9aa0aa;font-size:9px;letter-spacing:.4px;text-transform:uppercase}',

      '.meta{flex:0 0 auto;display:flex;gap:6px;align-items:baseline;padding:3px 5px;' +
      'background:' + INK.meta + ';border-bottom:1px solid ' + INK.soft + '}',
      '.code{font-weight:700}',
      '.scene{flex:1;min-width:0;font-size:.9em;color:#333;overflow:hidden;text-overflow:ellipsis;' +
      'white-space:nowrap}',
      '.type{font-size:.82em;text-transform:uppercase;letter-spacing:.4px;color:#666;white-space:nowrap}',

      /* The clamp lives on an inner box: a flex item is blockified, which
       * throws -webkit-box away and leaves text cut through the middle of a
       * line instead of ending in an ellipsis. */
      '.script{flex:0 1 auto;min-height:0;padding:4px 5px;overflow:hidden;' +
      'border-bottom:1px dashed #e3e5e9}',
      '.desc{flex:0 1 auto;min-height:0;padding:4px 5px 5px;color:#333;overflow:hidden}',
      '.grow{flex:1 1 auto}',
      '.script.grow{border-bottom:none}',
      '.clip{display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}',
      /* clamp 0 means print the lot, and -webkit-box with no clamp would cut
       * the last line in half instead of just ending */
      pr.script ? '.script .clip{-webkit-line-clamp:' + pr.script + '}' : '.script .clip{display:block}',
      pr.desc ? '.desc .clip{-webkit-line-clamp:' + pr.desc + '}' : '.desc .clip{display:block}',
      '.dim{color:#9aa0aa}',

      /* a scene band, sitting in the grid so the rows keep their height */
      '.banner{grid-column:1/-1;min-width:0;overflow:hidden;display:flex;flex-direction:column;' +
      'justify-content:center;gap:3px;padding:4mm 5mm;background:' + INK.meta + ';' +
      'border:1px solid ' + INK.line + ';border-left:3mm solid ' + INK.line + ';border-radius:3px}',
      '.bh{font-size:1.5em;font-weight:700;line-height:1.2}',
      '.bd{color:#333;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;' +
      '-webkit-line-clamp:6;white-space:pre-wrap}',

      'footer{flex:0 0 auto;padding-top:3mm;font-size:9px;color:#666;text-align:center}',

      '@media print{body{background:#fff}' +
      '.page{width:auto;height:var(--page-h);margin:0;box-shadow:none}}'
    ];
    return css.filter(Boolean).join('');
  }

  /* Printing before the frames have decoded is what produced a sheet of
   * collapsed images, so wait for them. */
  const READY = 'window.addEventListener("load",function(){' +
    'var imgs=[].slice.call(document.images);' +
    'Promise.all(imgs.map(function(i){' +
    'return i.decode?i.decode().catch(function(){}):Promise.resolve();}))' +
    '.then(function(){setTimeout(function(){window.print()},120)});});';

  /* opts.silent skips the auto-print script — the options dialog previews the
   * sheet in an iframe and must not open a print dialog while it does. */
  function html(o) {
    const p = P();
    o = options(o);
    const pr = preset(o.preset);
    const list = cells();
    const sheets = paginate(list, pr, o);

    let pages = sheets.map(function (pg, i) {
      const inner = (pg.banner ? bannerHTML(pg.banner, o) : '') +
        pg.items.map(function (c) { return cellHTML(c, pr, o); }).join('');
      /* A band costs a row's worth of cards either way, but letting its row
       * size to its content hands that height back to the cards below instead
       * of leaving a third of the sheet empty. A band with no cards under it is
       * a title sheet, so there it fills. */
      const rows = (pg.banner && pg.items.length && pr.rows > 1)
        ? ' style="grid-template-rows:auto repeat(' + (pr.rows - 1) + ',minmax(0,1fr))"'
        : '';
      const foot = o.footer
        ? '<footer>' + SB.esc(p.name) + ' · ' + SB.esc(p.versionName) + ' · page ' +
        (i + 1) + ' of ' + sheets.length + '</footer>'
        : '';
      return '<section class="page"><div class="grid"' + rows + '>' + inner + '</div>' +
        foot + '</section>';
    }).join('');
    if (!pages) pages = '<section class="page"><p>Nothing to print — every shot is marked “no shot”.</p></section>';

    return '<!DOCTYPE html><html><head><meta charset="utf-8"><title>' + SB.esc(p.name) +
      ' — storyboard</title><style>' + sheetCSS(pr, o) + '</style></head><body>' + pages +
      (o.silent ? '' : '<script>' + READY + '<\/script>') + '</body></html>';
  }

  function exportPdf(o) {
    const w = window.open('', '_blank');
    if (!w) { SB.toast('Allow pop-ups for this page to export the PDF', true); return; }
    w.document.open();
    w.document.write(html(o));
    w.document.close();
  }

  SB.Pdf = {
    exportPdf: exportPdf, html: html, cells: cells,
    PRESETS: PRESETS, PAPER: PAPER, preset: preset, layout: layout, options: options
  };

})(window.SB);

</script>
<script>
/* ===== js/exportoptions.js ===== */
/* exportoptions.js — the dialog behind the PDF button.
 *
 * Picks a layout preset and what goes on each card, previews the real sheet in
 * an iframe, and on Export commits the choices to project.settings.export so
 * the board remembers how it prints.
 */
(function (SB) {
  'use strict';

  function P() { return SB.app.project; }

  function field(labelText, control) {
    const l = SB.el('label', 'field');
    l.appendChild(SB.el('span', null, labelText));
    l.appendChild(control);
    return l;
  }

  function toggle(labelText, checked, onChange) {
    const l = SB.el('label', 'pp-toggle');
    const chk = document.createElement('input');
    chk.type = 'checkbox';
    chk.checked = !!checked;
    chk.onchange = function () { onChange(chk.checked); };
    l.appendChild(chk);
    l.appendChild(document.createTextNode(' ' + labelText));
    return l;
  }

  /* "Landscape, 3 across × 2 down — 6 cards a sheet" */
  function describe(pr) {
    const shape = pr.cols + ' across × ' + pr.rows + ' down';
    const n = pr.cols * pr.rows;
    return (pr.orient === 'landscape' ? 'Landscape' : 'Portrait') + ', ' + shape +
      ' — ' + n + (n === 1 ? ' card a sheet' : ' cards a sheet') +
      (pr.dir === 'row' ? ', frame beside the words' : '');
  }

  function open() {
    const p = P();
    /* edit a copy: Cancel has to leave the project exactly as it was */
    const working = SB.clone(p.settings.export || SB.Model.defaultExport());

    const body = SB.el('div', 'xp-body');
    const left = SB.el('div', 'xp-left');
    const right = SB.el('div', 'xp-right');
    body.appendChild(left);
    body.appendChild(right);

    /* ---------------- layout ---------------- */
    const presetSel = document.createElement('select');
    SB.Pdf.PRESETS.forEach(function (pr) {
      const op = document.createElement('option');
      op.value = pr.id;
      op.textContent = pr.label;
      if (pr.id === working.preset) op.selected = true;
      presetSel.appendChild(op);
    });
    presetSel.onchange = function () { working.preset = presetSel.value; draw(); };
    left.appendChild(field('Layout', presetSel));

    const shape = SB.el('div', 'pp-note');
    left.appendChild(shape);

    /* ---------------- what goes on a card ---------------- */
    left.appendChild(SB.el('div', 'xp-head', 'On each card'));
    [
      ['showType', 'Shot type'],
      ['showScript', 'Script'],
      ['showDesc', 'Description'],
      ['showSceneHeading', 'Scene name']
    ].forEach(function (t) {
      left.appendChild(toggle(t[1], working[t[0]], function (v) { working[t[0]] = v; draw(); }));
    });

    /* ---------------- scenes ---------------- */
    left.appendChild(SB.el('div', 'xp-head', 'Scenes'));
    left.appendChild(toggle('Band with the scene description where a scene starts',
      working.sceneBanner, function (v) { working.sceneBanner = v; draw(); }));
    left.appendChild(toggle('Start each scene on a new sheet',
      working.scenePageBreak, function (v) { working.scenePageBreak = v; draw(); }));

    /* ---------------- colour + footer ---------------- */
    left.appendChild(SB.el('div', 'xp-head', 'Sheet'));
    const colorSel = document.createElement('select');
    [['accent', 'Card colour on the edge and meta bar'], ['off', 'Plain grey, no card colour']]
      .forEach(function (o) {
        const op = document.createElement('option');
        op.value = o[0]; op.textContent = o[1];
        if (working.color === o[0]) op.selected = true;
        colorSel.appendChild(op);
      });
    colorSel.onchange = function () { working.color = colorSel.value; draw(); };
    left.appendChild(field('Colour', colorSel));
    left.appendChild(toggle('Footer with the project name, version and page number',
      working.footer, function (v) { working.footer = v; draw(); }));

    left.appendChild(SB.el('div', 'pp-note',
      'Cards marked “no shot” never print. Comments and ink are left off the sheet. ' +
      'Frames are stored at 854×480, so a one-up sheet will look soft up close.'));

    /* ---------------- preview ---------------- */
    const count = SB.el('div', 'xp-count');
    const stage = SB.el('div', 'xp-stage');
    const frame = document.createElement('iframe');
    frame.className = 'xp-frame';
    stage.appendChild(frame);
    right.appendChild(SB.el('div', 'xp-head', 'Preview'));
    right.appendChild(count);
    right.appendChild(stage);

    /* Redraw everything from `working` — same clear-and-rebuild style as the
     * settings dialog, and cheap because SB.Pdf.html() already hands back a
     * whole document. `silent` keeps the sheet from opening a print dialog. */
    function draw() {
      const info = SB.Pdf.layout(working);
      shape.textContent = describe(info.preset);
      count.textContent = info.shots + (info.shots === 1 ? ' shot → ' : ' shots → ') +
        info.sheets + (info.sheets === 1 ? ' sheet' : ' sheets');

      /* the sheet is laid out in mm; scale the real thing down rather than
       * re-styling it, so what is previewed is what prints */
      const wide = info.preset.orient === 'landscape';
      const pw = wide ? 964 : 703;              // page width in px at 96dpi
      const ph = wide ? 703 : 949;
      const scale = 300 / pw;
      frame.style.width = pw + 'px';
      frame.style.height = ph + 'px';
      frame.style.transform = 'scale(' + scale + ')';
      stage.style.height = Math.round(ph * scale) + 'px';

      const shown = SB.clone(working);
      shown.silent = true;
      const doc = frame.contentDocument;
      doc.open();
      doc.write(SB.Pdf.html(shown));
      doc.close();
    }
    /* the iframe has no document until it is in the page, so the modal has to
     * exist before the first preview is drawn */
    SB.modal({
      title: 'PDF export', width: '820px', body: body,
      buttons: [
        { label: 'Cancel' },
        {
          label: 'Export', primary: true, onClick: function (close) {
            delete working.silent;
            p.settings.export = working;
            SB.app.changed(false);
            close();
            SB.Pdf.exportPdf(working);
          }
        }
      ]
    });
    draw();
  }

  SB.ExportOptions = { open: open };

})(window.SB);

</script>
<script>
/* ===== js/app.js ===== */
/* app.js — boot + wiring. */
(function (SB) {
  'use strict';

  const app = SB.app = {
    project: null,
    selectedShotId: null,
    selectedSceneId: null,
    commentMode: false,
    pendingHandle: null
  };

  /* Any change at all. structural = the card layout must be rebuilt. */
  app.changed = function (structural) {
    if (structural) {
      /* only a structural change can orphan an image (a deleted shot, a
       * replaced frame, a dropped version) */
      SB.Blobs.gc(app.project);
      SB.Board.render();
      renderChrome();
    } else {
      SB.Board.renderSceneList();
    }
    /* The prompt table is a view of the same shots — left alone it drifted a
     * row behind the board, and its counts with it. */
    SB.PromptPanel.follow();
    SB.Store.touch();
  };

  /* A change to shared script text: refresh every window onto the master. */
  app.scriptChanged = function () {
    SB.Board.renderScriptWindows();
    SB.ScriptMode.refresh();
    SB.ScriptMode.invalidateSelection();
    SB.Store.touch();
  };

  /* Which build is this? Shown on the brand, so a stale copy of the single
   * file can be spotted instead of argued about. */
  function stampBuild() {
    const b = document.querySelector('.brand');
    if (!b) return;
    const build = window.SB_BUILD || 'source';
    b.title = 'Storyboarder — build ' + build;
    b.appendChild(SB.el('span', 'build-stamp', build));
  }

  function renderChrome() {
    const p = app.project;
    document.getElementById('projName').value = p.name || '';
    document.getElementById('verLabel').textContent = p.versionName || ('v' + p.versionNumber);
  }

  function setProject(p) {
    app.project = p;
    SB.History.reset();
    app.selectedShotId = null;
    app.selectedSceneId = p.scenes[0] ? p.scenes[0].id : null;
    SB.Board.render();
    renderChrome();
    SB.ScriptMode.refresh();
    SB.PromptPanel.refresh();
    SB.PersonaPanel.refresh();
  }

  /* ---------------- boot ---------------- */

  function boot() {
    if (!SB.Store.hasFS) {
      SB.toast('This app needs Chrome or Edge (File System Access API) to autosave.', true);
    }
    SB.ScriptMode.init();
    SB.PromptPanel.init();
    SB.PersonaPanel.init();
    SB.Store.S.getProject = function () { return app.project; };
    SB.Store.S.onState = function (txt, cls) {
      const el = document.getElementById('saveState');
      el.textContent = txt;
      el.className = 'save-state ' + (cls || '');
    };

    /* A save that fails silently is how a board gets lost. Make it impossible
     * to miss, and hand over a rescue copy on the spot. */
    SB.Store.S.onFailure = function (what) {
      const body = SB.el('div');
      body.appendChild(SB.el('p', null,
        'Your board could not be saved to its file — ' + what + '.'));
      body.appendChild(SB.el('p', null,
        'Nothing has been lost from this window. Download a copy now, then use ' +
        '“Save as…” to point the board at a fresh file.'));
      SB.modal({
        title: 'Save failed',
        body: body,
        buttons: [
          {
            label: 'Download a copy', primary: true, onClick: function (close) {
              SB.Store.downloadCopy(app.project, 'rescue');
              close();
            }
          },
          { label: 'Save as…', onClick: function (close) { close(); doSaveAs(); } },
          { label: 'Dismiss' }
        ]
      });
    };

    stampBuild();
    setProject(SB.Model.newProject());
    wire();

    SB.Store.lastHandle().then(function (h) {
      if (!h) {
        /* file:// has no working IndexedDB, so the last project cannot be
         * remembered there. Say so rather than showing a bare "no file". */
        SB.Store.storageUsable().then(function (ok) {
          if (ok || SB.Store.S.handle) return;
          const el = document.getElementById('saveState');
          el.textContent = 'no file — Open…';
          el.className = 'save-state dirty';
          el.title = 'Opened from a file:// page, so this browser cannot remember your ' +
            'last project. Use Open… each session; autosave works normally once a file is open.';
        });
        return;
      }
      return h.queryPermission({ mode: 'readwrite' }).then(function (perm) {
        if (perm === 'granted') {
          return SB.Store.loadFromHandle(h, false).then(setProject)
            .catch(function (e) { loadFailed(h, e); });
        }
        app.pendingHandle = h;
        const el = document.getElementById('saveState');
        el.textContent = 'reopen ' + h.name;
        el.className = 'save-state dirty';
        el.style.cursor = 'pointer';
        el.title = 'Click to reopen the last project';
      });
    }).catch(function () { });
  }

  /* A project file that will not open must never look like a fresh start —
   * and if it is merely cut short, most of it is still in there. */
  function loadFailed(handle, err) {
    const el = document.getElementById('saveState');
    el.textContent = 'could not open ' + (handle && handle.name ? handle.name : 'the project');
    el.className = 'save-state dirty';

    const name = (handle && handle.name) || 'the project file';
    const body = SB.el('div');
    body.appendChild(SB.el('p', null,
      'Storyboarder could not read “' + name + '”: ' +
      (err && err.message ? err.message : String(err))));
    body.appendChild(SB.el('p', null,
      'The blank board on screen is NOT your project — nothing has overwritten your file, ' +
      'and it will not be saved over unless you choose that file again.'));

    const buttons = [
      { label: 'Open a different file…', onClick: function (close) { close(); doOpen(); } },
      { label: 'Dismiss' }
    ];

    /* offer the rescue only when there is genuinely something to rescue */
    SB.Store.readHandle(handle).then(function (text) {
      const r = SB.Store.repairReport(text);
      if (!r) return;
      body.appendChild(SB.el('p', null,
        'It looks cut short rather than corrupt — the last ' + r.lost +
        ' characters are missing. Everything before that is intact: ' +
        r.scenes + ' scene' + (r.scenes === 1 ? '' : 's') + ', ' +
        r.shots + ' shot' + (r.shots === 1 ? '' : 's') + ', ' +
        r.images + ' image' + (r.images === 1 ? '' : 's') + ', ' +
        r.script + ' characters of script' +
        (r.settings ? '.' : ', and the settings will be rebuilt from defaults.')));
      const foot = m.root.querySelector('.foot');
      const fix = SB.el('button', 'tb on', 'Recover what is there');
      fix.onclick = function () {
        let p;
        try { p = SB.Model.migrate(JSON.parse(r.text)); }
        catch (e) { SB.toast('The repair did not hold: ' + e.message, true); return; }
        m.close();
        SB.Store.detach();          // do not write the repair over the damaged file
        setProject(p);
        SB.toast('Recovered — use “Save as…” to write it to a new file');
      };
      foot.insertBefore(fix, foot.firstChild);
    }).catch(function () { /* nothing readable; the message above stands */ });

    const m = SB.modal({ title: 'That project would not open', body: body, buttons: buttons });
  }

  function doOpen() {
    let picked = null;
    SB.Store.pick().then(function (h) {
      picked = h;
      return SB.Store.loadFromHandle(h, true);
    }).then(setProject).catch(function (e) {
      if (e && e.name === 'AbortError') return;
      if (picked) loadFailed(picked, e);       // offer the repair on a bad file
      else SB.toast(e.message || String(e), true);
    });
  }

  function doSaveAs() {
    SB.Store.saveAs(app.project).then(function (n) { SB.toast('Autosaving to ' + n); })
      .catch(function (e) {
        if (e && e.name === 'AbortError') return;
        SB.toast(e.message || String(e), true);
      });
  }

  function wire() {
    const $ = function (id) { return document.getElementById(id); };

    $('projName').addEventListener('input', function () {
      app.project.name = this.value; SB.Store.touch();
    });

    $('saveState').addEventListener('click', function () {
      if (!app.pendingHandle) return;
      const h = app.pendingHandle;
      app.pendingHandle = null;
      this.style.cursor = '';
      SB.Store.loadFromHandle(h, true).then(setProject)
        .catch(function (e) { SB.toast(e.message, true); });
    });

    $('btnNew').addEventListener('click', function () {
      if (!confirm('Start a new project? The current one is already saved to its file.')) return;
      SB.Store.detach();
      setProject(SB.Model.newProject());
    });

    $('btnOpen').addEventListener('click', doOpen);
    $('btnSaveAs').addEventListener('click', doSaveAs);
    $('btnCopy').addEventListener('click', function () {
      if (!SB.Store.downloadCopy(app.project)) SB.toast('Nothing to copy yet', true);
    });

    $('btnScript').addEventListener('click', function () { SB.ScriptMode.toggle(); });

    $('btnUndo').addEventListener('mousedown', function (e) { e.preventDefault(); });
    $('btnUndo').addEventListener('click', function () {
      if (!SB.History.undo()) SB.toast('Nothing to undo');
    });
    $('btnRedo').addEventListener('mousedown', function (e) { e.preventDefault(); });
    $('btnRedo').addEventListener('click', function () {
      if (!SB.History.redo()) SB.toast('Nothing to redo');
    });

    $('btnComment').addEventListener('click', function () {
      app.commentMode = !app.commentMode;
      this.classList.toggle('on', app.commentMode);
      document.body.classList.toggle('comment-mode', app.commentMode);
      SB.Board.render();
      /* commenting on the script needs the script in front of you */
      if (app.commentMode && !SB.ScriptMode.isOpen()) SB.ScriptMode.open();
    });

    $('btnPersonas').addEventListener('click', function () { SB.PersonaPanel.toggle(); });

    $('btnPrompts').addEventListener('click', function () { SB.PromptPanel.toggle(); });

    $('btnTheme').addEventListener('click', function () { SB.Theme.toggle(); });

    $('btnVersions').addEventListener('click', function () { SB.Versions.open(); });
    $('btnPdf').addEventListener('click', function () { SB.ExportOptions.open(); });
    $('btnSettings').addEventListener('click', function () { SB.Settings.open(); });

    $('btnAddScene').addEventListener('click', function () {
      const sc = SB.Model.addScene(app.project);
      app.selectedSceneId = sc.id;
      app.changed(true);
    });

    /* paste an image straight onto the selected card (text pastes are left alone) */
    document.addEventListener('paste', function (ev) {
      const cd = ev.clipboardData;
      const file = cd && Array.prototype.filter.call(cd.items || [], function (i) {
        return i.kind === 'file' && /^image\//.test(i.type);
      })[0];
      if (!file) return;
      /* Whatever is on top owns the clipboard. Without this the paste went
       * straight through an open takeover and replaced the frame of a card
       * nobody could see — no toast, no undo, and the work was gone. */
      if (SB.PersonaPanel.isOpen()) {
        ev.preventDefault();
        SB.PersonaPanel.pasteImage(file.getAsFile());
        return;
      }
      if (document.querySelector('.modal-back')) return;
      if (!app.selectedShotId) { SB.toast('Select a card first, then paste', true); return; }
      const f = SB.Model.findShot(app.project, app.selectedShotId);
      if (!f) return;
      ev.preventDefault();
      const blob = file.getAsFile();
      if (blob) SB.Board.setImage(f.shot, blob);
    });

    document.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape') {
        if (SB.Board.swapArmed()) { ev.preventDefault(); SB.Board.armSwap(null); return; }
        if (SB.Board.selection().length > 1) { ev.preventDefault(); SB.Board.clearSelection(); return; }
      }
      /* Ctrl+A over the board picks every card, not the page text */
      if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'a') {
        const t = ev.target;
        if (t && (t.isContentEditable || t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
        ev.preventDefault();
        const all = [];
        SB.Model.eachShot(app.project, function (sh) { all.push(sh.id); });
        app.selection = all;
        app.selectedShotId = all[all.length - 1] || null;
        SB.Board.render();
        return;
      }
      if (!(ev.ctrlKey || ev.metaKey) || ev.altKey) return;
      const k = ev.key.toLowerCase();
      if (k === 's') {
        ev.preventDefault();
        SB.Store.saveNow();
        return;
      }
      /* undo/redo also works when focus isn't in a script box */
      const t = ev.target;
      if (t && t.isContentEditable) return;          // the editor handles its own
      if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
      if (k === 'z' || k === 'y') {
        ev.preventDefault();
        const redo = (k === 'y') || ev.shiftKey;
        if (!(redo ? SB.History.redo() : SB.History.undo())) {
          SB.toast(redo ? 'Nothing to redo' : 'Nothing to undo');
        }
      }
    });

    window.addEventListener('beforeunload', function (e) {
      if (SB.Store.S.dirty) { e.preventDefault(); e.returnValue = ''; }
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();

})(window.SB);

</script>
</body>
</html>
