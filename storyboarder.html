  function toggle() { panel.classList.contains('hidden') ? open() : close(); }
  function isOpen() { return panel && !panel.classList.contains('hidden'); }
  function refresh() { if (isOpen()) render(); }

  SB.PromptPanel = {
    init: init, open: open, close: close, toggle: toggle, isOpen: isOpen,
    refresh: refresh, run: run, refreshUsage: refreshUsage
  };

})(window.SB);

</script>
<script>
/* ===== js/personapanel.js ===== */
/* personapanel.js — add, edit and maintain the people who recur on the board. */
(function (SB) {
  'use strict';

  let panel, bodyEl, statusEl;

  function P() { return SB.app.project; }

  function init() {
    panel = document.getElementById('personaPanel');
    bodyEl = document.getElementById('personaBody');
  }

  function setStatus(txt, isErr) {
    if (!statusEl) return;
    statusEl.textContent = txt || '';
    statusEl.classList.toggle('err', !!isErr);
  }

  function render() {
    if (!panel || !P()) return;
    const p = P();
    bodyEl.innerHTML = '';

    /* --- generate --- */
    const gen = SB.el('div', 'pp-block');
    gen.appendChild(SB.el('div', 't', 'generate from the script'));

    const row = SB.el('div', 'pp-row');
    row.appendChild(SB.el('label', null, 'How many'));
    const count = document.createElement('select');
    [1, 2, 3, 4, 5].forEach(function (n) {
      const o = document.createElement('option');
      o.value = n; o.textContent = n;
      if (n === 2) o.selected = true;
      count.appendChild(o);
    });
    row.appendChild(count);
    gen.appendChild(row);

    const note = document.createElement('input');
    note.type = 'text';
    note.placeholder = 'optional direction — “one on-site technician”';
    const nRow = SB.el('div', 'pp-row');
    nRow.appendChild(SB.el('label', null, 'Direction'));
    nRow.appendChild(note);
    gen.appendChild(nRow);

    const acts = SB.el('div', 'pp-actions');
    const bGen = SB.el('button', 'tb on', 'Generate');
    bGen.onclick = function () {
      bGen.disabled = true;
      setStatus('reading the script…');
      SB.Personas.generate(p, parseInt(count.value, 10) || 1, note.value.trim())
        .then(function (made) {
          bGen.disabled = false;
          SB.app.changed(true);
          render();
          setStatus('added ' + made.length + ' — edit anything that is not right.');
        })
        .catch(function (e) {
          bGen.disabled = false;
          setStatus(e.message || String(e), true);
        });
    };
    const bAdd = SB.el('button', 'tb', '+ Blank persona');
    bAdd.onclick = function () {
      SB.Personas.add(p, {});
      SB.app.changed(true);
      render();
    };
    acts.appendChild(bGen);
    acts.appendChild(bAdd);
    gen.appendChild(acts);

    statusEl = SB.el('div', 'pp-status');
    gen.appendChild(statusEl);
    gen.appendChild(SB.el('div', 'pp-note',
      'Descriptions carry the wardrobe. That text plus the reference image is what keeps ' +
      'a person identical from shot to shot.'));
    bodyEl.appendChild(gen);

    /* --- the personas themselves --- */
    const list = SB.Personas.all(p);
    if (!list.length) {
      bodyEl.appendChild(SB.el('div', 'pp-note', 'No personas yet.'));
    }
    list.forEach(function (per, i) { bodyEl.appendChild(card(per, i)); });
  }

  function card(per, idx) {
    const p = P();
    const wrap = SB.el('div', 'persona');

    const head = SB.el('div', 'persona-head');
    const name = document.createElement('input');
    name.type = 'text';
    name.className = 'persona-name';
    name.value = per.name || '';
    name.placeholder = 'Name';
    name.addEventListener('input', function () {
      per.name = name.value;
      SB.Store.touch();
      SB.Board.refreshCast();
    });
    head.appendChild(name);

    const used = countShots(per.id);
    head.appendChild(SB.el('span', 'persona-used', used + (used === 1 ? ' shot' : ' shots')));

    const del = SB.el('button', 'mini danger', '✕');
    del.title = 'Remove this persona and take it off every shot';
    del.onclick = function () {
      if (!confirm('Remove “' + (per.name || 'persona') + '”? It comes off ' + used + ' shot(s).')) return;
      SB.Personas.remove(p, per.id);
      SB.app.changed(true);
      render();
    };
    head.appendChild(del);
    wrap.appendChild(head);

    /* reference frame */
    const frame = SB.el('div', 'persona-frame');
    if (per.image) {
      const img = document.createElement('img');
      img.src = per.image.data;
      frame.appendChild(img);
    } else {
      frame.appendChild(SB.el('div', 'drop-hint', 'drop the reference frame here, or click to load'));
    }
    frame.onclick = function () {
      SB.pickImageFile().then(function (f) { if (f) setImage(per, f); });
    };
    frame.addEventListener('dragover', function (ev) {
      ev.preventDefault();
      frame.classList.add('drag-over');
    });
    frame.addEventListener('dragleave', function () { frame.classList.remove('drag-over'); });
    frame.addEventListener('drop', function (ev) {
      ev.preventDefault();
      frame.classList.remove('drag-over');
      SB.imageFromTransfer(ev.dataTransfer).then(function (src) {
        if (src) setImage(per, src);
        else SB.toast('No image in that drop', true);
      });
    });
    if (per.image) {
      const rm = SB.el('button', 'mini danger persona-clear', 'remove image');
      rm.onclick = function (ev) {
        ev.stopPropagation();
        per.image = null;
        SB.app.changed(true);
        render();
      };
      frame.appendChild(rm);
    }
    wrap.appendChild(frame);
    wrap.appendChild(SB.el('div', 'pp-note',
      per.image
        ? 'Fed to the model as image ' + imageIndex(per) + ' wherever this persona appears.'
        : 'No reference image — prompts will describe this person in full instead.'));

    wrap.appendChild(SB.el('div', 'box-label', 'description + wardrobe'));
    const d = document.createElement('textarea');
    d.className = 'persona-text';
    d.rows = 4;
    d.value = per.description || '';
    d.placeholder = 'Age range, build, hair, and the exact outfit — fabric and colour.';
    d.addEventListener('input', function () { per.description = d.value; SB.Store.touch(); });
    wrap.appendChild(d);

    wrap.appendChild(SB.el('div', 'box-label', 'reference image prompt'));
    const ip = document.createElement('textarea');
    ip.className = 'persona-text';
    ip.rows = 4;
    ip.value = per.imagePrompt || '';
    ip.placeholder = 'The prompt that makes this person’s reference frame.';
    ip.addEventListener('input', function () { per.imagePrompt = ip.value; SB.Store.touch(); });
    wrap.appendChild(ip);

    const foot = SB.el('div', 'pp-actions');
    const copy = SB.el('button', 'mini', 'copy prompt');
    copy.onclick = function () {
      navigator.clipboard.writeText(per.imagePrompt || '').then(function () {
        SB.toast('Reference prompt copied');
      }).catch(function () { SB.toast('Could not copy', true); });
    };
    foot.appendChild(copy);

    const write = SB.el('button', 'mini', 'write it for me');
    write.title = 'Ask the writer model for a reference-frame prompt from the description';
    write.onclick = function () {
      if (!(per.description || '').trim()) { SB.toast('Write a description first', true); return; }
      write.disabled = true;
      const m = SB.Model.imageModel(P());
      const sys = SB.Brand.brandOf(P()).enabled
        ? 'HOUSE STYLE — obey this.\n\n' + SB.Brand.brandOf(P()).text : '';
      SB.Prompts.raw(
        'Write one still-image prompt for ' + (m ? m.name : 'an image model') +
        ' that produces a clean, front-facing reference frame of this person: plain background, ' +
        'natural light, full wardrobe visible, neutral expression. No gendered language.\n\n' +
        'PERSON:\n' + per.description,
        { type: 'OBJECT', properties: { imagePrompt: { type: 'STRING' } }, required: ['imagePrompt'] },
        sys
      ).then(function (out) {
        per.imagePrompt = out.imagePrompt || '';
        ip.value = per.imagePrompt;
        write.disabled = false;
        SB.app.changed(true);
      }).catch(function (e) {
        write.disabled = false;
        SB.toast(e.message || String(e), true);
      });
    };
    foot.appendChild(write);
    wrap.appendChild(foot);

    return wrap;
  }

  function imageIndex(per) {
    const withImg = SB.Personas.all(P()).filter(function (x) { return !!x.image; });
    return withImg.indexOf(per) + 1;
  }

  function countShots(id) {
    let n = 0;
    SB.Model.eachShot(P(), function (sh) {
      if ((sh.personaIds || []).indexOf(id) >= 0) n++;
    });
    return n;
  }

  function setImage(per, src) {
    return SB.downscaleImage(src).then(function (img) {
      per.image = img;
      SB.app.changed(true);
      render();
    }).catch(function (e) { SB.toast('Image failed: ' + e.message, true); });
  }

  function open() {
    panel.classList.remove('hidden');
    document.getElementById('btnPersonas').classList.add('on');
    render();
  }
  function close() {
    panel.classList.add('hidden');
    document.getElementById('btnPersonas').classList.remove('on');
  }
  function toggle() { panel.classList.contains('hidden') ? open() : close(); }
  function isOpen() { return panel && !panel.classList.contains('hidden'); }
  function refresh() { if (isOpen()) render(); }

  SB.PersonaPanel = {
    init: init, open: open, close: close, toggle: toggle, isOpen: isOpen, refresh: refresh
  };

})(window.SB);

</script>
<script>
/* ===== js/usagepanel.js ===== */
/* usagepanel.js — the size readout: what this board weighs, what it moves,
 * and whether it could live on Firebase's free tier. */
(function (SB) {
  'use strict';

  const fmt = function (n) { return SB.Usage.fmt(n); };

  function P() { return SB.app.project; }

  /* the small always-on readout in the top bar */
  function refreshBadge() {
    const el = document.getElementById('sizeState');
    if (!el || !P()) return;
    let m;
    try { m = SB.Usage.measure(P()); } catch (e) { return; }
    el.textContent = fmt(m.total);
    el.title = 'This board is ' + fmt(m.total) + ' — ' +
      Math.round(m.imageBytes / Math.max(1, m.total) * 100) + '% images. Click for the breakdown.';
    el.classList.toggle('over', m.total > SB.Usage.FS_DOC_LIMIT);
  }

  function tile(label, value, note) {
    const d = SB.el('div', 'stat-tile');
    d.appendChild(SB.el('div', 'stat-label', label));
    d.appendChild(SB.el('div', 'stat-value', value));
    if (note) d.appendChild(SB.el('div', 'stat-note', note));
    return d;
  }

  function open() {
    const p = P();
    const m = SB.Usage.measure(p);
    const rate = SB.Store.saveRate();
    const stats = SB.Store.S.stats;
    const fb = SB.Usage.firebase(m, rate);

    const body = SB.el('div', 'usage');

    /* ---- headline numbers ---- */
    const tiles = SB.el('div', 'stat-row');
    tiles.appendChild(tile('This board', fmt(m.total),
      m.counts.shots + ' shots · ' + m.counts.scenes + ' scenes · ' + m.counts.images + ' images'));
    tiles.appendChild(tile('Images are', Math.round(m.imageBytes / Math.max(1, m.total) * 100) + '%',
      fmt(m.imageBytes) + ' of the file'));
    tiles.appendChild(tile('Saved this session', stats.writes.toLocaleString() + '×',
      fmt(stats.bytes) + ' written' + (rate ? ' · ≈' + Math.round(rate.perHour) + '/hour' : '')));
    body.appendChild(tiles);

    /* ---- the breakdown ---- */
    body.appendChild(SB.el('h3', 'usage-h', 'Where the bytes are'));
    const bar = SB.el('div', 'usage-bar');
    m.sections.forEach(function (s) {
      const seg = SB.el('span', 'usage-seg');
      seg.style.background = s.color;
      seg.style.flexGrow = String(Math.max(0.4, s.b / Math.max(1, m.total) * 100));
      seg.title = s.label + ' — ' + fmt(s.b);
      bar.appendChild(seg);
    });
    body.appendChild(bar);

    /* the same numbers as text, because colour alone is never the encoding */
    const table = SB.el('table', 'usage-table');
    const thead = SB.el('tr');
    ['', 'Part of the board', 'Size', 'Share'].forEach(function (h) {
      thead.appendChild(SB.el('th', null, h));
    });
    table.appendChild(thead);
    m.sections.forEach(function (s) {
      const tr = SB.el('tr');
      const sw = SB.el('td');
      const dot = SB.el('span', 'usage-dot');
      dot.style.background = s.color;
      sw.appendChild(dot);
      tr.appendChild(sw);
      tr.appendChild(SB.el('td', null, s.label + (s.n ? ' (' + s.n + ')' : '')));
      tr.appendChild(SB.el('td', 'num', fmt(s.b)));
      tr.appendChild(SB.el('td', 'num', Math.round(s.b / Math.max(1, m.total) * 100) + '%'));
      table.appendChild(tr);
    });
    body.appendChild(table);

    if (m.heaviest.length) {
      body.appendChild(SB.el('h3', 'usage-h', 'Heaviest single items'));
      const h = SB.el('div', 'usage-heavy');
      m.heaviest.forEach(function (x) {
        const row = SB.el('div', 'usage-heavy-row');
        row.appendChild(SB.el('span', null, x.label));
        row.appendChild(SB.el('span', 'num', fmt(x.b)));
        h.appendChild(row);
      });
      body.appendChild(h);
    }

    /* ---- firebase ---- */
    body.appendChild(SB.el('h3', 'usage-h', 'On Firebase’s free (Spark) plan'));
    const tight = fb.checks[0] && fb.checks[0].warn;
    const verdict = SB.el('div', 'usage-verdict' +
      (m.total > SB.Usage.FS_DOC_LIMIT ? ' bad' : (tight ? ' warn' : ' good')), fb.verdict);
    body.appendChild(verdict);

    const checks = SB.el('div', 'usage-checks');
    fb.checks.forEach(function (c) {
      const row = SB.el('div', 'usage-check' + (c.ok ? (c.warn ? ' warn' : '') : ' bad'));
      row.appendChild(SB.el('span', 'usage-mark', c.ok ? (c.warn ? '!' : '✓') : '✕'));
      const txt = SB.el('div');
      txt.appendChild(SB.el('div', 'usage-check-label', c.label));
      txt.appendChild(SB.el('div', 'usage-check-detail', c.detail));
      row.appendChild(txt);
      checks.appendChild(row);
    });
    body.appendChild(checks);

    body.appendChild(SB.el('div', 'pp-note',
      'Limits as published Aug 2026: a Firestore document is capped at 1 MiB (hard, not a quota); ' +
      'Spark gives 1 GiB stored, 20,000 writes and 50,000 reads a day; Cloud Storage — where image ' +
      'files would normally go — is not on Spark at all and needs the Blaze plan. ' +
      'Rates here are measured from this session, extrapolated over an 8-hour day for one editor.'));

    SB.modal({
      title: 'Data in this project',
      width: '760px',
      body: body,
      buttons: [
        {
          label: 'Copy report', onClick: function (close) {
            navigator.clipboard.writeText(report(m, fb, stats, rate))
              .then(function () { SB.toast('Report copied'); })
              .catch(function () { SB.toast('Could not copy', true); });
          }
        },
        { label: 'Close', primary: true }
      ]
    });
  }

  function report(m, fb, stats, rate) {
    const lines = [];
    lines.push('Storyboarder — data report for “' + P().name + '”');
    lines.push('Total board: ' + fmt(m.total));
    m.sections.forEach(function (s) {
      lines.push('  ' + s.label + ': ' + fmt(s.b) +
        ' (' + Math.round(s.b / Math.max(1, m.total) * 100) + '%)');
    });
    lines.push('Images: ' + fmt(m.imageBytes) + ' · text and structure: ' + fmt(m.textBytes));
    lines.push('Saved ' + stats.writes + '× this session, ' + fmt(stats.bytes) + ' written' +
      (rate ? ' (≈' + Math.round(rate.perHour) + '/hour, ≈' + Math.round(rate.perDay) + '/day)' : ''));
    lines.push('');
    lines.push('Firebase Spark:');
    fb.checks.forEach(function (c) {
      lines.push('  [' + (c.ok ? 'ok' : 'NO') + '] ' + c.label + ' — ' + c.detail);
    });
    lines.push('Verdict: ' + fb.verdict);
    return lines.join('\n');
  }

  /* Measuring re-serialises the whole board, so the badge is never recomputed
   * on the keystroke itself. */
  const debouncedBadge = SB.debounce(refreshBadge, 1200);

  SB.UsagePanel = { open: open, refreshBadge: refreshBadge, badgeSoon: debouncedBadge };

})(window.SB);

</script>
<script>
/* ===== js/settings.js ===== */
/* settings.js — tabbed: General · Models & templates · API. */
(function (SB) {
  'use strict';

  function P() { return SB.app.project; }

  function field(labelText, control) {
    const l = SB.el('label', 'field');
    l.appendChild(SB.el('span', null, labelText));
    l.appendChild(control);
    return l;
  }

  function open(startTab) {
    const p = P();
    const body = SB.el('div');

    const tabs = SB.el('div', 'tabs');
    const panels = {};
    const order = [['general', 'General'], ['brand', 'Brand style'],
    ['models', 'Models & templates'], ['api', 'API']];
    order.forEach(function (t) {
      const b = SB.el('button', 'tab', t[1]);
      b.dataset.tab = t[0];
      b.onclick = function () { select(t[0]); };
      tabs.appendChild(b);
      panels[t[0]] = SB.el('div', 'tab-panel');
    });
    function select(id) {
      tabs.querySelectorAll('.tab').forEach(function (b) { b.classList.toggle('on', b.dataset.tab === id); });
      order.forEach(function (t) { panels[t[0]].classList.toggle('on', t[0] === id); });
    }
    body.appendChild(tabs);
    const host = SB.el('div');
    host.style.paddingTop = '12px';
    order.forEach(function (t) { host.appendChild(panels[t[0]]); });
    body.appendChild(host);

    /* ---------------- General ---------------- */
    const types = document.createElement('textarea');
    types.rows = 8;
    types.value = p.settings.shotTypes.join('\n');
    panels.general.appendChild(field('Shot types (one per line)', types));

    const themeSel = document.createElement('select');
    [['dark', 'Dark'], ['light', 'Light']].forEach(function (o) {
      const op = document.createElement('option');
      op.value = o[0]; op.textContent = o[1];
      if (SB.Theme.current() === o[0]) op.selected = true;
      themeSel.appendChild(op);
    });
    themeSel.onchange = function () { SB.Theme.set(themeSel.value); };
    panels.general.appendChild(field('Appearance', themeSel));

    /* ---------------- Brand style ---------------- */
    const brand = SB.Brand.brandOf(p);
    const bOn = SB.el('label', 'pp-toggle');
    const bChk = document.createElement('input');
    bChk.type = 'checkbox';
    bChk.checked = brand.enabled;
    bOn.appendChild(bChk);
    bOn.appendChild(document.createTextNode(' Apply the house style to every prompt'));
    panels.brand.appendChild(bOn);

    panels.brand.appendChild(SB.el('div', 'pp-note',
      'Rides along with every prompt the app writes, on top of the per-model templates. ' +
      'The app adds the scene’s beat list underneath it automatically, so “same subject, same ' +
      'wardrobe, same location across the sequence” is something the writer can actually act on. ' +
      'The no-gendered-language rule is verified on the way back, not just requested.'));

    const bText = document.createElement('textarea');
    bText.rows = 22;
    bText.value = (p.settings.brand && p.settings.brand.text) || SB.Brand.DEFAULT;
    bText.style.fontSize = '11.5px';
    const bField = field('House style', bText);
    bField.style.marginTop = '10px';
    panels.brand.appendChild(bField);

    const bActs = SB.el('div', 'pp-actions');
    const bReset = SB.el('button', 'tb', 'Restore the default style');
    bReset.onclick = function () { bText.value = SB.Brand.DEFAULT; };
    const bPreview = SB.el('button', 'tb', 'Preview what a shot sends');
    bPreview.onclick = function () {
      const f = SB.app.selectedShotId && SB.Model.findShot(p, SB.app.selectedShotId);
      const shot = f ? f.shot : (p.scenes[0] && p.scenes[0].shots[0]);
      if (!shot) { SB.toast('Add a shot first', true); return; }
      const saved = p.settings.brand.text;
      p.settings.brand.text = bText.value;      // preview what is on screen
      const body = SB.el('div');
      const pre = document.createElement('textarea');
      pre.rows = 24;
      pre.readOnly = true;
      pre.value = SB.Brand.systemFor(p, shot, 'both');
      pre.style.fontSize = '11px';
      body.appendChild(pre);
      p.settings.brand.text = saved;
      SB.modal({
        title: 'System instruction for this shot', width: '760px', body: body,
        buttons: [{ label: 'Close', primary: true }]
      });
    };
    bActs.appendChild(bReset);
    bActs.appendChild(bPreview);
    panels.brand.appendChild(bActs);

    /* ---------------- Models & templates ---------------- */
    panels.models.appendChild(SB.el('div', 'pp-note',
      'One entry per target model. The templates tell Gemini how to write for that model — ' +
      'Midjourney-style parameters, natural language, whatever it needs.'));
    const hint = SB.el('div', 'vmeta',
      'Placeholders: {{MODEL}} {{SHOT_TYPE}} {{SCENE}} {{SCENE_DESC}} {{SCRIPT}} {{DESCRIPTION}} {{CODE}}');
    hint.style.margin = '6px 0 10px';
    panels.models.appendChild(hint);

    const listHost = SB.el('div');
    panels.models.appendChild(listHost);

    const working = SB.clone(p.settings.models);

    function drawModels() {
      listHost.innerHTML = '';
      working.forEach(function (m, i) {
        const row = SB.el('div', 'model-row');
        const top = SB.el('div', 'top');
        const name = document.createElement('input');
        name.type = 'text'; name.value = m.name; name.placeholder = 'Model name';
        name.oninput = function () { m.name = name.value; };
        const kind = document.createElement('select');
        [['video', 'video'], ['image', 'image']].forEach(function (k) {
          const o = document.createElement('option');
          o.value = k[0]; o.textContent = k[1];
          if (m.kind === k[0]) o.selected = true;
          kind.appendChild(o);
        });
        kind.onchange = function () { m.kind = kind.value; };
        const tpl = SB.el('button', 'mini', m.__open ? 'hide templates' : 'templates');
        tpl.onclick = function () { m.__open = !m.__open; drawModels(); };
        const rst = SB.el('button', 'mini', 'reset');
        rst.title = 'Restore the default templates for this model';
        rst.onclick = function () {
          m.imageTemplate = SB.Model.IMG_TPL; m.videoTemplate = SB.Model.VID_TPL;
          m.__open = true; drawModels();
        };
        const del = SB.el('button', 'mini danger', 'remove');
        del.onclick = function () { working.splice(i, 1); drawModels(); };
        top.appendChild(name); top.appendChild(kind);
        top.appendChild(tpl); top.appendChild(rst); top.appendChild(del);
        row.appendChild(top);

        if (m.__open) {
          const ti = document.createElement('textarea');
          ti.rows = 5; ti.value = m.imageTemplate;
          ti.oninput = function () { m.imageTemplate = ti.value; };
          row.appendChild(field('first-frame (image) template', ti));

          const tv = document.createElement('textarea');
          tv.rows = 5; tv.value = m.videoTemplate;
          tv.oninput = function () { m.videoTemplate = tv.value; };
          row.appendChild(field('image→video template', tv));

          const tr = document.createElement('textarea');
          tr.rows = 3;
          tr.value = m.referenceTemplate || SB.Personas.DEFAULT_REF_TEMPLATE;
          tr.oninput = function () { m.referenceTemplate = tr.value; };
          const trF = field('reference-image wording — how THIS model expects to be told about ' +
            'persona references ({{N}} = image number, {{NAME}} = names)', tr);
          row.appendChild(trF);
          const trHint = SB.el('div', 'pp-note',
            'Only used on shots that have cast. Leave blank for a model that takes no references.');
          row.appendChild(trHint);
        }
        listHost.appendChild(row);
      });
      const add = SB.el('button', 'tb', '+ Add model');
      add.onclick = function () {
        working.push({
          id: SB.uid('m'), name: 'New model', kind: 'video',
          imageTemplate: SB.Model.IMG_TPL, videoTemplate: SB.Model.VID_TPL, __open: true
        });
        drawModels();
      };
      listHost.appendChild(add);
    }
    drawModels();

    /* ---------------- API ---------------- */
    const key = document.createElement('input');
    key.type = 'password';
    key.value = SB.Store.getApiKey();
    key.placeholder = 'AIza…';
    panels.api.appendChild(field('Google (Gemini) API key', key));
    panels.api.appendChild(SB.el('div', 'pp-note',
      'Stored in this browser only — never written into the .storyboard file, so a board can be shared without leaking the key.'));

    let chosenModel = p.settings.geminiModel || SB.GeminiModels.DEFAULT;
    const pick = SB.GeminiModels.picker(chosenModel, function (id) { chosenModel = id; });
    const gmField = field('Gemini model used to write prompts', pick.el);
    gmField.style.marginTop = '14px';
    panels.api.appendChild(gmField);

    const refreshRow = SB.el('div', 'pp-actions');
    const refresh = SB.el('button', 'tb', 'Refresh list from my key');
    const refreshNote = SB.el('span', 'pp-note', '');
    refresh.onclick = function () {
      SB.Store.setApiKey(key.value.trim());   // use whatever is typed right now
      refresh.disabled = true;
      refreshNote.textContent = 'asking Google…';
      refreshNote.classList.remove('err');
      SB.GeminiModels.fetchAvailable().then(function (models) {
        pick.rebuild(chosenModel);
        refresh.disabled = false;
        refreshNote.textContent = models.length + ' models this key can reach.';
      }).catch(function (e) {
        refresh.disabled = false;
        refreshNote.textContent = e.message || String(e);
        refreshNote.classList.add('err');
      });
    };
    const useCurated = SB.el('button', 'tb', 'Back to curated list');
    useCurated.onclick = function () {
      SB.GeminiModels.clearCache();
      pick.rebuild(chosenModel);
      refreshNote.textContent = 'showing the built-in list.';
      refreshNote.classList.remove('err');
    };
    refreshRow.appendChild(refresh);
    refreshRow.appendChild(useCurated);
    panels.api.appendChild(refreshRow);
    panels.api.appendChild(refreshNote);
    panels.api.appendChild(SB.el('div', 'pp-note',
      'Google retires model ids on its own schedule. If a prompt run comes back 404, ' +
      'refresh this list — it asks your key what it can actually reach today.'));

    select(startTab && panels[startTab] ? startTab : 'general');

    SB.modal({
      title: 'Settings',
      width: '720px',
      body: body,
      buttons: [
        { label: 'Cancel' },
        {
          label: 'Save', primary: true, onClick: function (close) {
            const t = types.value.split('\n').map(function (s) { return s.trim(); })
              .filter(function (s) { return s; });
            p.settings.shotTypes = t.length ? t : SB.Model.DEFAULT_SHOT_TYPES.slice();
            const bTxt = bText.value.trim();
            p.settings.brand = (bTxt && bTxt !== SB.Brand.DEFAULT.trim())
              ? { enabled: bChk.checked, custom: true, text: bTxt }
              : { enabled: bChk.checked, custom: false };
            p.settings.geminiModel = (chosenModel || '').trim() || SB.GeminiModels.DEFAULT;
            p.settings.models = working.filter(function (m) { return (m.name || '').trim(); })
              .map(function (m) { delete m.__open; return m; });
            if (!p.settings.models.length) p.settings.models = SB.Model.defaultModels();
            const has = function (id) {
              return p.settings.models.some(function (m) { return m.id === id; });
            };
            if (!has(p.settings.imageModelId)) {
              p.settings.imageModelId = SB.Model.firstOfKind(p.settings.models, 'image');
            }
            if (!has(p.settings.videoModelId)) {
              p.settings.videoModelId = SB.Model.firstOfKind(p.settings.models, 'video');
            }
            SB.Store.setApiKey(key.value.trim());
            close();
            SB.app.changed(true);
            SB.PromptPanel.refresh();
            SB.toast('Settings saved');
          }
        }
      ]
    });
  }

  SB.Settings = { open: open };

})(window.SB);

</script>
<script>
/* ===== js/versions.js ===== */
/* versions.js — whole-project versions. Comments and ink freeze with the
 * version they were made in and do NOT carry forward into the new one.
 */
(function (SB) {
  'use strict';

  function P() { return SB.app.project; }

  function core(p) {
    return {
      master: SB.clone(p.master),
      scenes: SB.clone(p.scenes),
      versionNumber: p.versionNumber,
      versionName: p.versionName
    };
  }

  function freeze(p, note) {
    p.versions.push({
      n: p.versionNumber,
      name: p.versionName + (note ? ' — ' + note : ''),
      createdAt: Date.now(),
      snapshot: core(p)
    });
  }

  function countComments(snap) {
    let n = 0, ink = 0;
    (snap.scenes || []).forEach(function (sc) {
      sc.shots.forEach(function (sh) {
        n += (sh.comments || []).length;
        if (sh.annotation) ink++;
      });
    });
    return { comments: n, ink: ink };
  }

  function newVersion() {
    const p = P();
    const suggested = 'v' + (p.versionNumber + 1);
    const name = prompt('Name for the new version:', suggested);
    if (name === null) return;
    freeze(p, null);
    p.versionNumber = p.versionNumber + 1;
    p.versionName = (name || '').trim() || suggested;
    // fresh start: comments and drawings stay with the version they were made in
    SB.Model.eachShot(p, function (sh) { sh.comments = []; sh.annotation = null; });
    SB.app.changed(true);
    SB.toast('Now working in ' + p.versionName + ' — comments and ink start clean');
  }

  function restore(v) {
    const p = P();
    if (!confirm('Restore "' + v.name + '"?\n\nThe current state is saved as a version first, so nothing is lost.')) return;
    freeze(p, 'before restoring ' + v.name);
    p.master = SB.clone(v.snapshot.master);
    p.scenes = SB.clone(v.snapshot.scenes);
    p.versionNumber = p.versions.reduce(function (a, x) { return Math.max(a, x.n); }, p.versionNumber) + 1;
    p.versionName = v.name + ' (restored)';
    SB.app.selectedShotId = null;
    SB.app.changed(true);
    SB.toast('Restored ' + v.name);
  }

  function viewComments(v) {
    const body = SB.el('div');
    let any = false;
    (v.snapshot.scenes || []).forEach(function (sc, si) {
      sc.shots.forEach(function (sh, sj) {
        if (!(sh.comments || []).length && !sh.annotation) return;
        any = true;
        const h = SB.el('div', 'ver-row');
        h.appendChild(SB.el('b', null, SB.Model.code(si, sj) + ' · ' + (sc.heading || '')));
        if (sh.annotation) h.appendChild(SB.el('span', 'vmeta', ' (has ink)'));
        body.appendChild(h);
        (sh.comments || []).forEach(function (cm) {
          const r = SB.el('div', 'comment');
          r.appendChild(SB.el('span', 'when', SB.fmtDate(cm.at)));
          r.appendChild(SB.el('span', 'txt', cm.text));
          body.appendChild(r);
        });
      });
    });
    if (!any) body.appendChild(SB.el('div', 'vmeta', 'No comments or drawings in this version.'));
    SB.modal({ title: 'Comments in ' + v.name, body: body, buttons: [{ label: 'Close', primary: true }] });
  }

  function open() {
    const p = P();
    const body = SB.el('div');

    const cur = SB.el('div', 'ver-row current');
    const c = countComments(p);
    cur.appendChild(SB.el('span', 'vname', p.versionName + '  (working)'));
    cur.appendChild(SB.el('span', 'vmeta', c.comments + ' comments · ' + c.ink + ' inked'));
    const nv = SB.el('button', 'mini primary', 'New version…');
    nv.onclick = function () { m.close(); newVersion(); };
    cur.appendChild(nv);
    body.appendChild(cur);

    p.versions.slice().reverse().forEach(function (v) {
      const cc = countComments(v.snapshot);
      const row = SB.el('div', 'ver-row');
      row.appendChild(SB.el('span', 'vname', v.name));
      row.appendChild(SB.el('span', 'vmeta', SB.fmtDate(v.createdAt) + ' · ' +
        cc.comments + ' comments · ' + cc.ink + ' inked'));
      const bc = SB.el('button', 'mini', 'comments');
      bc.onclick = function () { viewComments(v); };
      const br = SB.el('button', 'mini', 'restore');
      br.onclick = function () { m.close(); restore(v); };
      row.appendChild(bc); row.appendChild(br);
      body.appendChild(row);
    });

    if (!p.versions.length) body.appendChild(SB.el('div', 'vmeta', 'No earlier versions yet.'));

    const m = SB.modal({
      title: 'Versions', width: '560px', body: body,
      buttons: [{ label: 'Close', primary: true }]
    });
  }

  SB.Versions = { open: open, newVersion: newVersion };

})(window.SB);

</script>
<script>
/* ===== js/pdf.js ===== */
/* pdf.js — contact sheet, 6 shots per page, via Chrome's Print → Save as PDF.
 * Excludes comments, ink, and "no shot" fragments.
 */
(function (SB) {
  'use strict';

  const PER_PAGE = 6;

  function P() { return SB.app.project; }

  function cells() {
    const out = [];
    const p = P();
    p.scenes.forEach(function (sc, si) {
      sc.shots.forEach(function (sh, sj) {
        if (sh.noShot) return;
        const w = SB.Model.windowFor(p, sh);
        out.push({
          code: SB.Model.code(si, sj),
          scene: sc.heading || '',
          type: sh.type || '',
          img: sh.image ? sh.image.data : null,
          script: SB.Doc.renderHTML(w.doc, w.from, w.to, null),
          desc: sh.description || ''
        });
      });
    });
    return out;
  }

  function html() {
    const p = P();
    const list = cells();
    let pages = '';
    for (let i = 0; i < list.length; i += PER_PAGE) {
      const grp = list.slice(i, i + PER_PAGE);
      pages += '<section class="page"><div class="grid">' + grp.map(function (c) {
        return '<figure class="cell">' +
          '<div class="frame">' + (c.img ? '<img src="' + c.img + '">' : '<div class="empty">no frame</div>') + '</div>' +
          '<div class="meta"><span class="code">' + SB.esc(c.code) + '</span>' +
          '<span class="scene">' + SB.esc(c.scene) + '</span>' +
          (c.type ? '<span class="type">' + SB.esc(c.type) + '</span>' : '') + '</div>' +
          '<div class="script">' + (c.script || '<i class="dim">(no script)</i>') + '</div>' +
          '<div class="desc">' + SB.esc(c.desc) + '</div>' +
          '</figure>';
      }).join('') + '</div>' +
        '<footer>' + SB.esc(p.name) + ' · ' + SB.esc(p.versionName) + ' · page ' +
        (Math.floor(i / PER_PAGE) + 1) + ' of ' + Math.ceil(list.length / PER_PAGE) + '</footer></section>';
    }
    if (!pages) pages = '<section class="page"><p>Nothing to print — every shot is marked “no shot”.</p></section>';

    return '<!DOCTYPE html><html><head><meta charset="utf-8"><title>' + SB.esc(p.name) +
      ' — storyboard</title><style>' +
      '@page{size:letter portrait;margin:12mm}' +
      'body{margin:0;font:11px/1.4 "Segoe UI",system-ui,sans-serif;color:#111;background:#fff}' +
      '.page{page-break-after:always;display:flex;flex-direction:column;height:262mm}' +
      '.page:last-child{page-break-after:auto}' +
      '.grid{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr 1fr;gap:6mm}' +
      '.cell{margin:0;display:flex;flex-direction:column;border:1px solid #bbb;border-radius:3px;overflow:hidden}' +
      '.frame{background:#000;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center}' +
      '.frame img{width:100%;height:100%;object-fit:contain}' +
      '.empty{color:#777;font-size:10px}' +
      '.meta{display:flex;gap:6px;align-items:baseline;padding:3px 5px;background:#eee;border-bottom:1px solid #ddd}' +
      '.code{font-weight:700}.scene{flex:1;font-size:10px;color:#333}' +
      '.type{font-size:9px;text-transform:uppercase;letter-spacing:.4px;color:#666}' +
      '.script{padding:4px 5px;white-space:pre-wrap;border-bottom:1px dashed #ddd;max-height:22mm;overflow:hidden}' +
      '.desc{padding:4px 5px;color:#333;white-space:pre-wrap;flex:1;overflow:hidden}' +
      '.dim{color:#999}' +
      'footer{padding-top:3mm;font-size:9px;color:#666;text-align:center}' +
      '</style></head><body>' + pages +
      '<script>window.addEventListener("load",function(){setTimeout(function(){window.print()},250)})<\/script>' +
      '</body></html>';
  }

  function exportPdf() {
    const w = window.open('', '_blank');
    if (!w) { SB.toast('Allow pop-ups for this page to export the PDF', true); return; }
    w.document.open();
    w.document.write(html());
    w.document.close();
  }

  SB.Pdf = { exportPdf: exportPdf, html: html, cells: cells };

})(window.SB);

</script>
<script>
/* ===== js/app.js ===== */
/* app.js — boot + wiring. */
(function (SB) {
  'use strict';

  const app = SB.app = {
    project: null,
    selectedShotId: null,
    selectedSceneId: null,
    commentMode: false,
    pendingHandle: null
  };

  /* Any change at all. structural = the card layout must be rebuilt. */
  app.changed = function (structural) {
    if (structural) {
      SB.Board.render();
      renderChrome();
    } else {
      SB.Board.renderSceneList();
    }
    SB.Store.touch();
    SB.UsagePanel.badgeSoon();
  };

  /* A change to shared script text: refresh every window onto the master. */
  app.scriptChanged = function () {
    SB.Board.renderScriptWindows();
    SB.ScriptMode.refresh();
    SB.ScriptMode.invalidateSelection();
    SB.Store.touch();
  };

  function renderChrome() {
    const p = app.project;
    document.getElementById('projName').value = p.name || '';
    document.getElementById('verLabel').textContent = p.versionName || ('v' + p.versionNumber);
  }

  function setProject(p) {
    app.project = p;
    SB.History.reset();
    app.selectedShotId = null;
    app.selectedSceneId = p.scenes[0] ? p.scenes[0].id : null;
    SB.Board.render();
    renderChrome();
    SB.ScriptMode.refresh();
    SB.PromptPanel.refresh();
    SB.PersonaPanel.refresh();
    SB.UsagePanel.refreshBadge();
  }

  /* ---------------- boot ---------------- */

  function boot() {
    if (!SB.Store.hasFS) {
      SB.toast('This app needs Chrome or Edge (File System Access API) to autosave.', true);
    }
    SB.ScriptMode.init();
    SB.PromptPanel.init();
    SB.PersonaPanel.init();
    SB.Store.S.getProject = function () { return app.project; };
    SB.Store.S.onSaved = function () { SB.UsagePanel.refreshBadge(); };
    SB.Store.S.onState = function (txt, cls) {
      const el = document.getElementById('saveState');
      el.textContent = txt;
      el.className = 'save-state ' + (cls || '');
    };

    /* A save that fails silently is how a board gets lost. Make it impossible
     * to miss, and hand over a rescue copy on the spot. */
    SB.Store.S.onFailure = function (what) {
      const body = SB.el('div');
      body.appendChild(SB.el('p', null,
        'Your board could not be saved to its file — ' + what + '.'));
      body.appendChild(SB.el('p', null,
        'Nothing has been lost from this window. Download a copy now, then use ' +
        '“Save as…” to point the board at a fresh file.'));
      SB.modal({
        title: 'Save failed',
        body: body,
        buttons: [
          {
            label: 'Download a copy', primary: true, onClick: function (close) {
              SB.Store.downloadCopy(app.project, 'rescue');
              close();
            }
          },
          { label: 'Save as…', onClick: function (close) { close(); doSaveAs(); } },
          { label: 'Dismiss' }
        ]
      });
    };

    setProject(SB.Model.newProject());
    wire();

    SB.Store.lastHandle().then(function (h) {
      if (!h) {
        /* file:// has no working IndexedDB, so the last project cannot be
         * remembered there. Say so rather than showing a bare "no file". */
        SB.Store.storageUsable().then(function (ok) {
          if (ok || SB.Store.S.handle) return;
          const el = document.getElementById('saveState');
          el.textContent = 'no file — Open…';
          el.className = 'save-state dirty';
          el.title = 'Opened from a file:// page, so this browser cannot remember your ' +
            'last project. Use Open… each session; autosave works normally once a file is open.';
        });
        return;
      }
      return h.queryPermission({ mode: 'readwrite' }).then(function (perm) {
        if (perm === 'granted') {
          return SB.Store.loadFromHandle(h, false).then(setProject)
            .catch(function (e) { loadFailed(h, e); });
        }
        app.pendingHandle = h;
        const el = document.getElementById('saveState');
        el.textContent = 'reopen ' + h.name;
        el.className = 'save-state dirty';
        el.style.cursor = 'pointer';
        el.title = 'Click to reopen the last project';
      });
    }).catch(function () { });
  }

  /* A project file that will not open must never look like a fresh start. */
  function loadFailed(handle, err) {
    const el = document.getElementById('saveState');
    el.textContent = 'could not open ' + (handle && handle.name ? handle.name : 'the project');
    el.className = 'save-state dirty';
    const body = SB.el('div');
    body.appendChild(SB.el('p', null,
      'Storyboarder could not read “' + (handle && handle.name || 'the project file') + '”: ' +
      (err && err.message ? err.message : String(err))));
    body.appendChild(SB.el('p', null,
      'The blank board on screen is NOT your project — nothing has overwritten your file, ' +
      'and it will not be saved over unless you choose that file again.'));
    body.appendChild(SB.el('p', null,
      'If the file is 0 bytes, an interrupted save emptied it. Otherwise try Open… again.'));
    SB.modal({
      title: 'That project would not open',
      body: body,
      buttons: [
        { label: 'Open a different file…', primary: true, onClick: function (close) { close(); doOpen(); } },
        { label: 'Dismiss' }
      ]
    });
  }

  function doOpen() {
    SB.Store.open().then(setProject).catch(function (e) {
      if (e && e.name === 'AbortError') return;
      SB.toast(e.message || String(e), true);
    });
  }

  function doSaveAs() {
    SB.Store.saveAs(app.project).then(function (n) { SB.toast('Autosaving to ' + n); })
      .catch(function (e) {
        if (e && e.name === 'AbortError') return;
        SB.toast(e.message || String(e), true);
      });
  }

  function wire() {
    const $ = function (id) { return document.getElementById(id); };

    $('projName').addEventListener('input', function () {
      app.project.name = this.value; SB.Store.touch();
    });

    $('saveState').addEventListener('click', function () {
      if (!app.pendingHandle) return;
      const h = app.pendingHandle;
      app.pendingHandle = null;
      this.style.cursor = '';
      SB.Store.loadFromHandle(h, true).then(setProject)
        .catch(function (e) { SB.toast(e.message, true); });
    });

    $('btnNew').addEventListener('click', function () {
      if (!confirm('Start a new project? The current one is already saved to its file.')) return;
      SB.Store.detach();
      setProject(SB.Model.newProject());
    });

    $('btnOpen').addEventListener('click', doOpen);
    $('btnSaveAs').addEventListener('click', doSaveAs);
    $('btnCopy').addEventListener('click', function () {
      if (!SB.Store.downloadCopy(app.project)) SB.toast('Nothing to copy yet', true);
    });
    $('sizeState').addEventListener('click', function () { SB.UsagePanel.open(); });

    $('btnScript').addEventListener('click', function () { SB.ScriptMode.toggle(); });

    $('btnUndo').addEventListener('mousedown', function (e) { e.preventDefault(); });
    $('btnUndo').addEventListener('click', function () {
      if (!SB.History.undo()) SB.toast('Nothing to undo');
    });
    $('btnRedo').addEventListener('mousedown', function (e) { e.preventDefault(); });
    $('btnRedo').addEventListener('click', function () {
      if (!SB.History.redo()) SB.toast('Nothing to redo');
    });

    $('btnComment').addEventListener('click', function () {
      app.commentMode = !app.commentMode;
      this.classList.toggle('on', app.commentMode);
      document.body.classList.toggle('comment-mode', app.commentMode);
      SB.Board.render();
    });

    $('btnPersonas').addEventListener('click', function () { SB.PersonaPanel.toggle(); });

    $('btnPrompts').addEventListener('click', function () { SB.PromptPanel.toggle(); });

    $('btnTheme').addEventListener('click', function () { SB.Theme.toggle(); });

    $('btnVersions').addEventListener('click', function () { SB.Versions.open(); });
    $('btnPdf').addEventListener('click', function () { SB.Pdf.exportPdf(); });
    $('btnSettings').addEventListener('click', function () { SB.Settings.open(); });

    $('btnAddScene').addEventListener('click', function () {
      const sc = SB.Model.addScene(app.project);
      app.selectedSceneId = sc.id;
      app.changed(true);
    });

    /* paste an image straight onto the selected card (text pastes are left alone) */
    document.addEventListener('paste', function (ev) {
      const cd = ev.clipboardData;
      const file = cd && Array.prototype.filter.call(cd.items || [], function (i) {
        return i.kind === 'file' && /^image\//.test(i.type);
      })[0];
      if (!file) return;
      if (!app.selectedShotId) { SB.toast('Select a card first, then paste', true); return; }
      const f = SB.Model.findShot(app.project, app.selectedShotId);
      if (!f) return;
      ev.preventDefault();
      const blob = file.getAsFile();
      if (blob) SB.Board.setImage(f.shot, blob);
    });

    document.addEventListener('keydown', function (ev) {
      if (!(ev.ctrlKey || ev.metaKey) || ev.altKey) return;
      const k = ev.key.toLowerCase();
      if (k === 's') {
        ev.preventDefault();
        SB.Store.saveNow();
        return;
      }
      /* undo/redo also works when focus isn't in a script box */
      const t = ev.target;
      if (t && t.isContentEditable) return;          // the editor handles its own
      if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
      if (k === 'z' || k === 'y') {
        ev.preventDefault();
        const redo = (k === 'y') || ev.shiftKey;
        if (!(redo ? SB.History.redo() : SB.History.undo())) {
          SB.toast(redo ? 'Nothing to redo' : 'Nothing to undo');
        }
      }
    });

    window.addEventListener('beforeunload', function (e) {
      if (SB.Store.S.dirty) { e.preventDefault(); e.returnValue = ''; }
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();

})(window.SB);

</script>
</body>
</html>
