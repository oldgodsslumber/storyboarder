<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Storyboarder</title>
<style>
/* Storyboarder — app styles */

:root,
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#15171c;
  --bg2:#1c1f26;
  --bg3:#242833;
  --line:#333844;
  --line2:#454c5c;
  --fg:#e6e9ef;
  --fg-dim:#98a0b0;
  --accent:#5b8dff;
  --accent2:#ffb347;
  --on-accent:#0d1017;
  --danger:#ff5f56;
  --ok:#4ec98a;
  --frame-bg:#0c0e12;
  --input-bg:#12141a;
  --shadow:rgba(0,0,0,.5);
  --hl1:rgba(91,141,255,.20);
  --hl2:rgba(91,141,255,.36);
  --hl3:rgba(255,179,71,.42);
  /* a scene's claim on a section — teal, because blue is the shot wash and
     amber is already the comment underline and the selected card */
  --scene:#3fb99a;
  --scene-on:#7ee0c4;
  --card-radius:8px;
  /* how much of a card's colour shows through it */
  --card-tint:20%;
  --card-tint-strong:34%;
}

:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f2f4f7;
  --bg2:#ffffff;
  --bg3:#e9ecf1;
  --line:#d3d8e0;
  --line2:#b3bac6;
  --fg:#1a1d23;
  --fg-dim:#5f6774;
  --accent:#2563eb;
  --accent2:#b45309;
  --on-accent:#ffffff;
  --danger:#dc2626;
  --ok:#15803d;
  --frame-bg:#dadee5;
  --input-bg:#ffffff;
  --shadow:rgba(20,25,35,.18);
  --hl1:rgba(37,99,235,.15);
  --hl2:rgba(37,99,235,.30);
  --hl3:rgba(180,83,9,.30);
  --scene:#0f766e;
  --scene-on:#14b8a6;
  /* the same hues sit heavier on a light surface, so less of them */
  --card-tint:13%;
  --card-tint-strong:24%;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font:13px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif;
  overflow:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none !important}
.spacer{flex:1}

#app{display:flex;flex-direction:column;height:100%}

/* ---------- top bar ---------- */
#topbar{
  display:flex;align-items:center;gap:8px;padding:6px 10px;
  background:var(--bg2);border-bottom:1px solid var(--line);flex:0 0 auto;
  flex-wrap:wrap;
}
.brand{font-weight:700;letter-spacing:.4px;color:var(--accent);margin-right:4px;display:flex;align-items:baseline;gap:5px}
.build-stamp{font-weight:400;font-size:9.5px;letter-spacing:0;color:var(--fg-dim);opacity:.75}
.proj-name{
  background:transparent;border:1px solid transparent;border-radius:4px;
  padding:3px 6px;width:190px;
}
.proj-name:hover{border-color:var(--line)}
.proj-name:focus{outline:none;border-color:var(--accent);background:var(--bg)}
.tb-group{display:flex;align-items:center;gap:4px}
.tb-sep{width:1px;height:20px;background:var(--line)}
.tb{
  background:var(--bg3);border:1px solid var(--line);border-radius:4px;
  padding:4px 9px;cursor:pointer;white-space:nowrap;
}
.tb:hover{border-color:var(--line2)}
.tb.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.tb-select{background:var(--bg3);border:1px solid var(--line);border-radius:4px;padding:4px 6px;max-width:180px}
.tb-check{display:flex;align-items:center;gap:3px;color:var(--fg-dim);cursor:pointer;user-select:none}
.tb-check input{margin:0}
.mini{
  background:var(--bg3);border:1px solid var(--line);border-radius:4px;
  padding:2px 7px;cursor:pointer;font-size:12px;
}
.mini:hover{border-color:var(--line2)}
.mini.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.mini.primary:disabled{opacity:.35;cursor:default}
.mini.danger:hover{border-color:var(--danger);color:var(--danger)}
/* Deleting a shot asks in place rather than in a modal: the button arms
   itself, and a second click on the same button does it. */
.mini.arm{background:var(--danger);border-color:var(--danger);color:#fff;font-weight:600}
.mini.arm:hover{border-color:var(--danger);color:#fff}
.save-state{color:var(--fg-dim);font-size:11px;min-width:74px}
.save-state.dirty{color:var(--accent2)}
.save-state.saved{color:var(--ok)}

/* ---------- layout ---------- */
#main{flex:1;display:flex;min-height:0}
#scenePanel{
  flex:0 0 200px;background:var(--bg2);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;
}
#boardPanel{flex:1;min-width:0;overflow:auto}
#scriptPanel{
  flex:0 0 380px;background:var(--bg2);border-left:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;
}
.panel-head{
  display:flex;align-items:center;gap:6px;padding:6px 8px;
  border-bottom:1px solid var(--line);font-weight:600;color:var(--fg-dim);
  text-transform:uppercase;font-size:11px;letter-spacing:.6px;flex:0 0 auto;
}

/* ---------- scene list ---------- */
.scene-list{overflow:auto;padding:6px;flex:1}
.scene-item{
  border:1px solid var(--line);border-radius:6px;background:var(--bg3);
  padding:6px 8px;margin-bottom:6px;cursor:grab;
}
.scene-item.sel{border-color:var(--accent)}
.scene-item.drag-over{border-top:2px solid var(--accent2)}
.scene-item.drop-shot{
  border-color:var(--accent);background:var(--bg);
  box-shadow:inset 0 0 0 1px var(--accent);
}
.scene-item.drop-shot::after{
  content:"drop to move here";display:block;margin-top:3px;
  font-size:10px;color:var(--accent);text-transform:uppercase;letter-spacing:.5px;
}
.scene-item .num{color:var(--accent);font-weight:700;margin-right:5px}
.scene-item .ttl{font-weight:600}
.scene-item .cnt{color:var(--fg-dim);font-size:11px;margin-top:2px}

/* ---------- board ---------- */
.board{padding:12px 14px 60px}
.scene-block{margin-bottom:22px}
.scene-head{
  display:flex;align-items:flex-start;gap:8px;padding:6px 8px;
  background:var(--bg2);border:1px solid var(--line);border-radius:6px;margin-bottom:10px;
}
.scene-head.sel{border-color:var(--accent)}
.scene-head .snum{
  color:var(--accent);font-weight:700;font-size:15px;padding-top:2px;min-width:58px;
}
.scene-head .fields{flex:1;display:flex;flex-direction:column;gap:4px}
.scene-head input.sh-heading{
  background:transparent;border:1px solid transparent;border-radius:4px;padding:2px 5px;
  font-size:15px;font-weight:600;
}
.scene-head .sh-desc{
  background:transparent;border:1px solid transparent;border-radius:4px;padding:2px 5px;
  min-height:24px;color:var(--fg-dim);font-size:12px;
}
.scene-head .sh-desc:focus{background:var(--input-bg);border-color:var(--accent)}
.scene-head .scene-script{margin-top:3px}
.scene-head .box-label{padding:2px 4px 0}
.scene-head .script-box.scene-script-box{margin:1px 0 2px;max-height:110px}
.scene-head input:hover,.scene-head textarea:hover{border-color:var(--line)}
.scene-head input:focus,.scene-head textarea:focus{outline:none;border-color:var(--accent);background:var(--bg)}
.scene-actions{display:flex;gap:4px}

/* writer-model actions on the scene description */
.sc-ai{display:flex;align-items:center;gap:4px;flex-wrap:wrap;padding:0 5px 2px}
.sc-ai .sc-ai-gap{width:8px}
.sc-ai select.sc-ai-count{
  background:var(--bg3);border:1px solid var(--line);border-radius:4px;
  color:var(--fg);font-size:11px;padding:2px 3px;
}
.mini.link{background:none;border-color:transparent;color:var(--fg-dim);text-decoration:underline}
.mini.link:hover{color:var(--fg);border-color:transparent}
.mini:disabled{opacity:.4;cursor:default}
.sc-ai-status{font-size:11px;color:var(--fg-dim)}
.sc-ai-status.run{color:var(--accent)}
.sc-ai-status.err{color:var(--danger)}

.shots{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;min-height:60px;border-radius:6px}
.shots.drag-over{outline:2px dashed var(--accent);outline-offset:4px;background:rgba(91,141,255,.06)}
.scene-block.drag-over > .scene-head{border-color:var(--accent);background:var(--bg3)}

/* ---------- shot card ---------- */
/* A card's colour washes the whole card, not a stripe down its edge. The
   inner text boxes keep their own surface so nothing loses contrast. */
.card{
  --card-color:var(--line2);
  width:280px;border-radius:var(--card-radius);
  background:color-mix(in srgb, var(--card-color) var(--card-tint), var(--bg2));
  border:1px solid color-mix(in srgb, var(--card-color) 50%, var(--line));
  display:flex;flex-direction:column;overflow:hidden;
}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.card.sel.lead{box-shadow:0 0 0 2px var(--accent)}

/* a break between two cards: click to start a new scene there */
/* Fixed width: widening it on hover would shove every card sideways just for
   pointing at the gap. The label floats over the neighbours instead. */
.scene-break{
  flex:0 0 14px;align-self:stretch;min-height:80px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  margin:0 -7px;position:relative;z-index:3;
}
.scene-break::before{
  content:"";width:3px;height:100%;border-radius:3px;background:transparent;transition:background .12s;
}
.scene-break:hover::before{background:var(--accent2)}
.scene-break-label{
  position:absolute;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;
  color:var(--on-accent);background:var(--accent2);border-radius:9px;padding:3px 9px;
  white-space:nowrap;opacity:0;transition:opacity .12s;pointer-events:none;
  box-shadow:0 2px 8px var(--shadow);
}
.scene-break:hover .scene-break-label{opacity:1}

/* what you can do to a group of cards */
.sel-bar-wrap{
  position:sticky;bottom:0;z-index:8;display:flex;justify-content:center;
  padding:8px;pointer-events:none;
}
.sel-bar{
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;pointer-events:auto;
  background:var(--bg3);border:1px solid var(--line2);border-radius:8px;
  padding:6px 10px;box-shadow:0 4px 18px var(--shadow);
}
.sel-count{font-weight:600;font-size:12px;margin-right:4px}
.card.noshot{opacity:.72}
.card.drag-over{outline:2px dashed var(--accent2);outline-offset:2px}
.card.dragging{opacity:.4}

/* swapping two shots: the pictures trade places, the dialogue does not */
.card.swap-target{outline:2px solid var(--accent2);outline-offset:2px;position:relative}
.card.swap-target::after{
  content:"⇄ swap pictures";
  position:absolute;left:50%;top:8px;transform:translateX(-50%);
  background:var(--accent2);color:var(--on-accent);font-size:10px;font-weight:700;
  padding:2px 8px;border-radius:9px;letter-spacing:.4px;pointer-events:none;z-index:2;
}
.card.swap-armed{outline:2px solid var(--accent2);outline-offset:2px}
.card.swap-pick{cursor:copy}
.card.swap-pick:hover{outline:2px dashed var(--accent2);outline-offset:2px}
.card-head{
  display:flex;align-items:center;gap:6px;padding:4px 6px;cursor:grab;
  background:color-mix(in srgb, var(--card-color) var(--card-tint-strong), var(--bg3));
  border-bottom:1px solid color-mix(in srgb, var(--card-color) 35%, var(--line));
}
.card-head{flex-wrap:wrap}
.card-head .code{font-weight:700;color:var(--accent);min-width:34px}
/* which file on disk this card's render is */
.card-head .code-serial{font-size:9px;color:var(--fg-dim);font-variant-numeric:tabular-nums;margin-left:-3px}
.card-head select.type{
  background:var(--bg2);border:1px solid var(--line);border-radius:4px;
  padding:1px 4px;font-size:11px;flex:1 1 60px;min-width:0;max-width:104px;
}
.card-head .ch-actions{margin-left:auto;display:flex;gap:3px;align-items:center}
.card-head .swatch{width:16px;height:16px;border:1px solid var(--line2);border-radius:3px;padding:0;background:none;cursor:pointer}
.badge{
  font-size:10px;padding:1px 5px;border-radius:9px;border:1px solid var(--line2);
  color:var(--fg-dim);text-transform:uppercase;letter-spacing:.4px;
}
.badge.noshot{border-color:var(--accent2);color:var(--accent2)}
.badge.warn{border-color:var(--danger);color:var(--danger);cursor:help}
/* not an error — the prompt is fine, it is just describing an older wardrobe */
.badge.stale{border-color:var(--accent2);color:var(--accent2);cursor:help}

.frame{
  position:relative;background:var(--frame-bg);aspect-ratio:16/9;display:flex;
  align-items:center;justify-content:center;cursor:pointer;overflow:hidden;
}
.frame img.shot-img{width:100%;height:100%;object-fit:contain;display:block}
.frame img.anno{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}
.frame .drop-hint{color:var(--fg-dim);font-size:11px;text-align:center;padding:8px}
.frame.drag-over{outline:2px dashed var(--accent);outline-offset:-4px}
.frame-tools{position:absolute;right:4px;top:4px;display:flex;gap:3px;opacity:0;transition:opacity .12s}
.frame:hover .frame-tools{opacity:1}

.box-label{
  display:flex;align-items:center;gap:5px;padding:3px 6px 0;
  font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--fg-dim);
}
.link-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:0 0 auto}
.link-dot.free{background:var(--fg-dim)}
.link-dot.broken{background:var(--danger)}
.box-label .lbl-actions{margin-left:auto;display:flex;gap:4px}
.box-label button{background:none;border:none;color:var(--fg-dim);cursor:pointer;padding:0;font-size:10px;text-decoration:underline}
.box-label button:hover{color:var(--fg)}

.script-box,.desc-box{
  margin:2px 6px 6px;padding:5px 6px;border:1px solid var(--line);border-radius:5px;
  background:var(--input-bg);white-space:pre-wrap;word-wrap:break-word;overflow:auto;
}
.script-box{min-height:44px;max-height:150px;font-size:12px}
.script-box.broken{border-color:var(--danger);background:rgba(255,95,86,.07)}
.script-box:empty::before{content:"(empty)";color:var(--fg-dim)}
.desc-box{min-height:70px;max-height:260px;overflow:auto;width:calc(100% - 12px);font-size:12.5px}
.desc-box.field-box{min-height:42px;font-size:12px}
.script-box:focus,.desc-box:focus{outline:none;border-color:var(--accent)}

.prompt-box{margin:0 6px 6px}
.prompt-box .ptitle{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--accent2);padding:0 2px 2px;display:flex;gap:6px;align-items:center}
.prompt-box textarea{
  width:100%;min-height:58px;max-height:200px;background:var(--input-bg);color:var(--fg);
  border:1px solid var(--line);border-radius:5px;padding:5px 6px;font-size:11.5px;resize:vertical;
}
.prompt-box textarea:focus{outline:none;border-color:var(--accent2)}

.comments{margin:0 6px 6px;border-top:1px dashed var(--line);padding-top:5px}
.comment{display:flex;gap:6px;align-items:flex-start;font-size:12px;padding:2px 0;border-bottom:1px dotted var(--line)}
.comment .txt{flex:1;white-space:pre-wrap}
.comment .when{color:var(--fg-dim);font-size:10px}
.comment .del{background:none;border:none;color:var(--fg-dim);cursor:pointer}
.comment .del:hover{color:var(--danger)}
.comment-add{display:flex;gap:4px;margin-top:4px}
.comment-add input{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:3px 5px}
.comment-add input:focus{outline:none;border-color:var(--accent)}

.card-foot{display:flex;gap:4px;padding:0 6px 6px}
.add-shot{
  width:280px;min-height:120px;border:1px dashed var(--line2);border-radius:var(--card-radius);
  background:transparent;color:var(--fg-dim);cursor:pointer;font-size:13px;
}
.add-shot:hover{border-color:var(--accent);color:var(--fg)}
/* An image dragged onto an add button becomes a card. */
.add-shot.drag-over,.mini.drag-over{outline:2px dashed var(--accent);outline-offset:2px;border-color:var(--accent);color:var(--fg)}

/* ---------- master script ---------- */
.script-hint{padding:6px 8px;color:var(--fg-dim);font-size:11px;border-bottom:1px solid var(--line)}
.script-hint .hint-scene{color:var(--scene-on)}
.script-hint .hint-cov{display:block;margin-top:2px;color:var(--fg)}
.master-script{
  flex:1;overflow:auto;padding:10px 12px;white-space:pre-wrap;word-wrap:break-word;
  font-size:13.5px;line-height:1.6;background:var(--bg);
}
.master-script:focus{outline:none}
.master-script:empty::before{
  content:"Paste or type the script here, then select a line and press Capture shot.";
  color:var(--fg-dim);
}
.master-script .h1{background:var(--hl1);border-radius:2px}
.master-script .h2{background:var(--hl2);border-radius:2px}
.master-script .h3{background:var(--hl3);border-radius:2px}
/* Two coverage layers land on the same characters and both have to stay
 * readable: the background wash says how many SHOTS cover a character, the rule
 * along the TOP says a SCENE claims it — the loose early pass, which is often
 * there before any shot is. The bottom rule stays the selected card.
 * Everything here paints the whole span rather than its edges: renderHTML
 * splits a run wherever any class changes, so a border would sprout ends
 * mid-section wherever a shot wash starts. One box-shadow is built from custom
 * properties because a second declaration would replace the first, not add. */
.master-script span{
  --sc-top:0 0 transparent;
  --sh-bot:0 0 transparent;
  box-shadow:var(--sc-top),var(--sh-bot);
}
.master-script .scov{--sc-top:inset 0 3px 0 var(--scene)}
.master-script .scov-on{--sc-top:inset 0 4px 0 var(--scene-on)}
.master-script .hactive{--sh-bot:inset 0 -2px 0 var(--accent2)}
/* a commented phrase is underlined, so it still reads under a capture wash */
.master-script .cmt{
  text-decoration:underline;
  text-decoration-color:var(--accent2);
  text-decoration-thickness:2px;
  text-underline-offset:3px;
  text-decoration-skip-ink:none;
}
.master-script .cmt-on{
  background:rgba(255,179,71,.22);
  text-decoration-style:double;
}
body.comment-mode .master-script .cmt{cursor:pointer}

/* ---------- script comments ---------- */
.note-list{
  flex:0 0 auto;max-height:42%;overflow:auto;border-top:1px solid var(--line);
  background:var(--bg2);padding:6px 8px 10px;
}
.note-head{
  font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--fg-dim);
  font-weight:600;padding:2px 0 6px;position:sticky;top:0;background:var(--bg2);
}
.note-empty{color:var(--fg-dim);font-size:11.5px;line-height:1.5}
.note{
  border:1px solid var(--line);border-left:3px solid var(--accent2);border-radius:5px;
  background:var(--bg3);padding:6px 8px;margin-bottom:6px;cursor:pointer;
}
.note:hover{border-color:var(--line2)}
.note.on{border-color:var(--accent2);box-shadow:0 0 0 1px var(--accent2)}
.note.broken{border-left-color:var(--danger);opacity:.85}
.note-quote{
  font-size:11px;color:var(--fg-dim);font-style:italic;margin-bottom:3px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.note.broken .note-quote{color:var(--danger)}
.note-text{font-size:12.5px;white-space:pre-wrap}
.note-foot{display:flex;align-items:center;gap:6px;margin-top:4px}
.note-when{font-size:10px;color:var(--fg-dim);flex:1}
.note-input{
  width:100%;background:var(--input-bg);color:var(--fg);border:1px solid var(--line);
  border-radius:4px;padding:5px 6px;font-size:12.5px;resize:vertical;
}
.note-input:focus{outline:none;border-color:var(--accent)}
.capture-form{
  border-top:1px solid var(--line);padding:8px;background:var(--bg3);
  display:flex;flex-direction:column;gap:6px;
}
.capture-form .row{display:flex;gap:6px;align-items:center}
.capture-form .cap-mode .mini.on{border-color:var(--accent);color:var(--fg)}
.capture-form .cap-note{
  margin:4px 0 2px;padding:5px 6px;font-size:11px;line-height:1.45;
  color:var(--fg-dim);background:var(--bg3);border-radius:4px;
}
.capture-form label{color:var(--fg-dim);font-size:11px;min-width:52px}
.capture-form select{flex:1;background:var(--bg2);border:1px solid var(--line);border-radius:4px;padding:3px 5px}
.capture-form .preview{
  max-height:60px;overflow:auto;background:var(--bg);border:1px solid var(--line);
  border-radius:4px;padding:4px 6px;font-size:11.5px;color:var(--fg-dim);
}

/* ---------- modal ---------- */
.modal-back{
  position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;
  align-items:center;justify-content:center;z-index:50;
}
.modal{
  background:var(--bg2);border:1px solid var(--line2);border-radius:8px;
  min-width:420px;max-width:min(900px,92vw);max-height:88vh;display:flex;flex-direction:column;
}
.modal h2{margin:0;padding:10px 14px;border-bottom:1px solid var(--line);font-size:15px}
.modal .body{padding:12px 14px;overflow:auto}
.modal .foot{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:6px;justify-content:flex-end}
.modal label.field{display:block;margin-bottom:10px}
.modal label.field > span{display:block;color:var(--fg-dim);font-size:11px;margin-bottom:3px;text-transform:uppercase;letter-spacing:.5px}
.modal input[type=text],.modal input[type=password],.modal textarea,.modal select{
  width:100%;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:5px 7px;
}
.modal textarea{resize:vertical;min-height:60px;font-size:12px}
.modal input:focus,.modal textarea:focus,.modal select:focus{outline:none;border-color:var(--accent)}
/* the blocked-API dialog: one explanation, one link, one way to try again */
.blocked-body p{margin:0 0 10px;font-size:13px;line-height:1.5}
.blocked-body p.pp-note{font-size:11px}
.blocked-link{
  display:inline-block;margin:2px 0 12px;padding:6px 12px;border-radius:5px;
  background:var(--accent);color:var(--on-accent);font-weight:600;font-size:13px;text-decoration:none;
}
.blocked-link:hover{filter:brightness(1.1)}
button.linkish{
  background:none;border:0;padding:0;cursor:pointer;font:inherit;
  color:var(--accent);text-decoration:underline;
}

/* Settings -> API: how to get a key in the first place */
.setup{border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-bottom:14px;background:var(--bg3)}
.setup > .t{color:var(--fg-dim);font-size:11px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.setup-steps{margin:0;padding-left:20px;font-size:12px;line-height:1.6}
.setup-steps li{margin-bottom:5px}
.setup-steps a{color:var(--accent)}
.setup-steps .dim{color:var(--fg-dim)}
.setup-mono{
  font-family:ui-monospace,Consolas,monospace;font-size:11px;
  background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:0 4px;
}

.model-row{border:1px solid var(--line);border-radius:6px;padding:8px;margin-bottom:8px;background:var(--bg3)}
.field-row{
  display:flex;align-items:center;gap:8px;padding:6px;margin-bottom:6px;
  border:1px solid var(--line);border-radius:6px;background:var(--bg3);
}
.field-row input[type=checkbox]{margin:0;flex:0 0 auto}
.field-row .field-name{flex:1;min-width:0}
.field-row .field-name[readonly]{opacity:.75}
.field-tag{
  font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--accent2);
  background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:1px 5px;white-space:nowrap;
}
.model-row .top{display:flex;gap:6px;margin-bottom:6px}
.model-row .top input{flex:1}
.model-row .top select{width:96px}
.ver-row{display:flex;gap:8px;align-items:center;padding:6px;border-bottom:1px solid var(--line)}
.ver-row .vname{flex:1}
.ver-row .vmeta{color:var(--fg-dim);font-size:11px}
.ver-row.current{color:var(--accent)}

/* drawing modal */
.draw-wrap{position:relative;background:#000;line-height:0}
.draw-wrap img{display:block;max-width:78vw;max-height:66vh}
.draw-wrap canvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair;touch-action:none}
.draw-tools{display:flex;gap:8px;align-items:center;padding:8px 0 0}
.draw-tools .sw{width:20px;height:20px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.draw-tools .sw.on{border-color:#fff}

/* ---------- data readout ---------- */
/* refreshBadge() writes the board's own size in here, so the text grows as the
   board does — "—" to "834.2 KB" to "12.41 MB" — and goes bold on top of that
   once it is over the limit. #topbar wraps, so a badge free to widen pushes the
   last group onto a second row and moves the whole page down every time a photo
   is dropped. Reserve the widest it can get (10 characters, bold), the same way
   .save-state already does for its own text. */
.size-state{
  background:none;border:1px solid transparent;border-radius:4px;padding:2px 6px;
  color:var(--fg-dim);font-size:11px;cursor:pointer;font-variant-numeric:tabular-nums;
  min-width:76px;text-align:center;
}
.size-state:hover{border-color:var(--line);color:var(--fg)}
.size-state.over{color:var(--danger);font-weight:600}

.usage .stat-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.stat-tile{
  flex:1 1 160px;border:1px solid var(--line);border-radius:8px;
  background:var(--bg3);padding:10px 12px;
}
.stat-label{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--fg-dim)}
.stat-value{font-size:22px;font-weight:700;line-height:1.2;margin:2px 0;font-variant-numeric:tabular-nums}
.stat-note{font-size:11px;color:var(--fg-dim)}

.usage-h{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--fg-dim);margin:18px 0 8px}
.usage-bar{
  display:flex;gap:2px;height:22px;border-radius:4px;overflow:hidden;background:var(--bg);
}
.usage-seg{display:block;min-width:3px}
.usage-table{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px}
.usage-table th{
  text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.5px;
  color:var(--fg-dim);font-weight:600;padding:4px 6px;border-bottom:1px solid var(--line);
}
.usage-table td{padding:4px 6px;border-bottom:1px solid var(--line)}
.usage-table td.num,.usage-table th:nth-child(3),.usage-table th:nth-child(4){
  text-align:right;font-variant-numeric:tabular-nums;
}
.usage-table td:first-child{width:18px}
.usage-dot{display:inline-block;width:10px;height:10px;border-radius:3px}
.usage-heavy{font-size:12px}
.usage-heavy-row{
  display:flex;justify-content:space-between;gap:10px;padding:3px 6px;
  border-bottom:1px dotted var(--line);
}
.usage-heavy-row .num{font-variant-numeric:tabular-nums;color:var(--fg-dim)}
.usage-verdict{
  border-left:3px solid var(--ok);padding:8px 10px;background:var(--bg3);
  border-radius:0 6px 6px 0;font-size:12.5px;
}
.usage-verdict.bad{border-left-color:var(--danger)}
.usage-verdict.warn{border-left-color:var(--accent2)}
.usage-check.warn .usage-mark{color:var(--accent2)}
.usage-checks{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.usage-check{display:flex;gap:8px;align-items:flex-start;font-size:12px}
.usage-mark{color:var(--ok);font-weight:700;flex:0 0 14px}
.usage-check.bad .usage-mark{color:var(--danger)}
.usage-check-label{font-weight:600}
.usage-check-detail{color:var(--fg-dim);font-size:11.5px}

/* ---------- toast ---------- */
#toastRoot{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:6px;align-items:center}
.toast{
  background:var(--bg3);border:1px solid var(--line2);border-radius:6px;padding:6px 12px;
  box-shadow:0 4px 18px var(--shadow);animation:tin .15s ease-out;
}
.toast.err{border-color:var(--danger);color:var(--danger)}
@keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- prompt panel ---------- */
#promptPanel{
  flex:0 0 300px;background:var(--bg2);border-left:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;overflow:auto;
}
.pp-body{padding:10px;display:flex;flex-direction:column;gap:12px}
.pp-block{border:1px solid var(--line);border-radius:6px;background:var(--bg3);padding:8px}
.pp-block > .t{
  font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--fg-dim);margin-bottom:6px;
}
.pp-row{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.pp-row:last-child{margin-bottom:0}
.pp-row label{flex:0 0 74px;color:var(--fg-dim);font-size:11px}
.pp-row select,.pp-row input[type=text]{
  flex:1;min-width:0;background:var(--input-bg);border:1px solid var(--line);
  border-radius:4px;padding:3px 5px;
}
.pp-row select:focus{outline:none;border-color:var(--accent)}
.pp-toggle{display:flex;align-items:center;gap:6px;padding:3px 0;cursor:pointer;user-select:none}
.pp-toggle input{margin:0}
.pp-note{color:var(--fg-dim);font-size:11px;line-height:1.5}
.pp-note b{color:var(--fg)}
.pp-actions{display:flex;gap:6px;flex-wrap:wrap}

/* provider switch — Settings → API, and the Prompts panel */
.pp-label{font-size:11px;text-transform:uppercase;letter-spacing:.04em;
  color:var(--fg-dim);margin-bottom:6px}
.prov-pick{display:flex;gap:6px;flex-wrap:wrap}
.prov-pick .tb{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prov-block{margin-top:14px}
.prov-block.hidden{display:none}
.prov-row .prov-pick{flex:1;min-width:0}
.pp-status{font-size:11px;color:var(--fg-dim);min-height:15px}
.pp-status.err{color:var(--danger)}
/* PDF export dialog — controls on the left, a scaled-down real sheet on the right */
.xp-body{display:flex;gap:18px;align-items:flex-start}
.xp-left{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:8px}
.xp-right{flex:0 0 300px}
.xp-head{
  font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--fg-dim);
  margin-top:6px;padding-bottom:3px;border-bottom:1px solid var(--line);
}
.xp-count{font-size:11px;color:var(--fg-dim);padding:4px 0 6px}
/* the iframe is the sheet at its true size in px; the stage crops the scaled copy */
.xp-stage{width:300px;overflow:hidden;border:1px solid var(--line);border-radius:4px;background:#e9eaee}
.xp-frame{border:0;display:block;transform-origin:top left}
.pp-usage{flex:1;font-size:11px;color:var(--fg-dim)}
.pp-usage.spent{color:var(--danger);font-weight:600}
.pp-limit{
  width:58px;background:var(--input-bg);border:1px solid var(--line);
  border-radius:4px;padding:2px 4px;font-size:11px;
}
.pp-limit:focus{outline:none;border-color:var(--accent)}
.gm-picker{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.gm-picker select,.gm-picker input{
  width:100%;background:var(--input-bg);border:1px solid var(--line);
  border-radius:4px;padding:3px 5px;
}
.gm-picker select:focus,.gm-picker input:focus{outline:none;border-color:var(--accent)}
.modal .gm-picker{width:100%}

/* ---------- the reference library takeover ---------- */
.lib-back{
  position:fixed;inset:0;background:rgba(0,0,0,.62);display:flex;
  align-items:center;justify-content:center;z-index:50;
}
.lib{
  width:95vw;height:92vh;background:var(--bg);border:1px solid var(--line2);
  border-radius:10px;display:flex;flex-direction:column;min-height:0;overflow:hidden;
  box-shadow:0 20px 60px var(--shadow);
}
.lib-head{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:8px 12px;border-bottom:1px solid var(--line);background:var(--bg2);
}
.lib-head h2{margin:0;font-size:15px;white-space:nowrap}
.lib-tabs{display:flex;gap:2px;margin-left:6px}
.lib-search{
  width:230px;background:var(--input-bg);color:var(--fg);border:1px solid var(--line);
  border-radius:4px;padding:3px 6px;font-size:12px;
}
.lib-search:focus{outline:none;border-color:var(--accent)}
.lib-head .spacer{flex:1}
.lib-x{font-size:13px;line-height:1}
.lib-size{display:flex;gap:2px;align-items:center}
.lib-size .lbl{font-size:11px;color:var(--fg-dim)}
.lib-size button{padding:2px 7px;font-size:11px}

.lib-split{flex:1;min-height:0;display:flex;flex-direction:column}
.lib-refs{flex:0 0 62%;min-height:0;overflow:auto;padding:10px 12px 16px}
.lib-scenes{flex:1;min-height:0;overflow:auto;padding:10px 12px 16px;background:var(--bg2)}
.lib-divider{
  flex:0 0 7px;background:var(--bg2);border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);cursor:row-resize;position:relative;
}
.lib-divider::after{
  content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:44px;height:2px;border-radius:2px;background:var(--line2);
}
.lib-divider:hover::after{background:var(--accent)}
.lib-status{padding:0 0 4px}
.lib-section{margin-bottom:16px}
.lib-section-head{
  display:flex;align-items:center;gap:8px;margin:4px 0 8px;
  border-bottom:1px solid var(--line);padding-bottom:4px;
}
.lib-section-head .t{
  font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--fg-dim);font-weight:600;
}
.lib-section-head .n{font-size:11px;color:var(--fg-dim)}
.lib-section-head .spacer{flex:1}
.lib-empty{padding:2px 0 4px}
/* Cards keep their own height — a portrait subject is a tall card, and
   stretching it to match a landscape neighbour is what buried it. */
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--ref-col,380px),1fr));gap:10px;align-items:start}
.lib-pop{
  position:fixed;z-index:70;background:var(--bg2);border:1px solid var(--line2);
  border-radius:6px;padding:8px;box-shadow:0 6px 20px var(--shadow);
  width:300px;display:flex;flex-direction:column;gap:6px;
}
.lib-rename{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11.5px;
  border:1px solid var(--accent2);border-radius:6px;padding:6px 8px;margin-bottom:10px;
}

/* ---------- one recurring subject ---------- */
.persona{
  border:1px solid var(--line);border-radius:6px;background:var(--bg3);padding:8px;
  border-top:2px solid var(--line2);display:flex;flex-direction:column;
}
.persona.target{box-shadow:0 0 0 1px var(--accent) inset}
.persona.kind-person{border-top-color:var(--accent)}
.persona.kind-place{border-top-color:var(--scene)}
.persona.kind-thing{border-top-color:var(--accent2)}
.persona-head{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.persona-name{
  flex:1;min-width:0;background:var(--input-bg);border:1px solid var(--line);
  border-radius:4px;padding:3px 5px;font-weight:600;
}
.persona-name:focus{outline:none;border-color:var(--accent)}
.persona-kind{flex:0 0 auto;font-size:11px;padding:2px 18px 2px 4px}
.persona-used{
  color:var(--fg-dim);font-size:11px;white-space:nowrap;background:none;
  border:none;cursor:pointer;text-decoration:underline;padding:0;
}
.persona-used.none{text-decoration:none;cursor:default}
.persona-used:hover:not(.none){color:var(--accent)}
/* The frame is the shape of the picture in it, not a fixed landscape slot.
   A 9:16 person used to be letterboxed into 84px of a 234px-wide box; now the
   height is the dial and the width follows the ratio. Landscape pictures run
   into max-width instead and give their height back on their own. */
.persona-frames{display:flex;flex-direction:column;min-width:0}
.persona-frame{
  position:relative;background:var(--frame-bg);
  height:var(--ref-hero,260px);width:auto;max-width:100%;aspect-ratio:var(--ar,16/9);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  border-radius:5px;overflow:hidden;margin:0 auto 4px;
}
.persona-frame img{width:100%;height:100%;object-fit:contain}

/* A tall picture leaves room beside it; the fields move into it. */
.persona-body{display:flex;flex-direction:column;min-width:0}
.persona-fields{display:flex;flex-direction:column;min-width:0}
.persona.portrait .persona-body{flex-direction:row;gap:10px;align-items:flex-start}
.persona.portrait .persona-frames{flex:0 0 auto;min-width:70px}
.persona.portrait .persona-fields{flex:1;min-width:0}
.persona-frame.drag-over,.strip-thumb.drag-over{outline:2px dashed var(--accent);outline-offset:-3px}
/* An X in the corner. The old button said "remove image" straight across the
   middle of whoever's face it happened to be sitting on. */
.frame-x{
  position:absolute;right:4px;top:4px;width:20px;height:20px;padding:0;line-height:1;
  border-radius:50%;border:1px solid var(--line2);background:rgba(0,0,0,.55);
  color:#fff;font-size:11px;cursor:pointer;opacity:0;transition:opacity .12s;
}
.frame-x.small{width:15px;height:15px;font-size:8px;right:2px;top:2px}
.persona-frame:hover .frame-x,.strip-thumb:hover .frame-x,.frame-x:focus{opacity:1}
.frame-x:hover{background:var(--danger);border-color:var(--danger)}

.persona-strip{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:4px}
.strip-cell{min-width:64px;display:flex;flex-direction:column;gap:2px}
/* Same bargain as the hero: fixed height, width from the picture — otherwise a
   portrait angle is 27px of a 64px thumb. The cell stays 64px wide so the
   label under it is still a usable box. */
.strip-thumb{
  position:relative;height:48px;width:auto;aspect-ratio:var(--ar,4/3);
  max-width:100%;min-width:20px;margin:0 auto;background:var(--frame-bg);
  border:1px solid var(--line);border-radius:4px;overflow:hidden;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.strip-cell.hero .strip-thumb{border-color:var(--accent);cursor:default}
.strip-thumb img{width:100%;height:100%;object-fit:contain}
.strip-thumb.add{color:var(--fg-dim);font-size:16px;border-style:dashed}
.strip-thumb.add:hover{color:var(--accent);border-color:var(--accent)}
.strip-label{
  width:100%;background:var(--input-bg);color:var(--fg);border:1px solid var(--line);
  border-radius:3px;padding:1px 3px;font-size:9px;
}
.strip-label:focus{outline:none;border-color:var(--accent)}
.pp-note.warn{color:var(--accent2)}

.persona-text{
  width:100%;background:var(--input-bg);color:var(--fg);border:1px solid var(--line);
  border-radius:5px;padding:5px 6px;font-size:11.5px;resize:vertical;margin-bottom:6px;
}
.persona-text:focus{outline:none;border-color:var(--accent)}

/* ---------- the scene organizer ---------- */
.sc-list{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.sc-row{
  display:flex;align-items:flex-start;gap:8px;padding:6px 8px;
  border:1px solid var(--line);border-radius:6px;background:var(--bg3);
}
.sc-row.sel{border-color:var(--accent)}
.sc-row.dragging{opacity:.4}
.sc-row.drag-over{border-color:var(--accent);border-top-width:3px}
.sc-grip{
  cursor:grab;color:var(--fg-dim);font-size:14px;line-height:1.4;user-select:none;
  padding:2px 2px 2px 0;
}
.sc-num{
  flex:0 0 22px;text-align:center;font-size:11px;color:var(--fg-dim);
  padding-top:4px;font-variant-numeric:tabular-nums;
}
.sc-fields{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.sc-fields .sh-heading{
  width:100%;background:var(--input-bg);color:var(--fg);border:1px solid var(--line);
  border-radius:4px;padding:3px 6px;font-weight:600;
}
.sc-fields .sh-desc{
  width:100%;background:var(--input-bg);color:var(--fg);border:1px solid var(--line);
  border-radius:4px;padding:4px 6px;font-size:11.5px;resize:vertical;
}
.sc-fields .sh-heading:focus,.sc-fields .sh-desc:focus{outline:none;border-color:var(--accent)}
.sc-meta{
  flex:0 0 108px;display:flex;flex-direction:column;align-items:flex-end;gap:4px;
}
.sc-claim{font-size:10px;color:var(--fg-dim);text-transform:uppercase;letter-spacing:.4px}
.sc-claim.broken{color:var(--danger)}

/* ---------- a reference is an object, not words ---------- */
/* The box is a contenteditable so a mark can be drawn as a link. It has to keep
   looking and behaving exactly like the textarea it replaced. */
.ref-box{white-space:pre-wrap;overflow-wrap:break-word;cursor:text}
.ref-box:focus{outline:none;border-color:var(--accent)}
.ref-box.empty::before{
  content:attr(data-placeholder);color:var(--fg-dim);opacity:.75;pointer-events:none;
}
.ref-link{
  color:var(--accent);text-decoration:underline;text-decoration-thickness:1px;
  text-underline-offset:2px;cursor:pointer;border-radius:2px;
}
.ref-link:hover{background:var(--hl1)}
/* a shot chip is a whole frame, not a face — worth telling apart at a glance */
.ref-link.ref-shot{color:var(--scene)}
.ref-link.ref-shot::before{content:'▸';font-size:.85em;opacity:.8;margin-right:1px}
/* whatever it pointed at is gone: it is plain text now, and says so */
.ref-link.dead{color:var(--fg-dim);text-decoration-style:dotted;cursor:default}

/* ---------- the feed: what this card hands the model ---------- */
.feed-row{
  display:flex;align-items:center;gap:5px;flex-wrap:wrap;
  padding:4px 6px 2px;min-height:22px;
}
.feed-label{
  font-size:9px;text-transform:uppercase;letter-spacing:.6px;color:var(--fg-dim);
}
.feed-empty{font-size:10px;color:var(--fg-dim);font-style:italic}
.feed-cell{
  display:flex;align-items:center;gap:4px;padding:1px 5px 1px 2px;
  border:1px solid var(--line2);border-radius:10px;background:none;cursor:pointer;
  font-size:10px;color:var(--fg-dim);max-width:150px;
}
.feed-cell:hover{border-color:var(--accent);color:var(--fg)}
.feed-n{
  min-width:13px;text-align:center;font-variant-numeric:tabular-nums;
  color:var(--accent);font-weight:600;
}
.feed-thumb{
  position:relative;width:22px;height:16px;border-radius:2px;overflow:hidden;
  background:var(--frame-bg);flex:0 0 auto;display:flex;align-items:center;justify-content:center;
}
.feed-thumb img{width:100%;height:100%;object-fit:cover}
.feed-thumb.none{color:var(--accent2);font-size:9px}
.feed-more{

<script>
/* ===== js/theme.js ===== */
/* theme.js — light / dark. Runs before anything else so there is no flash.
 * The choice is a browser preference, not project data — it never touches the file.
 */
window.SB = window.SB || {};
(function (SB) {
  'use strict';

  const KEY = 'sb.theme';

  function stored() {
    try { return localStorage.getItem(KEY); } catch (e) { return null; }
  }

  function systemPref() {
    return (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches)
      ? 'light' : 'dark';
  }

  function current() { return document.documentElement.getAttribute('data-theme') || 'dark'; }

  function apply(t) {
    document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
    const b = document.getElementById('btnTheme');
    if (b) {
      b.textContent = t === 'light' ? '☾' : '☀';
      b.title = t === 'light' ? 'Switch to dark' : 'Switch to light';
    }
  }

  function set(t) {
    try { localStorage.setItem(KEY, t); } catch (e) { }
    apply(t);
  }

  function toggle() { set(current() === 'light' ? 'dark' : 'light'); }

  apply(stored() || systemPref());
  document.addEventListener('DOMContentLoaded', function () { apply(current()); });

  SB.Theme = { apply: apply, set: set, toggle: toggle, current: current };

})(window.SB);

</script>
<script>
/* ===== js/util.js ===== */
/* util.js — small shared helpers */
window.SB = window.SB || {};
(function (SB) {
  'use strict';

  let _seq = 0;
  SB.uid = function (p) {
    _seq++;
    return (p || 'id') + '_' + Date.now().toString(36) + '_' + _seq.toString(36) +
      Math.random().toString(36).slice(2, 6);
  };

  SB.debounce = function (fn, ms) {
    let t = null;
    const wrapped = function () {
      const args = arguments, self = this;
      clearTimeout(t);
      t = setTimeout(function () { t = null; fn.apply(self, args); }, ms);
    };
    wrapped.flush = function () { if (t) { clearTimeout(t); t = null; fn(); } };
    return wrapped;
  };

  SB.esc = function (s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  };

  SB.clone = function (o) { return JSON.parse(JSON.stringify(o)); };

  SB.clamp = function (v, a, b) { return v < a ? a : (v > b ? b : v); };

  /* A, B, ... Z, AA, AB ... */
  SB.letters = function (i) {
    let s = '';
    i = i | 0;
    do { s = String.fromCharCode(65 + (i % 26)) + s; i = Math.floor(i / 26) - 1; }
    while (i >= 0);
    return s;
  };

  SB.fmtDate = function (ts) {
    const d = new Date(ts);
    return d.toLocaleString(undefined, {
      year: 'numeric', month: 'short', day: 'numeric',
      hour: '2-digit', minute: '2-digit'
    });
  };

  SB.toast = function (msg, isErr) {
    const root = document.getElementById('toastRoot');
    if (!root) return;
    const el = document.createElement('div');
    el.className = 'toast' + (isErr ? ' err' : '');
    el.textContent = msg;
    root.appendChild(el);
    setTimeout(function () { el.remove(); }, isErr ? 6000 : 2600);
  };

  /* ---- ask in place ----
   *
   * confirm() stops the whole app dead for something as ordinary as dropping
   * a card. Instead the button itself becomes the question: one click arms it
   * and relabels it, a second click within a few seconds does the job, and
   * anything else — Esc, a click elsewhere, waiting — quietly disarms it.
   */
  SB.armButton = function (btn, label, run) {
    const was = { text: btn.textContent, cls: btn.className, title: btn.title };
    let armed = false, timer = null;
    function disarm() {
      if (!armed) return;
      armed = false;
      clearTimeout(timer);
      btn.textContent = was.text; btn.className = was.cls; btn.title = was.title;
      document.removeEventListener('mousedown', away, true);
      document.removeEventListener('keydown', esc, true);
    }
    function away(ev) { if (ev.target !== btn) disarm(); }
    function esc(ev) { if (ev.key === 'Escape') disarm(); }
    btn.onclick = function (ev) {
      ev.stopPropagation();
      if (armed) { disarm(); run(); return; }
      armed = true;
      btn.textContent = label;
      btn.className = was.cls + ' arm';
      btn.title = 'Click again to confirm — or press Esc';
      document.addEventListener('mousedown', away, true);
      document.addEventListener('keydown', esc, true);
      timer = setTimeout(disarm, 4000);
    };
    return disarm;
  };

  /* ---- the request that never left the browser ----
   *
   * A corporate proxy blocking generativelanguage.googleapis.com looks nothing
   * like a Gemini error: fetch rejects with a TypeError, no status, no body,
   * and the user gets "Failed to fetch" — which explains nothing and suggests
   * no fix. On this network the fix is always the same one click, so the
   * failure is classified here and answered with it.
   */
  SB.AISTUDIO_URL = 'https://aistudio.google.com/';

  const BLOCKED_MSG = 'Google’s API could not be reached — the request was blocked before it ' +
    'left the browser. On the Pega network this happens until AI Studio has been opened once ' +
    'in this browser and accepted.';
  const OFFLINE_MSG = 'No network — the request never left the browser. Reconnect, then try again.';

  /* 'blocked' | 'offline' | null (an ordinary error, handle it normally) */
  SB.netKind = function (e) {
    if (!e) return null;
    /* A local model server that isn't answering fails exactly like a proxied
     * request — same TypeError, same "Failed to fetch" — but the fix has
     * nothing to do with AI Studio. Providers mark those, and they are never
     * classified as a network block. */
    if (e.localApi) return null;
    if (e.blocked) return e.netKind || 'blocked';
    if (typeof navigator !== 'undefined' && navigator.onLine === false) return 'offline';
    /* fetch itself rejecting — CORS, a proxy, DNS. No response ever arrived. */
    if (typeof TypeError !== 'undefined' && e instanceof TypeError) return 'blocked';
    if (/failed to fetch|networkerror|load failed|network request failed/i.test(String(e.message || e))) {
      return 'blocked';
    }
    /* An interception page answering with HTML where JSON was due. Kept narrow:
     * a real "API key not valid" 403 is JSON and must keep reporting itself. */
    if (e.interception) return 'blocked';
    return null;
  };

  /* Does this response body look like a proxy's own page rather than Google's? */
  SB.isInterception = function (status, body) {
    if ([403, 407, 451, 502].indexOf(status) < 0) return false;
    const t = String(body || '').trim();
    if (!t) return false;
    if (/^[[{]/.test(t)) return false;                 // JSON — Google answered
    return /^<|<html|<!doctype/i.test(t);
  };

  SB.netError = function (kind) {
    const err = new Error(kind === 'offline' ? OFFLINE_MSG : BLOCKED_MSG);
    err.blocked = true;
    err.netKind = kind === 'offline' ? 'offline' : 'blocked';
    return err;
  };

  /* Show the way out and offer to run the failed thing again. Returns false for
   * anything that is not a network block, so callers keep their own handling:
   *
   *   .catch(function (e) { if (SB.apiBlocked(e, again)) return; failed(e); });
   *
   * Shown every time it happens — the fix is one click, and hiding it behind
   * "don't show again" would just move the confusion later.
   */
  let openBlock = null;

  SB.apiBlocked = function (err, retry) {
    const kind = SB.netKind(err);
    if (!kind) return false;
    /* Already on screen: keep the newer way back rather than stacking dialogs. */
    if (openBlock) { openBlock.retry = retry || openBlock.retry; return true; }

    const state = { retry: retry || null };
    const body = SB.el('div', 'blocked-body');
    body.appendChild(SB.el('p', null, kind === 'offline' ? OFFLINE_MSG : BLOCKED_MSG));

    if (kind !== 'offline') {
      const a = document.createElement('a');
      a.className = 'blocked-link';
      a.href = SB.AISTUDIO_URL;
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = 'Open AI Studio ↗';
      body.appendChild(a);
      body.appendChild(SB.el('p', 'pp-note',
        'It opens in a new tab. Accept there, come back, and try again — it only has to be ' +
        'done once in this browser.'));

      const help = SB.el('p', 'pp-note');
      help.appendChild(document.createTextNode('No key yet? '));
      const link = SB.el('button', 'linkish', 'Settings → API');
      link.onclick = function () {
        if (openBlock) openBlock.close();
        SB.Settings.open('api');
      };
      help.appendChild(link);
      help.appendChild(document.createTextNode(' walks through making one.'));
      body.appendChild(help);
    }

    const m = SB.modal({
      title: kind === 'offline' ? 'No network' : 'Google’s API is being blocked',
      width: '460px',
      body: body,
      buttons: [
        { label: 'Close' },
        {
          label: 'Try again', primary: true, onClick: function (close) {
            const again = state.retry;
            close();
            if (again) again();
          }
        }
      ],
      onClose: function () { openBlock = null; }
    });
    state.close = m.close;
    openBlock = state;
    return true;
  };

  /* ---- images: downscale to <=480p proxy, base64 JPEG ---- */
  const MAX_W = 854, MAX_H = 480;

  SB.downscaleImage = function (blobOrDataUrl) {
    return new Promise(function (resolve, reject) {
      const img = new Image();
      img.onload = function () {
        let w = img.naturalWidth, h = img.naturalHeight;
        if (!w || !h) { reject(new Error('bad image')); return; }
        const scale = Math.min(1, MAX_W / w, MAX_H / h);
        w = Math.max(1, Math.round(w * scale));
        h = Math.max(1, Math.round(h * scale));
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        resolve({ data: c.toDataURL('image/jpeg', 0.82), w: w, h: h });
      };
      img.onerror = function () { reject(new Error('could not decode image')); };
      if (typeof blobOrDataUrl === 'string') img.src = blobOrDataUrl;
      else img.src = URL.createObjectURL(blobOrDataUrl);
    });
  };

  /* Pull an image out of a drop / paste event. Returns Promise<Blob|string|null> */
  SB.imageFromTransfer = function (dt) {
    if (!dt) return Promise.resolve(null);
    const files = dt.files;
    if (files && files.length) {
      for (let i = 0; i < files.length; i++) {
        if (/^image\//.test(files[i].type)) return Promise.resolve(files[i]);
      }
    }
    if (dt.items) {
      for (let i = 0; i < dt.items.length; i++) {
        const it = dt.items[i];
        if (it.kind === 'file' && /^image\//.test(it.type)) {
          const f = it.getAsFile();
          if (f) return Promise.resolve(f);
        }
      }
    }
    const uri = dt.getData && (dt.getData('text/uri-list') || dt.getData('text/plain'));
    if (uri && /^(https?:|data:image)/i.test(uri.trim())) {
      const u = uri.trim().split(/\s+/)[0];
      if (/^data:image/i.test(u)) return Promise.resolve(u);
      return fetch(u, { mode: 'cors' }).then(function (r) { return r.blob(); })
        .catch(function () { return null; });
    }
    const html = dt.getData && dt.getData('text/html');
    if (html) {
      const m = html.match(/<img[^>]+src=["']([^"']+)["']/i);
      if (m) {
        const u = m[1];
        if (/^data:image/i.test(u)) return Promise.resolve(u);
        return fetch(u, { mode: 'cors' }).then(function (r) { return r.blob(); })
          .catch(function () { return null; });
      }
    }
    return Promise.resolve(null);
  };

  /* Every image in a drop, not just the first. Dragging a selection out of
     Explorer is one gesture and means several pictures; the single-image
     fallbacks (a URL, an <img> lifted out of a page) can only ever describe
     one, so they come back as a list of one. Returns Promise<Array>. */
  SB.imagesFromTransfer = function (dt) {
    if (!dt) return Promise.resolve([]);
    const out = [];
    const files = dt.files;
    if (files && files.length) {
      for (let i = 0; i < files.length; i++) {
        if (/^image\//.test(files[i].type)) out.push(files[i]);
      }
    }
    if (!out.length && dt.items) {
      for (let i = 0; i < dt.items.length; i++) {
        const it = dt.items[i];
        if (it.kind === 'file' && /^image\//.test(it.type)) {
          const f = it.getAsFile();
          if (f) out.push(f);
        }
      }
    }
    if (out.length) return Promise.resolve(out);
    return SB.imageFromTransfer(dt).then(function (one) { return one ? [one] : []; });
  };

  SB.pickImageFile = function () {
    return new Promise(function (resolve) {
      const inp = document.createElement('input');
      inp.type = 'file';
      inp.accept = 'image/*';
      inp.onchange = function () { resolve(inp.files && inp.files[0] ? inp.files[0] : null); };
      inp.click();
    });
  };

  /* ---- modal ---- */
  SB.modal = function (opts) {
    const back = SB.el('div', 'modal-back');
    const m = SB.el('div', 'modal');
    if (opts.width) m.style.minWidth = opts.width;
    const h = SB.el('h2', null, opts.title || '');
    const body = SB.el('div', 'body');
    if (opts.body) body.appendChild(opts.body);
    const foot = SB.el('div', 'foot');
    m.appendChild(h); m.appendChild(body); m.appendChild(foot);
    back.appendChild(m);

    function close() {
      back.remove();
      document.removeEventListener('keydown', onKey);
      if (opts.onClose) opts.onClose();
    }
    function onKey(e) { if (e.key === 'Escape') close(); }
    document.addEventListener('keydown', onKey);
    back.addEventListener('mousedown', function (e) { if (e.target === back) close(); });

    (opts.buttons || [{ label: 'Close' }]).forEach(function (b) {
      const btn = SB.el('button', 'tb' + (b.primary ? ' on' : ''), b.label);
      btn.onclick = function () { if (b.onClick) b.onClick(close, body); else close(); };
      foot.appendChild(btn);
    });

    document.getElementById('modalRoot').appendChild(back);
    return { close: close, body: body, root: back };
  };

  /* tiny DOM helper */
  SB.el = function (tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  };

})(window.SB);

</script>
<script>
/* ===== js/doc.js ===== */
/* doc.js — the shared-document engine.
 *
 * A Doc is { text: string, marks: { b:[[s,e]..], i:[...], u:[...] } }.
 * Every edit anywhere in the app is funnelled through a single primitive:
 *
 *     replace(doc, start, end, insertedText)
 *
 * Positions (shot link anchors, marks) are *transformed* through that
 * primitive rather than re-found by string matching, so they survive edits
 * elsewhere in the document. Gravity decides what happens when an edit lands
 * exactly on an anchor.
 */
(function (SB) {
  'use strict';

  const TYPES = ['b', 'i', 'u'];
  const BIT = { b: 1, i: 2, u: 4 };

  /* The HTML parser folds \r\n — and a lone \r — into \n the instant text
   * reaches the DOM. A doc holding CRs therefore measures longer than anything
   * the editor can see, so every offset read back off a selection came up short
   * by one per line above it, and a shot captured from the script was handed
   * somebody else's characters. Windows puts CRs on the clipboard, so this
   * arrives by pasting from Word, Outlook or a transcript. Nothing above this
   * layer has to care: the CRs are folded out on the way in. */
  function eol(s) {
    return String(s == null ? '' : s).replace(/\r\n?/g, '\n');
  }

  /* Fold the CRs out of a doc that already holds some, returning a map from old
   * character offsets to new ones — null when there was nothing to fold. The
   * caller owns every other anchor into this doc and has to drag it through. */
  function foldEOL(doc) {
    if (!doc || typeof doc.text !== 'string' || doc.text.indexOf('\r') < 0) return null;
    const old = doc.text;
    const map = new Int32Array(old.length + 1);
    let out = '', drop = 0;
    for (let i = 0; i < old.length; i++) {
      map[i] = i - drop;
      if (old.charAt(i) === '\r') {
        if (old.charAt(i + 1) === '\n') drop++;   // CRLF: the LF stands for both
        else out += '\n';                         // a lone CR is a line break too
      } else out += old.charAt(i);
    }
    map[old.length] = old.length - drop;
    doc.text = out;
    doc.marks = doc.marks || { b: [], i: [], u: [] };
    const at = function (p) { return map[SB.clamp(p | 0, 0, old.length)]; };
    for (let k = 0; k < TYPES.length; k++) {
      const t = TYPES[k];
      doc.marks[t] = normalize((doc.marks[t] || []).map(function (r) {
        return [at(r[0]), at(r[1])];
      }));
    }
    return at;
  }

  function make(text) {
    return { text: eol(text), marks: { b: [], i: [], u: [] } };
  }

  function normalize(list) {
    if (!list || !list.length) return [];
    const l = list.filter(function (r) { return r[1] > r[0]; })
      .sort(function (a, b) { return a[0] - b[0] || a[1] - b[1]; });
    const out = [];
    for (let k = 0; k < l.length; k++) {
      const last = out[out.length - 1];
      if (last && l[k][0] <= last[1]) last[1] = Math.max(last[1], l[k][1]);
      else out.push([l[k][0], l[k][1]]);
    }
    return out;
  }

  /* Transform position p through replace(start,end,len).
   * leftGravity=true  -> anchor stays to the LEFT of inserted text
   * leftGravity=false -> anchor moves to the RIGHT of inserted text
   */
  function mapPos(p, start, end, len, leftGravity) {
    // 1. deletion of [start,end)
    let q;
    if (p <= start) q = p;
    else if (p >= end) q = p - (end - start);
    else q = start;
    // 2. insertion of len at start
    if (q < start) return q;
    if (q > start) return q + len;
    return leftGravity ? start : start + len;
  }

  function mapList(list, start, end, len) {
    const out = [];
    for (let k = 0; k < list.length; k++) {
      // marks: don't grab text typed before them, do extend when typed at their end
      const a = mapPos(list[k][0], start, end, len, false);
      const b = mapPos(list[k][1], start, end, len, false);
      if (b > a) out.push([a, b]);
    }
    return normalize(out);
  }

  /* Apply a replacement to a doc's text + marks. Returns the raw op. */
  function replace(doc, start, end, text) {
    start = SB.clamp(start | 0, 0, doc.text.length);
    end = SB.clamp(end | 0, start, doc.text.length);
    text = eol(text);
    doc.text = doc.text.slice(0, start) + text + doc.text.slice(end);
    for (let k = 0; k < TYPES.length; k++) {
      const t = TYPES[k];
      doc.marks[t] = mapList(doc.marks[t] || [], start, end, text.length);
    }
    return { start: start, end: end, len: text.length };
  }

  /* Does [s,e) carry the mark entirely? */
  function hasMark(doc, type, s, e) {
    if (e <= s) return false;
    const list = doc.marks[type] || [];
    let cur = s;
    for (let k = 0; k < list.length && cur < e; k++) {
      if (list[k][1] <= cur) continue;
      if (list[k][0] > cur) return false;
      cur = list[k][1];
    }
    return cur >= e;
  }

  function addMark(doc, type, s, e) {
    if (e <= s) return;
    doc.marks[type] = normalize((doc.marks[type] || []).concat([[s, e]]));
  }

  function removeMark(doc, type, s, e) {
    if (e <= s) return;
    const out = [];
    const list = doc.marks[type] || [];
    for (let k = 0; k < list.length; k++) {
      const a = list[k][0], b = list[k][1];
      if (b <= s || a >= e) { out.push([a, b]); continue; }
      if (a < s) out.push([a, s]);
      if (b > e) out.push([e, b]);
    }
    doc.marks[type] = normalize(out);
  }

  function toggleMark(doc, type, s, e) {
    if (e <= s || !BIT[type]) return;
    if (hasMark(doc, type, s, e)) removeMark(doc, type, s, e);
    else addMark(doc, type, s, e);
  }

  /* Per-character style bitfield for [from,to) */
  function flags(doc, from, to) {
    const n = Math.max(0, to - from);
    const f = new Uint8Array(n);
    for (let k = 0; k < TYPES.length; k++) {
      const t = TYPES[k], bit = BIT[t], list = doc.marks[t] || [];
      for (let j = 0; j < list.length; j++) {
        const a = Math.max(from, list[j][0]), b = Math.min(to, list[j][1]);
        for (let i = a; i < b; i++) f[i - from] |= bit;
      }
    }
    return f;
  }

  /* Marks inside [from,to) rebased to 0 (used when breaking a link). */
  function sliceMarks(doc, from, to) {
    const out = { b: [], i: [], u: [] };
    for (let k = 0; k < TYPES.length; k++) {
      const t = TYPES[k], list = doc.marks[t] || [];
      for (let j = 0; j < list.length; j++) {
        const a = Math.max(from, list[j][0]), b = Math.min(to, list[j][1]);
        if (b > a) out[t].push([a - from, b - from]);
      }
      out[t] = normalize(out[t]);
    }
    return out;
  }

  /* Render [from,to) as HTML. extraFn(absoluteIndex) -> extra class string (or ''). */
  function renderHTML(doc, from, to, extraFn) {
    from = SB.clamp(from | 0, 0, doc.text.length);
    to = SB.clamp(to | 0, from, doc.text.length);
    const slice = doc.text.slice(from, to);
    if (!slice) return '';
    const f = flags(doc, from, to);
    let html = '';
    let runStart = 0, runFlag = f[0], runExtra = extraFn ? extraFn(from) : '';
    function emit(a, b, fl, ex) {
      let s = SB.esc(slice.slice(a, b));
      if (fl & BIT.b) s = '<b>' + s + '</b>';
      if (fl & BIT.i) s = '<i>' + s + '</i>';
      if (fl & BIT.u) s = '<u>' + s + '</u>';
      if (ex) s = '<span class="' + ex + '">' + s + '</span>';
      html += s;
    }
    for (let i = 1; i < slice.length; i++) {
      const ex = extraFn ? extraFn(from + i) : '';
      if (f[i] !== runFlag || ex !== runExtra) {
        emit(runStart, i, runFlag, runExtra);
        runStart = i; runFlag = f[i]; runExtra = ex;
      }
    }
    emit(runStart, slice.length, runFlag, runExtra);
    if (slice.charAt(slice.length - 1) === '\n') html += '<br class="pad">';
    return html;
  }

  SB.Doc = {
    TYPES: TYPES, BIT: BIT,
    make: make, normalize: normalize, mapPos: mapPos, mapList: mapList,
    eol: eol, foldEOL: foldEOL,
    replace: replace, hasMark: hasMark, toggleMark: toggleMark,
    addMark: addMark, removeMark: removeMark,
    flags: flags, sliceMarks: sliceMarks, renderHTML: renderHTML
  };

})(window.SB);

</script>
<script>
/* ===== js/blobs.js ===== */
/* blobs.js — every image stored once, under the hash of its bytes.
 *
 * Shots, personas and ink hold a short reference; the actual base64 lives in
 * one map on the project. Two things fall out of that:
 *
 *   - A version snapshot used to deep-copy every frame it froze. Now it copies
 *     references, so cutting a version costs almost nothing.
 *   - The same picture used twice — the same reference frame on ten shots — is
 *     stored once.
 *
 * The map lives INSIDE the project file, so a board is still one thing you can
 * hand to someone. When the board goes online the same references become keys
 * in an object store; nothing above this layer has to change.
 */
(function (SB) {
  'use strict';

  /* Data URLs are ASCII, so a byte-wise FNV-1a is fine here. Two independent
   * 32-bit rounds plus the length give a key wide enough that a collision is
   * not a practical concern — and put() verifies anyway, so a collision could
   * never silently swap one picture for another. */
  function h32(str, seed) {
    let h = seed >>> 0;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i) & 0xff;
      h = Math.imul(h, 16777619) >>> 0;
    }
    return h >>> 0;
  }

  function hash(s) {
    return h32(s, 2166136261).toString(36) + h32(s, 40389).toString(36) +
      '-' + s.length.toString(36);
  }

  function map(p) { return (p.blobs = p.blobs || {}); }

  /* Store a data URL, return its reference. Same bytes -> same reference. */
  function put(p, dataUrl) {
    if (!dataUrl) return null;
    const b = map(p);
    let key = hash(dataUrl);
    let n = 1;
    while (b[key] !== undefined && b[key] !== dataUrl) key = hash(dataUrl) + '~' + (++n);
    b[key] = dataUrl;
    return key;
  }

  function get(p, ref) {
    if (!ref) return '';
    return map(p)[ref] || '';
  }

  /* Accepts the new {ref,w,h}, the old inline {data,w,h}, or a bare data URL,
   * so an older project renders while it is being migrated. */
  function src(p, img) {
    if (!img) return '';
    if (typeof img === 'string') return /^data:/.test(img) ? img : get(p, img);
    if (img.ref) return get(p, img.ref);
    if (img.data) return img.data;
    return '';
  }

  function has(p, ref) { return !!(ref && map(p)[ref] !== undefined); }

  /* Turn a data URL into a stored image record. */
  function image(p, dataUrl, w, h) {
    const ref = put(p, dataUrl);
    return ref ? { ref: ref, w: w || 0, h: h || 0 } : null;
  }

  /* Every reference a project holds — current board AND every frozen version,
   * which is what stops a version's frames being collected. */
  function referenced(p) {
    const seen = {};
    const mark = function (img) {
      if (!img) return;
      if (typeof img === 'string') { seen[img] = 1; return; }
      if (img.ref) seen[img.ref] = 1;
    };
    const walkScenes = function (scenes) {
      (scenes || []).forEach(function (sc) {
        (sc.shots || []).forEach(function (sh) {
          mark(sh.image);
          mark(sh.annotation);
        });
      });
    };
    /* Both shapes, deliberately: this sweep decides what gc() deletes, so a
     * record that has not been through migrate() — a snapshot pasted in by
     * hand, a fixture — must not cost somebody their reference frames. */
    const walkPersonas = function (list) {
      (list || []).forEach(function (per) {
        mark(per.image);
        (per.images || []).forEach(mark);
      });
    };
    walkScenes(p.scenes);
    walkPersonas(p.personas);
    (p.versions || []).forEach(function (v) {
      if (!v.snapshot) return;
      walkScenes(v.snapshot.scenes);
      walkPersonas(v.snapshot.personas);
    });
    return seen;
  }

  /* Drop anything nothing points at any more. Returns bytes reclaimed. */
  function gc(p) {
    const keep = referenced(p);
    const b = map(p);
    let freed = 0;
    Object.keys(b).forEach(function (k) {
      if (!keep[k]) { freed += (b[k] || '').length; delete b[k]; }
    });
    return freed;
  }

  /* What the store holds vs what it would cost inline — the dedupe saving. */
  function stats(p) {
    const b = map(p);
    let unique = 0, uniqueBytes = 0;
    Object.keys(b).forEach(function (k) { unique++; uniqueBytes += (b[k] || '').length; });

    let refs = 0, inlineBytes = 0;
    const count = function (img) {
      if (!img) return;
      const ref = (typeof img === 'string') ? img : img.ref;
      if (!ref || b[ref] === undefined) return;
      refs++;
      inlineBytes += b[ref].length;
    };
    const scenes = function (list) {
      (list || []).forEach(function (sc) {
        (sc.shots || []).forEach(function (sh) { count(sh.image); count(sh.annotation); });
      });
    };
    const refsOf = function (list) {
      (list || []).forEach(function (per) {
        count(per.image);
        (per.images || []).forEach(count);
      });
    };
    scenes(p.scenes);
    refsOf(p.personas);
    (p.versions || []).forEach(function (v) {
      if (!v.snapshot) return;
      scenes(v.snapshot.scenes);
      refsOf(v.snapshot.personas);
    });

    return {
      unique: unique, uniqueBytes: uniqueBytes,
      refs: refs, inlineBytes: inlineBytes,
      saved: Math.max(0, inlineBytes - uniqueBytes)
    };
  }

  /* Migrate one image-bearing record from the old inline shape. */
  function adopt(p, img) {
    if (!img) return null;
    if (typeof img === 'string') {                 // old annotation: a bare data URL
      return /^data:/.test(img) ? { ref: put(p, img) } : { ref: img };
    }
    if (img.ref) return img;                       // already a reference
    if (img.data) return { ref: put(p, img.data), w: img.w || 0, h: img.h || 0 };
    return null;
  }

  SB.Blobs = {
    hash: hash, put: put, get: get, src: src, has: has, image: image,
    referenced: referenced, gc: gc, stats: stats, adopt: adopt, map: map
  };

})(window.SB);

</script>
<script>
/* ===== js/geminimodels.js ===== */
/* geminimodels.js — which Gemini model writes the prompts.
 *
 * Curated list of the text models documented at ai.google.dev (verified against ListModels + a per-id generateContent ping, 2026-08-21),
 * filtered to ones that take text in and return text/JSON out — no image, TTS,
 * live-audio, embedding or video models, none of which can write a prompt.
 *
 * Google retires ids on its own schedule, so the picker can also ask the key
 * itself: "refresh from my key" calls ListModels and replaces the list with
 * whatever that key can actually reach today. That result is cached locally.
 */
(function (SB) {
  'use strict';

  const DEFAULT = 'gemini-3.7-flash';
  const CACHE_KEY = 'sb.geminiModelList';

  const LIST = [
    { id: 'gemini-3.7-flash', label: 'Gemini 3.7 Flash — latest, best coding/agents (default)' },
    { id: 'gemini-3.6-flash', label: 'Gemini 3.6 Flash — previous default, balanced' },
    { id: 'gemini-3.5-flash', label: 'Gemini 3.5 Flash — most intelligent' },
    { id: 'gemini-3.5-flash-lite', label: 'Gemini 3.5 Flash-Lite — fastest / cheapest 3.5' },
    { id: 'gemini-3.1-flash-lite', label: 'Gemini 3.1 Flash-Lite — frontier-class, low cost' },
    { id: 'gemini-3.1-pro-preview', label: 'Gemini 3.1 Pro — deepest reasoning (preview)' },
    { id: 'gemini-3-flash-preview', label: 'Gemini 3 Flash (preview)' },
    { id: 'gemini-2.5-flash', label: 'Gemini 2.5 Flash — older price/performance' },
    { id: 'gemini-2.5-flash-lite', label: 'Gemini 2.5 Flash-Lite — older, budget' },
    { id: 'gemini-2.5-pro', label: 'Gemini 2.5 Pro — older, deep reasoning' },
    { id: 'gemma-4-31b-it', label: 'Gemma 4 31B — open model, large free quota' }
  ];

  /* Gemma is served through the same endpoint but is not a Gemini model: it
   * has no JSON mode, so prompts.js asks it for JSON in words instead of
   * sending a responseSchema. */
  function isGemma(id) { return /^gemma/i.test(String(id || '')); }

  /* ids Google has shut down — anything pointing at these gets moved to DEFAULT */
  const RETIRED = [
    'gemini-2.0-flash', 'gemini-2.0-flash-lite',
    'gemini-3-pro-preview',
    'gemini-1.5-flash', 'gemini-1.5-pro', 'gemini-pro',
    /* Gemma ids Google has dropped from the API (verified 2026-08-21) */
    'gemma-3-27b-it', 'gemma-3-12b-it', 'gemma-4-e4b-it', 'gemma-4-e2b-it'
  ];

  /* ---- daily request counting (same idea as the AI GM app) ----
   * Google stopped publishing per-model free-tier RPD in the docs, so the
   * count here is real (every request this browser sent today) while the
   * limit is whatever AI Studio shows you. Resets at local midnight.
   */
  const USAGE_KEY = 'sb.geminiUsage';
  const LIMITS_KEY = 'sb.geminiLimits';
  const DEFAULT_LIMITS = {
    'gemini-2.5-flash': 20, 'gemini-2.5-flash-lite': 20,
    'gemma-4-31b-it': 1500
  };

  function today() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' +
      String(d.getDate()).padStart(2, '0');
  }

  function usage() {
    try {
      const u = JSON.parse(localStorage.getItem(USAGE_KEY));
      if (u && u.date === today()) return u;
    } catch (e) { }
    return { date: today(), counts: {} };
  }

  function saveUsage(u) {
    try { localStorage.setItem(USAGE_KEY, JSON.stringify(u)); } catch (e) { }
  }

  function bump(id) {
    const u = usage();
    u.counts[id] = (u.counts[id] || 0) + 1;
    saveUsage(u);
    return u.counts[id];
  }

  function count(id) { return usage().counts[id] || 0; }

  /* a 429 means today's allowance is gone whatever the number says */
  function markExhausted(id) {
    const u = usage();
    const lim = limit(id);
    u.counts[id] = lim ? Math.max(lim, u.counts[id] || 0) : (u.counts[id] || 0) + 1;
    saveUsage(u);
  }

  function limits() {
    try { return JSON.parse(localStorage.getItem(LIMITS_KEY)) || {}; } catch (e) { return {}; }
  }

  function limit(id) {
    const l = limits();
    if (typeof l[id] === 'number') return l[id];
    return DEFAULT_LIMITS[id] || 0;   // 0 = unknown, just show the count
  }

  function setLimit(id, n) {
    const l = limits();
    if (n > 0) l[id] = n; else delete l[id];
    try { localStorage.setItem(LIMITS_KEY, JSON.stringify(l)); } catch (e) { }
  }

  function remaining(id) {
    const lim = limit(id);
    return lim ? Math.max(0, lim - count(id)) : null;
  }

  function usageText(id) {
    const c = count(id), lim = limit(id);
    if (!lim) return c + ' request' + (c === 1 ? '' : 's') + ' today';
    return c + ' / ' + lim + ' today · ' + Math.max(0, lim - c) + ' left';
  }

  function cached() {
    try {
      const v = JSON.parse(localStorage.getItem(CACHE_KEY));
      return (v && Array.isArray(v.models) && v.models.length) ? v : null;
    } catch (e) { return null; }
  }

  /* Curated list, or the live one from the key if it has been fetched. */
  function options() {
    const c = cached();
    if (!c) return LIST.slice();
    return c.models.map(function (m) {
      return { id: m.id, label: m.label || m.id };
    });
  }

  function isRetired(id) { return RETIRED.indexOf(id) >= 0; }

  /* Google also serves floating aliases — gemini-flash-latest and friends —
   * that silently repoint at whatever is newest. A board must not change which
   * model writes its prompts without anyone touching a setting, so an alias is
   * moved onto the pinned default the same way a retired id is. */
  function isAlias(id) { return /-latest$/i.test(String(id || '')); }

  function normalize(id) {
    if (!id || isRetired(id) || isAlias(id)) return DEFAULT;
    return id;
  }

  /* Ask the user's own key what it can reach. */
  function fetchAvailable() {
    const key = SB.Store.getApiKey();
    if (!key) return Promise.reject(new Error('Add your API key first, then refresh the list.'));
    return fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200&key=' +
      encodeURIComponent(key))
      .catch(function (e) {
        const kind = SB.netKind(e);
        if (kind) throw SB.netError(kind);
        throw e;
      })
      .then(function (r) {
        return r.text().then(function (t) {
          if (!r.ok) {
            if (SB.isInterception(r.status, t)) throw SB.netError('blocked');
            let msg = t;
            try { msg = JSON.parse(t).error.message; } catch (e) { }
            throw new Error('Gemini ' + r.status + ': ' + msg);
          }
          return JSON.parse(t);
        });
      })
      .then(function (data) {
        const models = (data.models || []).filter(function (m) {
          const methods = m.supportedGenerationMethods || m.supportedActions || [];
          if (methods.indexOf('generateContent') < 0) return false;
          const id = String(m.name || '').replace(/^models\//, '');
          // drop anything that can't write text back
          return !/embedding|aqa|tts|image|live|veo|imagen|robotics/i.test(id);
        }).map(function (m) {
          const id = String(m.name).replace(/^models\//, '');
          return { id: id, label: (m.displayName || id) + ' — ' + id };
        });
        if (!models.length) throw new Error('That key returned no text models.');
        try {
          localStorage.setItem(CACHE_KEY, JSON.stringify({ at: Date.now(), models: models }));
        } catch (e) { }
        return models;
      });
  }

  function clearCache() {
    try { localStorage.removeItem(CACHE_KEY); } catch (e) { }
  }

  /* A <select> of known models plus a "Custom…" escape hatch.
   * Returns {el, value()} — el is a wrapper holding the select and, when
   * "Custom…" is chosen, a text input. */
  function picker(current, onChange) {
    const wrap = SB.el('div', 'gm-picker');
    const sel = document.createElement('select');
    const custom = document.createElement('input');
    custom.type = 'text';
    custom.placeholder = 'model id, e.g. gemini-3.6-flash';
    custom.className = 'gm-custom';

    function build() {
      const list = options();
      sel.innerHTML = '';
      let matched = false;
      list.forEach(function (m) {
        const o = document.createElement('option');
        o.value = m.id; o.textContent = m.label;
        if (m.id === current) { o.selected = true; matched = true; }
        sel.appendChild(o);
      });
      if (current && !matched) {
        const o = document.createElement('option');
        o.value = current; o.textContent = current + ' — (not in list)';
        o.selected = true;
        sel.insertBefore(o, sel.firstChild);
      }
      const oc = document.createElement('option');
      oc.value = '__custom'; oc.textContent = 'Custom…';
      sel.appendChild(oc);
    }
    build();

    custom.classList.add('hidden');
    sel.addEventListener('change', function () {
      if (sel.value === '__custom') {
        custom.classList.remove('hidden');
        custom.value = current || '';
        custom.focus();
        return;
      }
      custom.classList.add('hidden');
      current = sel.value;
      if (onChange) onChange(current);
    });
    custom.addEventListener('input', function () {
      current = custom.value.trim();
      if (onChange) onChange(current);
    });

    wrap.appendChild(sel);
    wrap.appendChild(custom);
    return {
      el: wrap,
      value: function () { return current; },
      rebuild: function (cur) { if (cur) current = cur; build(); }
    };
  }

  SB.GeminiModels = {
    DEFAULT: DEFAULT, LIST: LIST, RETIRED: RETIRED,
    options: options, isRetired: isRetired, isAlias: isAlias, normalize: normalize, isGemma: isGemma,
    fetchAvailable: fetchAvailable, clearCache: clearCache, picker: picker,
    bump: bump, count: count, markExhausted: markExhausted,
    limit: limit, setLimit: setLimit, remaining: remaining, usageText: usageText
  };

})(window.SB);

</script>
<script>
/* ===== js/providers.js ===== */
/* providers.js — where the prompt WRITER runs.
 *
 * Two backends, one shape. prompts.js asks a provider to build a request body
 * and to pull the text back out; everything else in the app is unchanged.
 *
 *   gemini — Google's generativelanguage endpoint, with JSON schema mode.
 *   ooba   — any OpenAI-compatible /v1/chat/completions server: oobabooga's
 *            text-generation-webui (--api), Ollama (:11434, which requires a
 *            model name and answers 404 when it does not know it), LM Studio,
 *            llama.cpp's server, KoboldCpp. No schema mode, so it takes the
 *            same "ask for JSON in words" path Gemma already uses.
 *
 * Which one is active is a project setting (p.settings.aiProvider) because a
 * board's prompts are written by whatever the board is pointed at. WHERE the
 * local server lives is not: the URL, model and optional key are per-browser,
 * like the Gemini key, so a .storyboard handed to someone else carries neither
 * your key nor your machine's address — and so flipping provider back and
 * forth never costs you either side's model choice.
 */
(function (SB) {
  'use strict';

  const GEMINI_ENDPOINT = 'https://generativelanguage.googleapis.com/v1beta/models/';
  const DEFAULT_OOBA_URL = 'http://127.0.0.1:5000';

  function P() { return SB.app && SB.app.project; }

  /* ---------------- gemini ---------------- */

  const gemini = {
    id: 'gemini',
    label: 'Google Gemini',
    supportsSchema: true,
    needsKey: true,
