      name: 'a short label for the board. If the script names this person, USE THAT NAME — it is ' +
        'what somebody will type after an @ for the rest of the project. Only invent a handle ' +
        'like "Ops lead" when the script leaves them unnamed.',
      desc: 'who they are on camera and, critically, exactly what they look like and are WEARING. ' +
        'Age range, build, hair, skin tone, and a specific outfit described down to fabric and colour. ' +
        'This text is what keeps them identical from shot to shot, so be concrete and complete.'
    },
    place: {
      ask: 'recurring',
      unit: ['location', 'locations'],
      name: 'a short label for the board — the script\'s own name for the place if it has one, ' +
        'otherwise a handle like "Server room" or "Loading bay".',
      desc: 'what the place is and exactly what it looks like: architecture, surfaces, furniture, ' +
        'light sources, time of day, and anything fixed that must not drift between shots. ' +
        'Describe the room, not the action in it.'
    },
    thing: {
      ask: 'recurring',
      unit: ['object, product or screen', 'objects, products or screens'],
      name: 'a short label for the board — the script\'s own name for it if it has one, ' +
        'otherwise a handle like "Handset" or "Dashboard".',
      desc: 'what the object is and exactly what it looks like: form, size, material, finish, ' +
        'colour, and any logo, label or on-screen state that has to be identical every time. ' +
        'Do not invent a brand name, logo, model number or asset tag: if the script does not ' +
        'name one, say the surface is unbranded and leave any screen text generic.'
    }
  };

  const GEN_SCHEMA = {
    type: 'OBJECT',
    properties: {
      personas: {
        type: 'ARRAY',
        items: {
          type: 'OBJECT',
          properties: {
            name: { type: 'STRING' },
            description: { type: 'STRING' },
            imagePrompt: { type: 'STRING' }
          },
          required: ['name', 'description', 'imagePrompt']
        }
      }
    },
    required: ['personas']
  };

  function generate(p, count, extraNote, kind) {
    const k = kindOf({ kind: kind });
    const brief = GEN_BRIEF[k.id];
    const script = (p.master.text || '').trim();
    const descs = [];
    SB.Model.eachShot(p, function (sh) {
      if (sh.description) descs.push(SB.Refs.plain(p, sh.description));
    });
    if (!script && !descs.length) {
      return Promise.reject(new Error('Nothing to work from yet — write some script or shot descriptions first.'));
    }

    const model = SB.Model.imageModel(p);
    const text = [
      'Read the script below and invent ' + count + ' ' + brief.ask + ' ' +
      (count === 1 ? brief.unit[0] : brief.unit[1]) + ' for this video.',
      '',
      'For each one return:',
      '- name: ' + brief.name,
      '- description: ' + brief.desc,
      '- imagePrompt: a single still-image prompt that would produce ' + k.refBrief +
      ', for ' + (model ? model.name : 'an image model') + '. It must obey the house style.',
      '',
      extraNote ? 'Additional direction: ' + extraNote + '\n' : '',
      script ? 'SCRIPT:\n' + script.slice(0, 12000) : '',
      descs.length ? '\n\nSHOT DESCRIPTIONS:\n- ' + descs.slice(0, 40).join('\n- ') : ''
    ].join('\n');

    /* The exemption comes after the brand, because the last word wins and the
     * brand's Finishing line would otherwise put a grade on every record. */
    const brand = SB.Brand.brandOf(p);
    const system = brand.enabled
      ? 'HOUSE STYLE\n\n' + brand.text + '\n\n' + SB.Brand.REFERENCE_RIDER
      : SB.Brand.REFERENCE_RIDER;

    return SB.Prompts.raw(text, GEN_SCHEMA, system).then(function (out) {
      const made = (out.personas || []).map(function (x) {
        return add(p, {
          kind: k.id, name: x.name, description: x.description, imagePrompt: x.imagePrompt
        });
      });
      if (!made.length) throw new Error('Nothing came back');
      return made;
    });
  }

  SB.Personas = {
    REF_TEMPLATES: REF_TEMPLATES,
    DEFAULT_REF_TEMPLATE: DEFAULT_REF_TEMPLATE,
    KINDS: KINDS, kindOf: kindOf, ofKind: ofKind, IMAGE_ADVICE: IMAGE_ADVICE,
    newPersona: newPersona, all: all, find: find, add: add, remove: remove,
    imagesOf: imagesOf, hero: hero, hasImage: hasImage,
    addImage: addImage, removeImage: removeImage, makeHero: makeHero, labelImage: labelImage,
    forShot: forShot, toggleOnShot: toggleOnShot, block: block, generate: generate,
    enters: enters, setEnters: setEnters, toggleEnters: toggleEnters,
    presentAtOpen: presentAtOpen, arriving: arriving, ARRIVAL_RE: ARRIVAL_RE,
    readsAsArrival: readsAsArrival,
    touch: touch, editedAt: editedAt, staleFor: staleFor
  };

})(window.SB);

</script>
<script>
/* ===== js/fields.js ===== */
/* fields.js — the extra text boxes a card carries, chosen per project.
 *
 * Every board wants something different under the description: art direction
 * on one, SFX on another, a client's own column on a third. The set lives in
 * the project, so it travels with the board, and the values live on the shot.
 *
 * Anything filled in is handed to the prompt writer as well — art direction
 * that only the storyboard can see is not much use.
 */
(function (SB) {
  'use strict';

  /* Ship the ones asked for, switched off until wanted. */
  function defaults() {
    return [
      { id: 'artDirection', label: 'Art direction', enabled: false, builtin: true },
      { id: 'context', label: 'Context', enabled: false, builtin: true },
      { id: 'sfx', label: 'SFX', enabled: false, builtin: true }
    ];
  }

  function all(p) {
    const s = p.settings || {};
    if (!Array.isArray(s.fields) || !s.fields.length) s.fields = defaults();
    return s.fields;
  }

  function enabled(p) {
    return all(p).filter(function (f) { return f.enabled; });
  }

  function find(p, id) {
    return all(p).filter(function (f) { return f.id === id; })[0] || null;
  }

  function add(p, label) {
    const f = {
      id: SB.uid('fld'),
      label: (label || 'New field').trim() || 'New field',
      enabled: true,
      builtin: false
    };
    all(p).push(f);
    return f;
  }

  /* Removing a field takes its text with it — the caller confirms first. */
  function remove(p, id) {
    p.settings.fields = all(p).filter(function (f) { return f.id !== id; });
    SB.Model.eachShot(p, function (sh) {
      if (sh.fields) delete sh.fields[id];
    });
  }

  function value(shot, id) {
    return (shot.fields && shot.fields[id]) || '';
  }

  function set(shot, id, text) {
    shot.fields = shot.fields || {};
    if (text) shot.fields[id] = text;
    else delete shot.fields[id];
  }

  /* ART_DIRECTION, SFX, MY_OWN_FIELD — usable in a model template. */
  function placeholder(f) {
    if (f.id === 'artDirection') return 'ART_DIRECTION';
    if (f.id === 'context') return 'CONTEXT';
    if (f.id === 'sfx') return 'SFX';
    return String(f.label || 'FIELD').toUpperCase()
      .replace(/[^A-Z0-9]+/g, '_').replace(/^_|_$/g, '') || 'FIELD';
  }

  /* A field is a description too: it can hold marks, and nothing but prose
   * ever reaches a model. */
  function plainValue(p, shot, id) {
    return SB.Refs.plain(p, value(shot, id));
  }

  function placeholders(p, shot) {
    const out = {};
    enabled(p).forEach(function (f) { out[placeholder(f)] = plainValue(p, shot, f.id); });
    return out;
  }

  /* What gets appended to a prompt request for this shot. */
  function promptBlock(p, shot) {
    const filled = enabled(p).filter(function (f) { return value(shot, f.id).trim(); });
    if (!filled.length) return '';
    return filled.map(function (f) {
      return f.label.toUpperCase() + ':\n' + plainValue(p, shot, f.id).trim();
    }).join('\n\n');
  }

  function migrate(p) {
    const s = p.settings;
    if (!Array.isArray(s.fields)) s.fields = defaults();
    s.fields = s.fields.filter(function (f) { return f && f.id; }).map(function (f) {
      return {
        id: f.id,
        label: f.label || f.id,
        enabled: !!f.enabled,
        builtin: !!f.builtin
      };
    });
    // make sure the shipped three are always offered, even in an older file
    defaults().forEach(function (d) {
      if (!s.fields.some(function (f) { return f.id === d.id; })) s.fields.push(d);
    });
  }

  SB.Fields = {
    defaults: defaults, all: all, enabled: enabled, find: find,
    add: add, remove: remove, value: value, set: set,
    placeholder: placeholder, placeholders: placeholders,
    promptBlock: promptBlock, migrate: migrate
  };

})(window.SB);

</script>
<script>
/* ===== js/model.js ===== */
/* model.js — project schema, numbering, and all structural mutations. */
(function (SB) {
  'use strict';

  const FILE_VERSION = 1;

  const DEFAULT_SHOT_TYPES = [
    'Wide', 'Medium', 'Close-up', 'Extreme close-up', 'Over the shoulder',
    'Two shot', 'Insert', 'Cutaway', 'POV', 'Screen capture', 'Talking head'
  ];

  /* The wording every board was written with, kept so a template nobody has
   * touched can be brought up to date without overwriting one somebody has. */
  const IMG_TPL_V1 =
    'Write a single first-frame still-image prompt for {{MODEL}}.\n' +
    'Shot type: {{SHOT_TYPE}}. Scene: {{SCENE}}.\n' +
    'Describe subject, setting, composition, lens, lighting and mood in one dense paragraph. ' +
    'No camera motion, no narration, no preamble.\n\n' +
    'SHOT DESCRIPTION:\n{{DESCRIPTION}}';

  const IMG_TPL =
    'Write a single first-frame still-image prompt for {{MODEL}}.\n' +
    'Shot type: {{SHOT_TYPE}}. Scene: {{SCENE}}.\n' +
    'The description below is a short sequence. You are writing only its FIRST INSTANT — the ' +
    'state of things as the shot opens, before anything it says happens next has happened. ' +
    'Anyone or anything described as arriving, entering or appearing later is not in this frame.\n' +
    'Describe subject, setting, composition, lens, lighting and mood in one dense paragraph. ' +
    'No camera motion, no narration, no preamble.\n\n' +
    'SHOT DESCRIPTION:\n{{DESCRIPTION}}';

  const VID_TPL =
    'Write a single image-to-video prompt for {{MODEL}}, starting from the first frame described below.\n' +
    'Shot type: {{SHOT_TYPE}}. Scene: {{SCENE}}.\n' +
    'Describe only what MOVES: subject action, camera move, pacing, and how the shot ends. ' +
    'Keep it one paragraph, no preamble.\n\n' +
    'SHOT DESCRIPTION:\n{{DESCRIPTION}}';

  /* MiniMax H3 does not take a paragraph. Its published prompt guide
   * (VIDEO_PROMPT_WRITING_GUIDE_ref_en.md) specifies a six-section rewrite with
   * its own reference labels, relationship markers and shot syntax; a prose
   * prompt is simply the wrong shape for it. Everything below is that format. */
  const H3_VID_TPL =
    'Write a single image-to-video prompt for {{MODEL}}, starting from the first frame described below.\n' +
    'H3 takes a full-reference rewrite, NOT a paragraph. Emit exactly these six sections, ' +
    'in this order, each introduced on its own line as "name:" followed by its content:\n' +
    '  subject_definitions, summary, retention_analysis, detailed_description, ' +
    'overall_soundscape, non_diegetic_music\n\n' +
    'FORMAT RULES\n' +
    '- English throughout. Keep dialogue and lyrics in their original language inside ' +
    '<d>[Language] ...</d>, and keep visible on-screen text as it reads.\n' +
    '- Reference labels: <Subject N> for reusable visible content (a person, a place, a ' +
    'costume, a prop, a style, an action), <Picture N> for an image used as a concrete frame ' +
    'or composition anchor, <Video N> for a source video, <Audio N> for a copied or referenced ' +
    'audio signal. The supplied first frame is <Picture 1>. Define each label once in ' +
    'subject_definitions, then reuse it unchanged everywhere after. An image that only ' +
    'establishes a character, wardrobe or style gets no <Picture N> line of its own — cite it ' +
    'inside that <Subject N> definition instead.\n' +
    '- summary: one short paragraph opening with a bracketed task type. A supplied first frame ' +
    'is [keyframe completion]; add reference generation when character or style references are ' +
    'also supplied. Join multiple types with " + " and never repeat one. Introduce no new labels here.\n' +
    '- retention_analysis: one line per label, e.g. "<Subject 1> (appears in [Shot 1]): ' +
    'fully_preserved - ...". Visible content uses fully_preserved, partially_preserved, ' +
    'attribute_transfer or weak_reference; audio uses fully_copy, partially_copy, reference or ' +
    'weak_reference. Never write a speaker ID in this section.\n' +
    '- detailed_description: one or two sentences of style FIRST, then the shots in playback ' +
    'order. [Shot 1] carries no timestamp; each later shot opens "[Shot N] At MM:SS.mmm, ...". ' +
    'Treat this as one continuous shot unless the description below calls for a cut. State that ' +
    'the shot begins from <Picture 1>, then give composition, subject appearance and position, ' +
    'environment and lighting, the action and every state change, the camera move (type, ' +
    'amplitude and speed, written as natural English), the sound, and the moment each reference ' +
    'takes effect. 350-500 words. Do not reduce it to a plot summary or a list of reference ' +
    'relationships.\n' +
    '- Speakers take stable IDs in the order they first speak: "<Subject 2> (S1) turns and says, ' +
    '<d>[English] ...</d>". Mark unseen speech off-screen. Use <scenetrans> for dialogue carrying ' +
    'across a cut and <cutoff> for a line the shot ends on.\n' +
    '- overall_soundscape: ambience and physical sound across the whole clip. ' +
    'non_diegetic_music: audience-only score — instrumentation, tempo, dynamics — or N/A. ' +
    'Neither section repeats dialogue or lyrics.\n' +
    '- No preamble, no commentary, no markdown fences.\n\n' +
    'Shot type: {{SHOT_TYPE}}. Scene: {{SCENE}}.\n\n' +
    'SHOT DESCRIPTION:\n{{DESCRIPTION}}';

  const H3_REF_TPL =
    'Reference images are supplied in order. Give each recurring subject its own <Subject N> ' +
    'line in subject_definitions, citing the image it comes from ("<Subject 1> is the woman in ' +
    'reference image {{N}}, with ..."), and keep face, hair and wardrobe exactly as in that ' +
    'image. Reuse the same <Subject N> label in summary, retention_analysis and ' +
    'detailed_description. Named subjects: {{NAME}}.';

  /* Templates a specific model needs instead of the generic pair, keyed by the
   * name it ships under in defaultModels(). */
  const MODEL_TPLS = {
    'MiniMax H3 (Hailuo)': { video: H3_VID_TPL, reference: H3_REF_TPL }
  };

  function tplsFor(name) {
    const o = MODEL_TPLS[name] || {};
    return {
      image: o.image || IMG_TPL,
      video: o.video || VID_TPL,
      reference: typeof o.reference === 'string' ? o.reference : SB.Personas.DEFAULT_REF_TEMPLATE
    };
  }

  function model(name, kind) {
    const t = tplsFor(name);
    return {
      id: SB.uid('m'), name: name, kind: kind,
      imageTemplate: t.image, videoTemplate: t.video,
      referenceTemplate: t.reference
    };
  }

  function defaultModels() {
    return [
      model('Wan', 'video'), model('LTX (LTXV 2.3)', 'video'), model('Veo', 'video'),
      model('Kling', 'video'), model('Sora', 'video'), model('Runway', 'video'),
      model('MiniMax H3 (Hailuo)', 'video'), model('Seedance', 'video'),
      model('Flux 3', 'video'),
      model('Nano Banana (Gemini Image)', 'image'), model('Qwen-Image', 'image'),
      model('FLUX', 'image'), model('GPT Image', 'image'), model('Imagen', 'image'),
      model('Ideogram', 'image'), model('Midjourney', 'image')
    ];
  }

  /* Mid-tone hues, each legible as a card edge on both the light and dark board. */
  const CARD_COLORS = [
    '#6b7280', // slate
    '#3b82f6', // blue
    '#0891b2', // cyan
    '#0d9488', // teal
    '#16a34a', // green
    '#ca8a04', // gold
    '#ea580c', // orange
    '#dc2626', // red
    '#db2777', // pink
    '#7c3aed'  // violet
  ];

  function newShot(opts) {
    opts = opts || {};
    return {
      id: SB.uid('sh'),
      type: opts.type || '',
      noShot: !!opts.noShot,
      color: opts.color || CARD_COLORS[0],
      link: opts.link || null,          // {from,to} into master, or null = freestanding
      local: opts.link ? null : SB.Doc.make(opts.text || ''),
      personaIds: [],                   // who appears in this shot
      /* ...and which of them are not there yet when it opens. A first frame is
       * one instant, so somebody who walks in during the shot must not be drawn
       * standing in it. A subset of personaIds, never anything else. */
      castEnters: [],
      broken: false,
      description: '',
      fields: {},                       // extra text boxes, keyed by field id
      image: null,                      // {ref,w,h} into project.blobs
      annotation: null,                 // {ref} — transparent PNG overlay
      /* {serial,ext,bytes,at} — where the full-size original of this frame
       * lives in the renders folder. The board keeps only the proxy; this is
       * the pointer to the real thing, and it rides with the content. */
      render: null,
      comments: [],
      prompts: {}                       // modelName -> {imagePrompt, videoPrompt}
    };
  }

  /* A scene can claim a stretch of the master script of its own — the loose,
   * early pass, before anyone knows what the shots are. It is independent of
   * whatever its shots point at: they may overlap it, or sit outside it, or not
   * exist yet. Unlike a shot, a scene starts with NO script at all — an empty
   * local doc here would have every scene claiming to have one. */
  /* A new scene has no name.
   *
   * It used to be called "Scene 3", which is true exactly until somebody drags
   * it — and then the board has a scene called "Scene 3" sitting second, which
   * is worse than no name at all. The number is where a scene SITS: the
   * navigator, the banner, the organizer and the prompt table all draw it from
   * the position, so it is right by construction and never has to be kept in
   * step. What the heading is for is what the scene IS. */
  function newScene(heading) {
    return {
      id: SB.uid('sc'),
      heading: heading || '',
      description: '',
      link: null,          // {from,to} into master
      local: null,         // its own doc once the link is broken; null = untied
      broken: false,
      shots: []
    };
  }

  /* How this board prints. Kept in the file rather than in localStorage so a
   * board carries its own print setup wherever it is opened. The preset ids
   * belong to SB.Pdf.PRESETS, but this default is spelled out here so model.js
   * stays loadable without pdf.js (the node tests load neither). */
  function defaultExport() {
    return {
      preset: 'sheet6',
      showType: true,
      showScript: true,
      showDesc: true,
      showSceneHeading: true,   // scene name on each card's meta line
      sceneBanner: false,       // heading + description as a band where a scene starts
      scenePageBreak: false,    // each scene starts a fresh sheet
      color: 'accent',          // 'off' | 'accent' — carry shot.color onto paper
      footer: true              // name · version · page N of M
    };
  }

  function firstOfKind(models, kind) {
    const m = models.filter(function (x) { return x.kind === kind; })[0] || models[0];
    return m ? m.id : null;
  }

  function newProject() {
    const p = {
      fileVersion: FILE_VERSION,
      id: SB.uid('prj'),
      name: 'Untitled project',
      createdAt: Date.now(),
      updatedAt: Date.now(),
      master: SB.Doc.make(''),
      blobs: {},                        // hash -> data URL; images live here once
      scriptComments: [],               // notes anchored to ranges of the master
      personas: [],
      /* High-water mark for render serials. Only ever goes up: a number
       * belonging to a deleted shot is never handed out again, so a file that
       * has already left the app never comes to mean something else. */
      renderSeq: 0,
      scenes: [newScene()],
      versionNumber: 1,
      versionName: 'v1',
      versions: [],
      settings: {
        shotTypes: DEFAULT_SHOT_TYPES.slice(),
        fields: SB.Fields.defaults(),
        models: defaultModels(),
        imageModelId: null,
        videoModelId: null,
        aiProvider: 'gemini',
        geminiModel: SB.GeminiModels.DEFAULT,
        brand: { enabled: true, custom: false },
        // prompt boxes stay off the cards until the user asks for them
        showImagePrompt: false,
        showVideoPrompt: false,
        export: defaultExport()
      }
    };
    p.settings.imageModelId = firstOfKind(p.settings.models, 'image');
    p.settings.videoModelId = firstOfKind(p.settings.models, 'video');
    p.scenes[0].shots.push(newShot({ type: DEFAULT_SHOT_TYPES[0] }));
    return p;
  }

  /* Boards written before the fold were saved with the CRs still in them, and
   * their links are already anchored against those longer offsets. Folding the
   * text without dragging every anchor through the same map would move each
   * card's text instead of repairing it, so both happen together.
   * `core` is {master, scenes, scriptComments} — the shape of a project and of
   * a frozen version alike, so a restore does not bring the CRs back. */
  function foldLineEndings(core) {
    if (!core || !core.master || typeof core.master.text !== 'string') return;
    const at = SB.Doc.foldEOL(core.master);
    if (at) {
      (core.scenes || []).forEach(function (sc) {
        if (sc && sc.link && typeof sc.link.from === 'number') {
          sc.link.from = at(sc.link.from);
          sc.link.to = at(sc.link.to);
          if (sc.link.to <= sc.link.from) sc.broken = true;
        }
        (sc.shots || []).forEach(function (sh) {
          if (!sh || !sh.link || typeof sh.link.from !== 'number') return;
          sh.link.from = at(sh.link.from);
          sh.link.to = at(sh.link.to);
          if (sh.link.to <= sh.link.from) sh.broken = true;
        });
      });
      (core.scriptComments || []).forEach(function (c) {
        c.from = at(c.from);
        c.to = at(c.to);
        c.quote = SB.Doc.eol(c.quote);
        if (c.to <= c.from) c.broken = true;
      });
    }
    /* A freestanding card or scene owns its own text, with no anchors into it. */
    (core.scenes || []).forEach(function (sc) {
      if (sc && !sc.link && sc.local) SB.Doc.foldEOL(sc.local);
      (sc.shots || []).forEach(function (sh) {
        if (sh && !sh.link && sh.local) SB.Doc.foldEOL(sh.local);
      });
    });
  }

  /* A render record, or null. The serial is a filename on somebody's disk and
   * the promise that a number is never reused, so anything that is not a whole
   * positive number is not one: "abc" padded to 0000, and two such records
   * collided on the same file. */
  function goodRender(r) {
    if (!r) return null;
    const n = typeof r.serial === 'number' ? r.serial : parseFloat(r.serial);
    if (!isFinite(n) || n < 1 || Math.floor(n) !== n) return null;
    r.serial = n;
    return r;
  }

  /* One recurring subject, brought up to date.
   *
   * Two things moved after the first boards were written: a subject is now a
   * person, a place or a thing, and it carries several reference frames rather
   * than one. Boards predating either are the common case — everything ever
   * written as a persona is a person, and its lone `image` becomes the first
   * frame. Frozen version snapshots come through here too, so nothing
   * downstream has to know which era a record was written in. */
  function migratePersona(p, x) {
    x.id = x.id || SB.uid('per');
    x.kind = SB.Personas.kindOf(x).id;
    x.name = x.name || 'Persona';
    x.description = x.description || '';
    x.imagePrompt = x.imagePrompt || '';
    /* Left at 0 when a board predates the stamp: unknown, not "just edited",
     * so no card is falsely flagged as behind. */
    x.updatedAt = typeof x.updatedAt === 'number' ? x.updatedAt : 0;

    const imgs = Array.isArray(x.images) ? x.images.slice() : [];
    if (x.image) imgs.unshift(x.image);
    delete x.image;
    x.images = imgs.map(function (img) {
      const a = SB.Blobs.adopt(p, img);
      if (!a) return null;
      a.label = typeof img.label === 'string' ? img.label : (a.label || '');
      a.render = goodRender(img.render) || goodRender(a.render);
      if (a.render) p.renderSeq = Math.max(p.renderSeq | 0, a.render.serial);
      return a;
    }).filter(Boolean);
  }

  /* Fill in anything an older/hand-edited file is missing. */
  function migrate(p) {
    if (!p || typeof p !== 'object') throw new Error('not a Storyboarder project');
    p.fileVersion = FILE_VERSION;
    p.id = p.id || SB.uid('prj');
    p.name = p.name || 'Untitled project';
    p.createdAt = p.createdAt || Date.now();
    p.master = p.master && typeof p.master.text === 'string' ? p.master : SB.Doc.make('');
    p.master.marks = p.master.marks || { b: [], i: [], u: [] };
    ['b', 'i', 'u'].forEach(function (t) { p.master.marks[t] = p.master.marks[t] || []; });
    /* Images used to sit inline on each shot, which meant every version froze
     * its own copy of every frame. They are now stored once under a hash. */
    p.blobs = (p.blobs && typeof p.blobs === 'object') ? p.blobs : {};

    p.scriptComments = Array.isArray(p.scriptComments) ? p.scriptComments : [];
    p.scriptComments.forEach(function (c) {
      c.id = c.id || SB.uid('sc');
      c.from = SB.clamp(c.from | 0, 0, p.master.text.length);
      c.to = SB.clamp(c.to | 0, c.from, p.master.text.length);
      c.text = c.text || '';
      c.quote = c.quote || '';
      c.at = c.at || Date.now();
      c.broken = !!c.broken || c.to <= c.from;
    });
    p.personas = Array.isArray(p.personas) ? p.personas : [];
    p.personas.forEach(function (x) { migratePersona(p, x); });
    p.scenes = Array.isArray(p.scenes) ? p.scenes : [];
    /* "Scene 3" sitting second is a number somebody never typed and cannot be
     * kept true. Only the app's own defaults are cleared — anything a person
     * actually wrote is theirs, whatever it says. */
    p.scenes.forEach(function (sc) {
      if (sc && /^scene (?:\d+|one)$/i.test(String(sc.heading || '').trim())) sc.heading = '';
    });
    if (!p.scenes.length) p.scenes.push(newScene());
    p.renderSeq = Math.max(p.renderSeq | 0, 0);
    p.versionNumber = p.versionNumber || 1;
    p.versionName = p.versionName || ('v' + p.versionNumber);
    p.versions = Array.isArray(p.versions) ? p.versions : [];
    /* Frozen versions carried their own copy of every frame — the same bytes
     * hash to the same reference, so migrating them collapses the duplicates. */
    p.versions.forEach(function (v) {
      if (!v || !v.snapshot) return;
      /* Versions written before the cast froze with them hold cards that name
       * subjects the snapshot never carried. What that cast looked like at the
       * time is not recorded anywhere and cannot be recovered — so the closest
       * true thing is used: the cast as it stands now. That keeps every
       * restored card's personaIds resolvable, and keeps the reference frames
       * referenced, which is what stopped them being collected as orphans.
       * A snapshot that already has its own cast is left alone. */
      if (!Array.isArray(v.snapshot.personas)) {
        v.snapshot.personas = SB.clone(p.personas);
      }
      (v.snapshot.scenes || []).forEach(function (sc) {
        (sc.shots || []).forEach(function (sh) {
          /* the arrival marks are a subset of the cast here too */
          sh.render = goodRender(sh.render);
        if (sh.render) p.renderSeq = Math.max(p.renderSeq | 0, sh.render.serial);
        sh.personaIds = Array.isArray(sh.personaIds) ? sh.personaIds : [];
          sh.castEnters = (Array.isArray(sh.castEnters) ? sh.castEnters : [])
            .filter(function (id) { return sh.personaIds.indexOf(id) >= 0; });
          sh.image = SB.Blobs.adopt(p, sh.image);
          sh.annotation = SB.Blobs.adopt(p, sh.annotation);
        });
      });
      (v.snapshot.personas || []).forEach(function (per) { migratePersona(p, per); });
    });
    const s = p.settings = p.settings || {};
    s.shotTypes = (s.shotTypes && s.shotTypes.length) ? s.shotTypes : DEFAULT_SHOT_TYPES.slice();
    SB.Fields.migrate(p);
    s.models = (s.models && s.models.length) ? s.models : defaultModels();
    /* The MiniMax entry shipped under its platform name with the generic
     * templates. Rename it and hand it the H3 format — but only where the
     * templates are still untouched, so an edited one stays the user's. */
    s.models.forEach(function (m) {
      if (m.name !== 'Hailuo (MiniMax)') return;
      m.name = 'MiniMax H3 (Hailuo)';
      const t = tplsFor(m.name);
      if (!m.videoTemplate || m.videoTemplate === VID_TPL) m.videoTemplate = t.video;
      if (typeof m.referenceTemplate !== 'string' ||
          m.referenceTemplate === SB.Personas.DEFAULT_REF_TEMPLATE) {
        m.referenceTemplate = t.reference;
      }
    });
    s.modelSeeds = (s.modelSeeds || []).map(function (n) {
      return n === 'Hailuo (MiniMax)' ? 'MiniMax H3 (Hailuo)' : n;
    });

    /* A first frame is one instant, and the old template never said so — it
     * called the job a first-frame prompt and then handed over a paragraph in
     * which three things happen. Boards carry their own copy of that wording,
     * so it is replaced here; anything edited by hand is left exactly alone. */
    s.models.forEach(function (m) {
      if (m.imageTemplate === IMG_TPL_V1) m.imageTemplate = IMG_TPL;
    });

    s.models.forEach(function (m) {
      m.id = m.id || SB.uid('m');
      m.kind = m.kind || 'video';
      const t = tplsFor(m.name);
      m.imageTemplate = m.imageTemplate || t.image;
      m.videoTemplate = m.videoTemplate || t.video;
      if (typeof m.referenceTemplate !== 'string') {
        m.referenceTemplate = t.reference;
      }
    });
    /* A board keeps its own model list, so a model added to the app later
     * would never reach an existing project. Offer each shipped model once:
     * after that it is recorded, so one you delete stays deleted. */
    s.modelSeeds = Array.isArray(s.modelSeeds) ? s.modelSeeds : [];
    defaultModels().forEach(function (d) {
      if (s.modelSeeds.indexOf(d.name) >= 0) return;
      s.modelSeeds.push(d.name);
      if (!s.models.some(function (m) { return m.name === d.name; })) s.models.push(d);
    });

    const has = function (id) { return s.models.some(function (m) { return m.id === id; }); };
    // older files carried a single activeModelId
    if (s.activeModelId && has(s.activeModelId)) {
      const old = s.models.filter(function (m) { return m.id === s.activeModelId; })[0];
      if (old.kind === 'image' && !s.imageModelId) s.imageModelId = old.id;
      if (old.kind === 'video' && !s.videoModelId) s.videoModelId = old.id;
    }
    delete s.activeModelId;
    if (!has(s.imageModelId)) s.imageModelId = firstOfKind(s.models, 'image');
    if (!has(s.videoModelId)) s.videoModelId = firstOfKind(s.models, 'video');
    // Google retires ids; move a project off anything that is gone
    s.geminiModel = SB.GeminiModels.normalize(s.geminiModel);
    /* Every board written before the local-model option existed was a Gemini
     * board, and normalize() says so for anything unrecognised too. */
    s.aiProvider = SB.Providers.normalize(s.aiProvider);
    s.brand = (s.brand && typeof s.brand === 'object') ? s.brand : {};
    if (typeof s.brand.enabled !== 'boolean') s.brand.enabled = true;
    // only a hand-edited house style is stored; the rest follow the app's
    if (typeof s.brand.custom !== 'boolean') s.brand.custom = false;
    if (!s.brand.custom) delete s.brand.text;
    if (typeof s.showImagePrompt !== 'boolean') s.showImagePrompt = false;
    if (typeof s.showVideoPrompt !== 'boolean') s.showVideoPrompt = false;
    /* Fill each export key on its own: a file written by an older build has
     * some of them, and replacing the whole object would throw away the
     * preset the user chose. */
    const dx = defaultExport();
    s.export = (s.export && typeof s.export === 'object') ? s.export : {};
    Object.keys(dx).forEach(function (k) {
      if (typeof s.export[k] !== typeof dx[k]) s.export[k] = dx[k];
    });

    p.scenes.forEach(function (sc) {
      sc.id = sc.id || SB.uid('sc');
      sc.heading = sc.heading || '';
      sc.description = sc.description || '';
      /* An older board has no section on any scene, and must not be given one:
       * untied is the resting state, so only what is already there is kept. */
      sc.link = sc.link && typeof sc.link.from === 'number' ? sc.link : null;
      if (sc.link) {
        sc.link.from = SB.clamp(sc.link.from, 0, p.master.text.length);
        sc.link.to = SB.clamp(sc.link.to, sc.link.from, p.master.text.length);
        sc.local = null;
      } else if (sc.local && typeof sc.local.text === 'string') {
        sc.local.marks = sc.local.marks || { b: [], i: [], u: [] };
        ['b', 'i', 'u'].forEach(function (t) { sc.local.marks[t] = sc.local.marks[t] || []; });
      } else {
        sc.local = null;
      }
      sc.broken = !!sc.broken;
      sc.shots = Array.isArray(sc.shots) ? sc.shots : [];
      sc.shots.forEach(function (sh) {
        sh.id = sh.id || SB.uid('sh');
        sh.type = sh.type || '';
        sh.noShot = !!sh.noShot;
        sh.color = sh.color || CARD_COLORS[0];
        sh.link = sh.link && typeof sh.link.from === 'number' ? sh.link : null;
        if (!sh.link) {
          sh.local = sh.local && typeof sh.local.text === 'string' ? sh.local : SB.Doc.make('');
          sh.local.marks = sh.local.marks || { b: [], i: [], u: [] };
          ['b', 'i', 'u'].forEach(function (t) { sh.local.marks[t] = sh.local.marks[t] || []; });
        } else {
          sh.link.from = SB.clamp(sh.link.from, 0, p.master.text.length);
          sh.link.to = SB.clamp(sh.link.to, sh.link.from, p.master.text.length);
        }
        sh.broken = !!sh.broken;
        sh.description = sh.description || '';
        sh.fields = (sh.fields && typeof sh.fields === 'object') ? sh.fields : {};
        sh.comments = Array.isArray(sh.comments) ? sh.comments : [];
        sh.prompts = sh.prompts || {};
        sh.render = goodRender(sh.render);
        if (sh.render) p.renderSeq = Math.max(p.renderSeq | 0, sh.render.serial);
        sh.personaIds = Array.isArray(sh.personaIds) ? sh.personaIds : [];
        /* Empty for every board written before this, which is the right answer:
           nobody was marked as arriving, so everybody was already there. */
        sh.castEnters = (Array.isArray(sh.castEnters) ? sh.castEnters : [])
          .filter(function (id) { return sh.personaIds.indexOf(id) >= 0; });
        sh.image = SB.Blobs.adopt(p, sh.image);
        sh.annotation = SB.Blobs.adopt(p, sh.annotation);
      });
    });

    /* Last, so it works on shots and comments that are already well-formed. */
    foldLineEndings(p);
    p.versions.forEach(function (v) { if (v && v.snapshot) foldLineEndings(v.snapshot); });
    return p;
  }

  /* ---------- lookup / numbering ---------- */

  function eachShot(p, fn) {
    for (let i = 0; i < p.scenes.length; i++) {
      const sc = p.scenes[i];
      for (let j = 0; j < sc.shots.length; j++) fn(sc.shots[j], sc, i, j);
    }
  }

  function code(sceneIdx, shotIdx) { return (sceneIdx + 1) + SB.letters(shotIdx); }

  function findShot(p, id) {
    let res = null;
    eachShot(p, function (sh, sc, i, j) {
      if (sh.id === id) res = { shot: sh, scene: sc, sceneIdx: i, shotIdx: j, code: code(i, j) };
    });
    return res;
  }

  function findScene(p, id) {
    for (let i = 0; i < p.scenes.length; i++) if (p.scenes[i].id === id) return { scene: p.scenes[i], idx: i };
    return null;
  }

  /* ---------- the shared-script window ---------- */

  /* What document + slice does this shot's script box show? */
  function windowFor(p, shot) {
    if (shot.link) return { doc: p.master, from: shot.link.from, to: shot.link.to, linked: true };
    return { doc: shot.local, from: 0, to: shot.local.text.length, linked: false };
  }

  /* The same for a scene — null when it has claimed nothing, which is where
   * most scenes stay, so every caller has to be ready for it. */
  function windowForScene(p, scene) {
    if (!scene) return null;
    if (scene.link) return { doc: p.master, from: scene.link.from, to: scene.link.to, linked: true };
    if (scene.local) return { doc: scene.local, from: 0, to: scene.local.text.length, linked: false };
    return null;
  }

  function sceneTied(scene) { return !!(scene && (scene.link || scene.local)); }

  /* The one place master-script text changes.
   * sourceShotId  = the shot whose box the user typed in (null = typed in master).
   * sourceSceneId = likewise for a scene's own section box.
   */
  function applyMasterEdit(p, start, end, text, sourceShotId, sourceSceneId) {
    if (SB.History) SB.History.push('master:' + (sourceShotId || ''));
    /* Fold before op.len is taken, not inside Doc.replace: every anchor below
     * is mapped through that length, so measuring the un-folded string would
     * push each link one character further right per pasted line. */
    text = SB.Doc.eol(text);
    const op = { start: start, end: end, len: (text || '').length };
    const links = [];
    eachShot(p, function (sh) { if (sh.link) links.push(sh); });

    links.forEach(function (sh) {
      let fromLeft, toLeft;
      if (sh.id === sourceShotId) {
        // the shot being typed in grows at both edges
        fromLeft = true; toLeft = false;
      } else if (!sourceShotId) {
        // typed in master: text at a shot's end boundary extends that shot
        fromLeft = false; toLeft = false;
      } else {
        // another shot's edit: only interior insertions grow this one
        fromLeft = false; toLeft = true;
      }
      const nf = SB.Doc.mapPos(sh.link.from, start, end, op.len, fromLeft);
      const nt = SB.Doc.mapPos(sh.link.to, start, end, op.len, toLeft);
      sh.link.from = Math.min(nf, nt);
      sh.link.to = Math.max(nf, nt);
      if (sh.link.to <= sh.link.from) sh.broken = true;
      else if (sh.broken && sh.link.to > sh.link.from) sh.broken = false;
    });

    /* A scene's claim is a coarse container: text typed against either edge in
     * the master belongs to the section, and typing inside the scene's own box
     * grows it at both edges the way a shot's box does. */
    p.scenes.forEach(function (sc) {
      if (!sc.link) return;
      const own = sc.id === sourceSceneId;
      const nf = SB.Doc.mapPos(sc.link.from, start, end, op.len, own ? true : false);
      const nt = SB.Doc.mapPos(sc.link.to, start, end, op.len, false);
      sc.link.from = Math.min(nf, nt);
      sc.link.to = Math.max(nf, nt);
      if (sc.link.to <= sc.link.from) sc.broken = true;
      else if (sc.broken && sc.link.to > sc.link.from) sc.broken = false;
    });

    /* A note on a phrase should not swallow text typed against its edges, so
     * neither end grows; if the phrase itself is deleted the note is flagged
     * rather than vanishing with it. */
    (p.scriptComments || []).forEach(function (c) {
      const nf = SB.Doc.mapPos(c.from, start, end, op.len, false);
      const nt = SB.Doc.mapPos(c.to, start, end, op.len, true);
      c.from = Math.min(nf, nt);
      c.to = Math.max(nf, nt);
      if (c.to <= c.from) c.broken = true;
      else if (c.broken) c.broken = false;
    });

    SB.Doc.replace(p.master, start, end, text);
    p.updatedAt = Date.now();
    return op;
  }

  /* Edit routed from a shot's own script box (local coords). */
  function applyShotEdit(p, shot, lStart, lEnd, text) {
    text = SB.Doc.eol(text);
    if (shot.link) {
      return applyMasterEdit(p, shot.link.from + lStart, shot.link.from + lEnd, text, shot.id);
    }
    if (SB.History) SB.History.push('local:' + shot.id);
    SB.Doc.replace(shot.local, lStart, lEnd, text);
    p.updatedAt = Date.now();
    return { start: lStart, end: lEnd, len: (text || '').length };
  }

  function breakLink(p, shot) {
    if (!shot.link) return;
    if (SB.History) { SB.History.seal(); SB.History.push('break:' + shot.id); SB.History.seal(); }
    const w = windowFor(p, shot);
    shot.local = {
      text: p.master.text.slice(w.from, w.to),
      marks: SB.Doc.sliceMarks(p.master, w.from, w.to)
    };
    shot.link = null;
    shot.broken = false;
    p.updatedAt = Date.now();
  }

  /* ---------- a scene's own section of the script ---------- */

  /* Edit routed from a scene's section box (local coords). */
  function applySceneEdit(p, scene, lStart, lEnd, text) {
    text = SB.Doc.eol(text);
    if (scene.link) {
      return applyMasterEdit(p, scene.link.from + lStart, scene.link.from + lEnd,
        text, null, scene.id);
    }
    if (!scene.local) return null;
    if (SB.History) SB.History.push('scenelocal:' + scene.id);
    SB.Doc.replace(scene.local, lStart, lEnd, text);
    p.updatedAt = Date.now();
    return { start: lStart, end: lEnd, len: text.length };
  }

  function breakSceneLink(p, scene) {
    if (!scene.link) return;
    if (SB.History) { SB.History.seal(); SB.History.push('scenebreak:' + scene.id); SB.History.seal(); }
    const w = windowForScene(p, scene);
    scene.local = {
      text: p.master.text.slice(w.from, w.to),
      marks: SB.Doc.sliceMarks(p.master, w.from, w.to)
    };
    scene.link = null;
    scene.broken = false;
    p.updatedAt = Date.now();
  }

  /* Claim [from,to) of the master for a scene. `widen` keeps whatever the scene
   * already had and stretches to cover both, which is how a section gets claimed
   * a paragraph at a time. */
  function tieScene(p, sceneId, from, to, widen) {
    const f = findScene(p, sceneId);
    if (!f) return null;
    from = SB.clamp(from | 0, 0, p.master.text.length);
    to = SB.clamp(to | 0, from, p.master.text.length);
    if (to <= from) return null;
    if (widen && f.scene.link && !f.scene.broken) {
      from = Math.min(from, f.scene.link.from);
      to = Math.max(to, f.scene.link.to);
    }
    f.scene.link = { from: from, to: to };
    f.scene.local = null;
    f.scene.broken = false;
    p.updatedAt = Date.now();
    return f.scene;
  }

  /* Give the section back — the scene keeps its heading, description and shots.
   * A shot cannot do this; a scene with no script is the normal state. */
  function untieScene(p, sceneId) {
    const f = findScene(p, sceneId);
    if (!f) return null;
    f.scene.link = null;
    f.scene.local = null;
    f.scene.broken = false;
    p.updatedAt = Date.now();
    return f.scene;
  }

  /* ---------- notes on the script ---------- */

  function addScriptComment(p, from, to, text) {
    from = SB.clamp(from | 0, 0, p.master.text.length);
    to = SB.clamp(to | 0, from, p.master.text.length);
    if (to <= from) return null;
    const c = {
      id: SB.uid('scm'),
      from: from, to: to,
      quote: p.master.text.slice(from, to),
      text: text || '',
      at: Date.now(),
      broken: false
    };
    p.scriptComments = p.scriptComments || [];
    p.scriptComments.push(c);
    p.updatedAt = Date.now();
    return c;
  }

  function deleteScriptComment(p, id) {
    p.scriptComments = (p.scriptComments || []).filter(function (c) { return c.id !== id; });
    p.updatedAt = Date.now();
  }

  function scriptComments(p) {
    return (p.scriptComments || []).slice().sort(function (a, b) {
      return a.from - b.from || a.at - b.at;
    });
  }

  /* how many notes cover each master character (for the underline layer) */
  function commentCoverage(p) {
    const n = p.master.text.length;
    const d = new Uint8Array(n);
    (p.scriptComments || []).forEach(function (c) {
      if (c.broken) return;
      for (let i = c.from; i < c.to && i < n; i++) if (d[i] < 250) d[i]++;
    });
    return d;
  }

  /* how many shots cover each master character (for the highlight underlay) */
  function coverage(p) {
    const n = p.master.text.length;
    const d = new Uint8Array(n);
    eachShot(p, function (sh) {
      if (!sh.link) return;
      for (let i = sh.link.from; i < sh.link.to && i < n; i++) if (d[i] < 250) d[i]++;
    });
    return d;
  }

  /* How many scenes claim each master character. The loose layer: this is what
   * says a stretch of script is spoken for before any shot exists. */
  function sceneCoverage(p) {
    const n = p.master.text.length;
    const d = new Uint8Array(n);
    p.scenes.forEach(function (sc) {
      if (!sc.link || sc.broken) return;
      for (let i = sc.link.from; i < sc.link.to && i < n; i++) if (d[i] < 250) d[i]++;
    });
    return d;
  }

  /* What share of the script any scene has claimed, 0..1 — the answer to "have
   * I covered it all yet?" without counting spans by eye. */
  function sceneCoverageShare(p) {
    const d = sceneCoverage(p);
    if (!d.length) return 0;
    let hit = 0;
    for (let i = 0; i < d.length; i++) if (d[i]) hit++;
    return hit / d.length;
  }

  /* ---------- structure ---------- */

  function addScene(p, afterIdx) {
    const sc = newScene();
    if (typeof afterIdx === 'number') p.scenes.splice(afterIdx + 1, 0, sc);
    else p.scenes.push(sc);
    p.updatedAt = Date.now();
    return sc;
  }

  function deleteScene(p, sceneId) {
    const f = findScene(p, sceneId);
    if (!f) return;
    p.scenes.splice(f.idx, 1);
    if (!p.scenes.length) p.scenes.push(newScene());
    p.updatedAt = Date.now();
  }

  function addShot(p, sceneId, opts, atIdx) {
    const f = findScene(p, sceneId);
    if (!f) return null;
    const sh = newShot(Object.assign({ type: p.settings.shotTypes[0] || '' }, opts || {}));
    if (typeof atIdx === 'number') f.scene.shots.splice(atIdx, 0, sh);
    else f.scene.shots.push(sh);
    p.updatedAt = Date.now();
    return sh;
  }

  /* Deleting a shot leaves its text in the master script (resolved decision #2). */
  function deleteShot(p, shotId) {
    const f = findShot(p, shotId);
    if (!f) return;
    f.scene.shots.splice(f.shotIdx, 1);
    p.updatedAt = Date.now();
  }

  /* Everything that belongs to the PICTURE rather than to the place in the
   * script. The script window, whether it is linked or freestanding, and the
   * "no shot" flag all describe the fragment of script this card sits on, so
   * they stay behind when the imagery moves. */
  const CONTENT_KEYS = [
    'type', 'color', 'image', 'annotation', 'description',
    'fields', 'prompts', 'personaIds', 'castEnters', 'comments', 'render'
  ];

  /* Swap two shots' contents, leaving each card's dialogue where it is. */
  function swapShotContent(p, aId, bId) {
    const fa = findShot(p, aId), fb = findShot(p, bId);
    if (!fa || !fb || aId === bId) return null;
    CONTENT_KEYS.forEach(function (k) {
      const tmp = fa.shot[k];
      fa.shot[k] = fb.shot[k];
      fb.shot[k] = tmp;
    });
    p.updatedAt = Date.now();
    return { a: fa.code, b: fb.code };
  }

  function moveShot(p, shotId, toSceneId, toIdx) {
    const f = findShot(p, shotId);
    const t = findScene(p, toSceneId);
    if (!f || !t) return;
    f.scene.shots.splice(f.shotIdx, 1);
    if (f.scene === t.scene && toIdx > f.shotIdx) toIdx--;
    toIdx = SB.clamp(toIdx, 0, t.scene.shots.length);
    t.scene.shots.splice(toIdx, 0, f.shot);
    p.updatedAt = Date.now();
  }

  /* Move several shots at once, keeping the order they had on the board. */
  function moveShots(p, ids, toSceneId, toIdx) {
    const t = findScene(p, toSceneId);
    if (!t || !ids || !ids.length) return;
    const order = [];
    eachShot(p, function (sh) { if (ids.indexOf(sh.id) >= 0) order.push(sh); });
    if (!order.length) return;
    /* how many of them sit before the drop point in the target scene */
    let removedBefore = 0;
    order.forEach(function (sh) {
      const at = t.scene.shots.indexOf(sh);
      if (at >= 0 && at < toIdx) removedBefore++;
    });
    order.forEach(function (sh) {
      const f = findShot(p, sh.id);
      if (f) f.scene.shots.splice(f.shotIdx, 1);
    });
    let at = SB.clamp(toIdx - removedBefore, 0, t.scene.shots.length);
    order.forEach(function (sh) { t.scene.shots.splice(at++, 0, sh); });
    p.updatedAt = Date.now();
  }

  /* Start a new scene at a card: that card and everything after it in the
   * scene move into a fresh scene inserted straight after. This is how a
   * Premiere import — one long scene of cuts — gets broken into scenes. */
  function splitSceneAt(p, sceneId, idx) {
    const f = findScene(p, sceneId);
    if (!f) return null;
    if (idx <= 0 || idx >= f.scene.shots.length) return null;   // nothing to move
    const moved = f.scene.shots.splice(idx);
    const sc = newScene();
    sc.shots = moved;
    p.scenes.splice(f.idx + 1, 0, sc);
    p.updatedAt = Date.now();
    return sc;
  }

  /* Gather the given shots into a scene of their own, after the scene the
   * first of them is in. */
  function sceneFromShots(p, ids) {
    if (!ids || !ids.length) return null;
    const order = [];
    eachShot(p, function (sh) { if (ids.indexOf(sh.id) >= 0) order.push(sh); });
    if (!order.length) return null;
    const first = findShot(p, order[0].id);
    const afterIdx = first ? first.sceneIdx : p.scenes.length - 1;
    const sources = [];
    order.forEach(function (sh) {
      const f = findShot(p, sh.id);
      if (!f) return;
      if (sources.indexOf(f.scene) < 0) sources.push(f.scene);
      f.scene.shots.splice(f.shotIdx, 1);
    });
    const sc = newScene();
    sc.shots = order;
    p.scenes.splice(afterIdx + 1, 0, sc);
    /* A scene emptied BY THIS is noise on the board. An empty scene the user
     * made on purpose somewhere else is not ours to delete — and neither is one
     * holding a claim on the script, which is a deliberate mark that outlives
     * whichever cards happened to be sitting in it. */
    p.scenes = p.scenes.filter(function (s) {
      return s.shots.length || sources.indexOf(s) < 0 || sceneTied(s);
    });
    if (!p.scenes.length) p.scenes.push(sc);
    p.updatedAt = Date.now();
    return sc;
  }

  function moveScene(p, sceneId, toIdx) {
    const f = findScene(p, sceneId);
    if (!f) return;
    p.scenes.splice(f.idx, 1);
    if (toIdx > f.idx) toIdx--;
    p.scenes.splice(SB.clamp(toIdx, 0, p.scenes.length), 0, f.scene);
    p.updatedAt = Date.now();
  }

  function modelById(p, id) {
    return p.settings.models.filter(function (m) { return m.id === id; })[0] || null;
  }
  function imageModel(p) { return modelById(p, p.settings.imageModelId); }
  function videoModel(p) { return modelById(p, p.settings.videoModelId); }

  SB.Model = {
    FILE_VERSION: FILE_VERSION,
    CARD_COLORS: CARD_COLORS,
    DEFAULT_SHOT_TYPES: DEFAULT_SHOT_TYPES,
    IMG_TPL: IMG_TPL, IMG_TPL_V1: IMG_TPL_V1, VID_TPL: VID_TPL, tplsFor: tplsFor,
    newProject: newProject, migrate: migrate, foldLineEndings: foldLineEndings,
    newShot: newShot, newScene: newScene,
    defaultModels: defaultModels, defaultExport: defaultExport,
    eachShot: eachShot, code: code, findShot: findShot, findScene: findScene,
    windowFor: windowFor, applyMasterEdit: applyMasterEdit, applyShotEdit: applyShotEdit,
    breakLink: breakLink, coverage: coverage,
    windowForScene: windowForScene, sceneTied: sceneTied,
    applySceneEdit: applySceneEdit, breakSceneLink: breakSceneLink,
    tieScene: tieScene, untieScene: untieScene,
    sceneCoverage: sceneCoverage, sceneCoverageShare: sceneCoverageShare,
    addScriptComment: addScriptComment, deleteScriptComment: deleteScriptComment,
    scriptComments: scriptComments, commentCoverage: commentCoverage,
    addScene: addScene, deleteScene: deleteScene, addShot: addShot, deleteShot: deleteShot,
    moveShot: moveShot, moveShots: moveShots, moveScene: moveScene,
    splitSceneAt: splitSceneAt, sceneFromShots: sceneFromShots,
    swapShotContent: swapShotContent, CONTENT_KEYS: CONTENT_KEYS,
    modelById: modelById, imageModel: imageModel, videoModel: videoModel, firstOfKind: firstOfKind
  };

})(window.SB);

</script>
<script>
/* ===== js/store.js ===== */
/* store.js — File System Access persistence + local (non-project) secrets.
 *
 * The project lives in one .storyboard JSON file the user picks once; after
 * that every change is written back to the same handle, debounced. The Gemini
 * API key NEVER goes in that file — it lives in localStorage only.
 */
(function (SB) {
  'use strict';

  const KEY_API = 'sb.geminiApiKey';
  const KEY_OOBA = 'sb.oobaServer';
  const IDB_NAME = 'storyboarder';
  const IDB_STORE = 'handles';

  const S = {
    handle: null,
    fileName: null,
    dirty: false,
    writing: false,
    lastSaved: 0,
    onState: null,
    getProject: null,  // set by app: () => project
    /* what this session has actually pushed to disk — the numbers a backend
     * would have to carry */
    stats: { writes: 0, bytes: 0, since: Date.now(), lastBytes: 0 }
  };

  const hasFS = typeof window.showSaveFilePicker === 'function';

  function state(txt, cls) {
    if (S.onState) S.onState(txt, cls);
  }

  /* ---------- IndexedDB (remember the last file handle) ---------- */

  /* Remembering the handle is a convenience, never a precondition for saving.
   * IndexedDB is restricted on file:// (which is how this app is normally
   * opened), and a request that neither succeeds nor errors must not be able
   * to wedge anything, so every call is time-boxed. */
  let idbDead = false;      // proven unusable — stop paying the timeout each time

  function idb() {
    if (idbDead) return Promise.reject(new Error('indexeddb unavailable'));
    return new Promise(function (resolve, reject) {
      let done = false;
      const fail = function (why) {
        if (done) return;
        done = true;
        idbDead = true;       // it will not start working later in this session
        reject(new Error(why));
      };
      setTimeout(function () { fail('indexeddb timeout'); }, 1500);
      let r;
      try { r = indexedDB.open(IDB_NAME, 1); }
      catch (e) { fail('indexeddb unavailable'); return; }
      r.onupgradeneeded = function () {
        if (!r.result.objectStoreNames.contains(IDB_STORE)) r.result.createObjectStore(IDB_STORE);
      };
      r.onsuccess = function () { if (!done) { done = true; resolve(r.result); } };
      r.onerror = function () { fail('indexeddb error'); };
      r.onblocked = function () { fail('indexeddb blocked'); };
    });
  }

  function idbPut(k, v) {
    return idb().then(function (db) {
      return new Promise(function (res, rej) {
        const tx = db.transaction(IDB_STORE, 'readwrite');
        tx.objectStore(IDB_STORE).put(v, k);
        tx.oncomplete = function () { res(); };
        tx.onerror = function () { rej(tx.error); };
      });
    }).catch(function () { });
  }

  function idbGet(k) {
    return idb().then(function (db) {
      return new Promise(function (res) {
        const tx = db.transaction(IDB_STORE, 'readonly');
        const rq = tx.objectStore(IDB_STORE).get(k);
        rq.onsuccess = function () { res(rq.result || null); };
        rq.onerror = function () { res(null); };
      });
    }).catch(function () { return null; });
  }

  /* ---------- permissions ---------- */

  function ensurePermission(handle, interactive) {
    if (!handle || !handle.queryPermission) return Promise.resolve(true);
    return handle.queryPermission({ mode: 'readwrite' }).then(function (p) {
      if (p === 'granted') return true;
      if (!interactive) return false;
      return handle.requestPermission({ mode: 'readwrite' }).then(function (q) { return q === 'granted'; });
    });
  }

  /* ---------- write ---------- */

  function serialize(project) {
    // Belt and braces: the API key must never reach the file.
    const copy = SB.clone(project);
    if (copy.settings) delete copy.settings.geminiApiKey;
    copy.updatedAt = Date.now();
    return JSON.stringify(copy);
  }

  function writeNow() {
    const project = S.getProject && S.getProject();
    if (!project) return Promise.resolve();
    if (!S.handle) { state('no file', 'dirty'); return Promise.resolve(); }
    /* Hand back the write already running, so awaiting a save really waits for
     * the bytes to land instead of resolving straight away. */
    if (S.writing) { S.pending = true; return S.inflight || Promise.resolve(); }

    /* Serialising can throw (and once did leave the writing flag stuck on,
     * killing autosave for the rest of the session in silence). */
    let text;
    try {
      text = serialize(project);
    } catch (e) {
      console.error('[storyboarder] could not serialise the project', e);
      saveFailed('the project could not be encoded', e);
      return Promise.resolve();
    }
    if (!text || text.length < 2) {          // never write nothing over a board
      saveFailed('refused to write an empty project', new Error('empty serialisation'));
      return Promise.resolve();
    }

    S.writing = true;
    state('saving…', 'dirty');

    const chain = ensurePermission(S.handle, false).then(function (ok) {
      if (!ok) { state('permission needed', 'dirty'); throw new Error('permission'); }
      /* The swap starts EMPTY and is committed by close(), so there is never a
       * stale tail to trim. The safety against a half write is abort(), which
       * throws the swap away and leaves the board on disk untouched.
       *
       * Do not reintroduce truncate() here: it counts BYTES while a JS string
       * counts CHARACTERS, so on any board containing an em-dash or a smart
       * quote it cut the file short and the next open failed with
       * "Unexpected end of JSON input". */
      return S.handle.createWritable();
    }).then(function (w) {
      const blob = new Blob([text], { type: 'application/json' });
      S.lastBytes = blob.size;
      return Promise.resolve(w.write(blob))
        .then(function () { return w.close(); })
        .catch(function (e) {
          // leave the original alone rather than committing a half write
          if (w.abort) { try { w.abort(); } catch (x) { } }
          throw e;
        });
    }).then(function () {
      return confirmOnDisk(text);
    }).then(function () {
      S.writing = false;
      S.dirty = false;
      S.lastSaved = Date.now();
      S.lastGood = text;                     // the rescue copy
      S.stats.writes++;
      S.stats.lastBytes = text.length;
      S.stats.bytes += S.stats.lastBytes;
      state('saved ' + new Date().toLocaleTimeString(), 'saved');
      if (S.onSaved) S.onSaved(S.stats);
      if (S.pending) { S.pending = false; return writeNow(); }
    }).catch(function (e) {
      S.writing = false;
      S.pending = false;
      if (String(e && e.message) === 'permission') return;
      saveFailed('the file could not be written', e);
    }).then(function (r) {
      if (S.inflight === chain) S.inflight = null;
      return r;
    });

    S.inflight = chain;
    return chain;
  }

  /* Read back what we just wrote. A save that reports success and leaves an
   * unopenable file is the worst failure this app has, so it is checked rather
   * than trusted. Cheap: the file is already in the OS cache. */
  function confirmOnDisk(expected) {
    if (!S.handle || !S.handle.getFile) return Promise.resolve();
    return S.handle.getFile().then(function (f) {
      return f.text();
    }).then(function (onDisk) {
      if (onDisk === expected) return;
      const e = new Error('the file on disk does not match what was written (' +
        onDisk.length + ' vs ' + expected.length + ' characters)');
      e.mismatch = true;
      throw e;
    }).catch(function (e) {
      if (e && e.mismatch) throw e;
      /* couldn't re-read it — not proof of a bad write, so let it pass */
    });
  }

  /* A failed save is the one thing in this app the user must not miss. */
  function saveFailed(what, err) {
    S.writing = false;
    state('SAVE FAILED', 'dirty');
    console.error('[storyboarder] save failed —', what, err);
    if (S.onFailure) S.onFailure(what, err);
  }

  const debouncedWrite = SB.debounce(writeNow, 500);

  function touch() {
    S.dirty = true;
    if (S.handle) state('unsaved…', 'dirty');
    debouncedWrite();
  }

  /* ---------- open / save-as ---------- */

  const PICKER_TYPES = [{
    description: 'Storyboard project',
    accept: { 'application/json': ['.storyboard', '.json'] }
  }];

  function saveAs(project) {
    if (!hasFS) return Promise.reject(new Error('This browser has no File System Access API. Use Chrome or Edge.'));
    return window.showSaveFilePicker({
      suggestedName: (project.name || 'storyboard').replace(/[\\/:*?"<>|]+/g, '_') + '.storyboard',
      types: PICKER_TYPES
    }).then(function (h) {
      S.handle = h;
      S.fileName = h.name;
      idbPut('last', h);          // fire and forget — never gate the write on it
      return writeNow();
    }).then(function () {
      return S.fileName;
    });
  }

  /* Just the picker — the caller loads it, so a file that fails to parse can
   * still be identified and offered for repair. */
  function pick() {
    if (!hasFS) return Promise.reject(new Error('This browser has no File System Access API. Use Chrome or Edge.'));
    return window.showOpenFilePicker({ types: PICKER_TYPES, multiple: false })
      .then(function (hs) { return hs[0]; });
  }

  function openFile() {
    return pick().then(function (h) { return loadFromHandle(h, true); });
  }

  function loadFromHandle(handle, interactive) {
    return ensurePermission(handle, interactive).then(function (ok) {
      if (!ok) throw new Error('Permission to the project file was denied.');
      return handle.getFile();
    }).then(function (f) {
      return f.text();
    }).then(function (txt) {
      const p = SB.Model.migrate(JSON.parse(txt));
      S.handle = handle;
      S.fileName = handle.name;
      S.dirty = false;
      idbPut('last', handle);
      state('opened ' + handle.name, 'saved');
      return p;
    });
  }

  function lastHandle() { return idbGet('last'); }

  function detach() {
    S.handle = null;
    S.fileName = null;
    idbPut('last', null);
    state('no file', 'dirty');
  }

  /* ---------- API key (local only) ---------- */

  function getApiKey() { try { return localStorage.getItem(KEY_API) || ''; } catch (e) { return ''; } }
  function setApiKey(v) { try { v ? localStorage.setItem(KEY_API, v) : localStorage.removeItem(KEY_API); } catch (e) { } }

  /* Where the local (OpenAI-compatible) server lives. Per browser, not per
   * project: it is a fact about this machine, and a .storyboard passed to
   * someone else should carry neither it nor the key beside it. Keeping it
   * here also means switching provider back and forth never loses either
   * side's model choice. */
  function getOoba() {
    let v = {};
    try { v = JSON.parse(localStorage.getItem(KEY_OOBA)) || {}; } catch (e) { v = {}; }
    return {
      url: v.url || '',
      model: v.model || '',
      key: v.key || ''
    };
  }
  function setOoba(v) {
    const clean = {
      url: (v && v.url || '').trim(),
      model: (v && v.model || '').trim(),
      key: (v && v.key || '').trim()
    };
    try {
      if (clean.url || clean.model || clean.key) {
        localStorage.setItem(KEY_OOBA, JSON.stringify(clean));
      } else {
        localStorage.removeItem(KEY_OOBA);
      }
    } catch (e) { }
  }

  /* ---------- rescuing a truncated file ---------- */

  /* A project file cut short at the end — an interrupted write, or the
   * byte-vs-character truncate bug that shipped briefly — is still whole up to
   * the point it stops. Keep every top-level property that closed cleanly and
   * shut the object; migrate() fills in whatever was lost after that.
   *
   * Returns the repaired text, or null if there is nothing worth keeping. */
  function repair(text) {
    if (typeof text !== 'string' || text.length < 2) return null;
    let inStr = false, esc = false, lastSafe = -1;
    const stack = [];
    for (let i = 0; i < text.length; i++) {
      const ch = text.charAt(i);
      if (inStr) {
        if (esc) esc = false;
        else if (ch === '\\') esc = true;
        else if (ch === '"') inStr = false;
        continue;
      }
      if (ch === '"') { inStr = true; continue; }
      if (ch === '{' || ch === '[') { stack.push(ch); continue; }
      if (ch === '}' || ch === ']') {
        stack.pop();
        if (stack.length === 1) lastSafe = i;          // a property's value just closed
        continue;
      }
      if (ch === ',' && stack.length === 1) lastSafe = i - 1;  // ...or ended before a comma
    }
    if (lastSafe < 1) return null;
    const patched = text.slice(0, lastSafe + 1) + '}';
    try {
      const obj = JSON.parse(patched);
      if (!obj || !obj.scenes) return null;
      return patched;
    } catch (e) {
      return null;
    }
  }

  /* What a repair would cost, so the user can decide with the facts. */
  function repairReport(text) {
    const fixed = repair(text);
    if (!fixed) return null;
    let obj;
    try { obj = JSON.parse(fixed); } catch (e) { return null; }
    let shots = 0;
    (obj.scenes || []).forEach(function (sc) { shots += (sc.shots || []).length; });
    return {
      text: fixed,
      lost: text.length - fixed.length + 1,
      scenes: (obj.scenes || []).length,
      shots: shots,
      images: Object.keys(obj.blobs || {}).length,
      script: (obj.master && obj.master.text ? obj.master.text.length : 0),
      versions: (obj.versions || []).length,
      settings: !!obj.settings
    };
  }

  /* ---------- escape hatch ---------- */

  /* Always available, even when the file handle is gone or unwritable: hand
   * the project back as a download. */
  function downloadCopy(project, why) {
    let text;
    try { text = serialize(project || (S.getProject && S.getProject())); }
    catch (e) { text = S.lastGood || ''; }
    if (!text) return false;
    const name = ((project && project.name) || 'storyboard')
      .replace(/[\\/:*?"<>|]+/g, '_') + (why ? '-' + why : '') + '.storyboard';
    const url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    return true;
  }

  /* Saves per day at the rate this session has been going. Needs a few
   * minutes of real work before it means anything. */
  function saveRate() {
    const mins = (Date.now() - S.stats.since) / 60000;
    if (S.stats.writes < 3 || mins < 1) return null;
    return { perHour: S.stats.writes / (mins / 60), perDay: (S.stats.writes / (mins / 60)) * 8 };
  }

  /* Does this context have a working IndexedDB? On file:// it hangs rather
   * than failing, so "remember the last project" quietly cannot work there. */
  function storageUsable() {
    return idb().then(function () { return true; }).catch(function () { return false; });
  }

  SB.Store = {
    hasFS: hasFS,
    S: S,
    touch: touch,
    /* Flush any pending debounce, then hand back whatever write is running —
     * awaiting this means the bytes are on disk. */
    saveNow: function () {
      if (debouncedWrite.flush) debouncedWrite.flush();
      return S.inflight || writeNow();
    },
    saveAs: saveAs,
    open: openFile,
    pick: pick,
    loadFromHandle: loadFromHandle,
    lastHandle: lastHandle,
    detach: detach,
    getApiKey: getApiKey,
    setApiKey: setApiKey,
    getOoba: getOoba,
    setOoba: setOoba,
    serialize: serialize,
    downloadCopy: downloadCopy,
    storageUsable: storageUsable,
    saveRate: saveRate,
    repair: repair,
    repairReport: repairReport,
    readHandle: function (handle) {
      return handle.getFile().then(function (f) { return f.text(); });
    },
    /* The handle store and the permission dance, shared with renders.js — a
     * directory handle is kept exactly the way the project file's handle is,
     * and for the same reason: it is a fact about this machine, not about the
     * board, so it never goes in the file. */
    idbPut: idbPut,
    idbGet: idbGet,
    ensurePermission: ensurePermission
  };

})(window.SB);

</script>
<script>
/* ===== js/history.js ===== */
/* history.js — undo/redo for script text.
 *
 * The editor suppresses the browser's own undo (we own the DOM), so this
 * supplies it. A step snapshots the script layer only: the master document
 * plus every shot's and scene's link range / freestanding text. Structural changes —
 * adding, deleting or moving shots and scenes — are deliberately NOT undone,
 * so Ctrl+Z can never make a card disappear out from under you.
 *
 * Consecutive typing in the same window coalesces into one step.
 */
(function (SB) {
  'use strict';

  const LIMIT = 200;
  const COALESCE_MS = 700;

  const H = { past: [], future: [], applying: false, lastTag: null, lastAt: 0 };

  function P() { return SB.app && SB.app.project; }

  function snap(p) {
    const shots = [];
    SB.Model.eachShot(p, function (s) {
      shots.push({
        id: s.id,
        link: s.link ? { from: s.link.from, to: s.link.to } : null,
        broken: !!s.broken,
        local: s.local ? SB.clone(s.local) : null
      });
    });
    /* A scene's claim on a stretch of script is anchored into the same text, so
     * it belongs to this layer too — without it, undo puts the old text back
     * while every claim stays mapped forward against text that no longer
     * exists. Which scenes exist is structural and is left alone. */
    const scenes = p.scenes.map(function (sc) {
      return {
        id: sc.id,
        link: sc.link ? { from: sc.link.from, to: sc.link.to } : null,
        broken: !!sc.broken,
        local: sc.local ? SB.clone(sc.local) : null
      };
    });
    return {
      text: p.master.text,
      marks: SB.clone(p.master.marks),
      shots: shots,
      scenes: scenes,
      /* notes are anchored into the same text, so they have to move back with it */
      notes: SB.clone(p.scriptComments || [])
    };
  }

  function apply(p, s) {
    p.master.text = s.text;
    p.master.marks = SB.clone(s.marks);
    if (s.notes) p.scriptComments = SB.clone(s.notes);
    const byId = {};
    s.shots.forEach(function (x) { byId[x.id] = x; });
    SB.Model.eachShot(p, function (sh) {
      const x = byId[sh.id];
      if (!x) return;                    // shot created after this snapshot — leave it alone
      sh.link = x.link ? { from: x.link.from, to: x.link.to } : null;
      sh.broken = x.broken;
      sh.local = x.local ? SB.clone(x.local) : null;
    });
    const scById = {};
    (s.scenes || []).forEach(function (x) { scById[x.id] = x; });
    p.scenes.forEach(function (sc) {
      const x = scById[sc.id];
      if (!x) return;                    // scene created after this snapshot
      sc.link = x.link ? { from: x.link.from, to: x.link.to } : null;
      sc.broken = x.broken;
      sc.local = x.local ? SB.clone(x.local) : null;
    });
  }

  /* Called just BEFORE a script edit lands. tag identifies the window so that
   * a run of keystrokes in one box becomes a single undo step. */
  function push(tag) {
    const p = P();
    if (!p || H.applying) return;
    const now = Date.now();
    if (H.past.length && tag && tag === H.lastTag && (now - H.lastAt) < COALESCE_MS) {
      H.lastAt = now;
      return;                            // already have the pre-typing state
    }
    H.past.push(snap(p));
    if (H.past.length > LIMIT) H.past.shift();
    H.future.length = 0;
    H.lastTag = tag || null;
    H.lastAt = now;
  }

  /* A discrete action (capture, break link, paste) shouldn't merge with typing. */
  function seal() { H.lastTag = null; H.lastAt = 0; }

  function step(from, to) {
    const p = P();
    if (!p || !from.length) return false;
    H.applying = true;
    to.push(snap(p));
    apply(p, from.pop());
    H.applying = false;
    seal();
    SB.app.scriptChanged();
    SB.Board.renderScriptWindows();
    return true;
  }

  function undo() { return step(H.past, H.future); }
  function redo() { return step(H.future, H.past); }

  function reset() {
    H.past.length = 0;
    H.future.length = 0;
    seal();
  }

  SB.History = {
    push: push, undo: undo, redo: redo, reset: reset, seal: seal,
    depth: function () { return H.past.length; },
    redoDepth: function () { return H.future.length; }
  };

})(window.SB);

</script>
<script>
/* ===== js/editor.js ===== */
/* editor.js — a contenteditable "window" onto a slice of a Doc.
 *
 * The browser is never allowed to mutate the DOM: every keystroke is
 * intercepted, turned into a replace(start,end,text) op against the model, and
 * the view is re-rendered from the model. That is what lets several windows
 * share (and overlap on) the same underlying characters.
 */
(function (SB) {
  'use strict';

  /* ---------- offset <-> DOM selection ---------- */

  function walk(el, fn) {
    const it = document.createTreeWalker(el, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT, null);
    let n;
    while ((n = it.nextNode())) fn(n);
  }

  function textOf(el) {
    let out = '';
    walk(el, function (n) {
      if (n.nodeType === 3) out += n.data;
      else if (n.nodeName === 'BR' && !n.classList.contains('pad')) out += '\n';
    });
    return out;
  }

  /* Character offset of a DOM position within el.
   *
   * A click can land on an ELEMENT container (Chrome reports the highlight
   * span or a <b> run with a child index, not a text node) — measuring the
   * range text handles every container kind, which hand-walking did not:
   * it used to ignore the child index and snap to the start of the span, so
   * typing at the edge of a highlight jumped backwards. */
  function offsetOf(el, node, off) {
    const r = document.createRange();
    try {
      r.setStart(el, 0);
      r.setEnd(node, off);
    } catch (e) {
      return 0;
    }
    return r.toString().length;
  }

  function getSel(el) {
    const sel = window.getSelection();
    if (!sel || !sel.rangeCount) return null;
    const r = sel.getRangeAt(0);
    if (!el.contains(r.startContainer) || !el.contains(r.endContainer)) return null;
    let a = offsetOf(el, r.startContainer, r.startOffset);
    let b = offsetOf(el, r.endContainer, r.endOffset);
    return { start: Math.min(a, b), end: Math.max(a, b) };
  }

  function locate(el, target) {
    // find [textNode, offset] for a character offset
    let seen = 0, res = null;
    const it = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null);
    let n, last = null;
    while ((n = it.nextNode())) {
      last = n;
      if (seen + n.data.length >= target) { res = [n, target - seen]; break; }
      seen += n.data.length;
    }
    if (res) return res;
    if (last) return [last, last.data.length];
    return [el, 0];
  }

  function setSel(el, start, end) {
    const sel = window.getSelection();
    if (!sel) return;
    const r = document.createRange();
    const a = locate(el, start), b = locate(el, end == null ? start : end);
    try {
      r.setStart(a[0], Math.min(a[1], a[0].nodeType === 3 ? a[0].data.length : 0));
      r.setEnd(b[0], Math.min(b[1], b[0].nodeType === 3 ? b[0].data.length : 0));
    } catch (e) { return; }
    sel.removeAllRanges();
    sel.addRange(r);
  }

  /* ---------- word boundaries ---------- */

  const WORD = /[A-Za-z0-9_'À-ɏ]/;

  function wordBack(s, i) {
    while (i > 0 && /\s/.test(s.charAt(i - 1))) i--;
    if (i > 0 && !WORD.test(s.charAt(i - 1))) return i - 1;
    while (i > 0 && WORD.test(s.charAt(i - 1))) i--;
    return i;
  }

  function wordFwd(s, i) {
    const n = s.length;
    while (i < n && /\s/.test(s.charAt(i))) i++;
    if (i < n && !WORD.test(s.charAt(i))) return i + 1;
    while (i < n && WORD.test(s.charAt(i))) i++;
    return i;
  }

  /* ---------- attach ---------- */

  /* cfg = {
   *   get()            -> {doc, from, to} | null
   *   edit(s,e,text)   -> apply to model (local coords)
   *   toggle(type,s,e) -> toggle a mark (local coords)
   *   after()          -> tell the app to re-render every window
   *   extra(absIdx)    -> extra css class for that master character
   *   readOnly         -> bool
   * } */
  function attach(el, cfg) {
    const api = { el: el, cfg: cfg, composing: false, pending: null };
    el.__sbEditor = api;
    if (!cfg.readOnly) el.setAttribute('contenteditable', 'true');

    function win() { return cfg.get(); }

    api.render = function () {
      const w = win();
      if (!w) { el.innerHTML = ''; return; }
      if (api.composing) return;
      const focused = document.activeElement === el;
      const keep = api.pending || (focused ? getSel(el) : null);
      const scroll = el.scrollTop;
      el.innerHTML = SB.Doc.renderHTML(w.doc, w.from, w.to, cfg.extra || null);
      if (el.scrollTop !== scroll) el.scrollTop = scroll;
      if (focused && keep) {
        const max = w.to - w.from;
        setSel(el, SB.clamp(keep.start, 0, max), SB.clamp(keep.end == null ? keep.start : keep.end, 0, max));
      }
      api.pending = null;
    };

    if (cfg.readOnly) { api.render(); return api; }

    function mark(type, s, e) {
      if (e <= s) return;
      SB.History.seal();
      SB.History.push('mark');
      SB.History.seal();
      cfg.toggle(type, s, e);
      api.pending = { start: s, end: e };
      cfg.after();
    }

    function doEdit(s, e, text, caret) {
      const w = win();
      if (!w) return;
      const max = w.to - w.from;
      s = SB.clamp(s, 0, max); e = SB.clamp(e, s, max);
      if (s === e && !text) return;
      cfg.edit(s, e, text);
      api.pending = { start: caret == null ? s + (text || '').length : caret };
      cfg.after();
    }

    el.addEventListener('beforeinput', function (ev) {
      const w = win();
      if (!w) { ev.preventDefault(); return; }
      const sel = getSel(el);
      if (!sel) return;
      const t = ev.inputType;
      const text = w.doc.text.slice(w.from, w.to);

      if (t === 'insertCompositionText' || t === 'deleteCompositionText' ||
        t === 'insertFromComposition') return; // handled on compositionend

      ev.preventDefault();

      let s = sel.start, e = sel.end, ins = null;

      switch (t) {
        case 'insertText': ins = ev.data == null ? '' : ev.data; break;
        case 'insertReplacementText': ins = ev.data == null ? '' : ev.data; break;
        case 'insertLineBreak':
        case 'insertParagraph': ins = '\n'; break;
        case 'insertFromPaste':
        case 'insertFromDrop': {
          const dt = ev.dataTransfer;
          ins = dt ? (dt.getData('text/plain') || '') : '';
          break;
        }
        case 'deleteContentBackward':
          if (s === e) s = Math.max(0, s - 1);
          ins = ''; break;
        case 'deleteContentForward':
          if (s === e) e = Math.min(text.length, e + 1);
          ins = ''; break;
        case 'deleteWordBackward':
          if (s === e) s = wordBack(text, s);
          ins = ''; break;
        case 'deleteWordForward':
          if (s === e) e = wordFwd(text, e);
          ins = ''; break;
        case 'deleteSoftLineBackward':
        case 'deleteHardLineBackward':
          if (s === e) s = text.lastIndexOf('\n', Math.max(0, s - 1)) + 1;
          ins = ''; break;
        case 'deleteByCut':
        case 'deleteByDrag':
        case 'deleteContent':
          ins = ''; break;
        case 'formatBold': mark('b', s, e); return;
        case 'formatItalic': mark('i', s, e); return;
